<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ugandan Music - Ning Wei Media</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f8fa;
  color: #111;
}

.header {
  position: relative;
  height: 180px;
  background:
    linear-gradient(rgba(80,190,235,.22), rgba(80,190,235,.22)),
    url("../../../../ning-wei.png") center/cover no-repeat;
  display: flex;
  align-items: flex-end;
  padding: 15px;
}

.header h1 {
  margin: 0;
  color: white;
  font-size: 25px;
  text-shadow: 0 2px 5px #000;
}

.container {
  padding: 12px;
  max-width: 900px;
  margin: auto;
}

.search {
  width: 100%;
  padding: 12px 15px;
  border: 1px solid #ccc;
  border-radius: 25px;
  font-size: 16px;
  margin-bottom: 12px;
}

.back {
  display: inline-block;
  text-decoration: none;
  color: #087ea4;
  font-weight: bold;
  margin-bottom: 12px;
}

.item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: white;
  border-radius: 8px;
  padding: 9px;
  margin-bottom: 7px;
  box-shadow: 0 1px 4px rgba(0,0,0,.12);
}

.number {
  width: 32px;
  height: 32px;
  min-width: 32px;
  border-radius: 50%;
  background: #000;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.item a {
  text-decoration: none;
  color: #111;
  font-weight: bold;
  flex: 1;
}

.play {
  color: #0795c5;
  font-size: 20px;
}

.empty {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

<body>

<header class="header">
  <h1>🇺🇬 Ugandan Music</h1>
</header>

<div class="container">

  <a class="back" href="../folder.html?path=media%2Fsongs">
    ← Back to Music
  </a>

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search Ugandan music..."
  >

  <div id="list">
    <div class="empty">Loading music...</div>
  </div>

</div>

<script>
const owner = "Ningwei2567";
const repo = "Ning-wei-1";
const branch = "main";

const folderPath = "media/songs/Ugandan";

let allFiles = [];

async function loadMusic() {
  const list = document.getElementById("list");

  try {
    const response = await fetch(
      `https://api.github.com/repos/${owner}/${repo}/contents/${folderPath}?ref=${branch}`
    );

    if (!response.ok) {
      throw new Error("Could not load music");
    }

    const items = await response.json();

    allFiles = items
      .filter(item => item.type === "file")
      .filter(item => /\.(mp3|wav|m4a|aac|ogg)$/i.test(item.name))
      .sort((a, b) => a.name.localeCompare(b.name));

    displayMusic(allFiles);

  } catch (error) {
    list.innerHTML =
      `<div class="empty">
        Unable to load Ugandan music.
      </div>`;
  }
}

function displayMusic(files) {
  const list = document.getElementById("list");

  if (files.length === 0) {
    list.innerHTML =
      `<div class="empty">No music found.</div>`;
    return;
  }

  list.innerHTML = "";

  files.forEach((file, index) => {

    const item = document.createElement("div");
    item.className = "item";

    const number = document.createElement("div");
    number.className = "number";
    number.textContent = index + 1;

    const link = document.createElement("a");

    link.href =
      `../song.html?folder=Ugandan&file=${encodeURIComponent(file.name)}`;

    link.textContent =
      file.name.replace(/\.[^/.]+$/, "");

    const play = document.createElement("span");
    play.className = "play";
    play.textContent = "▶";

    item.appendChild(number);
    item.appendChild(link);
    item.appendChild(play);

    list.appendChild(item);
  });
}

document.getElementById("search").addEventListener("input", function() {

  const searchText = this.value.toLowerCase();

  const filtered = allFiles.filter(file =>
    file.name.toLowerCase().includes(searchText)
  );

  displayMusic(filtered);
});

loadMusic();
</script>

</body>
</html>
