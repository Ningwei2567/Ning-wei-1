<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ugandan Music - Ning Wei Media</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#168de2;
    color:white;
    padding:30px 20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
}

.container{
    max-width:800px;
    margin:auto;
    padding:15px;
}

.song{
    display:flex;
    align-items:center;
    background:white;
    padding:18px 15px;
    margin:10px 0;
    border-radius:12px;
    text-decoration:none;
    color:#222;
    box-shadow:0 2px 8px #ddd;
}

.play-icon{
    font-size:25px;
    color:#168de2;
    margin-right:15px;
}

.song-name{
    font-size:19px;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

.back{
    display:block;
    text-align:center;
    margin:25px;
    color:#168de2;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>🇺🇬 Ugandan Music</h1>
    <p>Popular Ugandan Songs</p>
</header>

<div class="container">

    <div id="songs" class="loading">
        Loading songs...
    </div>

</div>

<a class="back" href="../../../audio.html">
    ← Back to Trending Songs
</a>

<script>

const username = "Ningwei2567";
const repository = "Ning-wei-1";
const folder = "media/songs/Ugandan";

const apiURL =
`https://api.github.com/repos/${username}/${repository}/contents/${folder}`;

async function loadSongs(){

    const songsContainer = document.getElementById("songs");

    try{

        const response = await fetch(apiURL);

        if(!response.ok){
            throw new Error("Could not load songs");
        }

        const files = await response.json();

        const songs = files.filter(file =>
            file.type === "file" &&
            /\.(mp3|wav|m4a|ogg)$/i.test(file.name)
        );

        songsContainer.innerHTML = "";

        if(songs.length === 0){

            songsContainer.innerHTML =
            "<div class='loading'>No songs uploaded yet.</div>";

            return;
        }

        songs.forEach(song => {

            const link = document.createElement("a");

            link.className = "song";

            link.href =
            `../song.html?file=${encodeURIComponent(song.name)}&title=${encodeURIComponent(song.name.replace(/\.[^/.]+$/, ""))}`;

            link.innerHTML = `
                <span class="play-icon">▶</span>
                <span class="song-name">
                    ${song.name.replace(/\.[^/.]+$/, "")}
                </span>
            `;

            songsContainer.appendChild(link);

        });

    }catch(error){

        songsContainer.innerHTML =
        "<div class='loading'>Unable to load songs. Please try again.</div>";

    }
}

loadSongs();

</script>

</body>
</html>
