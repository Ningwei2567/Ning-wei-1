<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media - Song</title>

<link
rel="stylesheet"
href="https://ningwei2567.github.io/Ning-wei-1/style.css"
>

<style>

.song-page {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 2px 10px rgba(0,0,0,.10);
}

.song-title {
  font-size: 23px;
  font-weight: 800;
  margin-bottom: 15px;
  word-break: break-word;
}

audio {
  width: 100%;
  margin: 10px 0 20px;
}

.download-button {
  display: block;
  width: 100%;

  padding: 14px;

  background: #000;
  color: white;

  text-align: center;

  text-decoration: none;

  border-radius: 9px;

  font-size: 17px;
  font-weight: bold;
}

.download-button:hover {
  background: #222;
}

.message {
  text-align: center;
  padding: 30px;
  color: #777;
}

</style>

</head>


<body>


<header class="site-header">

<h1>Ning Wei Media</h1>

<p>
Music • Videos • Photos • Apps • Software
</p>

</header>


<div class="container">


<div id="content">

<div class="message">
Loading song...
</div>

</div>


<a
id="back"
class="back"
href="javascript:history.back()"
>
← Back
</a>


</div>


<footer class="site-footer">

© 2026 Ning Wei Media

</footer>


<script>

/* =================================
   GET SONG INFORMATION
   ================================= */

const params =
new URLSearchParams(
window.location.search
);


const folder =
params.get("folder");


const file =
params.get("file");


const title =
params.get("title")
|| (
file
? file.replace(/\.[^/.]+$/, "")
: "Song"
);


/* =================================
   PAGE ELEMENT
   ================================= */

const content =
document.getElementById("content");


/* =================================
   CHECK INFORMATION
   ================================= */

if (!folder || !file) {

content.innerHTML = `

<div class="message">

Song not found.

</div>

`;

}


/* =================================
   CREATE URL
   ================================= */

else {


const encodedFolder =
folder
.split("/")
.map(
part => encodeURIComponent(part)
)
.join("/");


const encodedFile =
encodeURIComponent(file);


/* =================================
   RAW GITHUB AUDIO URL
   ================================= */

const audioURL =
`https://raw.githubusercontent.com/Ningwei2567/Ning-wei-1/main/${encodedFolder}/${encodedFile}`;


/* =================================
   SHOW PLAYER
   ================================= */

content.innerHTML = `

<div class="song-page">

<div class="song-title">

${escapeHTML(title)}

</div>


<audio
controls
preload="metadata"
src="${audioURL}"
>

Your browser does not support
audio playback.

</audio>


<a
class="download-button"
href="${audioURL}"
download
>

⬇ Download

</a>

</div>

`;

}


/* =================================
   ESCAPE HTML
   ================================= */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text;

return div.innerHTML;

}

</script>


</body>

</html>
