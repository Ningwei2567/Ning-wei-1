<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Mixes - Ning Wei Media</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f9;
  color:#111;
}
header{
  position:relative;
  height:150px;
  background:
    linear-gradient(rgba(135,206,235,.38),rgba(135,206,235,.38)),
    url("../../../ning-wei.png") center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
header h1{
  background:rgba(255,255,255,.78);
  padding:10px 20px;
  border-radius:12px;
  margin:0;
  font-size:25px;
}
.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}
.search{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  margin-bottom:12px;
  font-size:16px;
}
.back{
  display:inline-block;
  margin-bottom:12px;
  text-decoration:none;
  color:#0077aa;
  font-weight:bold;
}
.item{
  display:flex;
  align-items:center;
  gap:12px;
  background:white;
  padding:10px;
  margin:7px 0;
  border-radius:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  text-decoration:none;
  color:#111;
}
.num{
  width:35px;
  height:35px;
  min-width:35px;
  border-radius:50%;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.name{
  font-size:16px;
  font-weight:600;
}
</style>
</head>

<body>

<header>
  <h1>🎧 DJ MIXES</h1>
</header>

<div class="container">

<a class="back" href="../../../audio.html">← Back to Songs</a>

<input
  id="search"
  class="search"
  type="text"
  placeholder="Search DJ Mixes..."
>

<div id="list">Loading...</div>

</div>

<script>
const API =
"https://api.github.com/repos/Ningwei2567/Ning-wei-1/contents/media/songs/DJ-Mixes";

const list=document.getElementById("list");
const search=document.getElementById("search");

let items=[];

async function load(){
  try{
    const response=await fetch(API);
    if(!response.ok) throw new Error("Unable to load folder");

    items=await response.json();
    render(items);
  }catch(error){
    list.innerHTML="<p>Unable to load DJ Mixes.</p>";
  }
}

function render(data){
  const query=search.value.toLowerCase();

  const filtered=data.filter(item =>
    item.name.toLowerCase().includes(query)
  );

  list.innerHTML="";

  if(!filtered.length){
    list.innerHTML="<p>No items found.</p>";
    return;
  }

  filtered.forEach((item,index)=>{
    const a=document.createElement("a");
    a.className="item";

    if(item.type==="dir"){
      a.href="browser.html?path="+encodeURIComponent(item.path);
    }else{
      a.href="../../../media.html?path="+encodeURIComponent(item.path);
    }

    a.innerHTML=`
      <span class="num">${index+1}</span>
      <span class="name">${item.name}</span>
    `;

    list.appendChild(a);
  });
}

search.addEventListener("input",()=>render(items));

load();
</script>

</body>
</html>
