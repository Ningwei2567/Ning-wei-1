<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DJ Mixes / Nonstop - Ning Wei Media</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:#182033;
    background:
      radial-gradient(circle at 10% 10%,#d9f3ff 0,transparent 35%),
      radial-gradient(circle at 90% 20%,#eee0ff 0,transparent 35%),
      linear-gradient(135deg,#f7fbff,#f4f0ff,#effcf8);
    min-height:100vh;
}

header{
    background:linear-gradient(135deg,#087fe8,#3159d9);
    color:white;
    text-align:center;
    padding:32px 15px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
    font-size:17px;
}

.search-box{
    padding:22px 4%;
}

.search{
    width:100%;
    padding:17px 20px;
    border:0;
    border-radius:35px;
    font-size:18px;
    outline:none;
    box-shadow:0 4px 18px #cfd7e5;
}

.container{
    max-width:800px;
    margin:auto;
    padding:0 4% 30px;
}

.item{
    display:flex;
    align-items:center;
    gap:15px;
    padding:20px 12px;
    border-bottom:1px solid #d9dce4;
    text-decoration:none;
    color:#182033;
    background:rgba(255,255,255,.55);
}

.item:first-child{
    border-radius:20px 20px 0 0;
}

.item:last-child{
    border-radius:0 0 20px 20px;
    border-bottom:0;
}

.icon{
    font-size:35px;
    width:55px;
    text-align:center;
}

.info{
    flex:1;
}

.info h2{
    margin:0;
    font-size:21px;
}

.info p{
    margin:5px 0 0;
    color:#718096;
}

.arrow{
    font-size:30px;
    color:#168bd0;
}

.back{
    display:block;
    text-align:center;
    margin:10px 0 35px;
    color:#168bd0;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>🎧 DJ Mixes / Nonstop</h1>
    <p>Mixtapes, mappings, effects & skins</p>
</header>

<div class="search-box">
    <input
        id="search"
        class="search"
        type="search"
        placeholder="🔎 Search DJ mixes..."
    >
</div>

<div class="container">

    <div id="items">

        <a class="item" href="browser.html?folder=Mixtapes-Nonstop">
            <div class="icon">🎧</div>
            <div class="info">
                <h2>Mixtapes / Nonstop</h2>
                <p>DJ mixtapes and nonstop mixes</p>
            </div>
            <div class="arrow">›</div>
        </a>

        <a class="item" href="browser.html?folder=Mappings">
            <div class="icon">🗺️</div>
            <div class="info">
                <h2>Mappings</h2>
                <p>DJ mappings and files</p>
            </div>
            <div class="arrow">›</div>
        </a>

        <a class="item" href="browser.html?folder=Sound-Effects">
            <div class="icon">🔊</div>
            <div class="info">
                <h2>Sound Effects</h2>
                <p>DJ sound effects</p>
            </div>
            <div class="arrow">›</div>
        </a>

        <a class="item" href="browser.html?folder=Virtual-DJ-Skins">
            <div class="icon">🎛️</div>
            <div class="info">
                <h2>Virtual DJ Skins</h2>
                <p>Virtual DJ skins</p>
            </div>
            <div class="arrow">›</div>
        </a>

    </div>

</div>

<a class="back" href="../../../index.html">
    ← Back to Home
</a>

<script>
const search = document.getElementById("search");
const items = document.querySelectorAll(".item");

search.addEventListener("input", function(){

    const text = this.value.toLowerCase();

    items.forEach(item => {
        item.style.display =
            item.innerText.toLowerCase().includes(text)
            ? "flex"
            : "none";
    });

});
</script>

</body>
</html>
