<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f9;
  color:#111;
}
header{
  height:150px;
  background:
    linear-gradient(rgba(135,206,235,.38),rgba(135,206,235,.38)),
    url("../../../ning-wei.png") center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
}
header h1{
  background:rgba(255,255,255,.8);
  padding:10px 18px;
  border-radius:12px;
  font-size:23px;
}
.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}
.search{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  margin-bottom:12px;
}
.back{
  display:inline-block;
  margin-bottom:12px;
  color:#0077aa;
  text-decoration:none;
  font-weight:bold;
}
.item{
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  padding:10px;
  margin:7px 0;
  border-radius:10px;
  text-decoration:none;
  color:#111;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}
.num{
  width:35px;
  height:35px;
  min-width:35px;
  border-radius:50%;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.name{
  font-weight:600;
}
</style>
</head>

<body>

<header>
<h1 id="title">DJ MIXES</h1>
</header>

<div class="container">

<a class="back" id="back" href="index.html">← Back</a>

<input
  class="search"
  id="search"
  placeholder="Search this folder..."
>

<div id="list">Loading...</div>

</div>

<script>

const BASE="https://api.github.com/repos/Ningwei2567/Ning-wei-1/contents/";

const params=new URLSearchParams(location.search);
const currentPath=params.get("path") || "media/songs/DJ-Mixes";

const list=document.getElementById("list");
const search=document.getElementById("search");
const title=document.getElementById("title");

let items=[];

title.textContent=currentPath.split("/").pop();

async function load(){

  try{

    const response=await fetch(BASE+currentPath);

    if(!response.ok) throw new Error();

    items=await response.json();

    render(items);

  }catch(e){

    list.innerHTML="<p>Unable to load this folder.</p>";

  }

}

function render(data){

  const q=search.value.toLowerCase();

  const filtered=data.filter(item=>
    item.name.toLowerCase().includes(q)
  );

  list.innerHTML="";

  if(filtered.length===0){

    list.innerHTML="<p>No items found.</p>";

    return;
  }

  filtered.forEach((item,index)=>{

    const a=document.createElement("a");

    a.className="item";

    if(item.type==="dir"){

      a.href="browser.html?path="+encodeURIComponent(item.path);

    }else{

      a.href="../../../media.html?path="+encodeURIComponent(item.path);

    }

    a.innerHTML=`
      <span class="num">${index+1}</span>
      <span class="name">${item.name}</span>
    `;

    list.appendChild(a);

  });

}

search.addEventListener("input",()=>render(items));

load();

</script>

</body>
</html>
