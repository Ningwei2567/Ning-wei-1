<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Master Search — Ning Wei Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3faff;
  color:#111;
}

/* ==============================
   HEADER
============================== */

.nw-header{
  position:relative;
  height:300px;
  overflow:hidden;
  background:#62b9e5;
  color:#fff;
}

.nw-header-photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 18%;
  transform:scale(1.08);
}

.nw-header-overlay{
  position:absolute;
  inset:0;
  background:rgba(55,145,205,.38);
}

.nw-header-content{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
  text-shadow:0 2px 7px rgba(0,0,0,.65);
}

.nw-header h1{
  margin:0;
  font-size:34px;
  font-weight:900;
}

.nw-header p{
  margin:7px 0 0;
  font-size:15px;
  font-weight:bold;
}

/* ==============================
   SEARCH AREA
============================== */

.search-area{
  padding:15px;
  background:#f3faff;
}

.search-row{
  display:flex;
  gap:8px;
}

#searchInput{
  flex:1;
  min-width:0;
  height:52px;
  border:1px solid #d4e2e8;
  border-radius:28px;
  background:#fff;
  padding:0 18px;
  font-size:17px;
  outline:none;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

#searchInput:focus{
  border-color:#168dcc;
}

#searchButton{
  width:52px;
  height:52px;
  min-width:52px;
  border:0;
  border-radius:50%;
  background:#168dcc;
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

#searchButton:active{
  transform:scale(.95);
}

#status{
  padding:9px 3px 2px;
  color:#777;
  font-size:13px;
}

/* ==============================
   RESULTS
============================== */

#results{
  padding:0 15px 25px;
}

.section-title{
  margin:15px 2px 8px;
  font-size:18px;
  font-weight:900;
}

.result{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 10px;
  margin:6px 0;
  border-radius:12px;
  background:#fff;
  color:#111;
  text-decoration:none;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.result-number{
  width:30px;
  height:30px;
  min-width:30px;
  border-radius:50%;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:bold;
}

.result-icon{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:10px;
  background:#edf8fd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.result-info{
  flex:1;
  min-width:0;
}

.result-name{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.result-path{
  margin-top:3px;
  color:#777;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.result-arrow{
  color:#168dcc;
  font-size:25px;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:25px 5px;
  color:#777;
}

.empty{
  margin-top:10px;
  padding:20px;
  border-radius:12px;
  background:#fff;
  text-align:center;
  color:#777;
}

.error{
  margin-top:10px;
  padding:15px;
  border-radius:12px;
  background:#fff0f0;
  color:#b00020;
}

.back{
  display:block;
  margin:0 15px 25px;
  padding:13px;
  border-radius:12px;
  background:#fff;
  color:#168dcc;
  text-decoration:none;
  text-align:center;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

footer{
  padding:20px;
  text-align:center;
  color:#777;
  font-size:13px;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:500px){

  .nw-header{
    height:300px;
  }

  .nw-header h1{
    font-size:31px;
  }

  .nw-header p{
    font-size:14px;
  }

}
</style>
</head>

<body>

<!-- =================================
     NING WEI MEDIA HEADER
================================= -->

<header class="nw-header">

  <img
    class="nw-header-photo"
    src="ning-wei.png"
    alt="Ning Wei Media"
  >

  <div class="nw-header-overlay"></div>

  <div class="nw-header-content">

    <h1>Ning Wei Media</h1>

    <p>
      Music • Videos • Photos • Apps • Software
    </p>

  </div>

</header>


<!-- =================================
     MASTER SEARCH
================================= -->

<section class="search-area">

  <div class="search-row">

    <input
      id="searchInput"
      type="search"
      placeholder="🔍 Search everything..."
      autocomplete="off"
    >

    <button
      id="searchButton"
      type="button"
      aria-label="Search"
    >
      🔍
    </button>

  </div>

  <div id="status">
    Search everything on Ning Wei Media.
  </div>

</section>


<!-- =================================
     RESULTS
================================= -->

<main id="results"></main>


<a
  class="back"
  href="index.html"
>
  ← Ning Wei Media Home
</a>


<footer>
  © 2026 Ning Wei Media
</footer>


<script>

/* =====================================================
   MASTER SEARCH ENGINE
   NING WEI MEDIA
===================================================== */


/* =====================================================
   GITHUB CONFIG
===================================================== */

const GITHUB_USER =
  "Ningwei2567";

const GITHUB_REPO =
  "Ning-wei-1";

const GITHUB_BRANCH =
  "main";


/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://btksyizkcpzubtextuce.supabase.co";


/*
  IMPORTANT:

  Put the SAME PUBLIC/ANONYMOUS KEY
  that is already working in upload.html.

  NEVER put a secret/service-role key here.
*/

const SUPABASE_KEY =
  "PASTE_THE_SAME_PUBLIC_KEY_FROM_UPLOAD_HTML_HERE";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const searchInput =
  document.getElementById("searchInput");

const searchButton =
  document.getElementById("searchButton");

const results =
  document.getElementById("results");

const status =
  document.getElementById("status");


/* =====================================================
   MASTER DATA
===================================================== */

let githubData = [];

let supabaseData = [];

let everythingLoaded = false;


/* =====================================================
   GITHUB API URL
===================================================== */

function githubTreeURL(){

  return (
    "https://api.github.com/repos/" +
    GITHUB_USER +
    "/" +
    GITHUB_REPO +
    "/git/trees/" +
    GITHUB_BRANCH +
    "?recursive=1"
  );

}


/* =====================================================
   ENCODE PATH
===================================================== */

function encodePath(path){

  return path
    .split("/")
    .map(part =>
      encodeURIComponent(part)
    )
    .join("/");

}


/* =====================================================
   DETECT FILE TYPE
===================================================== */

function getIcon(path){

  const p =
    String(path || "")
    .toLowerCase();


  /* MUSIC */

  if(
    p.endsWith(".mp3") ||
    p.endsWith(".m4a") ||
    p.endsWith(".wav") ||
    p.endsWith(".aac") ||
    p.endsWith(".ogg") ||
    p.endsWith(".oga") ||
    p.endsWith(".opus") ||
    p.endsWith(".flac")
  ){

    return "🎵";

  }


  /* VIDEO */

  if(
    p.endsWith(".mp4") ||
    p.endsWith(".webm") ||
    p.endsWith(".mov") ||
    p.endsWith(".m4v") ||
    p.endsWith(".avi") ||
    p.endsWith(".mkv")
  ){

    return "🎬";

  }


  /* PHOTO */

  if(
    p.endsWith(".jpg") ||
    p.endsWith(".jpeg") ||
    p.endsWith(".png") ||
    p.endsWith(".gif") ||
    p.endsWith(".webp") ||
    p.endsWith(".bmp")
  ){

    return "📸";

  }


  /* APK */

  if(
    p.endsWith(".apk")
  ){

    return "📱";

  }


  /* SOFTWARE */

  if(
    p.endsWith(".exe") ||
    p.endsWith(".msi") ||
    p.endsWith(".zip") ||
    p.endsWith(".rar") ||
    p.endsWith(".7z")
  ){

    return "💻";

  }


  /* DJ */

  if(
    p.includes("dj-mixes") ||
    p.includes("mixtapes") ||
    p.includes("mappings") ||
    p.includes("sound-effects") ||
    p.includes("virtual-dj")
  ){

    return "🎧";

  }


  /* FOLDER */

  if(
    !p.includes(".")
  ){

    return "📁";

  }


  return "📄";

}


/* =====================================================
   GITHUB DESTINATION
===================================================== */

function githubDestination(path,type){

  const lower =
    path.toLowerCase();


  /* SONGS */

  if(
    lower.startsWith("media/songs/")
  ){

    return (
      "audio.html?path=" +
      encodeURIComponent(path)
    );

  }


  /* VIDEOS */

  if(
    lower.startsWith("media/videos")
  ){

    return (
      "videos.html?path=" +
      encodeURIComponent(path)
    );

  }


  /* PHOTOS */

  if(
    lower.startsWith("media/photos")
  ){

    return (
      "photos.html?path=" +
      encodeURIComponent(path)
    );

  }


  /* APPS */

  if(
    lower.startsWith("media/apps")
  ){

    return (
      "apks.html?path=" +
      encodeURIComponent(path)
    );

  }


  /* SOFTWARE */

  if(
    lower.startsWith("media/software")
  ){

    return (
      "software.html?path=" +
      encodeURIComponent(path)
    );

  }


  /* ROOT HTML/PAGES */

  if(
    type === "blob"
  ){

    const file =
      path
      .split("/")
      .pop()
      .toLowerCase();


    /*
      Media files open in the universal player.
    */

    if(
      lower.endsWith(".mp3") ||
      lower.endsWith(".m4a") ||
      lower.endsWith(".wav") ||
      lower.endsWith(".aac") ||
      lower.endsWith(".ogg") ||
      lower.endsWith(".flac") ||
      lower.endsWith(".mp4") ||
      lower.endsWith(".webm") ||
      lower.endsWith(".mov") ||
      lower.endsWith(".jpg") ||
      lower.endsWith(".jpeg") ||
      lower.endsWith(".png") ||
      lower.endsWith(".gif") ||
      lower.endsWith(".webp")
    ){

      return (
        "media.html?path=" +
        encodeURIComponent(path)
      );

    }


    /*
      Otherwise open the website file
      through GitHub.
    */

    return (
      "https://github.com/" +
      GITHUB_USER +
      "/" +
      GITHUB_REPO +
      "/blob/" +
      GITHUB_BRANCH +
      "/" +
      encodePath(path)
    );

  }


  return "index.html";

}


/* =====================================================
   LOAD COMPLETE GITHUB TREE
===================================================== */

async function loadGitHub(){

  const response =
    await fetch(
      githubTreeURL(),
      {
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "GitHub repository could not be searched."
    );

  }


  const data =
    await response.json();


  if(
    !data.tree ||
    !Array.isArray(data.tree)
  ){

    throw new Error(
      "GitHub returned an invalid repository tree."
    );

  }


  githubData =
    data.tree
    .filter(item =>
      item.type === "blob" ||
      item.type === "tree"
    )
    .map(item => ({

      path:
        item.path,

      type:
        item.type,

      url:
        githubDestination(
          item.path,
          item.type
        )

    }));


}


/* =====================================================
   CHECK AUDIO
===================================================== */

function isAudioFile(file){

  const name =
    String(
      file.name || ""
    )
    .toLowerCase();


  return [

    ".mp3",
    ".m4a",
    ".wav",
    ".aac",
    ".ogg",
    ".oga",
    ".opus",
    ".flac"

  ].some(ext =>
    name.endsWith(ext)
  );

}


/* =====================================================
   FIND SUPABASE COVER
===================================================== */

function findCover(files){

  if(
    !Array.isArray(files)
  ){

    return "ning-wei.png";

  }


  const cover =
    files.find(file =>
      String(
        file.type || ""
      ).toLowerCase() === "cover"
    );


  if(
    cover &&
    cover.url
  ){

    return cover.url;

  }


  const photo =
    files.find(file =>
      String(
        file.type || ""
      ).toLowerCase() === "photo"
    );


  if(
    photo &&
    photo.url
  ){

    return photo.url;

  }


  return "ning-wei.png";

}


/* =====================================================
   CLEAN SONG NAME
===================================================== */

function cleanSongName(name){

  return String(name || "")
    .replace(/\.[^/.]+$/,"")
    .replace(/[_-]+/g," ")
    .trim();

}


/* =====================================================
   LOAD SUPABASE
===================================================== */

async function loadSupabase(){

  const {
    data,
    error
  } =
    await supabaseClient
    .from("artist_submissions")
    .select(
      "id,artist_name,files,created_at"
    )
    .eq(
      "status",
      "approved"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(1000);


  if(error){

    console.warn(
      "Supabase search unavailable:",
      error
    );

    supabaseData = [];

    return;

  }


  supabaseData = [];


  (data || []).forEach(row => {

    let files =
      row.files;


    if(
      typeof files === "string"
    ){

      try{

        files =
          JSON.parse(files);

      }catch(e){

        files = [];

      }

    }


    if(
      !Array.isArray(files)
    ){

      return;

    }


    const cover =
      findCover(files);


    files.forEach(file => {

      if(
        !isAudioFile(file)
      ){

        return;

      }


      const url =
        file.url ||
        file.public_url ||
        file.path;


      if(!url){

        return;

      }


      supabaseData.push({

        id:
          row.id,

        artist:
          row.artist_name ||
          "Unknown Artist",

        name:
          cleanSongName(
            file.name ||
            "Untitled Song"
          ),

        original:
          file.name ||
          "",

        url:
          url,

        cover:
          cover,

        created:
          row.created_at

      });

    });

  });

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadEverything(){

  if(
    everythingLoaded
  ){

    return;

  }


  status.textContent =
    "Loading the master search index...";


  try{

    await Promise.all([

      loadGitHub(),

      loadSupabase()

    ]);


    everythingLoaded =
      true;


    status.textContent =
      "Ready — search everything.";

  }catch(error){

    console.error(error);


    status.textContent =
      "Search loaded with some sources unavailable.";

  }

}


/* =====================================================
   SUPABASE PLAYER URL
===================================================== */

function makePlayerURL(song){

  const params =
    new URLSearchParams();


  params.set(
    "url",
    song.url
  );


  params.set(
    "song",
    song.name
  );


  params.set(
    "artist",
    song.artist
  );


  params.set(
    "cover",
    song.cover
  );


  return (
    "media.html?" +
    params.toString()
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value || ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =====================================================
   SEARCH GITHUB
===================================================== */

function searchGitHub(query){

  return githubData.filter(item => {

    const path =
      String(
        item.path || ""
      )
      .toLowerCase();


    return path.includes(
      query
    );

  });

}


/* =====================================================
   SEARCH SUPABASE
===================================================== */

function searchSupabase(query){

  return supabaseData.filter(song => {

    const artist =
      String(
        song.artist || ""
      )
      .toLowerCase();


    const name =
      String(
        song.name || ""
      )
      .toLowerCase();


    const original =
      String(
        song.original || ""
      )
      .toLowerCase();


    return (

      artist.includes(query) ||

      name.includes(query) ||

      original.includes(query)

    );

  });

}


/* =====================================================
   DRAW GITHUB RESULTS
===================================================== */

function drawGitHubResults(items){

  if(
    !items.length
  ){

    return "";

  }


  let html = `

    <div class="section-title">
      🌐 Website files & folders
    </div>

  `;


  items.forEach(
    (item,index) => {

      const parts =
        item.path.split("/");


      const name =
        parts[parts.length - 1];


      html += `

        <a
          class="result"
          href="${escapeHTML(item.url)}"
        >

          <span class="result-number">
            ${index + 1}
          </span>

          <span class="result-icon">
            ${getIcon(item.path)}
          </span>

          <span class="result-info">

            <div class="result-name">
              ${escapeHTML(name)}
            </div>

            <div class="result-path">
              ${escapeHTML(item.path)}
            </div>

          </span>

          <span class="result-arrow">
            ›
          </span>

        </a>

      `;

    }
  );


  return html;

}


/* =====================================================
   DRAW SUPABASE RESULTS
===================================================== */

function drawSupabaseResults(items){

  if(
    !items.length
  ){

    return "";

  }


  let html = `

    <div class="section-title">
      ☁️ Uploaded Music
    </div>

  `;


  items.forEach(
    (song,index) => {

      html += `

        <a
          class="result"
          href="${escapeHTML(
            makePlayerURL(song)
          )}"
        >

          <span class="result-number">
            ${index + 1}
          </span>

          <span class="result-icon">
            🎵
          </span>

          <span class="result-info">

            <div class="result-name">
              ${escapeHTML(
                song.name
              )}
            </div>

            <div class="result-path">
              ${escapeHTML(
                song.artist
              )}
              • Uploaded music
            </div>

          </span>

          <span class="result-arrow">
            ›
          </span>

        </a>

      `;

    }
  );


  return html;

}


/* =====================================================
   MASTER SEARCH
===================================================== */

async function masterSearch(){

  const originalQuery =
    searchInput.value.trim();


  const query =
    originalQuery.toLowerCase();


  if(!query){

    results.innerHTML = "";

    status.textContent =
      "Search everything on Ning Wei Media.";

    return;

  }


  await loadEverything();


  results.innerHTML = `

    <div class="loading">
      🔍 Searching everywhere...
    </div>

  `;


  const githubMatches =
    searchGitHub(query);


  const supabaseMatches =
    searchSupabase(query);


  const total =
    githubMatches.length +
    supabaseMatches.length;


  if(
    total === 0
  ){

    results.innerHTML = `

      <div class="empty">

        🔍 Nothing found for
        <b>${escapeHTML(
          originalQuery
        )}</b>

        <br><br>

        Try another word or part of a filename.

      </div>

    `;


    status.textContent =
      "0 results found.";

    return;

  }


  status.textContent =
    total +
    " result" +
    (
      total === 1
      ? ""
      : "s"
    ) +
    " found.";


  results.innerHTML =

    drawSupabaseResults(
      supabaseMatches
    ) +

    drawGitHubResults(
      githubMatches
    );

}


/* =====================================================
   SEARCH BUTTON
===================================================== */

searchButton.addEventListener(
  "click",
  masterSearch
);


/* =====================================================
   ENTER KEY
===================================================== */

searchInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      masterSearch();

    }

  }
);


/* =====================================================
   LIVE SEARCH
===================================================== */

let searchTimer = null;


searchInput.addEventListener(
  "input",
  function(){

    clearTimeout(
      searchTimer
    );


    searchTimer =
      setTimeout(
        masterSearch,
        400
      );

  }
);


/* =====================================================
   INITIALIZE
===================================================== */

loadEverything();

</script>

</body>
</html>
