<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Song - Ning Wei Media</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    color:#172033;

    min-height:100vh;

    background:

    radial-gradient(
        circle at 10% 10%,
        rgba(0,145,255,.20),
        transparent 30%
    ),

    radial-gradient(
        circle at 90% 20%,
        rgba(140,70,255,.17),
        transparent 30%
    ),

    radial-gradient(
        circle at 50% 100%,
        rgba(0,190,160,.14),
        transparent 35%
    ),

    linear-gradient(
        135deg,
        #f8fbff,
        #f4f1ff,
        #f2fffb
    );

}


/* HEADER */

header{

    background:
    linear-gradient(
        135deg,
        #087ee8,
        #1756d5
    );

    color:white;

    text-align:center;

    padding:23px 15px;

}

header h1{

    margin:0;

    font-size:26px;

}


/* CONTAINER */

.container{

    max-width:700px;

    margin:auto;

    padding:18px 15px 35px;

}


/* PLAYER CARD */

.card{

    background:
    rgba(255,255,255,.92);

    border-radius:20px;

    padding:20px;

    text-align:center;

    box-shadow:
    0 8px 30px
    rgba(0,0,0,.08);

}


/* COVER */

.cover{

    width:230px;

    height:230px;

    object-fit:cover;

    border-radius:20px;

    margin:5px auto 18px;

    display:block;

    background:#168de2;

}


/* TITLE */

#title{

    font-size:23px;

    margin:5px 0 18px;

    word-break:break-word;

}


/* AUDIO */

audio{

    width:100%;

    margin-bottom:18px;

}


/* DOWNLOAD */

.download{

    display:block;

    width:100%;

    padding:14px;

    background:
    linear-gradient(
        135deg,
        #168de2,
        #0b68c7
    );

    color:white;

    text-decoration:none;

    border-radius:30px;

    font-size:17px;

    font-weight:bold;

    margin-bottom:20px;

}


/* AD */

.ad{

    min-height:120px;

    border:
    1px dashed #aaa;

    background:#f3f3f3;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#888;

    font-size:13px;

    margin-bottom:20px;

}


/* SHARE */

.share{

    padding:15px 0;

    border-top:
    1px solid #eee;

}


.share button{

    border:0;

    padding:10px 15px;

    border-radius:25px;

    background:#eef4fb;

    margin:5px;

    font-size:14px;

}


/* COMMENTS */

.comments{

    text-align:left;

    border-top:
    1px solid #eee;

    padding-top:18px;

    margin-top:5px;

}


.comments textarea{

    width:100%;

    min-height:85px;

    border:
    1px solid #ddd;

    border-radius:12px;

    padding:12px;

    font-family:Arial;

    resize:vertical;

    margin-top:10px;

}


.comments button{

    margin-top:8px;

    border:0;

    background:#168de2;

    color:white;

    padding:10px 18px;

    border-radius:22px;

}


.comment{

    background:#f5f7fa;

    padding:10px;

    border-radius:10px;

    margin-top:8px;

    word-break:break-word;

}


/* BACK */

.back{

    display:block;

    text-align:center;

    margin:22px;

    color:#087ee8;

    text-decoration:none;

    font-weight:bold;

}

</style>

</head>


<body>


<header>

<h1>🎵 Ning Wei Media</h1>

</header>


<div class="container">


<div class="card">


<img
    id="cover"
    class="cover"
    alt="Music cover"
>


<h2 id="title">
    Loading...
</h2>


<audio
    id="player"
    controls
    preload="metadata"
>
    Your browser does not support audio.
</audio>


<a
    id="download"
    class="download"
>
    ⬇ DOWNLOAD SONG
</a>


<div class="ad">

    ADVERTISEMENT

</div>


<div class="share">

    <strong>
        📤 Share this song
    </strong>

    <br>

    <button onclick="sharePage()">
        Share
    </button>

    <button onclick="copyLink()">
        Copy Link
    </button>

</div>


<div class="comments">

    <strong>
        💬 Comments
    </strong>


    <textarea
        id="comment"
        placeholder="Write a comment..."
    ></textarea>


    <button onclick="saveComment()">
        Post Comment
    </button>


    <div id="commentsList"></div>

</div>


</div>


<a
    id="back"
    class="back"
>
    ← Back to Folder
</a>


</div>


<script>


/* GET INFORMATION FROM URL */

const params =
new URLSearchParams(
    window.location.search
);


const file =
params.get("file");


const folder =
params.get("folder")
||
"media/songs/Ugandan";


const title =
params.get("title")
||
file
||
"Song";


const cleanTitle =
title.replace(
    /\.[^/.]+$/,
    ""
);


/* PAGE TITLE */

document.title =
cleanTitle +
" - Ning Wei Media";


document.getElementById(
    "title"
).textContent =
cleanTitle;


/* COVER */

const cover =
document.getElementById(
    "cover"
);


cover.src =
"data:image/svg+xml," +

encodeURIComponent(`

<svg
xmlns="http://www.w3.org/2000/svg"
width="600"
height="600"
>

<defs>

<linearGradient
id="g"
x1="0"
y1="0"
x2="1"
y2="1"
>

<stop
offset="0%"
stop-color="#087ee8"
/>

<stop
offset="100%"
stop-color="#6b35d9"
/>

</linearGradient>

</defs>

<rect
width="100%"
height="100%"
fill="url(#g)"
/>

<text
x="50%"
y="45%"
text-anchor="middle"
fill="white"
font-size="90"
>
🎵
</text>

<text
x="50%"
y="62%"
text-anchor="middle"
fill="white"
font-size="34"
font-family="Arial"
>
NING WEI MEDIA
</text>

</svg>

`);


/* CREATE SONG URL */

if(file){

    const encodedFile =
    file
    .split("/")
    .map(
        part =>
        encodeURIComponent(part)
    )
    .join("/");


    const songURL =
    `https://raw.githubusercontent.com/Ningwei2567/Ning-wei-1/main/${folder}/${encodedFile}`;


    /* PLAYER */

    const player =
    document.getElementById(
        "player"
    );


    player.src =
    songURL;


    /* DOWNLOAD */

    const download =
    document.getElementById(
        "download"
    );


    download.href =
    songURL;


    download.setAttribute(
        "download",
        cleanTitle
    );


    /*
     * BACK BUTTON
     */

    document.getElementById(
        "back"
    ).href =
    "media.html?path=" +
    encodeURIComponent(folder);

}


/* SHARE */

async function sharePage(){

    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                cleanTitle,

                text:
                "Listen to " +
                cleanTitle +
                " on Ning Wei Media",

                url:
                window.location.href

            });

        }else{

            copyLink();

        }

    }catch(error){

        console.log(error);

    }

}


/* COPY LINK */

async function copyLink(){

    try{

        await navigator.clipboard.writeText(
            window.location.href
        );

        alert(
            "Song link copied!"
        );

    }catch(error){

        alert(
            "Copy failed. Please copy the page address."
        );

    }

}


/* COMMENTS */

function commentKey(){

    return (
        "ningwei_comments_" +
        window.location.href
    );

}


function saveComment(){

    const box =
    document.getElementById(
        "comment"
    );


    const text =
    box.value.trim();


    if(!text){

        alert(
            "Please write a comment first."
        );

        return;

    }


    const comments =
    JSON.parse(
        localStorage.getItem(
            commentKey()
        ) || "[]"
    );


    comments.push({

        text:text,

        date:
        new Date()
        .toLocaleString()

    });


    localStorage.setItem(
        commentKey(),
        JSON.stringify(comments)
    );


    box.value = "";


    showComments();

}


function showComments(){

    const comments =
    JSON.parse(
        localStorage.getItem(
            commentKey()
        ) || "[]"
    );


    const list =
    document.getElementById(
        "commentsList"
    );


    list.innerHTML =
    "";


    comments.forEach(
        comment => {

            const div =
            document.createElement(
                "div"
            );


            div.className =
            "comment";


            div.textContent =
            "💬 " +
            comment.text;


            list.appendChild(
                div
            );

        }
    );

}


showComments();

</script>


</body>
</html>
