<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ning Wei Media - Music</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: #f5f5f7;
            padding-bottom: 30px;
        }

        /* =========================
           MASTER NING WEI HEADER
           ========================= */

        .banner {
            position: relative;
            width: 100%;
            height: 125px !important;
            min-height: 125px !important;
            max-height: 125px !important;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            background: #000;
        }

        .banner img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 20%;
            display: block;
            filter: none !important;
            opacity: 1 !important;
        }

        .banner-content {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 10px;
            text-shadow:
                0 2px 4px rgba(0,0,0,.8),
                0 1px 2px rgba(0,0,0,.8);
        }

        .banner h1 {
            margin: 0;
            font-size: 1.65rem;
            line-height: 1.1;
            font-weight: 800;
        }

        .banner p {
            margin: 5px 0 0;
            font-size: .78rem;
            font-weight: 600;
        }

        /* =========================
           SEARCH
           ========================= */

        .search-container {
            padding: 12px 15px;
            display: flex;
            justify-content: center;
        }

        .search-box {
            width: 100%;
            background: #fff;
            border-radius: 22px;
            padding: 10px 17px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,.04);
            border: 1px solid #e5e5ea;
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: .95rem;
            color: #333;
            background: transparent;
        }

        /* =========================
           UPLOAD
           ========================= */

        .upload-section {
            padding: 0 15px 12px;
        }

        .btn-upload-direct {
            width: 100%;
            background: #128c9e;
            color: #fff;
            border: none;
            border-radius: 11px;
            padding: 11px;
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* =========================
           LIST
           ========================= */

        .list-container {
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .list-item {
            background: #fff;
            border-radius: 12px;
            padding: 7px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(0,0,0,.03);
            min-height: 48px;
        }

        .item-left-block {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        /* BLACK NUMBER CIRCLE */

        .number-badge {
            width: 30px;
            height: 30px;
            min-width: 30px;
            background: #000;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .82rem;
            margin-right: 10px;
        }

        .row-icon {
            width: 25px;
            height: 25px;
            margin-right: 9px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
        }

        .text-meta-box {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
        }

        .text-title {
            font-size: .94rem;
            font-weight: 700;
            color: #1d1d1f;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .text-subtitle {
            font-size: .7rem;
            color: #86868b;
            margin: 2px 0 0;
        }

        .arrow-indicator {
            color: #0071e3;
            font-size: 1rem;
            font-weight: 800;
            padding-left: 7px;
            flex-shrink: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- CLEAN MASTER HEADER -->
    <div class="banner">

        <img
            src="https://ningwei2567.github.io/Ning-wei-1/ning-wei.png"
            alt="Ning Wei"
        >

        <div class="banner-content">
            <h1>Ning Wei Media</h1>
            <p>Music • Audio • DJ Mixes</p>
        </div>

    </div>

    <!-- SEARCH -->
    <div class="search-container">
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                onkeyup="filterTracks()"
                placeholder="Search music..."
            >
        </div>
    </div>

    <!-- OWNER UPLOAD -->
    <div class="upload-section">
        <button
            onclick="openUploadPortal()"
            class="btn-upload-direct"
        >
            🚨 Upload Music Directly Here
        </button>
    </div>

    <!-- MUSIC FOLDERS -->
    <div class="list-container" id="masterTrackList">

        <a
            href="media/songs/DJ-Mixes/index.html"
            class="list-item"
        >
            <div class="item-left-block">

                <div class="number-badge">1</div>

                <div class="row-icon">📁</div>

                <div class="text-meta-box">
                    <h3 class="text-title">DJ-Mixes</h3>
                    <p class="text-subtitle">Music folder</p>
                </div>

            </div>

            <div class="arrow-indicator">❯</div>
        </a>

    </div>

</div>

<script>

function openUploadPortal() {
    alert("Upload portal active!");
}

function filterTracks() {

    const filterValue =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    const items =
        document
        .getElementById("masterTrackList")
        .getElementsByClassName("list-item");

    for (let i = 0; i < items.length; i++) {

        const titleText =
            items[i]
            .querySelector(".text-title")
            .innerText
            .toLowerCase();

        if (titleText.includes(filterValue)) {
            items[i].style.display = "flex";
        } else {
            items[i].style.display = "none";
        }
    }
}

</script>

</body>
</html>
