        /* Base Setup matching your website design layout */
        body {
            margin: 0;

        /* Banner Header Area */
        .banner {

            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: #ffffff;
            border-radius: 25px;

            background-color: #128c9e;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(18, 140, 158, 0.2);
        }

        /* FIXED COMPACT LISTS ROWS */
        .list-container {
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-item {
            background: #ffffff;
            border-radius: 14px;
            padding: 8px 12px; /* Slim inline height padding */
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .item-left-block {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        /* Smaller Tighter Number Circles */
        .number-badge {
            width: 32px;
            height: 32px;
            background: #000000;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            margin-right: 12px;
            flex-shrink: 0;

        /* Row Icons (Folders & Music Notes) */

            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffcc00;
            font-size: 1.6rem;
        }

            font-size: 1.5rem;
        }

        .text-meta-box {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
        }

        .text-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1d1d1f;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .text-subtitle {
            font-size: 0.75rem;
            color: #86868b;
            margin: 2px 0 0 0;
        }

        .arrow-indicator {

            font-weight: bold;
            padding-left: 8px;

        /* Home Button styling */

            gap: 8px;
            color: #0071e3;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 10px 20px;
        }
