<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media Library</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef9ff;
  color:#111;
}

/* MASTER HEADER */
.header{
  position:relative;
  height:318px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#000;
}

.header img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 18%;
}

.header::after{
  display:none !important;
  content:none !important;
}

.header-content{
  position:relative;
  z-index:2;
  color:white;
  text-shadow:0 2px 5px rgba(0,0,0,.55);
}

.header-content h1{
  margin:0;
  font-size:38px;
  font-weight:900;
}

.header-content p{
  margin:8px 0 0;
  font-size:17px;
}

/* MAIN */
.container{
  width:94%;
  max-width:900px;
  margin:18px auto 40px;
}

/* SEARCH */
.search-box{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.search-box input{
  flex:1;
  min-width:0;
  padding:11px 13px;
  border:1px solid #b8dff0;
  border-radius:9px;
  font-size:15px;
  outline:none;
  background:white;
}

.search-box button{
  border:0;
  border-radius:9px;
  padding:0 16px;
  background:#111;
  color:white;
  font-weight:bold;
}

/* TOP BAR */
.top-bar{
  background:white;
  border-radius:10px;
  padding:11px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.location{
  font-size:14px;
  color:#555;
  margin-bottom:9px;
  word-break:break-word;
}

.upload-owner{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  background:#111;
  color:white;
  padding:10px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
}

/* ITEMS */
.items{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.item{
  display:flex;
  align-items:center;
  gap:9px;
  background:white;
  border-radius:8px;
  padding:7px 9px;
  min-height:45px;
  box-shadow:0 1px 5px rgba(0,0,0,.07);
}

.number{
  flex:0 0 29px;
  width:29px;
  height:29px;
  border-radius:50%;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:bold;
}

.item-main{
  flex:1;
  min-width:0;
}

.item-name{
  font-size:14px;
  font-weight:bold;
  word-break:break-word;
}

.item-meta{
  margin-top:2px;
  font-size:11px;
  color:#777;
  word-break:break-word;
}

.item-actions{
  display:flex;
  gap:5px;
  flex-shrink:0;
}

.action{
  border:0;
  border-radius:6px;
  padding:7px 9px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  white-space:nowrap;
}

.open-btn{
  background:#159bd3;
  color:white;
}

.download-btn{
  background:#111;
  color:white;
}

.folder-btn{
  background:#e6f6fd;
  color:#0875a5;
  width:100%;
  text-align:left;
  border:1px solid #b9e4f4;
}

.status{
  background:white;
  padding:15px;
  border-radius:9px;
  text-align:center;
  color:#555;
  margin-top:10px;
}

.empty{
  background:white;
  border-radius:9px;
  padding:20px;
  text-align:center;
  color:#666;
}

.artist{
  color:#0781b5;
}

/* PHOTO / VIDEO GRID */
.media-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.media-card{
  background:white;
  border-radius:8px;
  overflow:hidden;
  border:1px solid #ddd;
  text-decoration:none;
  color:#111;
  box-shadow:0 1px 5px rgba(0,0,0,.07);
}

.media-thumb{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#000;
}

.media-title{
  padding:7px 5px;
  font-size:11px;
  font-weight:bold;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* MOBILE */
@media(max-width:600px){

  .header{
    height:318px;
  }

  .header-content h1{
    font-size:29px;
  }

  .header-content p{
    font-size:14px;
  }

  .media-grid{
    grid-template-columns:repeat(4,1fr);
    gap:5px;
  }

  .item-actions{
    gap:3px;
  }

  .action{
    padding:6px 7px;
    font-size:10px;
  }
}
</style>
</head>

<body>

<header class="header">
  <img
    src="https://ningwei2567.github.io/Ning-wei-1/ning-wei.png"
    alt="Ning Wei"
  >

  <div class="header-content">
    <h1>Ning Wei Media</h1>
    <p>Music • Videos • Photos • Apps • Software</p>
  </div>
</header>

<main class="container">

  <div class="search-box">
    <input
      id="searchInput"
      type="search"
      placeholder="Search media..."
      autocomplete="off"
    >
    <button onclick="performSearch()">Search</button>
  </div>

  <div class="top-bar">

    <div class="location" id="locationText">
      Loading library...
    </div>

    <a
      id="ownerUpload"
      class="upload-owner"
      href="#"
      target="_blank"
      rel="noopener"
    >
      📤 Upload Directly Here
    </a>

  </div>

  <div id="items" class="items"></div>

  <div id="status" class="status">
    Loading...
  </div>

</main>

<script>

const OWNER="Ningwei2567";
const REPO="Ning-wei-1";
const BRANCH="main";

const SITE="https://ningwei2567.github.io/Ning-wei-1/";

const params=new URLSearchParams(location.search);

const category=(
  params.get("category")||"all"
).toLowerCase();

const requestedFolder=(
  params.get("folder")||""
).replace(/^\/+|\/+$/g,"");

const categoryPaths={
  songs:"media/songs",
  videos:"media/videos",
  photos:"media/photos",
  apps:"media/apps",
  software:"media/software",
  all:"media"
};

let githubItems=[];
let supabaseItems=[];
let allItems=[];

/* SUPABASE */

const SUPABASE_URL=
"https://btksyizkcpzubtextuce.supabase.co";

const SUPABASE_ANON_KEY=
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJidGtz eXl6a2NwencidGV4dGN1Y2UiLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8"
.replace(/\s/g,"");

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function encodePath(path){
  return path.split("/")
    .map(x=>encodeURIComponent(x))
    .join("/");
}

function extension(name){
  const clean=String(name||"").split("?")[0];
  const parts=clean.split(".");
  return parts.length>1
    ? parts.pop().toLowerCase()
    : "";
}

function categoryFromExtension(name){

  const ext=extension(name);

  if([
    "mp3","wav","m4a","aac","ogg",
    "oga","flac","opus","wma"
  ].includes(ext)) return "songs";

  if([
    "mp4","3gp","webm","mkv",
    "avi","mov","m4v"
  ].includes(ext)) return "videos";

  if([
    "jpg","jpeg","png","gif",
    "webp","bmp","svg"
  ].includes(ext)) return "photos";

  if(["apk","xapk"].includes(ext))
    return "apps";

  if([
    "exe","msi","zip","rar",
    "7z","iso","dmg","deb"
  ].includes(ext)) return "software";

  return "";
}

/* IMPORTANT:
   DIRECT GITHUB UPLOAD LINK
*/

function ownerUploadFolder(){

  if(requestedFolder)
    return requestedFolder;

  return categoryPaths[category]||"media";
}

function updateOwnerUploadLink(){

  const folder=ownerUploadFolder();

  const githubUpload=
    "https://github.com/" +
    OWNER + "/" +
    REPO +
    "/upload/" +
    BRANCH + "/" +
    folder;

  document.getElementById("ownerUpload").href=
    githubUpload;

  document.getElementById("locationText").textContent=
    "Current folder: "+folder;
}

/* GITHUB */

async function loadGithub(){

  const api=
    "https://api.github.com/repos/" +
    OWNER + "/" +
    REPO +
    "/git/trees/" +
    BRANCH +
    "?recursive=1";

  try{

    const response=await fetch(api);

    if(!response.ok)
      throw new Error("GitHub request failed");

    const data=await response.json();

    githubItems=[];

    if(!Array.isArray(data.tree))
      return;

    data.tree.forEach(entry=>{

      if(!entry.path)
        return;

      if(entry.type==="tree"){

        githubItems.push({
          type:"folder",
          path:entry.path,
          name:entry.path.split("/").pop(),
          source:"github"
        });

        return;
      }

      if(entry.type!=="blob")
        return;

      const cat=
        categoryFromExtension(entry.path);

      if(!cat)
        return;

      if(
        category!=="all" &&
        cat!==category
      )
        return;

      githubItems.push({
        type:"file",
        path:entry.path,
        name:entry.path.split("/").pop(),
        category:cat,
        source:"github"
      });

    });

  }catch(error){

    console.error(error);

  }
}

/* SUPABASE */

async function loadSupabase(){

  try{

    const endpoint=
      SUPABASE_URL+
      "/rest/v1/artist_submissions"+
      "?select=id,artist_name,files,created_at,status"+
      "&status=eq.approved"+
      "&order=created_at.desc";

    const response=await fetch(endpoint,{
      headers:{
        apikey:SUPABASE_ANON_KEY,
        Authorization:"Bearer "+SUPABASE_ANON_KEY
      }
    });

    if(!response.ok)
      throw new Error("Supabase request failed");

    const rows=await response.json();

    supabaseItems=[];

    rows.forEach(row=>{

      let files=row.files;

      if(typeof files==="string"){

        try{
          files=JSON.parse(files);
        }catch{
          files=[];
        }

      }

      if(!Array.isArray(files))
        files=[];

      files.forEach(file=>{

        if(!file)
          return;

        const name=
          file.name||
          file.filename||
          file.file_name||
          "Uploaded file";

        let url=
          file.url||
          file.public_url||
          file.publicUrl||
          "";

        const cat=
          String(
            file.category||
            categoryFromExtension(name)||
            ""
          ).toLowerCase();

        if(!cat)
          return;

        if(
          category!=="all" &&
          cat!==category
        )
          return;

        if(!url){

          const storagePath=
            file.path||
            file.storage_path||
            "";

          if(storagePath){

            url=
              SUPABASE_URL+
              "/storage/v1/object/public/artist-uploads/"+
              storagePath
                .split("/")
                .map(encodeURIComponent)
                .join("/");

          }

        }

        if(!url)
          return;

        supabaseItems.push({
          type:"file",
          name:name,
          url:url,
          category:cat,
          artist:
            row.artist_name||
            "Artist upload",
          source:"artist"
        });

      });

    });

  }catch(error){

    console.error(error);

  }
}

/* CURRENT FOLDER */

function getImmediateGithubItems(){

  const folder=
    requestedFolder||
    categoryPaths[category]||
    "media";

  const prefix=folder+"/";

  const result=[];
  const seen=new Set();

  githubItems.forEach(item=>{

    if(!item.path.startsWith(prefix))
      return;

    const remaining=
      item.path.slice(prefix.length);

    if(!remaining)
      return;

    if(item.type==="folder"){

      const first=
        remaining.split("/")[0];

      if(
        !seen.has(first)
      ){

        seen.add(first);

        result.push({
          type:"folder",
          name:first,
          path:prefix+first,
          source:"github"
        });

      }

    }else{

      if(!remaining.includes("/"))
        result.push(item);

    }

  });

  return result;
}

/* BUILD */

function buildItems(){

  const current=
    getImmediateGithubItems();

  if(requestedFolder){

    allItems=current;

  }else{

    allItems=[
      ...current,
      ...supabaseItems
    ];

  }

  renderItems();
}

/* GITHUB PAGES FILE URL */

function githubPagesUrl(path){

  return SITE+
    encodePath(path);
}

/* PLAYER URL */

function playerUrl(item){

  if(item.source==="artist"){

    return "media.html?url="+
      encodeURIComponent(item.url)+
      "&name="+
      encodeURIComponent(item.name)+
      "&mime="+
      encodeURIComponent(
        item.mime||""
      );

  }

  return "media.html?path="+
    encodeURIComponent(item.path)+
    "&name="+
    encodeURIComponent(item.name);

}

/* DOWNLOAD */

function downloadUrl(item){

  if(item.source==="artist")
    return item.url;

  return githubPagesUrl(item.path);
}

/* SHORT TITLE */

function shortTitle(name){

  const noExt=
    String(name)
      .replace(/\.[^/.]+$/,"")
      .replace(/[_-]+/g," ");

  const words=
    noExt.trim().split(/\s+/);

  return words.slice(0,3).join(" ");
}

/* RENDER */

function renderItems(){

  const container=
    document.getElementById("items");

  const status=
    document.getElementById("status");

  container.innerHTML="";

  let items=[...allItems];

  const query=
    document.getElementById("searchInput")
      .value.trim()
      .toLowerCase();

  if(query){

    items=items.filter(item=>{

      const text=[
        item.name,
        item.path,
        item.artist,
        item.category
      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      return text.includes(query);

    });

  }

  items.sort((a,b)=>{

    if(
      a.type==="folder" &&
      b.type!=="folder"
    ) return -1;

    if(
      a.type!=="folder" &&
      b.type==="folder"
    ) return 1;

    return String(a.name)
      .localeCompare(String(b.name));

  });

  if(!items.length){

    container.innerHTML=
      '<div class="empty">No media found.</div>';

    status.style.display="none";
    return;

  }

  status.style.display="none";

  const isVisual=
    category==="photos" ||
    category==="videos";

  if(isVisual && requestedFolder){

    container.className="media-grid";

  }else{

    container.className="items";

  }

  items.forEach((item,index)=>{

    const number=index+1;

    if(
      isVisual &&
      item.type==="file"
    ){

      const card=
        document.createElement("a");

      card.className="media-card";
      card.href=playerUrl(item);

      const ext=extension(item.name);

      let thumb="";

      if(category==="photos"){

        thumb=
          `<img class="media-thumb"
           src="${escapeHtml(
             item.source==="artist"
               ? item.url
               : githubPagesUrl(item.path)
           )}"
           alt="${escapeHtml(item.name)}">`;

      }else{

        thumb=
          `<video
             class="media-thumb"
             muted
             preload="metadata"
             playsinline
             src="${escapeHtml(
               item.source==="artist"
                 ? item.url
                 : githubPagesUrl(item.path)
             )}">
           </video>`;

      }

      card.innerHTML=
        thumb+
        `<div class="media-title">
          ${escapeHtml(shortTitle(item.name))}
        </div>`;

      container.appendChild(card);

      return;

    }

    const row=
      document.createElement("div");

    row.className="item";

    if(item.type==="folder"){

      const href=
        "library.html?category="+
        encodeURIComponent(category)+
        "&folder="+
        encodeURIComponent(item.path);

      row.innerHTML=`

        <div class="number">
          ${number}
        </div>

        <div class="item-main">
          <div class="item-name">
            📁 ${escapeHtml(item.name)}
          </div>

          <div class="item-meta">
            Folder
          </div>
        </div>

        <div class="item-actions">
          <a
            class="action folder-btn"
            href="${href}">
            Open
          </a>
        </div>
      `;

    }else{

      const open=
        playerUrl(item);

      const download=
        downloadUrl(item);

      const artist=
        item.artist
          ? `<span class="artist">
               • ${escapeHtml(item.artist)}
             </span>`
          : "";

      row.innerHTML=`

        <div class="number">
          ${number}
        </div>

        <div class="item-main">

          <div class="item-name">
            ${escapeHtml(item.name)}
            ${artist}
          </div>

          <div class="item-meta">
            ${escapeHtml(
              extension(item.name).toUpperCase()
            )}
          </div>

        </div>

        <div class="item-actions">

          <a
            class="action open-btn"
            href="${open}">
            Open
          </a>

          <a
            class="action download-btn"
            href="${download}"
            download>
            Download
          </a>

        </div>
      `;

    }

    container.appendChild(row);

  });

}

/* SEARCH */

function performSearch(){

  renderItems();

}

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderItems
  );

/* START */

updateOwnerUploadLink();

Promise.all([
  loadGithub(),
  loadSupabase()
]).then(buildItems);

</script>

</body>
</html>
