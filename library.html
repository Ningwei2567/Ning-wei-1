<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ning Wei Media Library</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
}

.container{
max-width:600px;
margin:auto;
padding-bottom:30px;
}


.header{

height:125px;
background:#000;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;

}


.header img{

position:absolute;
width:100%;
height:125px;
object-fit:cover;
object-position:center 35%;

}


.header div{

position:relative;
z-index:2;
text-shadow:0 2px 5px #000;

}


.card{

background:white;
margin:15px;
padding:15px;
border-radius:15px;

}


.artist-box{

display:flex;
align-items:center;
gap:12px;

}


.artist-photo{

width:60px;
height:60px;
border-radius:50%;
object-fit:cover;

}



.song-card{

background:white;
margin:15px;
border-radius:15px;
overflow:hidden;

}


.cover{

width:100%;
height:250px;
object-fit:cover;

}


.song-info{

padding:15px;

}


button,a{

display:inline-block;
padding:10px 15px;
border-radius:8px;
text-decoration:none;
font-weight:bold;

}


.play{

background:#128c9e;
color:white;

}


.download{

background:#000;
color:white;

}


</style>

</head>


<body>


<div class="container">


<header class="header">

<img src="https://ningwei2567.github.io/Ning-wei-1/ning-wei.png">

<div>

<h1>Ning Wei Media</h1>

<p>Music Library</p>

</div>

</header>



<div id="library"></div>


</div>



<script>


const SUPABASE_URL =
"https://btksyizkcpzubtextuce.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function loadMusic(){


let {data,error}=await supabaseClient

.from("songs")

.select(`

id,
title,
song_url,
cover_url,

artists(
name,
photo

)

`)

.order("id",{ascending:false});



if(error){

console.log(error);

return;

}



let box=document.getElementById("library");


box.innerHTML="";



data.forEach(song=>{


box.innerHTML+=`

<div class="song-card">


<img 
class="cover"
src="${song.cover_url}"
>


<div class="song-info">


<div class="artist-box">


<img
class="artist-photo"
src="${song.artists.photo}"
>


<h3>
${song.artists.name}
</h3>


</div>


<h2>
${song.title}
</h2>



<a class="play"
href="media.html?url=${encodeURIComponent(song.song_url)}">

▶ Play

</a>



<a class="download"
href="${song.song_url}"
download>

⬇ Download

</a>



</div>


</div>


`;


});


}



loadMusic();


</script>


</body>
</html>
