<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media Library</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f7;
}

.container{
max-width:600px;
margin:auto;
}

.header{
height:125px;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
}

.header img{
position:absolute;
width:100%;
height:125px;
object-fit:cover;
}

.header div{
position:relative;
z-index:2;
text-shadow:0 2px 5px #000;
}

.song-card{
background:white;
margin:15px;
border-radius:15px;
overflow:hidden;
box-shadow:0 3px 10px #ddd;
}

.cover{
width:100%;
height:260px;
object-fit:cover;
}

.info{
padding:15px;
}

.artist{
display:flex;
align-items:center;
gap:12px;
}

.artist img{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
}

.title{
margin:15px 0 8px;
}

.date{
font-size:13px;
color:#777;
margin:0 0 15px;
}

.play{
display:inline-block;
background:#128c9e;
color:white;
padding:12px 18px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
margin-right:6px;
}

.download{
display:inline-block;
background:#000;
color:white;
padding:12px 18px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.empty{
background:white;
margin:15px;
padding:25px;
border-radius:15px;
text-align:center;
color:#777;
}

.error{
background:#fff0f0;
color:#b00000;
margin:15px;
padding:15px;
border-radius:12px;
}

</style>

</head>


<body>


<div class="container">


<header class="header">

<img src="ning-wei.png" alt="Ning Wei">

<div>

<h1>Ning Wei Media</h1>

<p>Music Library</p>

</div>

</header>


<div id="library"></div>


</div>



<script>


const SUPABASE_URL =
"https://btksyizkcpzubtextuce.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoiYnRrc3l6aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



function formatUploadDate(dateValue){

if(!dateValue){
return "Upload date unavailable";
}

const date = new Date(dateValue);

if(isNaN(date.getTime())){
return "Upload date unavailable";
}

return date.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"long",
year:"numeric"
}
);

}



async function loadLibrary(){


const library =
document.getElementById("library");


library.innerHTML =
'<div class="empty">Loading music...</div>';



let {data,error}=await db

.from("songs")

.select(`

id,
title,
song_url,
cover_url,
created_at,

artists(
name,
photo

)

`)

.order("created_at",{ascending:false});



if(error){

console.error(error);

library.innerHTML = `

<div class="error">

Unable to load the music library.

<br><br>

${error.message}

</div>

`;

return;

}



if(!data || data.length === 0){

library.innerHTML = `

<div class="empty">

No uploaded music found.

</div>

`;

return;

}



let html="";



data.forEach(song=>{


const artist =
song.artists || {};


const artistName =
artist.name || "Unknown Artist";


const artistPhoto =
artist.photo || "default-user.png";


const cover =
song.cover_url || "default-cover.jpg";


const title =
song.title || "Untitled";


const uploadDate =
formatUploadDate(song.created_at);



html += `

<div class="song-card">


<img
class="cover"
src="${cover}"
alt="${title}"
onerror="this.src='default-cover.jpg'"
>


<div class="info">


<div class="artist">


<img
src="${artistPhoto}"
alt="${artistName}"
onerror="this.src='default-user.png'"
>


<h3>${artistName}</h3>


</div>


<h2 class="title">
${title}
</h2>


<p class="date">
📅 Uploaded: ${uploadDate}
</p>


<a
class="play"
href="media.html?id=${encodeURIComponent(song.id)}"
>

▶ Play

</a>


<a
class="download"
href="${song.song_url || '#'}"
${song.song_url ? 'download' : ''}
>

⬇ Download

</a>


</div>


</div>

`;



});



library.innerHTML=html;


}



loadLibrary();


</script>


</body>

</html>
