<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media - Library</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0a0a0a;
  color:#fff;
}
.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding-bottom:30px;
}

/* Header */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: #111;
  border-bottom: 1px solid #222;
}
.back-btn {
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}
.page-title {
  font-size: 16px;
  font-weight: 800;
  color: #55bfe8;
  text-transform: capitalize;
}
.admin-toggle-btn {
  background: #222;
  color: #ff4444;
  border: 1px solid #ff4444;
  padding: 4px 8px;
  font-size: 11px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}
.admin-toggle-btn.active {
  background: #ff4444;
  color: #fff;
}

/* Multi-Select Action Bar */
.bulk-action-bar {
  display: none;
  background: #220000;
  border-bottom: 1px solid #ff4444;
  padding: 10px 16px;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}
body.admin-mode .bulk-action-bar {
  display: flex;
}
.bulk-del-btn {
  background: #d32f2f;
  color: #fff;
  border: none;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}

/* Featured Media Container */
.main-player-wrap {
  width: 100%;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 250px;
}
video.full-media, img.full-media, audio.full-media {
  width: 100%;
  max-height: 80vh;
  object-fit: contain;
  outline: none;
  display: block;
}
.software-display-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  color: #fff;
  text-align: center;
  gap: 12px;
  background: #111;
  width: 100%;
  min-height: 250px;
}
.software-display-box span {
  font-size: 48px;
}
.software-display-box p {
  font-size: 16px;
  font-weight: bold;
  color: #55bfe8;
  margin: 0;
}

/* Media Info Section */
.video-details {
  padding: 12px 16px;
  background: #111;
  border-bottom: 1px solid #222;
}

.title-download-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.video-title {
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin: 0;
}
.action-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.download-btn {
  background: #e50914;
  color: #fff;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
  padding: 6px 10px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

/* Meta Information */
.meta-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: #aaa;
}
.uploader-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.artist-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  background: #333;
  border: 1px solid #555;
}
.uploader-name {
  color: #e50914;
  font-weight: bold;
}
.date-row {
  font-size: 12px;
  color: #888;
  padding-left: 2px;
}

/* Related Header Bar */
.related-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #222;
  padding: 10px 14px;
  margin-top: 15px;
  border-left: 4px solid #e50914;
}
.related-header h3 {
  margin: 0;
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  text-transform: capitalize;
}
.toggle-icon {
  background: #e50914;
  color: #fff;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 2px;
  font-size: 12px;
}

/* Related Grid */
.related-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 12px 16px;
}
.related-card {
  position: relative;
  background: #161616;
  border-radius: 8px;
  overflow: hidden;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  height: 190px;
  justify-content: center;
  align-items: center;
}
.related-card video, .related-card img, .related-card audio {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
  display: block;
}
.related-card-software {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #aaa;
  font-size: 12px;
  text-align: center;
  padding: 10px;
  gap: 5px;
}
.related-card-software span {
  font-size: 28px;
}

/* Multi-select checkboxes */
.card-checkbox {
  display: none;
  position: absolute;
  top: 8px;
  left: 8px;
  width: 20px;
  height: 20px;
  z-index: 10;
  accent-color: #d32f2f;
  cursor: pointer;
}
body.admin-mode .card-checkbox {
  display: block;
}

/* Custom Clean Modal */
.custom-modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  z-index: 9999;
  justify-content: center;
  align-items: center;
}
.custom-modal {
  background: #1a1a1a;
  border: 1px solid #333;
  padding: 20px;
  border-radius: 10px;
  width: 85%;
  max-width: 320px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.custom-modal p {
  font-size: 15px;
  margin-bottom: 20px;
  color: #fff;
  font-weight: bold;
}
.modal-btn-group {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.modal-btn {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: bold;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}
.modal-btn.cancel {
  background: #333;
  color: #fff;
}
.modal-btn.confirm {
  background: #e50914;
  color: #fff;
}
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← Home</a>
    <div class="page-title" id="folderName">Library</div>
    <button class="admin-toggle-btn" onclick="toggleAdminMode()">🔐 Admin</button>
  </div>

  <!-- Bulk Action Bar for Admin Mode -->
  <div class="bulk-action-bar">
    <div>
      <input type="checkbox" id="selectAllBox" onclick="toggleSelectAll(this)"> 
      <label for="selectAllBox"><b>Select All</b></label>
    </div>
    <button class="bulk-del-btn" onclick="promptDelete()">🗑️ Delete Selected</button>
  </div>

  <!-- Featured Media / Software Area -->
  <div class="main-player-wrap" id="mainMediaContainer"></div>

  <!-- Media Info -->
  <div class="video-details">
    <div class="title-download-row">
      <h2 class="video-title" id="activeTitle">Loading...</h2>
      <div class="action-group">
        <a id="downloadLink" class="download-btn" href="#" download>⬇ Download</a>
      </div>
    </div>

    <div class="meta-info">
      <div class="uploader-row">
        <img id="artistAvatar" class="artist-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Artist Profile">
        <span>From: <span class="uploader-name" id="activeUploader">Ning Wei Media</span></span>
      </div>
      <div class="date-row">
        📅 Date: <span id="activeDate">September 13, 2026</span>
      </div>
    </div>
  </div>

  <!-- Related Header Bar -->
  <div class="related-header">
    <h3 id="relatedHeaderTitle">Related items</h3>
    <div class="toggle-icon">▲</div>
  </div>

  <!-- Related Items Grid -->
  <div class="related-grid" id="relatedGrid"></div>
</div>

<!-- Custom Clean Popup Modal -->
<div class="custom-modal-overlay" id="customModalOverlay">
  <div class="custom-modal">
    <p id="customModalText">Message text here</p>
    <div class="modal-btn-group" id="customModalButtons">
      <button class="modal-btn confirm" id="modalOkBtn">OK</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://btksyizkcpzubtextuce.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";

let db = null;
let currentItem = null;
let allItems = [];

function showCustomAlert(message, callback) {
  const overlay = document.getElementById('customModalOverlay');
  const textEl = document.getElementById('customModalText');
  const btnGroup = document.getElementById('customModalButtons');
  
  textEl.textContent = message;
  btnGroup.innerHTML = `<button class="modal-btn confirm" id="modalOkBtn">OK</button>`;
  overlay.style.display = 'flex';

  document.getElementById('modalOkBtn').onclick = () => {
    overlay.style.display = 'none';
    if (callback) callback();
  };
}

function showCustomConfirm(message, onConfirm) {
  const overlay = document.getElementById('customModalOverlay');
  const textEl = document.getElementById('customModalText');
  const btnGroup = document.getElementById('customModalButtons');
  
  textEl.textContent = message;
  btnGroup.innerHTML = `
    <button class="modal-btn cancel" id="modalCancelBtn">Cancel</button>
    <button class="modal-btn confirm" id="modalConfirmBtn">Yes, Delete</button>
  `;
  overlay.style.display = 'flex';

  document.getElementById('modalCancelBtn').onclick = () => {
    overlay.style.display = 'none';
  };

  document.getElementById('modalConfirmBtn').onclick = () => {
    overlay.style.display = 'none';
    onConfirm();
  };
}

function toggleAdminMode() {
  document.body.classList.toggle('admin-mode');
  const btn = document.querySelector('.admin-toggle-btn');
  btn.classList.toggle('active');
}

function isImageFile(filenameOrUrl) {
  return /\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i.test(filenameOrUrl);
}

function isVideoFile(filenameOrUrl) {
  return /\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i.test(filenameOrUrl);
}

function isAudioFile(filenameOrUrl) {
  return /\.(mp3|wav|aac|m4a|flac|ogg)(\?.*)?$/i.test(filenameOrUrl);
}

async function initLibrary() {
  const urlParams = new URLSearchParams(window.location.search);
  const selectedFolder = urlParams.get('folder') || '';
  const formattedTitle = selectedFolder.replace(/-/g, ' ');
  
  document.getElementById('folderName').textContent = formattedTitle || "Library";
  document.getElementById('relatedHeaderTitle').textContent = "Related " + (formattedTitle ? formattedTitle.toLowerCase() : "items");

  const isSoftwareCategory = /software|editing|tools/i.test(selectedFolder);

  if (!window.supabase) return;
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const { data, error } = await db.from('artist_submissions').select('*');
  if (error || !data) return;

  allItems = [];

  data.forEach(row => {
    if (row.status && row.status.toLowerCase() !== 'approved') return;

    const rowCategory = (row.category || row.folder || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const currentFolder = selectedFolder.toLowerCase().replace(/[^a-z0-9]/g, '');

    const matchesFolder = !selectedFolder || rowCategory.includes(currentFolder) || currentFolder.includes(rowCategory);
    if (!matchesFolder) return;

    const dateStr = row.created_at ? new Date(row.created_at).toLocaleDateString('en-US', {
      month: 'long', day: 'numeric', year: 'numeric'
    }) : 'September 13, 2026';

    const avatarUrl = row.cover_url || row.artist_cover || row.profile_pic || '';

    if (Array.isArray(row.files)) {
      row.files.forEach((f, idx) => {
        const fileName = (f.original_name || f.name || '').toLowerCase();
        const fileUrl = (f.url || '').toLowerCase();
        
        const isPhoto = isImageFile(fileName) || isImageFile(fileUrl);
        const isVideo = isVideoFile(fileName) || isVideoFile(fileUrl);
        const isAudio = isAudioFile(fileName) || isAudioFile(fileUrl);

        allItems.push({
          id: row.id,
          fileIndex: idx,
          title: f.original_name || f.name || row.artist_name || 'File Package',
          url: f.url,
          isSoftware: isSoftwareCategory,
          isImage: isPhoto,
          isVideo: isVideo,
          isAudio: isAudio,
          uploader: row.artist_name || 'Ning Wei Media',
          avatar: avatarUrl,
          date: dateStr
        });
      });
    }
  });

  if (allItems.length > 0) {
    playMedia(allItems[0]);
    renderRelated(allItems.slice(1));
  } else {
    document.getElementById('activeTitle').textContent = 'No files found in this category.';
    document.getElementById('mainMediaContainer').innerHTML = '';
  }
}

function playMedia(item) {
  currentItem = item;
  const container = document.getElementById('mainMediaContainer');

  if (item.isSoftware) {
    container.innerHTML = `
      <div class="software-display-box">
        <span>📦</span>
        <p>Software / Tool Package Ready for Download</p>
      </div>
    `;
  } else if (item.isImage) {
    container.innerHTML = `<img src="${item.url}" class="full-media" alt="${item.title}">`;
  } else if (item.isVideo) {
    container.innerHTML = `<video id="mainVideoPlayer" class="full-media" controls autoplay playsinline src="${item.url}"></video>`;
  } else if (item.isAudio) {
    container.innerHTML = `<audio id="mainAudioPlayer" class="full-media" controls autoplay src="${item.url}"></audio>`;
  } else {
    container.innerHTML = `
      <div class="software-display-box">
        <span>📦</span>
        <p>File Ready for Download</p>
      </div>
    `;
  }

  document.getElementById('activeTitle').textContent = item.title;
  document.getElementById('activeUploader').textContent = item.uploader;
  document.getElementById('activeDate').textContent = item.date;

  const downloadBtn = document.getElementById('downloadLink');
  downloadBtn.href = item.url;
  downloadBtn.setAttribute('download', item.title);

  const avatarImg = document.getElementById('artistAvatar');
  if (item.avatar) {
    avatarImg.src = item.avatar;
  }
}

function renderRelated(relatedList) {
  const grid = document.getElementById('relatedGrid');
  grid.innerHTML = relatedList.map((item, idx) => {
    let previewElement = '';
    if (item.isSoftware) {
      previewElement = `
        <div class="related-card-software">
          <span>📦</span>
          <div>Software Package</div>
        </div>
      `;
    } else if (item.isImage) {
      previewElement = `<img src="${item.url}" loading="lazy" alt="preview">`;
    } else if (item.isVideo) {
      previewElement = `<video src="${item.url}#t=0.5" preload="metadata" muted></video>`;
    } else if (item.isAudio) {
      previewElement = `
        <div class="related-card-software">
          <span>🎵</span>
          <div>Audio Track</div>
        </div>
      `;
    } else {
      previewElement = `
        <div class="related-card-software">
          <span>📦</span>
          <div>File Package</div>
        </div>
      `;
    }

    return `
      <div class="related-card" onclick="switchMedia(${idx})">
        <input type="checkbox" class="card-checkbox" data-id="${item.id}" onclick="event.stopPropagation()">
        ${previewElement}
      </div>
    `;
  }).join('');
  
  window.currentRelated = relatedList;
}

function switchMedia(index) {
  if (window.currentRelated && window.currentRelated[index]) {
    playMedia(window.currentRelated[index]);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function toggleSelectAll(masterBox) {
  const checkboxes = document.querySelectorAll('.card-checkbox');
  checkboxes.forEach(cb => cb.checked = masterBox.checked);
}

function promptDelete() {
  const checkboxes = document.querySelectorAll('.card-checkbox:checked');
  const selectedIds = Array.from(checkboxes).map(cb => cb.getAttribute('data-id'));

  if (selectedIds.length === 0) {
    showCustomAlert("Please select at least one item to delete.");
    return;
  }

  showCustomConfirm("Confirm delete?", async () => {
    if (!db) return;
    const { error } = await db.from('artist_submissions').delete().in('id', selectedIds);
    if (error) {
      showCustomAlert("Error: " + error.message);
    } else {
      showCustomAlert("Deleted successfully!", () => {
        location.reload();
      });
    }
  });
}

initLibrary();
</script>

</body>
</html>
