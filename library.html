<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  background:#080808;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100%;
}

body{
  overflow-x:hidden;
}

button,
a,
input,
textarea{
  font:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none!important;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(8,8,8,.96);
  border-bottom:1px solid #222;
  backdrop-filter:blur(12px);
}

.header-inner{
  max-width:1400px;
  margin:auto;
  min-height:64px;
  padding:10px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
}

.upload-btn{
  background:#fff;
  color:#000;
  padding:10px 17px;
  border-radius:9px;
  font-weight:800;
  transition:.2s;
}

.upload-btn:hover{
  transform:translateY(-1px);
  opacity:.9;
}

/* MAIN */
.container{
  width:min(1400px,calc(100% - 24px));
  margin:auto;
}

.hero{
  padding:30px 0 20px;
  text-align:center;
}

.hero h1{
  font-size:clamp(28px,5vw,52px);
  margin-bottom:9px;
}

.hero p{
  color:#aaa;
  font-size:15px;
}

/* SEARCH */
.search-wrap{
  margin:0 auto 28px;
  max-width:760px;
}

.search-box{
  width:100%;
  background:#111;
  border:1px solid #2c2c2c;
  color:#fff;
  padding:14px 16px;
  border-radius:12px;
  outline:none;
}

.search-box:focus{
  border-color:#666;
}

/* SECTIONS */
.section{
  margin:0 0 34px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:15px;
  margin-bottom:18px;
}

.section-head h2{
  font-size:21px;
}

.section-more{
  display:flex;
  justify-content:center;
  margin-top:16px;
}

.more-btn,
.back-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid #333;
  background:#141414;
  color:#fff;
  border-radius:9px;
  padding:10px 18px;
  cursor:pointer;
  font-weight:800;
  transition:.2s;
}

.more-btn:hover,
.back-btn:hover{
  background:#222;
  transform:translateY(-1px);
}

/* CATEGORY CARDS */
.category-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}

.category-card{
  min-height:90px;
  padding:13px 12px;
  border:1px solid #252525;
  border-radius:11px;
  background:#101010;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  transition:.2s;
}

.category-card:hover{
  background:#181818;
  border-color:#444;
  transform:translateY(-2px);
}

.category-icon{
  width:39px;
  height:39px;
  flex:0 0 39px;
  border-radius:10px;
  background:#1c1c1c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.category-name{
  font-weight:800;
  font-size:13px;
  line-height:1.25;
}

/* MEDIA GRID */
.media-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

.media-card{
  display:block;
  overflow:hidden;
  background:#101010;
  border:1px solid #242424;
  border-radius:11px;
  cursor:pointer;
  transition:.2s;
}

.media-card:hover{
  border-color:#444;
  transform:translateY(-2px);
}

.media-thumb{
  width:100%;
  aspect-ratio:16/9;
  background:#151515;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.media-thumb img,
.media-thumb video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.media-placeholder{
  color:#888;
  font-size:30px;
}

.media-body{
  padding:9px 10px 11px;
}

.media-title{
  font-size:13px;
  font-weight:800;
  line-height:1.3;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.media-meta{
  color:#888;
  font-size:11px;
  margin-top:5px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.media-uploader{
  color:#bbb;
}

/* AUDIO */
.audio-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.audio-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:#101010;
  border:1px solid #252525;
  border-radius:10px;
  padding:10px 12px;
}

.audio-row:hover{
  background:#171717;
}

.audio-cover{
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:8px;
  background:#222;
  object-fit:cover;
}

.audio-info{
  min-width:0;
  flex:1;
}

.audio-title{
  font-weight:800;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.audio-meta{
  color:#888;
  font-size:11px;
  margin-top:4px;
}

/* STATES */
.loading,
.empty{
  padding:28px 12px;
  text-align:center;
  color:#888;
  border:1px dashed #292929;
  border-radius:10px;
}

.error{
  color:#ff7777;
}

/* CATEGORY PAGE */
.category-page{
  padding:25px 0 50px;
}

.category-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:20px;
}

.category-page h2{
  font-size:28px;
  margin-bottom:7px;
}

.category-subtitle{
  color:#888;
  margin-bottom:22px;
}

/* MEDIA VIEWER */
.media-viewer,
.profile-viewer{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.94);
}

.viewer-backdrop{
  position:absolute;
  inset:0;
}

.media-viewer-shell{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  max-width:1100px;
  margin:auto;
}

.viewer-close{
  position:absolute;
  z-index:10;
  right:15px;
  top:15px;
  width:42px;
  height:42px;
  border:1px solid #444;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff;
  font-size:27px;
  cursor:pointer;
}

.viewer-scroll{
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}

.viewer-slide{
  min-height:100%;
  scroll-snap-align:start;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:65px 15px 25px;
}

.viewer-card{
  width:min(900px,100%);
  max-height:calc(100vh - 90px);
  overflow-y:auto;
  background:#0e0e0e;
  border:1px solid #292929;
  border-radius:14px;
  padding:14px;
}

.viewer-media{
  width:100%;
  max-height:58vh;
  object-fit:contain;
  display:block;
  background:#050505;
  border-radius:10px;
}

.viewer-info{
  padding:13px 2px 2px;
}

.viewer-title{
  font-size:18px;
  font-weight:900;
  word-break:break-word;
}

.viewer-meta{
  color:#888;
  font-size:12px;
  margin-top:7px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.viewer-uploader{
  margin-top:12px;
  display:flex;
  align-items:center;
  gap:9px;
}

.uploader-photo{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}

.uploader-placeholder{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
}

.uploader-link{
  color:#fff;
  font-weight:800;
  cursor:pointer;
  text-decoration:underline;
}

.viewer-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.viewer-action{
  border:1px solid #333;
  background:#171717;
  color:#fff;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:800;
}

.viewer-action:hover{
  background:#252525;
}

/* COMMENTS */
.comments{
  margin-top:18px;
  border-top:1px solid #252525;
  padding-top:15px;
}

.comments h3{
  font-size:15px;
  margin-bottom:9px;
}

.comment-form{
  display:flex;
  gap:7px;
}

.comment-input{
  flex:1;
  min-width:0;
  resize:none;
  background:#151515;
  color:#fff;
  border:1px solid #303030;
  border-radius:8px;
  padding:9px;
  outline:none;
}

.comment-add{
  border:1px solid #333;
  background:#fff;
  color:#000;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  font-weight:800;
}

.comment-list{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.comment-item{
  background:#151515;
  border:1px solid #252525;
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
}

.comment-date{
  color:#777;
  display:block;
  margin-top:4px;
  font-size:10px;
}

/* PROFILE */
.profile-shell{
  position:relative;
  z-index:2;
  width:min(1050px,calc(100% - 24px));
  max-height:calc(100vh - 24px);
  overflow:auto;
  margin:12px auto;
  background:#0d0d0d;
  border:1px solid #2c2c2c;
  border-radius:14px;
  padding:18px;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:14px;
  padding-bottom:17px;
  border-bottom:1px solid #242424;
  margin-bottom:20px;
}

.profile-photo{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}

.profile-name{
  font-size:24px;
  font-weight:900;
}

.profile-tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.profile-tab{
  border:1px solid #333;
  background:#151515;
  color:#fff;
  padding:8px 13px;
  border-radius:8px;
  cursor:pointer;
}

.profile-tab.active{
  background:#fff;
  color:#000;
}

/* FOOTER */
footer{
  border-top:1px solid #222;
  margin-top:45px;
  padding:25px 15px;
  text-align:center;
  color:#777;
  font-size:12px;
}

/* RESPONSIVE */
@media(max-width:1000px){
  .category-grid,
  .media-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:600px){
  .container{
    width:min(100% - 16px,1400px);
  }

  .header-inner{
    padding:9px 10px;
  }

  .logo{
    font-size:17px;
  }

  .upload-btn{
    padding:8px 11px;
    font-size:12px;
  }

  .hero{
    padding-top:22px;
  }

  .section-head h2{
    font-size:18px;
  }

  .category-card{
    min-height:76px;
    padding:10px;
  }

  .category-icon{
    width:34px;
    height:34px;
    flex-basis:34px;
    font-size:17px;
  }

  .category-name{
    font-size:11px;
  }

  .media-grid{
    gap:8px;
  }

  .media-body{
    padding:7px 8px 9px;
  }

  .media-title{
    font-size:11px;
  }

  .media-meta{
    font-size:9px;
  }

  .viewer-slide{
    padding:60px 8px 12px;
  }

  .viewer-card{
    padding:9px;
  }

  .viewer-media{
    max-height:48vh;
  }

  .comment-form{
    flex-direction:column;
  }
}
</style>
</head>

</main>

<footer>

<!-- MEDIA VIEWER -->
<div id="mediaViewer" class="media-viewer hidden">

  <div class="media-viewer-shell">

    <button
      class="viewer-close"
      onclick="closeMediaViewer()"

    <div id="viewerScroll" class="viewer-scroll"></div>

  </div>
</div>


<!-- PROFILE VIEWER -->
<div id="profileViewer" class="profile-viewer hidden">

  <div class="viewer-backdrop" onclick="closeProfileViewer()"></div>

  <div class="profile-shell">

    <button
      class="viewer-close"

    <div class="profile-top">

    </div>

    <div class="profile-tabs">
      <button

      <button

    </div>

    <div id="profileMediaGrid" class="media-grid"></div>

  </div>
</div>

/* =========================================================
   HELPERS
========================================================= */

function cleanName(name){
  return String(name || "Media")
    .split("/")
    .pop()
    .replace(/\.[^/.]+$/,"")
    .replace(/[_-]+/g," ")
    .replace(/\s+/g," ")
    .trim() || "Media";
}

function fileExtension(name){
  const m = String(name || "").match(/\.([a-z0-9]+)$/i);
  return m ? m[1].toLowerCase() : "";
}

function isVideo(item){
  const type = String(item?.type || item?.mime || "").toLowerCase();
  const ext = fileExtension(item?.name || item?.file_name || item?.url || "");
  return type.startsWith("video/") ||
    ["mp4","webm","mov","m4v","avi","mkv","3gp"].includes(ext);
}

function isAudio(item){
  const type = String(item?.type || item?.mime || "").toLowerCase();
  const ext = fileExtension(item?.name || item?.file_name || item?.url || "");
  return type.startsWith("audio/") ||
    ["mp3","wav","m4a","aac","ogg","flac"].includes(ext);
}

function isImage(item){
  const type = String(item?.type || item?.mime || "").toLowerCase();
  const ext = fileExtension(item?.name || item?.file_name || item?.url || "");
  return type.startsWith("image/") ||
    ["jpg","jpeg","png","gif","webp","bmp","avif"].includes(ext);
}

function formatDate(date){
  if(!date) return "Date unavailable";

  const d = new Date(date);

  if(Number.isNaN(d.getTime())){
    return String(date);
  }

  return d.toLocaleDateString(undefined,{
    year:"numeric",
    month:"short",
    day:"numeric"
  });
}

function displayName(category){
  return DISPLAY_NAMES[category] ||
    String(category || "")
      .replace(/[-_]+/g," ")
      .replace(/\s+/g," ")
      .trim();
}

function getCategoryIcon(category){
  return CATEGORY_ICONS[category] || "📁";
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeUrl(url){
  try{
    return new URL(url,window.location.href).href;
  }catch{
    return "";
  }
}

function pathText(item){
  return [
    item?.path,
    item?.file_path,
    item?.url,
    item?.name,
    item?.category
  ]
  .filter(Boolean)
  .join(" ")
  .replace(/\\/g,"/");
}

function pathContainsCategory(item,category){
  const text = pathText(item).toLowerCase();
  const wanted = String(category || "").toLowerCase();

  if(!wanted) return false;

  if(text.includes("/" + wanted.toLowerCase() + "/")) return true;
  if(text.includes("/" + wanted.toLowerCase())) return true;
  if(text.includes(wanted.toLowerCase())) return true;

  const readableWanted =
    displayName(category).toLowerCase();

  return text.includes(readableWanted);
}

/* =========================================================
   GITHUB
========================================================= */

async function loadGithubTree(){

  const api =
    "https://api.github.com/repos/" +
    GITHUB_OWNER + "/" +
    GITHUB_REPO +
    "/git/trees/" +
    GITHUB_BRANCH +
    "?recursive=1";

  const response = await fetch(api,{
    headers:{
      "Accept":"application/vnd.github+json"
    }
  });

  if(!response.ok){
    throw new Error("GitHub tree request failed");
  }

  const data = await response.json();

  return Array.isArray(data.tree)
    ? data.tree
    : [];
}

function githubItems(tree){

  const items = [];

  for(const node of tree){

    if(node.type !== "blob") continue;

    const path =
      String(node.path || "").replace(/\\/g,"/");

    const lower = path.toLowerCase();

    let kind = "";

    if(lower.startsWith("media/videos/")){
      kind = "video";
    }else if(lower.startsWith("media/photos/")){
      kind = "image";
    }else if(
      lower.startsWith("media/songs/") ||
      lower.startsWith("media/dj-mixes/")
    ){
      kind = "audio";
    }else{
      continue;
    }

    const name =
      path.split("/").pop() || "Media";

    const url =
      RAW_BASE +
      path
        .split("/")
        .map(encodeURIComponent)
        .join("/");

    items.push({
      id:"github:" + path,
      source:"github",
      path,
      name,
      url,
      type:
        kind === "video"
          ? "video/mp4"
          : kind === "image"
            ? "image/jpeg"
            : "audio/mpeg",
      mime:
        kind === "video"
          ? "video/mp4"
          : kind === "image"
            ? "image/jpeg"
            : "audio/mpeg",
      date:"",
      thumbnail:"",
      uploaderId:"",
      uploaderName:"",
      uploaderPhoto:"",
      uploaderEmail:""
    });
  }

  return items;
}


/* =========================================================
   SUPABASE
========================================================= */

async function loadSupabaseItems(){

  if(
    !SUPABASE_URL ||
    !SUPABASE_ANON_KEY ||
    SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"
  ){
    return [];
  }

  const endpoint =
    SUPABASE_URL +
    "/rest/v1/artist_submissions?select=*";

  const response = await fetch(endpoint,{
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer " + SUPABASE_ANON_KEY
    }
  });

  if(!response.ok){
    return [];
  }

  const rows = await response.json();

  if(!Array.isArray(rows)){
    return [];
  }

  return rows.map((row,index)=>{

    const artistObj =
      row?.artist &&
      typeof row.artist === "object"
        ? row.artist
        : null;

    const url =
      row.file_url ||
      row.url ||
      row.public_url ||
      row.storage_url ||
      "";

    const name =
      row.file_name ||
      row.filename ||
      row.name ||
      "Media";

    const suppliedType =
      row.type ||
      row.media_type ||
      row.mime ||
      "";

    let type = suppliedType;

    if(!type){
      const ext = fileExtension(name);

      if(
        ["mp4","webm","mov","m4v","avi","mkv","3gp"]
          .includes(ext)
      ){
        type = "video/" + ext;
      }else if(
        ["jpg","jpeg","png","gif","webp","bmp","avif"]
          .includes(ext)
      ){
        type = "image/" + (ext === "jpg" ? "jpeg" : ext);
      }else if(
        ["mp3","wav","m4a","aac","ogg","flac"]
          .includes(ext)
      ){
        type = "audio/" + ext;
      }
    }

    return {
      id:
        "supabase:" +
        (row.id || index),

      source:"supabase",

      path:
        row.path ||
        row.file_path ||
        row.storage_path ||
        "",

      name,
      url,
      type,
      mime:type,

      date:
        row.created_at ||
        row.uploaded_at ||
        row.date ||
        "",

      thumbnail:
        row.thumbnail_url ||
        row.thumbnail ||
        row.cover_url ||
        "",

      category:
        row.category ||
        row.category_name ||
        "",

      uploaderId:
        row.artist_id ||
        row.uploader_id ||
        row.profile_id ||
        artistObj?.id ||
        "",

      uploaderName:
        row.artist_name ||
        row.artist ||
        row.uploader_name ||
        row.profile_name ||
        row.uploaded_by ||
        artistObj?.name ||
        artistObj?.artist_name ||
        artistObj?.display_name ||
        "",

      uploaderPhoto:
        row.artist_photo ||
        row.profile_photo ||
        row.uploader_photo ||
        artistObj?.photo ||
        artistObj?.photo_url ||
        artistObj?.profile_photo ||
        "",

      uploaderEmail:
        row.artist_email ||
        row.uploader_email ||
        artistObj?.email ||
        ""
    };

  }).filter(item=>item.url);
}


/* =========================================================
   DUPLICATES
========================================================= */

function removeDuplicates(items){

  const seen = new Set();

  return items.filter(item=>{

    const key =
      String(
        item.url ||
        item.path ||
        item.name ||
        ""
      )
      .trim()
      .toLowerCase();

    if(!key || seen.has(key)){
      return false;
    }

    seen.add(key);
    return true;
  });
}

        : "";

    thumb = `
      <video
        ${poster}
        muted
        preload="metadata"
        playsinline
      ></video>
    `;

  }else{

    thumb = `
      <div class="media-placeholder">🎵</div>
    `;
  }

  card.innerHTML = `
    <div class="media-thumb">
      ${thumb}
    </div>

    <div class="media-body">

        ${escapeHtml(title)}
      </div>

      <div class="media-meta">

          uploader.name
            ? `<span class="media-uploader">• ${escapeHtml(uploader.name)}</span>`
            : ""

  if(isImage(item) || isVideo(item)){

    card.addEventListener("click",()=>{

    card.addEventListener("click",()=>{
      window.location.href =
        mediaPage(
          item.url,
          item.name,
          item.mime || item.type
        );
    });

  return card;
}

async function loadLibrary(){

  const videosGrid =
    document.getElementById("videosGrid");

  const photosGrid =
    document.getElementById("photosGrid");

  const djGrid =
    document.getElementById("djGrid");

  try{

    const githubPromise =
      loadGithubTree()
        .then(githubItems)
        .catch(()=>[]);

    const supabasePromise =
      loadSupabaseItems()
        .catch(()=>[]);

    const [
      github,
      supabase
    ] = await Promise.all([
      githubPromise,
      supabasePromise
    ]);

    ALL_ITEMS =
      removeDuplicates([
        ...github,
        ...supabase
      ]);

    renderHome();

  }catch(error){

    console.error(error);

    if(videosGrid){
      videosGrid.innerHTML =
        `<div class="empty error">Unable to load videos.</div>`;
    }

    if(photosGrid){
      photosGrid.innerHTML =
        `<div class="empty error">Unable to load photos.</div>`;
    }

    if(djGrid){
      djGrid.innerHTML =
        `<div class="empty error">Unable to load DJ mixes.</div>`;
    }
  }
}

  subtitle.textContent =

  upload.href =
    "upload.html?category=" +
    encodeURIComponent(category);

  renderCategoryResults(category);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function renderCategoryResults(category){

  const container =
    document.getElementById("categoryResults");

  container.innerHTML = "";

  const isMusic =
    MUSIC_CATEGORIES.includes(category);

  const isApp =
    APPS_CATEGORIES.includes(category);

  const isSoftware =
    SOFTWARE_CATEGORIES.includes(category);

  let items =
    ALL_ITEMS.filter(item=>
      matchesRequestedCategory(item,category)
    );

  if(isMusic){
    items =
      items.filter(item=>
        isAudio(item) || !item.type
      );
  }

  if(isApp || isSoftware){
    items =
      items.filter(item=>!isAudio(item) || isVideo(item) || isImage(item));
  }

  if(!items.length){

    container.innerHTML = `
      <div class="empty">
        No content found in this category yet.
      </div>
    `;

    return;
  }

  const audio =
    items.filter(isAudio);

  const visual =
    items.filter(item=>
      isImage(item) || isVideo(item)
    );

  if(audio.length){

    const audioList =
      document.createElement("div");

    audioList.className =
      "audio-list";

    audio.forEach(item=>{
      audioList.appendChild(
        createAudioRow(item)
      );
    });

    container.appendChild(audioList);
  }

  if(visual.length){

    if(audio.length){
      const spacer =
        document.createElement("div");

      spacer.style.height = "22px";

      container.appendChild(spacer);
    }

    const grid =
      document.createElement("div");

    grid.className =
      "media-grid";

    visual.forEach(item=>{
      grid.appendChild(
        createMediaCard(item)
      );
    });

    container.appendChild(grid);
  }
}

/* =========================================================
   CATEGORY DIRECTORY
========================================================= */

function showCategoryDirectory(
  type,
  scroll=true
){

  const container =
    document.getElementById("categoryResults");

  container.innerHTML = "";

  let categories = [];

  if(type === "music"){
    categories = MUSIC_CATEGORIES;
  }else if(type === "apps"){
    categories = APPS_CATEGORIES;
  }else if(type === "software"){
    categories = SOFTWARE_CATEGORIES;
  }else if(type === "dj"){

    const djItems =
      ALL_ITEMS
        .filter(item=>isAudio(item))
        .filter(item=>isDjMix(item));

    if(!djItems.length){

      container.innerHTML =
        `<div class="empty">No DJ mixes available yet.</div>`;

      return;
    }

    const list =
      document.createElement("div");

    list.className =
      "audio-list";

    djItems.forEach(item=>{
      list.appendChild(
        createAudioRow(item)
      );
    });

    container.appendChild(list);

    if(scroll){
      window.scrollTo({
        top:0,
        behavior:"smooth"
      });
    }

    return;
  }

  const grid =
    document.createElement("div");

  grid.className =
    "category-grid";

  categories.forEach(category=>{
    grid.appendChild(
      createCategoryCard(category)
    );
  });

  container.appendChild(grid);

  if(scroll){
    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }
}

/* =========================================================
   MEDIA VIEWER
========================================================= */

function openMediaViewer(selectedItem){

  const viewer =
    document.getElementById("mediaViewer");

  const scroll =
    document.getElementById("viewerScroll");

  const selectedType =
    isVideo(selectedItem)
      ? "video"
      : "image";

  const collection =
    ALL_ITEMS.filter(item=>
      selectedType === "video"
        ? isVideo(item)
        : isImage(item)
    );

  if(!collection.length) return;

  const selectedIndex =
    Math.max(
      0,
      collection.findIndex(item=>
        String(item.id) ===
        String(selectedItem.id)
      )
    );

  scroll.innerHTML = "";

  collection.forEach((item,index)=>{

    const slide =
      document.createElement("div");

    slide.className =
      "viewer-slide";

    slide.dataset.index =
      String(index);

    slide.innerHTML =
      createViewerSlideHtml(item,index);

    scroll.appendChild(slide);

    setupViewerSlide(
      slide,
      item
    );
  });

  viewer.classList.remove("hidden");

  document.body.style.overflow = "hidden";

  requestAnimationFrame(()=>{

    const target =
      scroll.querySelector(
        `.viewer-slide[data-index="${selectedIndex}"]`
      );

    if(target){
      target.scrollIntoView({
        block:"start"
      });
    }
  });
}

function createViewerSlideHtml(
  item,
  index
){

  const uploader =
    getUploaderInfo(item);

  const title =
    cleanName(item.name);

  let mediaHtml = "";

  if(isVideo(item)){

    const poster =
      item.thumbnail
        ? `poster="${escapeHtml(item.thumbnail)}"`
        : "";

    mediaHtml = `
      <video
        class="viewer-media"
        controls
        playsinline
        preload="metadata"
        ${poster}
      >
        <source
          src="${escapeHtml(item.url)}"
          type="${escapeHtml(item.mime || item.type || "video/mp4")}"
        >
      </video>
    `;

  }else{

    mediaHtml = `
      <img
        class="viewer-media"
        src="${escapeHtml(item.url)}"
        alt="${escapeHtml(title)}"
      >
    `;
  }

  let uploaderHtml = "";

  if(uploader.name){

    const profileKey =
      uploaderKey(item);

    const photoHtml =
      uploader.photo
        ? `
          <img
            class="uploader-photo"
            src="${escapeHtml(uploader.photo)}"
            alt=""
          >
        `
        : `
          <div class="uploader-placeholder">
            👤
          </div>
        `;

    uploaderHtml = `
      <div class="viewer-uploader">

        ${photoHtml}

        <div>
          <div style="font-size:11px;color:#777">
            Uploaded by
          </div>

          <button
            type="button"
            class="uploader-link"
            data-profile-key="${escapeHtml(profileKey)}"
          >
            ${escapeHtml(uploader.name)}
          </button>
        </div>

      </div>
    `;
  }

  const commentKey =
    getCommentKey(item);

  return `
    <div class="viewer-card">

      ${mediaHtml}

      <div class="viewer-info">

        <div class="viewer-title">
          ${escapeHtml(title)}
        </div>

        <div class="viewer-meta">
          <span>
            Uploaded: ${escapeHtml(formatDate(item.date))}
          </span>

          <span>
            • ${isVideo(item) ? "Video" : "Photo"}
          </span>
        </div>

        ${uploaderHtml}

        <div class="viewer-actions">

          <a
            class="viewer-action"
            href="${escapeHtml(item.url)}"
            download="${escapeHtml(item.name || title)}"
            target="_blank"
            rel="noopener"
          >
            ⬇ Download
          </a>

          <button
            type="button"
            class="viewer-action"
            data-share-url="${escapeHtml(item.url)}"
            data-share-title="${escapeHtml(title)}"
          >
            ↗ Share
          </button>

          <button
            type="button"
            class="viewer-action"
            onclick="closeMediaViewer()"
          >
            Close
          </button>

        </div>

        <div
          class="comments"
          data-comment-key="${escapeHtml(commentKey)}"
        >

          <h3>💬 Comments</h3>

          <div class="comment-form">

            <textarea
              class="comment-input"
              rows="2"
              placeholder="Write a comment..."
            ></textarea>

            <button
              type="button"
              class="comment-add"
            >
              Add
            </button>

          </div>

          <div class="comment-list"></div>

        </div>

      </div>

    </div>
  `;
}

function setupViewerSlide(
  slide,
  item
){

  const shareButton =
    slide.querySelector(
      "[data-share-url]"
    );

  if(shareButton){

    shareButton.addEventListener(
      "click",
      ()=>{
        shareMedia(
          shareButton.dataset.shareUrl,
          shareButton.dataset.shareTitle
        );
      }
    );
  }

  const uploaderButton =
    slide.querySelector(
      ".uploader-link"
    );

  if(uploaderButton){

    uploaderButton.addEventListener(
      "click",
      ()=>{
        const key =
          uploaderButton.dataset.profileKey;

        openUploaderProfile(key);
      }
    );
  }

  const comments =
    slide.querySelector(".comments");

  if(comments){

    const key =
      comments.dataset.commentKey;

    loadCommentsInto(
      comments,
      key
    );

    const add =
      comments.querySelector(".comment-add");

    const input =
      comments.querySelector(".comment-input");

    add.addEventListener(
      "click",
      ()=>{
        addComment(
          key,
          input,
          comments
        );
      }
    );

    input.addEventListener(
      "keydown",
      event=>{
        if(
          event.key === "Enter" &&
          !event.shiftKey
        ){
          event.preventDefault();

          addComment(
            key,
            input,
            comments
          );
        }
      }
    );
  }
}

function closeMediaViewer(){

  document
    .getElementById("mediaViewer")
    .classList.add("hidden");

  document.body.style.overflow = "";
}


/* =========================================================
   SHARE
========================================================= */

async function shareMedia(
  url,
  title
){

  const fullUrl =
    safeUrl(url);

  try{

    if(
      navigator.share &&
      fullUrl
    ){

      await navigator.share({
        title:title || "Ning Wei Media",
        text:title || "Ning Wei Media",
        url:fullUrl
      });

      return;
    }

    if(
      navigator.clipboard &&
      fullUrl
    ){

      await navigator.clipboard.writeText(
        fullUrl
      );

      alert("Media link copied.");

      return;
    }

    window.prompt(
      "Copy this media link:",
      fullUrl
    );

  }catch(error){

    if(error?.name === "AbortError"){
      return;
    }

    try{
      await navigator.clipboard.writeText(
        fullUrl
      );

      alert("Media link copied.");

    }catch{
      window.prompt(
        "Copy this media link:",
        fullUrl
      );
    }
  }
}


/* =========================================================
   COMMENTS
========================================================= */

function getCommentKey(item){

  return (
    "ningwei-comments:" +
    String(
      item.id ||
      item.url ||
      item.path ||
      item.name ||
      ""
    )
  );
}

function readComments(key){

  try{

    const data =
      localStorage.getItem(key);

    const parsed =
      data ? JSON.parse(data) : [];

    return Array.isArray(parsed)
      ? parsed
      : [];

  }catch{
    return [];
  }
}

function saveComments(
  key,
  comments
){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(comments)
    );

  }catch{
    /* Local storage may be unavailable. */
  }
}

function loadCommentsInto(
  commentsBox,
  key
){

  const list =
    commentsBox.querySelector(
      ".comment-list"
    );

  const comments =
    readComments(key);

  list.innerHTML = "";

  if(!comments.length){

    list.innerHTML =
      `<div style="color:#666;font-size:11px">
         No comments yet.
       </div>`;

    return;
  }

  comments.forEach(comment=>{

    const item =
      document.createElement("div");

    item.className =
      "comment-item";

    item.innerHTML = `
      <div>
        ${escapeHtml(comment.text)}
      </div>
      <span class="comment-date">
        ${escapeHtml(formatDateTime(comment.date))}
      </span>
    `;

    list.appendChild(item);
  });
}

function formatDateTime(date){

  const d =
    new Date(date);

  if(Number.isNaN(d.getTime())){
    return String(date || "");
  }

  return d.toLocaleString();
}

function addComment(
  key,
  input,
  commentsBox
){

  const text =
    String(input.value || "").trim();

  if(!text) return;

  const comments =
    readComments(key);

  comments.push({
    text,
    date:new Date().toISOString()
  });

  saveComments(
    key,
    comments
  );

  input.value = "";

  loadCommentsInto(
    commentsBox,
    key
  );
}


/* =========================================================
   PROFILE VIEWER
========================================================= */

function openUploaderProfile(profileKey){

  if(!profileKey){
    return;
  }

  const items =
    ALL_ITEMS.filter(item=>
      uploaderKey(item) === profileKey
    );

  if(!items.length){
    return;
  }

  const first =
    items.find(item=>
      getUploaderInfo(item).name
    ) || items[0];

  const uploader =
    getUploaderInfo(first);

  CURRENT_PROFILE_KEY =
    profileKey;

  CURRENT_PROFILE_ITEMS =
    items;

  CURRENT_PROFILE_TYPE =
    "photos";

  document
    .getElementById("profileName")
    .textContent =
      uploader.name || "Uploader";

  document
    .getElementById("profileDescription")
    .textContent =
      "Photos and videos uploaded by " +
      (uploader.name || "this uploader");

  const photoHolder =
    document.getElementById(
      "profilePhotoHolder"
    );

  if(uploader.photo){

    photoHolder.innerHTML = `
      <img
        class="profile-photo"
        src="${escapeHtml(uploader.photo)}"
        alt=""
      >
    `;

  }else{

    photoHolder.innerHTML = `
      <div
        class="profile-photo"
        style="display:flex;align-items:center;justify-content:center;font-size:30px"
      >
        👤
      </div>
    `;
  }

  document
    .getElementById("profileViewer")
    .classList.remove("hidden");

  document.body.style.overflow = "hidden";

  showProfileMedia("photos");
}

function showProfileMedia(type){

  CURRENT_PROFILE_TYPE =
    type;

  const photosTab =
    document.getElementById(
      "profilePhotosTab"
    );

  const videosTab =
    document.getElementById(
      "profileVideosTab"
    );

  photosTab.classList.toggle(
    "active",
    type === "photos"
  );

  videosTab.classList.toggle(
    "active",
    type === "videos"
  );

  const grid =
    document.getElementById(
      "profileMediaGrid"
    );

  grid.innerHTML = "";

  const items =
    CURRENT_PROFILE_ITEMS.filter(
      type === "photos"
        ? isImage
        : isVideo
    );

  if(!items.length){

    grid.innerHTML =
      `<div class="empty">
         No ${type} uploaded by this profile yet.
       </div>`;

    return;
  }

  items.forEach(item=>{
    grid.appendChild(
      createMediaCard(item)
    );
  });
}

function closeProfileViewer(){

  document
    .getElementById("profileViewer")
    .classList.add("hidden");

  document.body.style.overflow = "";
}


/* =========================================================
   SEARCH
========================================================= */

function setupSearch(){

  const input =
    document.getElementById(
      "searchInput"
    );

  if(!input) return;

  input.addEventListener(
    "input",
    ()=>{
      const query =
        input.value
          .trim()
          .toLowerCase();

      if(!query){

        renderHome();

        return;
      }

      renderSearchResults(query);
    }
  );
}

function renderSearchResults(query){

  const musicGrid =
    document.getElementById("musicGrid");

  const appsGrid =
    document.getElementById("appsGrid");

  const softwareGrid =
    document.getElementById("softwareGrid");

  const videosGrid =
    document.getElementById("videosGrid");

  const photosGrid =
    document.getElementById("photosGrid");

  const djGrid =
    document.getElementById("djGrid");

  [
    musicGrid,
    appsGrid,
    softwareGrid,
    videosGrid,
    photosGrid,
    djGrid
  ].forEach(element=>{
    if(element){
      element.innerHTML = "";
    }
  });

  const matched =
    ALL_ITEMS.filter(item=>{

      const uploader =
        getUploaderInfo(item);

      const text =
        [
          item.name,
          item.path,
          item.category,
          uploader.name
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      return text.includes(query);
    });

  const videos =
    matched.filter(isVideo).slice(0,16);

  const photos =
    matched.filter(isImage).slice(0,16);

  const dj =
    matched
      .filter(item=>
        isAudio(item) &&
        isDjMix(item)
      )
      .slice(0,4);

  const music =
    MUSIC_CATEGORIES.filter(category=>
      displayName(category)
        .toLowerCase()
        .includes(query)
    ).slice(0,4);

  const apps =
    APPS_CATEGORIES.filter(category=>
      displayName(category)
        .toLowerCase()
        .includes(query)
    ).slice(0,4);

  const software =
    SOFTWARE_CATEGORIES.filter(category=>
      displayName(category)
        .toLowerCase()
        .includes(query)
    ).slice(0,4);

  music.forEach(category=>{
    musicGrid.appendChild(
      createCategoryCard(category)
    );
  });

  apps.forEach(category=>{
    appsGrid.appendChild(
      createCategoryCard(category)
    );
  });

  software.forEach(category=>{
    softwareGrid.appendChild(
      createCategoryCard(category)
    );
  });

  if(videos.length){
    videos.forEach(item=>{
      videosGrid.appendChild(
        createMediaCard(item)
      );
    });
  }else{
    videosGrid.innerHTML =
      `<div class="empty">No matching videos.</div>`;
  }

  if(photos.length){
    photos.forEach(item=>{
      photosGrid.appendChild(
        createMediaCard(item)
      );
    });
  }else{
    photosGrid.innerHTML =
      `<div class="empty">No matching photos.</div>`;
  }

  if(dj.length){
    dj.forEach(item=>{
      djGrid.appendChild(
        createAudioRow(item)
      );
    });
  }else{
    djGrid.innerHTML =
      `<div class="empty">No matching DJ mixes.</div>`;
  }
}
