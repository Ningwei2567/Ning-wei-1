<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media Library</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f7;
}

.container{
max-width:600px;
margin:auto;
}


.header{

height:125px;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;

}

.header img{

position:absolute;
width:100%;
height:125px;
object-fit:cover;

}


.header div{

position:relative;
z-index:2;
text-shadow:0 2px 5px #000;

}


.song-card{

background:white;
margin:15px;
border-radius:15px;
overflow:hidden;
box-shadow:0 3px 10px #ddd;

}


.cover{

width:100%;
height:260px;
object-fit:cover;

}


.info{

padding:15px;

}


.artist{

display:flex;
align-items:center;
gap:12px;

}


.artist img{

width:60px;
height:60px;
border-radius:50%;
object-fit:cover;

}


.play{

display:inline-block;
background:#128c9e;
color:white;
padding:12px 18px;
border-radius:10px;
text-decoration:none;
font-weight:bold;

}


.download{

display:inline-block;
background:#000;
color:white;
padding:12px 18px;
border-radius:10px;
text-decoration:none;
font-weight:bold;

}


</style>

</head>


<body>


<div class="container">


<header class="header">

<img src="ning-wei.png">

<div>

<h1>Ning Wei Media</h1>

<p>Music Library</p>

</div>

</header>



<div id="library"></div>



</div>



<script>


const SUPABASE_URL =
"https://btksyizkcpzubtextuce.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function loadLibrary(){


let {data,error}=await db

.from("songs")

.select(`

id,
title,
song_url,
cover_url,

artists(
name,
photo

)

`)

.order("id",{ascending:false});



if(error){

console.log(error);

return;

}



let html="";



data.forEach(song=>{


html += `

<div class="song-card">


<img class="cover"
src="${song.cover_url || 'default-cover.jpg'}">


<div class="info">


<div class="artist">


<img src="${song.artists.photo || 'default-user.png'}">


<h3>${song.artists.name}</h3>


</div>


<h2>${song.title}</h2>



<a class="play"

href="media.html?id=${song.id}">

▶ Play

</a>



<a class="download"

href="${song.song_url}"

download>

⬇ Download

</a>



</div>


</div>


`;



});



document.getElementById("library").innerHTML=html;


}



loadLibrary();


</script>


</body>

</html>
