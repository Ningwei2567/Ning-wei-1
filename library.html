<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ning Wei Media Library</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef9ff;
      color: #111;
    }

    /* HEADER */
    .header {
      position: relative;
      height: 318px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .header img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 18%;
      z-index: 0;
    }

    .header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(55, 165, 220, 0.38);
      z-index: 1;
    }

    .header-content {
      position: relative;
      z-index: 2;
      color: white;
      text-shadow: 0 2px 5px rgba(0,0,0,.55);
      padding: 15px;
    }

    .header-content h1 {
      margin: 0;
      font-size: 38px;
    }

    .header-content p {
      margin: 8px 0 0;
      font-size: 17px;
    }

    /* MAIN */
    .container {
      width: 94%;
      max-width: 900px;
      margin: 18px auto 40px;
    }

    /* SEARCH */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 11px 13px;
      border: 1px solid #b8dff0;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    .search-box button {
      border: 0;
      border-radius: 9px;
      padding: 0 16px;
      background: #159bd3;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* TOP BAR */
    .top-bar {
      background: white;
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .location {
      font-size: 14px;
      color: #555;
      margin-bottom: 9px;
      word-break: break-word;
    }

    .upload-owner {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: #111;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    /* ITEMS */
    .items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 9px;
      background: white;
      border-radius: 8px;
      padding: 7px 9px;
      min-height: 45px;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
    }

    .number {
      flex: 0 0 29px;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
    }

    .item-main {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 14px;
      font-weight: bold;
      word-break: break-word;
    }

    .item-meta {
      margin-top: 2px;
      font-size: 11px;
      color: #777;
      word-break: break-word;
    }

    .item-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .action {
      border: 0;
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    .open-btn {
      background: #159bd3;
      color: white;
    }

    .download-btn {
      background: #111;
      color: white;
    }

    .folder-btn {
      background: #e6f6fd;
      color: #0875a5;
      width: 100%;
      text-align: left;
      border: 1px solid #b9e4f4;
    }

    /* STATUS */
    .status {
      background: white;
      padding: 15px;
      border-radius: 9px;
      text-align: center;
      color: #555;
      margin-top: 10px;
    }

    .empty {
      background: white;
      border-radius: 9px;
      padding: 20px;
      text-align: center;
      color: #666;
    }

    .artist {
      color: #0781b5;
    }

    @media (max-width: 600px) {
      .header {
        height: 260px;
      }

      .header-content h1 {
        font-size: 29px;
      }

      .header-content p {
        font-size: 14px;
      }

      .item-actions {
        gap: 3px;
      }

      .action {
        padding: 6px 7px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <img src="ning-wei.png" alt="Ning Wei">
    <div class="header-content">
      <h1>Ning Wei Media</h1>
      <p>Music • Videos • Photos • Apps • Software</p>
    </div>
  </header>

  <main class="container">

    <!-- SEARCH -->
    <div class="search-box">
      <input
        id="searchInput"
        type="search"
        placeholder="Search media..."
        autocomplete="off"
      >
      <button onclick="performSearch()">Search</button>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="location" id="locationText">
        Loading library...
      </div>

      <!-- OWNER ONLY -->
      <a
        id="ownerUpload"
        class="upload-owner"
        href="#"
      >
        📤 Upload Directly Here
      </a>
    </div>

    <!-- ITEMS -->
    <div id="items" class="items"></div>

    <div id="status" class="status">
      Loading...
    </div>

  </main>

<script>
/* =========================================================
   NING WEI MEDIA UNIVERSAL LIBRARY
   ========================================================= */

const OWNER = "Ningwei2567";
const REPO = "Ning-wei-1";
const BRANCH = "main";

const category = (
  new URLSearchParams(window.location.search)
    .get("category") || "all"
).toLowerCase();

const requestedFolder = (
  new URLSearchParams(window.location.search)
    .get("folder") || ""
).replace(/^\/+|\/+$/g, "");

const initialSearch = (
  new URLSearchParams(window.location.search)
    .get("search") || ""
).trim();

const categoryPaths = {
  songs: "media/songs",
  videos: "media/videos",
  photos: "media/photos",
  apps: "media/apps",
  software: "media/software",
  all: "media"
};

const categoryNames = {
  songs: "Songs",
  videos: "Videos",
  photos: "Photos",
  apps: "Apps",
  software: "Software",
  all: "Media"
};

let allItems = [];
let githubItems = [];
let supabaseItems = [];

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://btksyizkcpzubtextuce.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function encodePath(path) {
  return path
    .split("/")
    .map(part => encodeURIComponent(part))
    .join("/");
}

function getCategoryPath() {
  return categoryPaths[category] || "media";
}

function extension(name) {
  const clean = String(name || "").split("?")[0];
  const parts = clean.split(".");
  if (parts.length < 2) return "";
  return parts.pop().toLowerCase();
}

function categoryFromExtension(name) {
  const ext = extension(name);

  if (
    [
      "mp3","wav","m4a","aac","ogg","oga",
      "flac","opus","wma"
    ].includes(ext)
  ) {
    return "songs";
  }

  if (
    [
      "mp4","3gp","webm","mkv","avi",
      "mov","m4v"
    ].includes(ext)
  ) {
    return "videos";
  }

  if (
    [
      "jpg","jpeg","png","gif","webp",
      "bmp","svg"
    ].includes(ext)
  ) {
    return "photos";
  }

  if (
    [
      "apk","xapk"
    ].includes(ext)
  ) {
    return "apps";
  }

  if (
    [
      "exe","msi","zip","rar","7z",
      "iso","dmg","deb"
    ].includes(ext)
  ) {
    return "software";
  }

  return "";
}

function categoryMatches(path, itemCategory) {

  if (category === "all") {
    return true;
  }

  if (itemCategory === category) {
    return true;
  }

  const wanted = categoryPaths[category];

  if (wanted && path.startsWith(wanted + "/")) {
    return true;
  }

  return false;
}

/* =========================================================
   OWNER UPLOAD LINK
   ========================================================= */

function ownerUploadFolder() {

  if (requestedFolder) {
    return requestedFolder;
  }

  return getCategoryPath();
}

function updateOwnerUploadLink() {

  const folder = ownerUploadFolder();

  const url =
    "admin-upload.html?folder=" +
    encodeURIComponent(folder);

  document.getElementById("ownerUpload").href = url;

  document.getElementById("locationText").textContent =
    folder
      ? "Current folder: " + folder
      : "Current section: " + (categoryNames[category] || "Media");
}

/* =========================================================
   GITHUB
   ========================================================= */

async function loadGithub() {

  const api =
    "https://api.github.com/repos/" +
    OWNER + "/" +
    REPO +
    "/git/trees/" +
    BRANCH +
    "?recursive=1";

  try {

    const response = await fetch(api, {
      headers: {
        "Accept": "application/vnd.github+json"
      }
    });

    if (!response.ok) {
      throw new Error("GitHub request failed");
    }

    const data = await response.json();

    if (!Array.isArray(data.tree)) {
      return;
    }

    githubItems = [];

    data.tree.forEach(entry => {

      if (!entry.path) return;

      if (entry.type === "tree") {
        githubItems.push({
          type: "folder",
          path: entry.path,
          name: entry.path.split("/").pop(),
          source: "github"
        });
        return;
      }

      if (entry.type !== "blob") return;

      const itemCategory =
        categoryFromExtension(entry.path);

      if (!categoryMatches(entry.path, itemCategory)) {
        return;
      }

      githubItems.push({
        type: "file",
        path: entry.path,
        name: entry.path.split("/").pop(),
        category: itemCategory,
        source: "github"
      });

    });

  } catch (error) {

    console.error(error);

  }
}

/* =========================================================
   SUPABASE
   ========================================================= */

async function loadSupabase() {

  try {

    const endpoint =
      SUPABASE_URL +
      "/rest/v1/artist_submissions" +
      "?select=id,artist_name,files,created_at,status" +
      "&status=eq.approved" +
      "&order=created_at.desc";

    const response = await fetch(endpoint, {
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY
      }
    });

    if (!response.ok) {
      throw new Error("Supabase request failed");
    }

    const rows = await response.json();

    supabaseItems = [];

    rows.forEach(row => {

      let files = row.files;

      if (typeof files === "string") {
        try {
          files = JSON.parse(files);
        } catch {
          files = [];
        }
      }

      if (!Array.isArray(files)) {
        files = [];
      }

      files.forEach(file => {

        if (!file) return;

        let fileName =
          file.name ||
          file.filename ||
          file.file_name ||
          "Uploaded file";

        let fileUrl =
          file.url ||
          file.public_url ||
          file.publicUrl ||
          "";

        const fileCategory =
          String(
            file.category ||
            categoryFromExtension(fileName) ||
            ""
          ).toLowerCase();

        if (!fileCategory) return;

        if (
          category !== "all" &&
          fileCategory !== category
        ) {
          return;
        }

        if (!fileUrl) {

          const storagePath =
            file.path ||
            file.storage_path ||
            "";

          if (storagePath) {

            fileUrl =
              SUPABASE_URL +
              "/storage/v1/object/public/artist-uploads/" +
              storagePath
                .split("/")
                .map(x => encodeURIComponent(x))
                .join("/");

          }

        }

        if (!fileUrl) return;

        supabaseItems.push({

          type: "file",

          name: fileName,

          url: fileUrl,

          category: fileCategory,

          artist:
            row.artist_name ||
            "Artist upload",

          source: "artist",

          created_at: row.created_at || ""

        });

      });

    });

  } catch (error) {

    console.error(error);

  }
}

/* =========================================================
   IMMEDIATE FOLDER CHILDREN
   ========================================================= */

function getImmediateGithubItems() {

  const folder =
    requestedFolder;

  if (!folder) {

    const root =
      getCategoryPath();

    const seenFolders = new Set();
    const result = [];

    githubItems.forEach(item => {

      if (item.type === "folder") {

        const prefix = root + "/";

        if (!item.path.startsWith(prefix)) {
          return;
        }

        const remaining =
          item.path.slice(prefix.length);

        if (!remaining) return;

        const first =
          remaining.split("/")[0];

        if (
          remaining.includes("/") &&
          !seenFolders.has(first)
        ) {

          seenFolders.add(first);

          result.push({
            type: "folder",
            name: first,
            path: root + "/" + first,
            source: "github"
          });

        }

      }

      if (item.type === "file") {

        const prefix = root + "/";

        if (!item.path.startsWith(prefix)) {
          return;
        }

        const remaining =
          item.path.slice(prefix.length);

        if (
          remaining &&
          !remaining.includes("/")
        ) {
          result.push(item);
        }

      }

    });

    return result;
  }

  const prefix =
    folder + "/";

  const result = [];
  const seenFolders = new Set();

  githubItems.forEach(item => {

    if (!item.path.startsWith(prefix)) {
      return;
    }

    const remaining =
      item.path.slice(prefix.length);

    if (!remaining) return;

    if (item.type === "folder") {

      const first =
        remaining.split("/")[0];

      if (
        remaining.includes("/") &&
        !seenFolders.has(first)
      ) {

        seenFolders.add(first);

        result.push({
          type: "folder",
          name: first,
          path: prefix + first,
          source: "github"
        });

      }

    }

    if (item.type === "file") {

      if (!remaining.includes("/")) {
        result.push(item);
      }

    }

  });

  return result;
}

/* =========================================================
   BUILD LIST
   ========================================================= */

function buildItems() {

  const currentGithub =
    getImmediateGithubItems();

  if (requestedFolder) {

    allItems = currentGithub;

  } else {

    allItems = [
      ...currentGithub,
      ...supabaseItems
    ];

  }

  renderItems();
}

/* =========================================================
   OPEN FILE
   ========================================================= */

function githubRawUrl(path) {

  return (
    "https://raw.githubusercontent.com/" +
    OWNER + "/" +
    REPO + "/" +
    BRANCH + "/" +
    encodePath(path)
  );

}

function playerUrl(item) {

  if (item.source === "artist") {

    return (
      "media.html?url=" +
      encodeURIComponent(item.url) +
      "&name=" +
      encodeURIComponent(item.name)
    );

  }

  return (
    "media.html?path=" +
    encodeURIComponent(item.path)
  );

}

function downloadUrl(item) {

  if (item.source === "artist") {
    return item.url;
  }

  return githubRawUrl(item.path);

}

/* =========================================================
   RENDER
   ========================================================= */

function renderItems() {

  const container =
    document.getElementById("items");

  const status =
    document.getElementById("status");

  container.innerHTML = "";

  let items =
    [...allItems];

  const query =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if (query) {

    items =
      items.filter(item => {

        const text = [
          item.name,
          item.path,
          item.artist,
          item.category
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return text.includes(query);

      });

  }

  /* FOLDERS FIRST */
  items.sort((a, b) => {

    if (
      a.type === "folder" &&
      b.type !== "folder"
    ) {
      return -1;
    }

    if (
      a.type !== "folder" &&
      b.type === "folder"
    ) {
      return 1;
    }

    return String(a.name)
      .localeCompare(String(b.name));

  });

  if (!items.length) {

    container.innerHTML =
      '<div class="empty">No media found.</div>';

    status.style.display = "none";

    return;
  }

  /* NUMBERING RESTARTS HERE */
  items.forEach((item, index) => {

    const number =
      index + 1;

    const row =
      document.createElement("div");

    row.className = "item";

    if (item.type === "folder") {

      const href =
        "library.html?category=" +
        encodeURIComponent(category) +
        "&folder=" +
        encodeURIComponent(item.path);

      row.innerHTML = `

        <div class="number">
          ${number}
        </div>

        <div class="item-main">
          <div class="item-name">
            📁 ${escapeHtml(item.name)}
          </div>

          <div class="item-meta">
            Folder
          </div>
        </div>

        <div class="item-actions">
          <a
            class="action folder-btn"
            href="${href}"
          >
            Open
          </a>
        </div>

      `;

    } else {

      const artist =
        item.artist
          ? `<span class="artist"> • ${escapeHtml(item.artist)}</span>`
          : "";

      const open =
        playerUrl(item);

      const download =
        downloadUrl(item);

      const ext =
        extension(item.name);

      row.innerHTML = `

        <div class="number">
          ${number}
        </div>

        <div class="item-main">

          <div class="item-name">
            ${escapeHtml(item.name)}
          </div>

          <div class="item-meta">
            ${escapeHtml(
              item.category ||
              ext.toUpperCase() ||
              "Media"
            )}
            ${artist}
          </div>

        </div>

        <div class="item-actions">

          <a
            class="action open-btn"
            href="${open}"
          >
            Open
          </a>

          <a
            class="action download-btn"
            href="${download}"
            download
          >
            Download
          </a>

        </div>

      `;

    }

    container.appendChild(row);

  });

  status.style.display = "none";

}

/* =========================================================
   SEARCH
   ========================================================= */

function performSearch() {

  renderItems();

  const query =
    document.getElementById("searchInput")
      .value
      .trim();

  const url =
    new URL(window.location.href);

  if (query) {
    url.searchParams.set("search", query);
  } else {
    url.searchParams.delete("search");
  }

  window.history.replaceState({}, "", url);

}

/* =========================================================
   INIT
   ========================================================= */

async function init() {

  updateOwnerUploadLink();

  document.getElementById("searchInput").value =
    initialSearch;

  document
    .getElementById("searchInput")
    .addEventListener("keydown", event => {

      if (event.key === "Enter") {
        performSearch();
      }

    });

  try {

    await Promise.all([
      loadGithub(),
      loadSupabase()
    ]);

    buildItems();

  } catch (error) {

    console.error(error);

    document.getElementById("status")
      .textContent =
      "Unable to load the library.";

  }

}

init();

</script>

</body>
</html>
