<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media Library</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#111;
}

.header{
  position:relative;
  width:100%;
  height:125px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#fff;
}

.header img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.header-content{
  position:relative;
  z-index:2;
  text-align:center;
  background:rgba(255,255,255,.82);
  padding:6px 18px;
  border-radius:8px;
}

.header-content h1{
  margin:0;
  font-size:25px;
}

.header-content p{
  margin:4px 0 0;
  font-size:12px;
}

.container{
  width:min(100%,850px);
  margin:auto;
  padding:12px 10px 30px;
}

.search-box{
  display:flex;
  gap:7px;
  margin-bottom:10px;
}

.search-box input{
  flex:1;
  min-width:0;
  padding:10px 13px;
  border:1px solid #ccc;
  border-radius:20px;
  font-size:14px;
  outline:none;
  background:#fff;
}

.search-box button{
  border:0;
  border-radius:20px;
  padding:0 15px;
  background:#111;
  color:#fff;
  font-weight:bold;
}

.top-bar{
  background:#fff;
  border-radius:9px;
  padding:9px;
  margin-bottom:10px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.location{
  font-size:12px;
  color:#666;
  margin-bottom:7px;
  word-break:break-word;
}

.upload-owner{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  background:#111;
  color:#fff;
  padding:9px;
  border-radius:7px;
  font-size:13px;
  font-weight:bold;
}

.items{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.item{
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border-radius:8px;
  padding:6px 8px;
  min-height:43px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}

.number{
  flex:0 0 28px;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
}

.item-main{
  flex:1;
  min-width:0;
}

.item-name{
  font-size:13px;
  font-weight:bold;
  word-break:break-word;
}

.item-meta{
  margin-top:2px;
  font-size:10px;
  color:#777;
}

.item-actions{
  display:flex;
  gap:4px;
  flex-shrink:0;
}

.action{
  border:0;
  border-radius:6px;
  padding:6px 8px;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  white-space:nowrap;
}

.open-btn{
  background:#159bd3;
  color:#fff;
}

.download-btn{
  background:#111;
  color:#fff;
}

.folder-btn{
  background:#e8f7fd;
  color:#0875a5;
  border:1px solid #b9e4f4;
}

.artist{
  color:#0781b5;
}

.media-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.media-card{
  display:block;
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  border:1px solid #ddd;
  text-decoration:none;
  color:#111;
}

.media-thumb{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#000;
}

.media-title{
  padding:6px 4px;
  font-size:10px;
  font-weight:bold;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status,.empty{
  background:#fff;
  border-radius:8px;
  padding:18px;
  text-align:center;
  color:#666;
  font-size:13px;
  margin-top:8px;
}

@media(max-width:600px){
  .header{height:125px}
  .header-content h1{font-size:22px}
  .header-content p{font-size:10px}

  .media-grid{
    grid-template-columns:repeat(4,1fr);
    gap:5px;
  }

  .media-title{
    font-size:9px;
    padding:5px 3px;
  }

  .action{
    padding:5px 6px;
    font-size:9px;
  }
}
</style>
</head>

<body>

<header class="header">
  <img
    src="https://ningwei2567.github.io/Ning-wei-1/ning-wei.png"
    alt="Ning Wei"
  >

  <div class="header-content">
    <h1>Ning Wei Media</h1>
    <p>Music • Videos • Photos • Apps • Software</p>
  </div>
</header>

<main class="container">

  <div class="search-box">
    <input
      id="searchInput"
      type="search"
      placeholder="Search media..."
      autocomplete="off"
    >
    <button onclick="performSearch()">Search</button>
  </div>

  <div class="top-bar">

    <div id="locationText" class="location">
      Loading library...
    </div>

    <a
      id="ownerUpload"
      class="upload-owner"
      href="#"
      target="_blank"
      rel="noopener"
    >
      📤 Upload Directly Here
    </a>

  </div>

  <div id="items" class="items"></div>

  <div id="status" class="status">
    Loading media...
  </div>

</main>

<script>

/* =====================================================
   NING WEI MEDIA SETTINGS
   ===================================================== */

const OWNER = "Ningwei2567";
const REPO = "Ning-wei-1";
const BRANCH = "main";

const SITE =
  "https://ningwei2567.github.io/Ning-wei-1/";

const SUPABASE_URL =
  "https://btksyizkcpzubtextuce.supabase.co";

/*
 IMPORTANT:
 Put your NEW Supabase ANON/PUBLIC key here.
 Do NOT use the key that was previously exposed.
*/
const SUPABASE_ANON_KEY =
  "PASTE_YOUR_NEW_SUPABASE_ANON_KEY_HERE";

/*
 Your actual Supabase Storage bucket.
*/
const STORAGE_BUCKET =
  "Artist Upload";


/* =====================================================
   URL PARAMETERS
   ===================================================== */

const params =
  new URLSearchParams(window.location.search);

const category =
  (
    params.get("category") || "all"
  ).toLowerCase();

const requestedFolder =
  (
    params.get("folder") || ""
  )
  .replace(/^\/+|\/+$/g,"");


/* =====================================================
   CATEGORY PATHS
   ===================================================== */

const categoryPaths = {

  songs:"media/songs",

  videos:"media/videos",

  photos:"media/photos",

  apps:"media/apps",

  software:"media/software",

  all:"media"

};


/* =====================================================
   DATA
   ===================================================== */

let githubItems = [];
let supabaseItems = [];
let allItems = [];


/* =====================================================
   HELPERS
   ===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function encodePath(path){

  return String(path)
    .split("/")
    .map(part => encodeURIComponent(part))
    .join("/");

}


function extension(name){

  const clean =
    String(name || "")
      .split("?")[0];

  const parts =
    clean.split(".");

  if(parts.length < 2)
    return "";

  return parts
    .pop()
    .toLowerCase();

}


/* =====================================================
   CATEGORY DETECTION
   ===================================================== */

function categoryFromExtension(name){

  const ext = extension(name);

  if([
    "mp3","wav","m4a","aac",
    "ogg","oga","flac","opus","wma"
  ].includes(ext)){

    return "songs";

  }

  if([
    "mp4","3gp","webm","mkv",
    "avi","mov","m4v"
  ].includes(ext)){

    return "videos";

  }

  if([
    "jpg","jpeg","png","gif",
    "webp","bmp","svg"
  ].includes(ext)){

    return "photos";

  }

  if([
    "apk","xapk"
  ].includes(ext)){

    return "apps";

  }

  if([
    "exe","msi","zip","rar",
    "7z","iso","dmg","deb"
  ].includes(ext)){

    return "software";

  }

  return "";

}


/* =====================================================
   SUPABASE STORAGE URL
   ===================================================== */

function supabasePublicUrl(path){

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    encodeURIComponent(STORAGE_BUCKET) +
    "/" +
    encodePath(path)
  );

}


/* =====================================================
   OWNER UPLOAD LINK
   ===================================================== */

function ownerUploadFolder(){

  if(requestedFolder)
    return requestedFolder;

  return (
    categoryPaths[category] ||
    "media"
  );

}


function updateOwnerUploadLink(){

  const folder =
    ownerUploadFolder();

  const githubUpload =
    "https://github.com/" +
    OWNER +
    "/" +
    REPO +
    "/upload/" +
    BRANCH +
    "/" +
    folder;

  document.getElementById(
    "ownerUpload"
  ).href = githubUpload;

  document.getElementById(
    "locationText"
  ).textContent =
    "Current folder: " + folder;

}


/* =====================================================
   LOAD GITHUB
   ===================================================== */

async function loadGithub(){

  const api =
    "https://api.github.com/repos/" +
    OWNER +
    "/" +
    REPO +
    "/git/trees/" +
    BRANCH +
    "?recursive=1";

  try{

    const response =
      await fetch(api);

    if(!response.ok)
      throw new Error("GitHub request failed");

    const data =
      await response.json();

    githubItems = [];

    if(!Array.isArray(data.tree))
      return;

    data.tree.forEach(entry => {

      if(!entry.path)
        return;

      if(entry.type === "tree"){

        githubItems.push({

          type:"folder",

          path:entry.path,

          name:
            entry.path
              .split("/")
              .pop(),

          source:"github"

        });

        return;

      }

      if(entry.type !== "blob")
        return;

      const cat =
        categoryFromExtension(
          entry.path
        );

      if(!cat)
        return;

      if(
        category !== "all" &&
        cat !== category
      )
        return;

      githubItems.push({

        type:"file",

        path:entry.path,

        name:
          entry.path
            .split("/")
            .pop(),

        category:cat,

        source:"github"

      });

    });

  }catch(error){

    console.error(
      "GitHub error:",
      error
    );

  }

}


/* =====================================================
   LOAD SUPABASE DATABASE
   ===================================================== */

async function loadSupabaseDatabase(){

  if(
    !SUPABASE_ANON_KEY ||
    SUPABASE_ANON_KEY ===
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8"
  ){

    console.warn(
      "Supabase anon key has not been added."
    );

    return;

  }

  try{

    const endpoint =
      SUPABASE_URL +
      "/rest/v1/artist_submissions" +
      "?select=id,artist_name,files,created_at,status" +
      "&status=eq.approved" +
      "&order=created_at.desc";

    const response =
      await fetch(
        endpoint,
        {
          headers:{
            apikey:
              SUPABASE_ANON_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_ANON_KEY,

            Accept:
              "application/json"
          }
        }
      );

    if(!response.ok){

      const text =
        await response.text();

      throw new Error(
        "Supabase database error: " +
        response.status +
        " " +
        text
      );

    }

    const rows =
      await response.json();

    supabaseItems = [];

    if(!Array.isArray(rows))
      return;

    rows.forEach(row => {

      let files = row.files;

      if(typeof files === "string"){

        try{

          files =
            JSON.parse(files);

        }catch{

          files = [];

        }

      }

      if(!Array.isArray(files))
        files = [];

      files.forEach(file => {

        if(!file)
          return;

        const name =
          file.name ||
          file.filename ||
          file.file_name ||
          "Uploaded file";

        let url =
          file.url ||
          file.public_url ||
          file.publicUrl ||
          "";

        const path =
          file.path ||
          file.storage_path ||
          file.storagePath ||
          "";

        const cat =
          String(
            file.category ||
            categoryFromExtension(name) ||
            ""
          ).toLowerCase();

        if(!cat)
          return;

        if(
          category !== "all" &&
          cat !== category
        )
          return;

        /*
         If the database does not contain
         a complete public URL, build one
         from the actual Artist Upload bucket.
        */

        if(!url && path){

          url =
            supabasePublicUrl(path);

        }

        if(!url)
          return;

        supabaseItems.push({

          type:"file",

          name:name,

          path:path,

          url:url,

          category:cat,

          artist:
            row.artist_name ||
            "Artist upload",

          created_at:
            row.created_at || "",

          source:"artist"

        });

      });

    });

  }catch(error){

    console.error(
      "Supabase database:",
      error
    );

    document.getElementById(
      "locationText"
    ).textContent =
      "Supabase connection error — check the anon key and database permissions.";

  }

}


/* =====================================================
   LOAD SUPABASE STORAGE DIRECTLY
   ===================================================== */

async function loadSupabaseStorage(){

  if(
    !SUPABASE_ANON_KEY ||
    SUPABASE_ANON_KEY ===
    "PASTE_YOUR_NEW_SUPABASE_ANON_KEY_HERE"
  )
    return;

  try{

    /*
     Ask Supabase Storage for objects
     inside the actual Artist Upload bucket.
    */

    const endpoint =
      SUPABASE_URL +
      "/storage/v1/object/list/" +
      encodeURIComponent(
        STORAGE_BUCKET
      );

    const response =
      await fetch(
        endpoint,
        {
          method:"POST",

          headers:{
            apikey:
              SUPABASE_ANON_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_ANON_KEY,

            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            prefix:
              requestedFolder || "",

            limit:1000,

            offset:0,

            sortBy:{
              column:"created_at",
              order:"desc"
            }

          })

        }
      );

    if(!response.ok){

      const text =
        await response.text();

      throw new Error(
        "Storage error: " +
        response.status +
        " " +
        text
      );

    }

    const objects =
      await response.json();

    if(!Array.isArray(objects))
      return;

    objects.forEach(object => {

      if(!object.name)
        return;

      /*
       Storage listing can return folders.
       We only add real files here.
      */

      const name =
        object.name;

      const cat =
        categoryFromExtension(name);

      if(!cat)
        return;

      if(
        category !== "all" &&
        cat !== category
      )
        return;

      const folder =
        requestedFolder
          ? requestedFolder + "/"
          : "";

      const path =
        folder + name;

      const url =
        supabasePublicUrl(path);

      /*
       Avoid duplicates when the same file
       already came from artist_submissions.
      */

      const alreadyExists =
        supabaseItems.some(item =>
          item.url === url ||
          (
            item.path &&
            item.path === path
          )
        );

      if(alreadyExists)
        return;

      supabaseItems.push({

        type:"file",

        name:name,

        path:path,

        url:url,

        category:cat,

        artist:"Artist upload",

        source:"artist"

      });

    });

  }catch(error){

    console.error(
      "Supabase Storage:",
      error
    );

  }

}


/* =====================================================
   CURRENT GITHUB FOLDER
   ===================================================== */

function getImmediateGithubItems(){

  const folder =
    requestedFolder ||
    categoryPaths[category] ||
    "media";

  const prefix =
    folder + "/";

  const result = [];

  const seen =
    new Set();

  githubItems.forEach(item => {

    if(
      !item.path.startsWith(prefix)
    )
      return;

    const remaining =
      item.path.slice(
        prefix.length
      );

    if(!remaining)
      return;

    if(item.type === "folder"){

      const first =
        remaining.split("/")[0];

      if(!seen.has(first)){

        seen.add(first);

        result.push({

          type:"folder",

          name:first,

          path:
            prefix + first,

          source:"github"

        });

      }

    }else{

      if(!remaining.includes("/")){

        result.push(item);

      }

    }

  });

  return result;

}


/* =====================================================
   BUILD ITEMS
   ===================================================== */

function buildItems(){

  const current =
    getImmediateGithubItems();

  /*
   When inside a specific GitHub folder,
   show that folder's GitHub contents.

   On category/front pages, show both
   GitHub and Supabase media.
  */

  if(requestedFolder){

    allItems = [
      ...current,
      ...supabaseItems
    ];

  }else{

    allItems = [
      ...current,
      ...supabaseItems
    ];

  }

  renderItems();

}


/* =====================================================
   GITHUB URL
   ===================================================== */

function githubPagesUrl(path){

  return SITE +
    encodePath(path);

}


/* =====================================================
   PLAYER
   ===================================================== */

function playerUrl(item){

  if(item.source === "artist"){

    return (
      "media.html?url=" +
      encodeURIComponent(item.url) +
      "&name=" +
      encodeURIComponent(item.name) +
      "&mime=" +
      encodeURIComponent(
        item.mime || ""
      )
    );

  }

  return (
    "media.html?path=" +
    encodeURIComponent(item.path) +
    "&name=" +
    encodeURIComponent(item.name)
  );

}


/* =====================================================
   DOWNLOAD
   ===================================================== */

function downloadUrl(item){

  if(item.source === "artist")
    return item.url;

  return githubPagesUrl(
    item.path
  );

}


/* =====================================================
   SHORT TITLE
   ===================================================== */

function shortTitle(name){

  const noExt =
    String(name)
      .replace(
        /\.[^/.]+$/,
        ""
      )
      .replace(
        /[_-]+/g,
        " "
      );

  const words =
    noExt
      .trim()
      .split(/\s+/);

  return words
    .slice(0,3)
    .join(" ");

}


/* =====================================================
   RENDER
   ===================================================== */

function renderItems(){

  const container =
    document.getElementById(
      "items"
    );

  const status =
    document.getElementById(
      "status"
    );

  container.innerHTML = "";

  let items =
    [...allItems];

  const query =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();

  if(query){

    items =
      items.filter(item => {

        const text = [

          item.name,

          item.path,

          item.artist,

          item.category

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return text.includes(query);

      });

  }


  /*
   Remove duplicate media.
  */

  const unique = [];

  const seen = new Set();

  items.forEach(item => {

    const key =
      item.source === "artist"
        ? (
            item.url ||
            item.path ||
            item.name
          )
        : (
            item.path ||
            item.name
          );

    if(seen.has(key))
      return;

    seen.add(key);

    unique.push(item);

  });

  items = unique;


  /*
   Folders first.
  */

  items.sort((a,b) => {

    if(
      a.type === "folder" &&
      b.type !== "folder"
    )
      return -1;

    if(
      a.type !== "folder" &&
      b.type === "folder"
    )
      return 1;

    return String(a.name)
      .localeCompare(
        String(b.name)
      );

  });


  if(!items.length){

    container.className =
      "items";

    container.innerHTML =
      '<div class="empty">' +
      'No media found.' +
      '</div>';

    status.style.display =
      "none";

    return;

  }


  status.style.display =
    "none";


  const isVisual =
    category === "photos" ||
    category === "videos";


  if(isVisual){

    container.className =
      "media-grid";

  }else{

    container.className =
      "items";

  }


  items.forEach(
    (item,index) => {

      const number =
        index + 1;


      /*
       PHOTO / VIDEO
      */

      if(
        isVisual &&
        item.type === "file"
      ){

        const card =
          document.createElement("a");

        card.className =
          "media-card";

        card.href =
          playerUrl(item);

        const mediaUrl =
          item.source === "artist"
            ? item.url
            : githubPagesUrl(
                item.path
              );

        let thumb = "";


        if(category === "photos"){

          thumb =
            '<img ' +
            'class="media-thumb" ' +
            'src="' +
            escapeHtml(mediaUrl) +
            '" ' +
            'alt="' +
            escapeHtml(item.name) +
            '" ' +
            'loading="lazy">';

        }else{

          thumb =
            '<video ' +
            'class="media-thumb" ' +
            'muted ' +
            'preload="metadata" ' +
            'playsinline ' +
            'src="' +
            escapeHtml(mediaUrl) +
            '"></video>';

        }


        card.innerHTML =
          thumb +
          '<div class="media-title">' +
          escapeHtml(
            shortTitle(item.name)
          ) +
          '</div>';

        container.appendChild(
          card
        );

        return;

      }


      /*
       NORMAL LIST
      */

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "item";


      /*
       FOLDER
      */

      if(item.type === "folder"){

        const href =
          "library.html?category=" +
          encodeURIComponent(category) +
          "&folder=" +
          encodeURIComponent(item.path);

        row.innerHTML =

          '<div class="number">' +
          number +
          '</div>' +

          '<div class="item-main">' +

          '<div class="item-name">' +
          '📁 ' +
          escapeHtml(item.name) +
          '</div>' +

          '<div class="item-meta">' +
          'Folder' +
          '</div>' +

          '</div>' +

          '<div class="item-actions">' +

          '<a ' +
          'class="action folder-btn" ' +
          'href="' +
          href +
          '">' +
          'Open' +
          '</a>' +

          '</div>';

      }


      /*
       FILE
      */

      else{

        const open =
          playerUrl(item);

        const download =
          downloadUrl(item);

        const artist =
          item.artist
            ? '<span class="artist"> • ' +
              escapeHtml(item.artist) +
              '</span>'
            : "";

        row.innerHTML =

          '<div class="number">' +
          number +
          '</div>' +

          '<div class="item-main">' +

          '<div class="item-name">' +
          escapeHtml(item.name) +
          artist +
          '</div>' +

          '<div class="item-meta">' +
          escapeHtml(
            extension(item.name)
              .toUpperCase()
          ) +
          '</div>' +

          '</div>' +

          '<div class="item-actions">' +

          '<a ' +
          'class="action open-btn" ' +
          'href="' +
          open +
          '">' +
          'Open' +
          '</a>' +

          '<a ' +
          'class="action download-btn" ' +
          href="' +
          download +
          '" ' +
          'download>' +
          'Download' +
          '</a>' +

          '</div>';

      }

      container.appendChild(row);

    }
  );

}
