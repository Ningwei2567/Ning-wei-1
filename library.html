<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4faff;
  color:#111;
}

.nw-header{
  position:relative;
  height:318px;
  overflow:hidden;
  background:#8ed8ff;
}

.nw-header-photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 18%;
  transform:scale(1.08);
}

.nw-header-overlay{
  position:absolute;
  inset:0;
  background:rgba(55,165,220,.38);
}

.nw-header-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding:20px 12px 18px;
  text-align:center;
}

.nw-title{
  margin:0;
  color:white;
  font-size:30px;
  font-weight:900;
  text-shadow:0 2px 6px rgba(0,0,0,.45);
}

.nw-subtitle{
  margin:5px 0 12px;
  color:white;
  font-size:13px;
  font-weight:bold;
  text-shadow:0 1px 4px rgba(0,0,0,.45);
}

.search-box{
  width:min(94%,520px);
  height:44px;
  border:0;
  outline:0;
  border-radius:24px;
  padding:0 18px;
  font-size:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.2);
}

.container{
  width:min(900px,96%);
  margin:12px auto 30px;
}

.page-title{
  font-size:22px;
  font-weight:900;
  margin:10px 3px;
}

.upload-direct{
  display:block;
  text-decoration:none;
  background:#111;
  color:#fff;
  border-radius:9px;
  padding:11px 13px;
  margin:8px 0;
  font-weight:bold;
  font-size:14px;
  text-align:center;
}

.back{
  display:block;
  text-decoration:none;
  color:#087fb4;
  font-weight:bold;
  margin:9px 2px;
  font-size:14px;
}

.status{
  text-align:center;
  padding:12px;
  font-size:14px;
  color:#555;
}

.list{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.item{
  display:flex;
  align-items:center;
  min-height:48px;
  padding:5px 8px;
  background:#fff;
  border-radius:8px;
  border:1px solid #d9edf7;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  text-decoration:none;
  color:#111;
}

.number{
  width:30px;
  height:30px;
  min-width:30px;
  border-radius:50%;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
  margin-right:9px;
}

.item-main{
  min-width:0;
  flex:1;
}

.item-name{
  font-size:14px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.item-meta{
  font-size:11px;
  color:#777;
  margin-top:2px;
}

.arrow{
  font-size:25px;
  color:#0795c9;
  margin-left:8px;
}

.actions{
  display:flex;
  gap:5px;
  margin-left:5px;
}

.action{
  border:0;
  border-radius:6px;
  padding:7px 8px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  background:#078fc5;
  color:white;
}

.action.download{
  background:#111;
}

.empty{
  background:white;
  border-radius:9px;
  padding:22px;
  text-align:center;
  color:#666;
}

.section-title{
  margin:18px 3px 8px;
  font-size:16px;
  font-weight:900;
}

@media(max-width:600px){
  .nw-header{
    height:318px;
  }

  .nw-title{
    font-size:27px;
  }

  .item{
    min-height:46px;
  }

  .item-name{
    font-size:13px;
  }

  .actions .action{
    padding:6px;
    font-size:10px;
  }
}
</style>
</head>

<body>

<header class="nw-header">
  <img
    class="nw-header-photo"
    src="ning-wei.png"
    alt=""
  >
  <div class="nw-header-overlay"></div>

  <div class="nw-header-content">
    <h1 class="nw-title">Ning Wei Media</h1>

    <div class="nw-subtitle">
      Music • Videos • Photos • Apps • Software
    </div>

    <input
      id="search"
      class="search-box"
      type="search"
      placeholder="Search songs, videos, photos, apps..."
      autocomplete="off"
    >
  </div>
</header>

<main class="container">

  <a id="backLink" class="back" href="index.html">
    ← Back
  </a>

  <h2 id="pageTitle" class="page-title">
    Loading...
  </h2>

  <a id="uploadLink"
     class="upload-direct"
     href="upload.html">
    📤 Upload Directly Here
  </a>

  <div id="status" class="status">
    Loading content...
  </div>

  <div id="list" class="list"></div>

</main>

<script>
const SUPABASE_URL =
  "https://btksyizkcpzubtextuce.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";

const BUCKET = "artist-uploads";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const OWNER = "Ningwei2567";
const REPO = "Ning-wei-1";
const BRANCH = "main";

const params = new URLSearchParams(location.search);

const requestedCategory =
  (params.get("category") || "all").toLowerCase();

const requestedFolder =
  params.get("folder") || "";

const requestedArtist =
  params.get("artist") || "";

const searchBox =
  document.getElementById("search");

const list =
  document.getElementById("list");

const status =
  document.getElementById("status");

const pageTitle =
  document.getElementById("pageTitle");

const backLink =
  document.getElementById("backLink");

const uploadLink =
  document.getElementById("uploadLink");


const CATEGORY_NAMES = {
  all: "All Media",
  songs: "Songs",
  videos: "Videos",
  photos: "Photos",
  apps: "Apps",
  software: "Software"
};


function categoryLabel(category){
  return CATEGORY_NAMES[category] || category;
}


function githubApi(path){
  const clean = path
    .replace(/^\/+/, "")
    .replace(/\/+$/, "");

  const encoded = clean
    .split("/")
    .filter(Boolean)
    .map(encodeURIComponent)
    .join("/");

  return `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encoded}?ref=${BRANCH}`;
}


function rawGithub(path){
  const encoded = path
    .split("/")
    .filter(Boolean)
    .map(encodeURIComponent)
    .join("/");

  return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encoded}`;
}


function extension(name){
  const p = name.lastIndexOf(".");
  return p >= 0
    ? name.substring(p + 1).toLowerCase()
    : "";
}


function detectCategory(file){
  const c =
    String(file.category || "").toLowerCase();

  if(
    c === "songs" ||
    c === "song" ||
    c === "music"
  ) return "songs";

  if(c === "videos" || c === "video")
    return "videos";

  if(c === "photos" || c === "photo" || c === "images")
    return "photos";

  if(c === "apps" || c === "apk")
    return "apps";

  if(
    c === "software" ||
    c === "windows" ||
    c === "programs"
  ) return "software";

  const ext = extension(
    file.original_name ||
    file.name ||
    ""
  );

  if([
    "mp3","wav","m4a","aac","ogg",
    "oga","opus","flac"
  ].includes(ext))
    return "songs";

  if([
    "mp4","webm","mov","m4v","avi","mkv"
  ].includes(ext))
    return "videos";

  if([
    "jpg","jpeg","png","gif","webp","bmp"
  ].includes(ext))
    return "photos";

  if(ext === "apk")
    return "apps";

  if([
    "exe","msi","zip","rar","7z",
    "iso","dmg"
  ].includes(ext))
    return "software";

  return "software";
}


function fileIcon(category){
  if(category === "songs") return "🎵";
  if(category === "videos") return "🎬";
  if(category === "photos") return "📷";
  if(category === "apps") return "📱";
  if(category === "software") return "💻";
  return "📁";
}


function safeName(name){
  return String(name || "file")
    .replace(/[<>:"/\\|?*\x00-\x1F]/g,"")
    .trim() || "file";
}


function playerUrl(item){
  const u =
    `media.html?url=${encodeURIComponent(item.url)}` +
    `&name=${encodeURIComponent(item.name)}` +
    `&mime=${encodeURIComponent(item.mime || "")}`;

  return u;
}


function uploadUrl(category, folder){
  let u = "upload.html";

  const q = [];

  if(category && category !== "all")
    q.push(`category=${encodeURIComponent(category)}`);

  if(folder)
    q.push(`folder=${encodeURIComponent(folder)}`);

  if(q.length)
    u += "?" + q.join("&");

  return u;
}


async function loadGithub(){
  const result = [];

  try{

    const response = await fetch(
      "https://api.github.com/repos/" +
      `${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`
    );

    if(!response.ok)
      return result;

    const data = await response.json();

    if(!Array.isArray(data.tree))
      return result;

    for(const entry of data.tree){

      if(entry.type !== "blob")
        continue;

      const path = entry.path;

      if(!path.startsWith("media/"))
        continue;

      let category = null;

      if(path.startsWith("media/songs/"))
        category = "songs";
      else if(path.startsWith("media/videos/"))
        category = "videos";
      else if(path.startsWith("media/photos/"))
        category = "photos";
      else if(path.startsWith("media/apps/"))
        category = "apps";
      else if(path.startsWith("media/software/"))
        category = "software";

      if(!category)
        continue;

      if(
        requestedCategory !== "all" &&
        category !== requestedCategory
      )
        continue;

      if(
        requestedFolder &&
        !path.startsWith(requestedFolder)
      )
        continue;

      const name =
        path.split("/").pop();

      if(name.toLowerCase() === "index.html")
        continue;

      result.push({
        source:"github",
        category,
        name,
        path,
        url:rawGithub(path),
        mime:""
      });
    }

  }catch(error){
    console.log("GitHub:",error);
  }

  return result;
}


async function loadSupabase(){

  const result = [];

  try{

    const {data,error} =
      await supabaseClient
        .from("artist_submissions")
        .select(
          "id,artist_name,files,created_at,status"
        )
        .eq("status","approved")
        .order(
          "created_at",
          {ascending:false}
        );

    if(error){
      console.error(error);
      return result;
    }

    for(const submission of (data || [])){

      const files =
        Array.isArray(submission.files)
          ? submission.files
          : [];

      for(const file of files){

        const category =
          detectCategory(file);

        if(
          requestedCategory !== "all" &&
          category !== requestedCategory
        )
          continue;

        const name =
          file.original_name ||
          file.name ||
          "Uploaded file";

        const url =
          file.url ||
          "";

        if(!url)
          continue;

        result.push({
          source:"supabase",
          id:submission.id,
          artist:submission.artist_name || "Artist",
          category,
          name,
          path:file.path || "",
          url,
          mime:file.type || "",
          size:file.size || 0,
          created_at:submission.created_at
        });
      }
    }

  }catch(error){
    console.error(error);
  }

  return result;
}


function sortItems(items){

  return items.sort((a,b)=>{

    if(a.source !== b.source){

      if(a.source === "github")
        return -1;

      return 1;
    }

    if(a.artist && b.artist){

      const aa =
        a.artist.toLowerCase();

      const bb =
        b.artist.toLowerCase();

      if(aa !== bb)
        return aa.localeCompare(bb);
    }

    return a.name
      .toLowerCase()
      .localeCompare(
        b.name.toLowerCase()
      );
  });
}


function createItem(item,index){

  const row =
    document.createElement("div");

  row.className = "item";

  const number =
    document.createElement("span");

  number.className = "number";
  number.textContent = index + 1;

  const main =
    document.createElement("div");

  main.className = "item-main";

  const name =
    document.createElement("div");

  name.className = "item-name";

  name.textContent =
    `${fileIcon(item.category)} ${item.name}`;

  const meta =
    document.createElement("div");

  meta.className = "item-meta";

  if(item.source === "supabase"){

    meta.textContent =
      `Uploaded by ${item.artist || "Artist"}`;

  }else{

    meta.textContent =
      "Ning Wei Media";
  }

  main.appendChild(name);
  main.appendChild(meta);

  row.appendChild(number);
  row.appendChild(main);

  const actions =
    document.createElement("div");

  actions.className = "actions";

  const ext =
    extension(item.name);

  const isAudio =
    item.category === "songs";

  const isVideo =
    item.category === "videos";

  const isPhoto =
    item.category === "photos";

  if(isAudio || isVideo || isPhoto){

    const open =
      document.createElement("a");

    open.className = "action";

    open.href =
      playerUrl(item);

    open.textContent =
      isPhoto ? "👁 View" : "▶ Play";

    actions.appendChild(open);
  }

  const download =
    document.createElement("a");

  download.className =
    "action download";

  download.href =
    item.url;

  download.target = "_blank";
  download.rel = "noopener";

  download.textContent =
    "📥";

  download.title =
    `Download ${safeName(item.name)}`;

  actions.appendChild(download);

  row.appendChild(actions);

  return row;
}


function display(items){

  list.innerHTML = "";

  if(!items.length){

    list.innerHTML =
      `<div class="empty">
        No content found here yet.
      </div>`;

    status.textContent = "";
    return;
  }

  status.textContent =
    `${items.length} item${items.length === 1 ? "" : "s"}`;

  items.forEach((item,index)=>{

    list.appendChild(
      createItem(item,index)
    );

  });
}


function setupPage(){

  const category =
    requestedCategory;

  pageTitle.textContent =
    requestedArtist
      ? requestedArtist
      : requestedFolder
        ? requestedFolder.split("/").pop()
        : categoryLabel(category);

  uploadLink.href =
    uploadUrl(
      category,
      requestedFolder
    );

  if(
    category !== "all" ||
    requestedFolder ||
    requestedArtist
  ){

    backLink.href =
      category === "all"
        ? "index.html"
        : `library.html?category=${encodeURIComponent(category)}`;

  }else{

    backLink.href =
      "index.html";
  }
}


let allItems = [];


function applySearch(){

  const q =
    searchBox.value
      .trim()
      .toLowerCase();

  if(!q){

    display(
      sortItems([...allItems])
    );

    return;
  }

  const filtered =
    allItems.filter(item=>{

      const text =
        [
          item.name,
          item.artist,
          item.category,
          item.path
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      return text.includes(q);
    });

  display(
    sortItems(filtered)
  );
}


searchBox.addEventListener(
  "input",
  applySearch
);


async function load(){

  setupPage();

  status.textContent =
    "Loading your media...";

  const [
    github,
    supabase
  ] =
    await Promise.all([
      loadGithub(),
      loadSupabase()
    ]);

  allItems =
    sortItems([
      ...github,
      ...supabase
    ]);

  display(allItems);
}


load();

</script>

</body>
</html>
