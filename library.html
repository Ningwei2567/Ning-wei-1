<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media Library</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#eaf7ff;
}

.container{
max-width:600px;
margin:auto;
}

.header{
height:150px;
position:relative;
background:#000;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
}

.header img{
position:absolute;
width:100%;
height:150px;
object-fit:cover;
opacity:.6;
}

.header div{
position:relative;
z-index:2;
}

.song-card{
background:white;
margin:15px;
border-radius:15px;
overflow:hidden;
box-shadow:0 3px 10px #ccc;
}

.cover{
width:100%;
height:250px;
object-fit:cover;
}

.info{
padding:15px;
}

.artist{
display:flex;
align-items:center;
gap:10px;
}

.artist img{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
}

button,a{
padding:10px 15px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
display:inline-block;
margin-top:10px;
}

.play{
background:#0099cc;
color:white;
}

.download{
background:#000;
color:white;
}

</style>

</head>


<body>

<div class="container">

<div class="header">

<img src="ning-we i.png">

<div>
<h1>Ning Wei Media</h1>
<p>Music Library</p>
</div>

</div>


<div id="library"></div>


</div>



<script>


const SUPABASE_URL =
"https://btksyizkcpzubtextuce.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";


const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function loadSongs(){


let {data,error}=await db
.from("songs")
.select(`
id,
title,
song_url,
cover_url,
artists(
name,
photo
)
`)
.order("id",{ascending:false});


if(error){
console.log(error);
return;
}


let html="";


data.forEach(song=>{


html += `

<div class="song-card">


<img class="cover" src="${song.cover_url}">


<div class="info">


<div class="artist">

<img src="${song.artists.photo}">

<h3>${song.artists.name}</h3>

</div>


<h2>${song.title}</h2>


<a class="play"
href="media.html?url=${encodeURIComponent(song.song_url)}">

▶ Play

</a>


<a class="download"
href="${song.song_url}"
download>

⬇ Download

</a>


</div>


</div>


`;

});


document.getElementById("library").innerHTML=html;


}


loadSongs();


</script>


</body>
</html>
