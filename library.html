<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media - Library</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0a0a0a;color:#fff;}
.container{width:100%;max-width:600px;margin:auto;padding-bottom:30px;}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#111;border-bottom:1px solid #222;}
.back-btn{color:#fff;text-decoration:none;font-weight:bold;font-size:14px;}
.page-title{font-size:16px;font-weight:800;color:#55bfe8;text-transform:capitalize;}
.admin-toggle-btn{background:#222;color:#ff4444;border:1px solid #ff4444;padding:4px 8px;font-size:11px;font-weight:bold;border-radius:4px;cursor:pointer;}
.admin-toggle-btn.active{background:#ff4444;color:#fff;}
.bulk-action-bar{display:none;background:#220000;border-bottom:1px solid #ff4444;padding:10px 16px;align-items:center;justify-content:space-between;font-size:13px;}
body.admin-mode .bulk-action-bar{display:flex;}
.bulk-del-btn{background:#d32f2f;color:#fff;border:none;padding:6px 12px;font-size:12px;font-weight:bold;border-radius:6px;cursor:pointer;}
.main-player-wrap{width:100%;background:#000;display:none;justify-content:center;align-items:center;min-height:250px;}
video.full-media, img.full-media, audio.full-media{width:100%;max-height:80vh;object-fit:contain;outline:none;display:block;}
.video-details{padding:12px 16px;background:#111;border-bottom:1px solid #222;display:none;}
.title-download-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.video-title{font-size:16px;font-weight:bold;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;}
.download-btn{background:#e50914;color:#fff;text-decoration:none;font-size:12px;font-weight:bold;padding:6px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.meta-info{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#aaa;}
.uploader-row{display:flex;align-items:center;gap:8px;}
.artist-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#333;border:1px solid #555;}
.uploader-name{color:#e50914;font-weight:bold;}
.date-row{font-size:12px;color:#888;}
.related-header{display:flex;align-items:center;justify-content:space-between;background:#222;padding:10px 14px;margin-top:5px;border-left:4px solid #e50914;}
.related-header h3{margin:0;font-size:16px;font-weight:bold;color:#fff;text-transform:capitalize;}
.toggle-icon{background:#e50914;color:#fff;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:2px;font-size:12px;}
.related-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 16px;}
.related-card{position:relative;background:#161616;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;height:190px;justify-content:center;align-items:center;}
.related-card video, .related-card img{width:100%;height:100%;object-fit:cover;background:#000;display:block;}
.related-card-software{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;font-size:12px;text-align:center;padding:10px;gap:5px;}
.related-card-software span{font-size:28px;}
.card-checkbox{display:none;position:absolute;top:8px;left:8px;width:20px;height:20px;z-index:10;accent-color:#d32f2f;cursor:pointer;}
body.admin-mode .card-checkbox{display:block;}
.custom-modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;justify-content:center;align-items:center;}
.custom-modal{background:#1a1a1a;border:1px solid #333;padding:20px;border-radius:10px;width:85%;max-width:320px;text-align:center;}
.custom-modal p{font-size:15px;margin-bottom:20px;color:#fff;font-weight:bold;}
.modal-btn-group{display:flex;gap:10px;justify-content:center;}
.modal-btn{padding:8px 16px;font-size:13px;font-weight:bold;border-radius:6px;border:none;cursor:pointer;}
.modal-btn.cancel{background:#333;color:#fff;}
.modal-btn.confirm{background:#e50914;color:#fff;}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← Home</a>
    <div class="page-title" id="folderName">Library</div>
    <button class="admin-toggle-btn" onclick="toggleAdminMode()">🔐 Admin</button>
  </div>
  <div class="bulk-action-bar">
    <div><input type="checkbox" id="selectAllBox" onclick="toggleSelectAll(this)"> <label for="selectAllBox"><b>Select All</b></label></div>
    <button class="bulk-del-btn" onclick="promptDelete()">🗑️ Delete Selected</button>
  </div>
  <div class="main-player-wrap" id="mainMediaContainer"></div>
  <div class="video-details" id="videoDetailsBox">
    <div class="title-download-row">
      <h2 class="video-title" id="activeTitle"></h2>
      <a id="downloadLink" class="download-btn" href="#" download>⬇ Download</a>
    </div>
    <div class="meta-info">
      <div class="uploader-row">
        <img id="artistAvatar" class="artist-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
        <span>From: <span class="uploader-name" id="activeUploader">Ning Wei Media</span></span>
      </div>
      <div class="date-row">📅 Date: <span id="activeDate"></span></div>
    </div>
  </div>
  <div class="related-header">
    <h3 id="relatedHeaderTitle">Items</h3>
    <div class="toggle-icon">▲</div>
  </div>
  <div class="related-grid" id="relatedGrid"></div>
</div>

<div class="custom-modal-overlay" id="customModalOverlay">
  <div class="custom-modal">
    <p id="customModalText"></p>
    <div class="modal-btn-group" id="customModalButtons"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://btksyizkcpzubtextuce.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";
let db = null, allItems = [];

function showCustomAlert(msg, cb) {
  const o = document.getElementById('customModalOverlay');
  document.getElementById('customModalText').textContent = msg;
  document.getElementById('customModalButtons').innerHTML = '<button class="modal-btn confirm" id="okBtn">OK</button>';
  o.style.display = 'flex';
  document.getElementById('okBtn').onclick = () => { o.style.display = 'none'; if(cb) cb(); };
}
function showCustomConfirm(msg, onYes) {
  const o = document.getElementById('customModalOverlay');
  document.getElementById('customModalText').textContent = msg;
  document.getElementById('customModalButtons').innerHTML = '<button class="modal-btn cancel" id="cancelBtn">Cancel</button><button class="modal-btn confirm" id="yesBtn">Yes, Delete</button>';
  o.style.display = 'flex';
  document.getElementById('cancelBtn').onclick = () => o.style.display = 'none';
  document.getElementById('yesBtn').onclick = () => { o.style.display = 'none'; onYes(); };
}
function toggleAdminMode() {
  document.body.classList.toggle('admin-mode');
  document.querySelector('.admin-toggle-btn').classList.toggle('active');
}
function isImage(s){ return /\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i.test(s||''); }
function isVideo(s){ return /\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i.test(s||''); }
function isAudio(s){ return /\.(mp3|wav|aac|m4a|flac|ogg)(\?.*)?$/i.test(s||''); }

function norm(s) {
  return (s || '').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]/g,'');
}

async function initLibrary() {
  const folder = new URLSearchParams(location.search).get('folder') || '';
  const displayName = folder.replace(/-/g, ' ');
  document.getElementById('folderName').textContent = displayName || 'Library';
  document.getElementById('relatedHeaderTitle').textContent = displayName || 'Items';

  const isSoftware = /software|editing|tools|apps|vpn|utility|mapping/i.test(folder);
  const current = norm(folder);

  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data, error } = await db.from('artist_submissions').select('*');
  if (error || !data) {
    document.getElementById('relatedGrid').innerHTML = '<p style="grid-column:span 2;text-align:center;color:#777;padding:20px;">Error loading data</p>';
    return;
  }

  allItems = [];

  data.forEach(row => {
    if (row.status && row.status.toLowerCase() !== 'approved') return;

    let fileList = [];
    if (Array.isArray(row.files)) {
      fileList = row.files;
    } else if (row.files && typeof row.files === 'object') {
      Object.keys(row.files).forEach(k => {
        (row.files[k] || []).forEach(f => {
          if (!f.category) f.category = k;
          fileList.push(f);
        });
      });
    }

    const dateStr = row.created_at 
      ? new Date(row.created_at).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'})
      : '';
    const avatar = row.cover_url || row.artist_cover || row.profile_pic || '';

    fileList.forEach(f => {
      const name = (f.original_name || f.name || '').toLowerCase();
      const url  = f.url || '';
      const cat  = norm(f.category || '');

      // ========== MATCHING ==========
      let match = false;

      if (!folder) {
        match = true;
      } else if (cat) {
        // Match the category saved by the upload form with the folder name
        if (cat === current || cat.includes(current) || current.includes(cat)) {
          match = true;
        }
      }

      // Photos should NOT appear in library folders (they go to homepage)
      if (isImage(name) || isImage(url) || (f.type||'').toLowerCase() === 'photo' || (f.type||'').toLowerCase() === 'profile') {
        match = false;
      }

      // Videos should NOT appear in library folders (they go to homepage)
      if (isVideo(name) || isVideo(url) || (f.type||'').toLowerCase() === 'video') {
        match = false;
      }

      if (!match) return;

      allItems.push({
        id: row.id,
        title: f.original_name || f.name || row.artist_name || 'File',
        url: url,
        isSoftware: isSoftware,
        isImage: isImage(name) || isImage(url),
        isVideo: isVideo(name) || isVideo(url),
        isAudio: isAudio(name) || isAudio(url),
        uploader: row.artist_name || 'Ning Wei Media',
        avatar: avatar,
        date: dateStr
      });
    });
  });

  const grid = document.getElementById('relatedGrid');
  if (allItems.length === 0) {
    grid.innerHTML = '<p style="grid-column:span 2;text-align:center;color:#777;padding:20px;">No files found in this category.</p>';
    return;
  }

  grid.innerHTML = allItems.map((item, i) => {
    let preview = '';
    if (item.isSoftware) {
      preview = `<div class="related-card-software"><span>📦</span><div>${item.title}</div></div>`;
    } else if (item.isImage) {
      preview = `<img src="${item.url}" loading="lazy">`;
    } else if (item.isVideo) {
      preview = `<video src="${item.url}#t=0.5" preload="metadata" muted></video>`;
    } else if (item.isAudio) {
      preview = `<div class="related-card-software"><span>🎵</span><div>${item.title}</div></div>`;
    } else {
      preview = `<div class="related-card-software"><span>📦</span><div>${item.title}</div></div>`;
    }

    return `<div class="related-card" onclick="playMedia(${i})">
      <input type="checkbox" class="card-checkbox" data-id="${item.id}" onclick="event.stopPropagation()">
      ${preview}
    </div>`;
  }).join('');
}

function playMedia(i) {
  const item = allItems[i];
  if (!item) return;
  const box = document.getElementById('mainMediaContainer');
  const details = document.getElementById('videoDetailsBox');
  details.style.display = 'block';

  if (item.isSoftware || (!item.isImage && !item.isVideo && !item.isAudio)) {
    box.style.display = 'none';
    box.innerHTML = '';
  } else if (item.isImage) {
    box.style.display = 'flex';
    box.innerHTML = `<img src="${item.url}" class="full-media">`;
  } else if (item.isVideo) {
    box.style.display = 'flex';
    box.innerHTML = `<video class="full-media" controls autoplay playsinline src="${item.url}"></video>`;
  } else if (item.isAudio) {
    box.style.display = 'flex';
    box.innerHTML = `<audio class="full-media" controls autoplay src="${item.url}"></audio>`;
  }

  document.getElementById('activeTitle').textContent = item.title;
  document.getElementById('activeUploader').textContent = item.uploader;
  document.getElementById('activeDate').textContent = item.date;
  document.getElementById('downloadLink').href = item.url;
  if (item.avatar) document.getElementById('artistAvatar').src = item.avatar;
  window.scrollTo({top:0, behavior:'smooth'});
}

function toggleSelectAll(m) {
  document.querySelectorAll('.card-checkbox').forEach(c => c.checked = m.checked);
}
function promptDelete() {
  const ids = Array.from(document.querySelectorAll('.card-checkbox:checked')).map(c => c.dataset.id);
  if (!ids.length) return showCustomAlert('Please select at least one item to delete.');
  showCustomConfirm('Confirm delete?', async () => {
    const { error } = await db.from('artist_submissions').delete().in('id', ids);
    if (error) showCustomAlert('Error: ' + error.message);
    else showCustomAlert('Deleted successfully!', () => location.reload());
  });
}

initLibrary();
</script>
</body>
</html>
