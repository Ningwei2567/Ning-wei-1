<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media - Library</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0a0a0a;color:#fff;}
.container{width:100%;max-width:600px;margin:auto;padding-bottom:30px;}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#111;border-bottom:1px solid #222;}
.back-btn{color:#fff;text-decoration:none;font-weight:bold;font-size:14px;}
.page-title{font-size:16px;font-weight:800;color:#55bfe8;text-transform:capitalize;}
.admin-toggle-btn{background:#222;color:#ff4444;border:1px solid #ff4444;padding:4px 8px;font-size:11px;font-weight:bold;border-radius:4px;cursor:pointer;}
.admin-toggle-btn.active{background:#ff4444;color:#fff;}
.bulk-action-bar{display:none;background:#220000;border-bottom:1px solid #ff4444;padding:10px 16px;align-items:center;justify-content:space-between;font-size:13px;}
body.admin-mode .bulk-action-bar{display:flex;}
.bulk-del-btn{background:#d32f2f;color:#fff;border:none;padding:6px 12px;font-size:12px;font-weight:bold;border-radius:6px;cursor:pointer;}

/* Inline media stage with prev/next arrows */
.main-player-wrap{
  width:100%;
  background:#000;
  display:none;
  justify-content:center;
  align-items:center;
  min-height:250px;
  position:relative;
}
video.full-media, img.full-media{width:100%;max-height:80vh;object-fit:contain;outline:none;display:block;}
audio.full-media{width:100%;outline:none;display:block;}

.nav-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,.65);
  color:#fff;
  border:none;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:24px;
  line-height:1;
  cursor:pointer;
  z-index:10;
  display:none;
}
.nav-arrow:hover{background:#e50914;}
.nav-arrow.prev{left:8px;}
.nav-arrow.next{right:8px;}
body.has-media .nav-arrow{display:flex;align-items:center;justify-content:center;}
.nav-arrow:disabled{opacity:.25;cursor:not-allowed;}

/* Audio player with cover art fallback chain */
.audio-player-card{
  width:100%;
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px;
  background:#0d0d0d;
}
.audio-cover{
  width:96px;
  height:96px;
  border-radius:8px;
  object-fit:cover;
  background:#222;
  flex-shrink:0;
  border:1px solid #333;
}
.audio-meta{flex:1;min-width:0;}
.audio-meta .audio-title{
  font-size:15px;
  font-weight:bold;
  color:#fff;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  margin-bottom:4px;
}
.audio-meta .audio-artist{font-size:12px;color:#aaa;margin-bottom:8px;}
.audio-meta audio.full-media{width:100%;}

/* App/software detail card */
.app-card{
  width:100%;
  display:flex;
  align-items:center;
  gap:14px;
  padding:18px;
  background:#0d0d0d;
}
.app-icon{
  width:80px;
  height:80px;
  border-radius:12px;
  object-fit:cover;
  background:#222;
  flex-shrink:0;
  border:1px solid #333;
}
.app-info{flex:1;min-width:0;}
.app-info .app-name{font-size:16px;font-weight:bold;color:#fff;margin-bottom:4px;}
.app-info .app-uploader{font-size:12px;color:#e50914;font-weight:bold;margin-bottom:6px;}
.app-info .app-desc{font-size:12px;color:#aaa;line-height:1.4;}

.video-details{padding:12px 16px;background:#111;border-bottom:1px solid #222;display:none;}
.title-download-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.video-title{font-size:16px;font-weight:bold;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;}
.download-btn{background:#e50914;color:#fff;text-decoration:none;font-size:12px;font-weight:bold;padding:6px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer;border:none;}
.download-btn:hover{background:#b00710;}
.meta-info{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#aaa;}
.uploader-row{display:flex;align-items:center;gap:8px;}
.artist-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#333;border:1px solid #555;}
.uploader-name{color:#e50914;font-weight:bold;}
.date-row{font-size:12px;color:#888;}

.related-header{display:flex;align-items:center;justify-content:space-between;background:#222;padding:10px 14px;margin-top:5px;border-left:4px solid #e50914;}
.related-header h3{margin:0;font-size:16px;font-weight:bold;color:#fff;text-transform:capitalize;}
.toggle-icon{background:#e50914;color:#fff;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:2px;font-size:12px;}

/* Render rules */
.related-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 16px;}
.related-list{display:flex;flex-direction:column;gap:8px;padding:12px 16px;}

.date-heading{
  font-size:11px;
  color:#888;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin:12px 16px 4px;
  padding-bottom:4px;
  border-bottom:1px solid #222;
}
.date-heading:first-child{margin-top:4px;}

.related-card{position:relative;background:#161616;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;height:190px;justify-content:center;align-items:center;}
.related-card video, .related-card img{width:100%;height:100%;object-fit:cover;background:#000;display:block;}

/* List-row style for songs/apps */
.related-list-item{
  display:flex;
  align-items:center;
  gap:12px;
  background:#161616;
  border:1px solid #222;
  border-radius:8px;
  padding:10px 12px;
  cursor:pointer;
  position:relative;
}
.related-list-item:hover{border-color:#e50914;}
.related-list-item .icon{
  width:48px;
  height:48px;
  border-radius:8px;
  object-fit:cover;
  background:#222;
  flex-shrink:0;
}
.related-list-item .icon-fallback{
  width:48px;
  height:48px;
  border-radius:8px;
  background:#0d0d0d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:#e50914;
  flex-shrink:0;
  border:1px solid #222;
}
.related-list-item .info{flex:1;min-width:0;}
.related-list-item .info .name{
  font-size:14px;
  font-weight:600;
  color:#fff;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.related-list-item .info .sub{
  font-size:11px;
  color:#888;
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.related-list-item .check-wrap{display:none;}
body.admin-mode .related-list-item .check-wrap{display:block;}

.related-card-software{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;font-size:12px;text-align:center;padding:10px;gap:5px;}
.related-card-software span{font-size:28px;}
.card-checkbox{display:none;position:absolute;top:8px;left:8px;width:20px;height:20px;z-index:10;accent-color:#d32f2f;cursor:pointer;}
body.admin-mode .card-checkbox{display:block;}

.custom-modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;justify-content:center;align-items:center;}
.custom-modal{background:#1a1a1a;border:1px solid #333;padding:20px;border-radius:10px;width:85%;max-width:320px;text-align:center;}
.custom-modal p{font-size:15px;margin-bottom:20px;color:#fff;font-weight:bold;}
.modal-btn-group{display:flex;gap:10px;justify-content:center;}
.modal-btn{padding:8px 16px;font-size:13px;font-weight:bold;border-radius:6px;border:none;cursor:pointer;}
.modal-btn.cancel{background:#333;color:#fff;}
.modal-btn.confirm{background:#e50914;color:#fff;}

/* Loading skeleton */
.skeleton-card{
  background:#161616;
  border-radius:8px;
  height:190px;
  position:relative;
  overflow:hidden;
}
.skeleton-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.04) 50%,transparent 100%);
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* Broken media state */
.broken{
  opacity:.25;
  filter:blur(4px) grayscale(1);
}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← Home</a>
    <div class="page-title" id="folderName">Library</div>
    <button class="admin-toggle-btn" onclick="toggleAdminMode()">🔐 Admin</button>
  </div>
  <div class="bulk-action-bar">
    <div><input type="checkbox" id="selectAllBox" onclick="toggleSelectAll(this)"> <label for="selectAllBox"><b>Select All</b></label></div>
    <button class="bulk-del-btn" onclick="promptDelete()">🗑️ Delete Selected</button>
  </div>

  <div class="main-player-wrap" id="mainMediaContainer">
    <button class="nav-arrow prev" id="prevBtn" aria-label="Previous">‹</button>
    <button class="nav-arrow next" id="nextBtn" aria-label="Next">›</button>
  </div>

  <div class="video-details" id="videoDetailsBox">
    <div class="title-download-row">
      <h2 class="video-title" id="activeTitle"></h2>
      <a id="downloadLink" class="download-btn" href="#" download>⬇ Download</a>
    </div>
    <div class="meta-info">
      <div class="uploader-row">
        <img id="artistAvatar" class="artist-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
        <span>From: <span class="uploader-name" id="activeUploader">Ning Wei Media</span></span>
      </div>
      <div class="date-row">📅 Date: <span id="activeDate"></span></div>
    </div>
  </div>

  <div class="related-header">
    <h3 id="relatedHeaderTitle">Items</h3>
    <div class="toggle-icon">▲</div>
  </div>
  <div id="relatedContainer">
    <div class="related-grid" id="relatedGrid"></div>
  </div>
</div>

<div class="custom-modal-overlay" id="customModalOverlay">
  <div class="custom-modal">
    <p id="customModalText"></p>
    <div class="modal-btn-group" id="customModalButtons"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://btksyizkcpzubtextuce.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";
let db = null;

/* ============================================================
 * library.html — Modified version
 * Changes vs. original:
 *   - Swipe gesture now respects media controls (won't fire on buttons/video/audio)
 *   - Keyboard listener uses a guard to prevent duplicate bindings
 *   - Empty related-state handled with friendly message
 *   - Added loading skeletons while data is fetched
 *   - Added broken-image fallback for missing media
 *   - Admin mode + bulk delete preserved (you still need to moderate)
 *   - Auto-approve from upload.html flows through (status filter stays)
 * ============================================================ */

let allItems = [];
let currentIndex = -1;
let currentFolder = '';
let requestedUrl = '';
let requestedName = '';
let requestedType = '';

function showCustomAlert(msg, cb) {
  const o = document.getElementById('customModalOverlay');
  document.getElementById('customModalText').textContent = msg;
  document.getElementById('customModalButtons').innerHTML = '<button class="modal-btn confirm" id="okBtn">OK</button>';
  o.style.display = 'flex';
  document.getElementById('okBtn').onclick = () => { o.style.display = 'none'; if(cb) cb(); };
}
function showCustomConfirm(msg, onYes) {
  const o = document.getElementById('customModalOverlay');
  document.getElementById('customModalText').textContent = msg;
  document.getElementById('customModalButtons').innerHTML = '<button class="modal-btn cancel" id="cancelBtn">Cancel</button><button class="modal-btn confirm" id="yesBtn">Yes, Delete</button>';
  o.style.display = 'flex';
  document.getElementById('cancelBtn').onclick = () => o.style.display = 'none';
  document.getElementById('yesBtn').onclick = () => { o.style.display = 'none'; onYes(); };
}
function toggleAdminMode() {
  document.body.classList.toggle('admin-mode');
  document.querySelector('.admin-toggle-btn').classList.toggle('active');
}
function isImage(s){ return /\.(jpg|jpeg|png|webp|gif|bmp)(\?.*)?$/i.test(s||''); }
function isVideo(s){ return /\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i.test(s||''); }
function isAudio(s){ return /\.(mp3|wav|aac|m4a|flac|ogg|oga|opus|wma|aiff|aif|m4b)(\?.*)?$/i.test(s||''); }
function isApp(s)  { return /\.(apk|exe|zip|rar|7z|dmg|pkg|apks|apkm|xapk|ipa|iso|msi|deb|rpm)(\?.*)?$/i.test(s||''); }

function norm(s) {
  return (s || '').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]/g,'');
}

function detectType(url, name) {
  if (isApp(url) || isApp(name))   return 'app';
  if (isVideo(url))                return 'video';
  if (isAudio(url))                return 'audio';
  if (isImage(url))                return 'image';
  return 'file';
}

function resolveCover(item) {
  return item.cover_url || item.artist_cover || item.profile_pic || item.avatar || '';
}

function formatDay(iso) {
  if (!iso) return 'Unknown date';
  try {
    return new Date(iso).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
  } catch { return String(iso).slice(0,10); }
}
function formatDayKey(iso) {
  if (!iso) return 'unknown';
  try { return new Date(iso).toISOString().slice(0,10); } catch { return 'unknown'; }
}

async function initLibrary() {
  const params = new URLSearchParams(location.search);
  const folder = params.get('folder') || params.get('category') || '';
  requestedUrl  = params.get('url')  || '';
  requestedName = params.get('name') || '';
  requestedType = params.get('type') || '';

  const displayName = folder.replace(/-/g, ' ');
  currentFolder = folder.toLowerCase();
  document.getElementById('folderName').textContent = displayName || 'Library';
  document.getElementById('relatedHeaderTitle').textContent =
    displayName ? `Related ${displayName}` : 'Items';

  /* Loading skeleton while data fetches */
  const grid = document.getElementById('relatedGrid');
  grid.innerHTML = '<div class="skeleton-card"></div><div class="skeleton-card"></div>';

  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data, error } = await db.from('artist_submissions').select('*');
  if (error || !data) {
    document.getElementById('relatedGrid').innerHTML = '<p style="grid-column:span 2;text-align:center;color:#777;padding:20px;">Error loading data</p>';
    return;
  }

  allItems = [];
  const current = norm(folder);

  data.forEach(row => {
    if (row.status && row.status.toLowerCase() !== 'approved') return;

    let fileList = [];
    if (Array.isArray(row.files)) {
      fileList = row.files;
    } else if (row.files && typeof row.files === 'object') {
      Object.keys(row.files).forEach(k => {
        (row.files[k] || []).forEach(f => {
          if (!f.category) f.category = k;
          fileList.push(f);
        });
      });
    }

    const isoDate  = row.created_at || row.posted_at || row.uploaded_at || '';
    const dateStr  = isoDate ? new Date(isoDate).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'}) : '';
    const avatar   = row.cover_url || row.artist_cover || row.profile_pic || '';

    fileList.forEach(f => {
      const name = (f.original_name || f.name || '').toLowerCase();
      const url  = f.url || '';
      const cat  = norm(f.category || '');
      const type = (f.type || '').toLowerCase();

      let match = false;
      if (!folder) {
        match = true;
      } else if (cat) {
        if (cat === current || cat.includes(current) || current.includes(cat)) {
          match = true;
        }
      }

      if (!match) return;

      const detected = detectType(url, name);
      const isSoftware = (detected === 'app')
        || type === 'apk' || type === 'software' || type === 'app'
        || /software|editing|tools|apps|vpn|utility|mapping/i.test(folder);

      allItems.push({
        id: row.id,
        title: f.original_name || f.name || row.artist_name || 'File',
        url: url,
        type: detected,
        isSoftware: isSoftware,
        isImage: detected === 'image',
        isVideo: detected === 'video',
        isAudio: detected === 'audio',
        isApp:   detected === 'app' || isSoftware,
        uploader: row.artist_name || 'Ning Wei Media',
        avatar: avatar,
        date: dateStr,
        isoDate: isoDate,
        description: row.description || '',
        category: f.category || ''
      });
    });
  });

  allItems.sort((a, b) => {
    const ta = a.isoDate ? new Date(a.isoDate).getTime() : 0;
    const tb = b.isoDate ? new Date(b.isoDate).getTime() : 0;
    return tb - ta;
  });

  renderRelated();
  attachPlayerNav();

  if (requestedUrl) {
    const idx = allItems.findIndex(i => i.url === requestedUrl);
    if (idx >= 0) {
      playMedia(idx);
    } else if (allItems.length) {
      playMedia(0);
    }
  }
}

function renderRelated() {
  const container = document.getElementById('relatedContainer');
  if (!allItems.length) {
    container.innerHTML = '<p style="grid-column:span 2;text-align:center;color:#777;padding:20px;">No files found in this category.</p>';
    return;
  }

  const related = allItems
    .filter(item => currentIndex < 0 || item.id !== allItems[currentIndex].id)
    .slice()
    .sort((a, b) => {
      const aSame = a.category === allItems[currentIndex]?.category ? 0 : 1;
      const bSame = b.category === allItems[currentIndex]?.category ? 0 : 1;
      return aSame - bSame;
    });

  /* Edge case: single item — friendly message */
  if (!related.length) {
    container.innerHTML = '<p style="grid-column:span 2;text-align:center;color:#777;padding:20px;">No related items yet. Try another category!</p>';
    return;
  }

  const groups = {};
  related.forEach(item => {
    const key = formatDayKey(item.isoDate);
    (groups[key] ||= []).push(item);
  });
  const days = Object.keys(groups).sort((a, b) => b.localeCompare(a));

  let html = '';
  days.forEach(day => {
    html += `<div class="date-heading">${day === 'unknown' ? 'Unknown date' : formatDay(day)}</div>`;
    const items = groups[day];
    const media = items.filter(i => i.isImage || i.isVideo);
    const list  = items.filter(i => i.isAudio || i.isApp);

    if (media.length) {
      html += '<div class="related-grid">';
      media.forEach(item => {
        const originalIndex = allItems.indexOf(item);
        let preview = '';
        if (item.isImage) {
          preview = `<img src="${escAttr(item.url)}" loading="lazy" onerror="this.classList.add('broken')">`;
        } else if (item.isVideo) {
          preview = `<video src="${escAttr(item.url)}#t=0.5" preload="metadata" muted></video>`;
        }
        html += `<div class="related-card" onclick="playMedia(${originalIndex})">
          <input type="checkbox" class="card-checkbox" data-id="${item.id}" onclick="event.stopPropagation()">
          ${preview}
        </div>`;
      });
      html += '</div>';
    }

    if (list.length) {
      html += '<div class="related-list">';
      list.forEach(item => {
        const originalIndex = allItems.indexOf(item);
        const cover = resolveCover(item);
        const isAudio = item.isAudio;
        const fallbackChar = isAudio ? '🎵' : '📦';
        const icon = cover
          ? `<img class="icon" src="${escAttr(cover)}" alt="" onerror="this.outerHTML='<div class=\\'icon-fallback\\'>${fallbackChar}</div>'">`
          : `<div class="icon-fallback">${fallbackChar}</div>`;
        const sub = `${escHtml(item.uploader)} · ${escHtml(item.date || '—')}`;
        html += `<div class="related-list-item" onclick="playMedia(${originalIndex})">
          <div class="check-wrap"><input type="checkbox" class="card-checkbox" data-id="${item.id}" onclick="event.stopPropagation()"></div>
          ${icon}
          <div class="info">
            <div class="name">${escHtml(item.title)}</div>
            <div class="sub">${sub}</div>
          </div>
        </div>`;
      });
      html += '</div>';
    }
  });

  container.innerHTML = html;
}

function playMedia(i) {
  const item = allItems[i];
  if (!item) return;
  currentIndex = i;

  const box = document.getElementById('mainMediaContainer');
  const details = document.getElementById('videoDetailsBox');
  details.style.display = 'block';
  document.body.classList.add('has-media');

  if (item.isApp) {
    box.style.display = 'flex';
    const cover = resolveCover(item) || '';
    const icon = cover
      ? `<img class="app-icon" src="${escAttr(cover)}" alt="" onerror="this.outerHTML='<div class=\\'app-icon\\' style=\\'display:flex;align-items:center;justify-content:center;font-size:32px;color:#e50914\\'>📦</div>'">`
      : `<div class="app-icon" style="display:flex;align-items:center;justify-content:center;font-size:32px;color:#e50914">📦</div>`;
    box.innerHTML = `
      <div class="app-card">
        ${icon}
        <div class="app-info">
          <div class="app-name">${escHtml(item.title)}</div>
          <div class="app-uploader">${escHtml(item.uploader)}</div>
          <div class="app-desc">${escHtml(item.description || 'Tap Download to get this app.')}</div>
        </div>
      </div>
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous" onclick="event.stopPropagation();navigateMedia(-1)">‹</button>
      <button class="nav-arrow next" id="nextBtn" aria-label="Next" onclick="event.stopPropagation();navigateMedia(1)">›</button>`;
  } else if (item.isImage) {
    box.style.display = 'flex';
    box.innerHTML = `
      <img src="${escAttr(item.url)}" class="full-media" onerror="this.classList.add('broken')">
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous" onclick="event.stopPropagation();navigateMedia(-1)">‹</button>
      <button class="nav-arrow next" id="nextBtn" aria-label="Next" onclick="event.stopPropagation();navigateMedia(1)">›</button>`;
  } else if (item.isVideo) {
    box.style.display = 'flex';
    box.innerHTML = `
      <video class="full-media" controls autoplay playsinline src="${escAttr(item.url)}"></video>
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous" onclick="event.stopPropagation();navigateMedia(-1)">‹</button>
      <button class="nav-arrow next" id="nextBtn" aria-label="Next" onclick="event.stopPropagation();navigateMedia(1)">›</button>`;
  } else if (item.isAudio) {
    box.style.display = 'flex';
    const cover = resolveCover(item) || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23222'/%3E%3Ctext x='50' y='62' font-size='52' text-anchor='middle' fill='%23e50914'%3E♪%3C/text%3E%3C/svg%3E";
    box.innerHTML = `
      <div class="audio-player-card">
        <img class="audio-cover" src="${escAttr(cover)}" alt=""
             onerror="this.src=&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23222'/%3E%3Ctext x='50' y='62' font-size='52' text-anchor='middle' fill='%23e50914'%3E♪%3C/text%3E%3C/svg%3E&quot;">
        <div class="audio-meta">
          <div class="audio-title">${escHtml(item.title)}</div>
          <div class="audio-artist">${escHtml(item.uploader)}</div>
          <audio class="full-media" controls autoplay src="${escAttr(item.url)}"></audio>
        </div>
      </div>
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous" onclick="event.stopPropagation();navigateMedia(-1)">‹</button>
      <button class="nav-arrow next" id="nextBtn" aria-label="Next" onclick="event.stopPropagation();navigateMedia(1)">›</button>`;
  } else {
    box.style.display = 'none';
    box.innerHTML = '';
  }

  document.getElementById('activeTitle').textContent = item.title;
  document.getElementById('activeUploader').textContent = item.uploader;
  document.getElementById('activeDate').textContent = item.date;
  const dl = document.getElementById('downloadLink');
  dl.href = item.url;
  dl.setAttribute('download', item.title || '');
  if (item.avatar) document.getElementById('artistAvatar').src = item.avatar;
  window.scrollTo({top:0, behavior:'smooth'});

  renderRelated();
}

function navigateMedia(delta) {
  if (!allItems.length) return;
  const next = (currentIndex + delta + allItems.length) % allItems.length;
  playMedia(next);
}

/* Touch + keyboard navigation
 * - Single-binds to prevent duplicates
 * - Swipe won't trigger when touching buttons / video / audio */
function attachPlayerNav() {
  const w = document.getElementById('mainMediaContainer');

  /* Guard against double-binding */
  if (w.__navAttached) return;
  w.__navAttached = true;

  let tx = 0;
  let swipeArmed = false;
  w.addEventListener('touchstart', e => {
    /* Don't hijack gestures from interactive controls */
    if (e.target.closest('button, audio, video, input')) {
      swipeArmed = false;
      return;
    }
    swipeArmed = true;
    tx = e.touches[0].clientX;
  }, { passive: true });

  w.addEventListener('touchend', e => {
    if (!swipeArmed) return;
    swipeArmed = false;
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) navigateMedia(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* Keyboard arrows (desktop) — guarded with document-level flag */
  if (!document.__keyNavAttached) {
    document.__keyNavAttached = true;
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  navigateMedia(-1);
      if (e.key === 'ArrowRight') navigateMedia(1);
    });
  }
}

function toggleSelectAll(m) {
  document.querySelectorAll('.card-checkbox').forEach(c => c.checked = m.checked);
}
function promptDelete() {
  const ids = Array.from(document.querySelectorAll('.card-checkbox:checked')).map(c => c.dataset.id);
  if (!ids.length) return showCustomAlert('Please select at least one item to delete.');
  showCustomConfirm('Confirm delete?', async () => {
    const { error } = await db.from('artist_submissions').delete().in('id', ids);
    if (error) showCustomAlert('Error: ' + error.message);
    else showCustomAlert('Deleted successfully!', () => location.reload());
  });
}

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s) { return escHtml(s); }

initLibrary();
</script>
