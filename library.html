function esc(s){

.replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}

/* =========================
   PUBLIC SUPABASE URL
========================= */

function publicUrl(bucket,path){

return SUPABASE_URL+
"/storage/v1/object/public/"+
bucket+
"/"+
path
.split("/")
.map(encodeURIComponent)
.join("/");

}


/* =========================
   LIST STORAGE
========================= */

async function listBucket(
bucket,
path="",
out=[]
){

let {
data,
error
}=await db.storage
.from(bucket)
.list(
path,
{
limit:1000,
sortBy:{
column:"created_at",
order:"desc"
}
}
);

if(error){

console.error(error);

return out;

}

for(const f of data||[]){

if(!f.name)continue;

const p =
path
?path+"/"+f.name
:f.name;

if(f.id===null){

await listBucket(
bucket,
p,
out
);

}

else{

out.push({

bucket,
path:p,
name:f.name,

created_at:
f.created_at||
f.updated_at,

url:
publicUrl(
bucket,
p
)

});

}

}

return out;

}


/* =========================
   MEDIA TYPE
========================= */

function mediaType(n){

let e =
n.toLowerCase()
.split(".")
.pop();

if([
"jpg",
"jpeg",
"png",
"gif",
"webp",
"bmp",
"avif"
].includes(e))

return "photo";


if([
"mp4",
"webm",
"mov",
"m4v",
"3gp",
"3g2",
"mpg",
"mpeg",
"mpe",
"ogv",
"avi",
"mkv"
].includes(e))

return "video";


return "other";

}
