<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media - Player & Library</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0a0a0a;
  color:#fff;
}
.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding-bottom:30px;
}

/* Header */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: #111;
  border-bottom: 1px solid #222;
}
.back-btn {
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}
.page-title {
  font-size: 16px;
  font-weight: 800;
  color: #55bfe8;
}

/* Fullscreen/TikTok Video Container */
.main-player-wrap {
  width: 100%;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}
video.full-video {
  width: 100%;
  max-height: 80vh;
  object-fit: contain;
  outline: none;
}

/* Video Details Section */
.video-details {
  padding: 12px 16px;
  background: #111;
  border-bottom: 1px solid #222;
}

/* Title Line + Inline Compact Download Button */
.title-download-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.video-title {
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin: 0;
}
.download-btn {
  background: #e50914;
  color: #fff;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
  padding: 6px 12px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  flex-shrink: 0;
}

/* Artist Avatar & Meta Information */
.meta-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: #aaa;
}
.uploader-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.artist-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  background: #333;
  border: 1px solid #555;
}
.uploader-name {
  color: #e50914;
  font-weight: bold;
}
.date-row {
  font-size: 12px;
  color: #888;
  padding-left: 2px;
}

/* Related Videos Header */
.related-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #222;
  padding: 10px 14px;
  margin-top: 15px;
  border-left: 4px solid #e50914;
}
.related-header h3 {
  margin: 0;
  font-size: 16px;
  font-weight: bold;
  color: #fff;
}
.toggle-icon {
  background: #e50914;
  color: #fff;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 2px;
  font-size: 12px;
}

/* Related Content Grid */
.related-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  padding: 12px 16px;
}
.related-card {
  background: #161616;
  border-radius: 8px;
  overflow: hidden;
  text-decoration: none;
  color: #fff;
  display: flex;
  flex-direction: column;
  cursor: pointer;
}
.related-card video {
  width: 100%;
  height: 120px;
  object-fit: cover;
  background: #000;
}
.related-card .card-title {
  padding: 6px 8px;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← Home</a>
    <div class="page-title" id="folderName">Videos</div>
    <div></div>
  </div>

  <!-- Featured Player Area -->
  <div class="main-player-wrap">
    <video id="mainVideoPlayer" class="full-video" controls autoplay playsinline></video>
  </div>

  <!-- Video Info -->
  <div class="video-details">
    <div class="title-download-row">
      <h2 class="video-title" id="activeTitle">Loading Video...</h2>
      <a id="downloadLink" class="download-btn" href="#" download>⬇ Download</a>
    </div>

    <div class="meta-info">
      <div class="uploader-row">
        <img id="artistAvatar" class="artist-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Artist Profile">
        <span>From: <span class="uploader-name" id="activeUploader">Ning Wei Media</span></span>
      </div>
      <div class="date-row">
        📅 Date: <span id="activeDate">September 13, 2026</span>
      </div>
    </div>
  </div>

  <!-- Related Videos Bar -->
  <div class="related-header">
    <h3>Related videos</h3>
    <div class="toggle-icon">▲</div>
  </div>

  <!-- Related Items Grid -->
  <div class="related-grid" id="relatedGrid"></div>
</div>

<script>
const SUPABASE_URL = "https://btksyizkcpzubtextuce.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";

async function initLibrary() {
  const urlParams = new URLSearchParams(window.location.search);
  const selectedFolder = urlParams.get('folder') || 'Trending-Videos';
  document.getElementById('folderName').textContent = selectedFolder.replace(/-/g, ' ');

  if (!window.supabase) return;
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const { data, error } = await db.from('artist_submissions').select('*');
  if (error || !data) return;

  const items = [];

  data.forEach(row => {
    if (row.status && row.status.toLowerCase() !== 'approved') return;

    const dateStr = row.created_at ? new Date(row.created_at).toLocaleDateString('en-US', {
      month: 'long', day: 'numeric', year: 'numeric'
    }) : 'September 13, 2026';

    const avatarUrl = row.cover_url || row.artist_cover || row.profile_pic || '';

    if (Array.isArray(row.files)) {
      row.files.forEach(f => {
        items.push({
          title: f.original_name || f.name || row.artist_name || 'Untitled Video',
          url: f.url,
          uploader: row.artist_name || 'Unknown Artist',
          avatar: avatarUrl,
          date: dateStr
        });
      });
    }
  });

  if (items.length > 0) {
    playVideo(items[0]);
    renderRelated(items.slice(1));
  }
}

function playVideo(item) {
  const player = document.getElementById('mainVideoPlayer');
  player.src = item.url;

  document.getElementById('activeTitle').textContent = item.title;
  document.getElementById('activeUploader').textContent = item.uploader;
  document.getElementById('activeDate').textContent = item.date;

  const downloadBtn = document.getElementById('downloadLink');
  downloadBtn.href = item.url;
  downloadBtn.setAttribute('download', item.title);

  const avatarImg = document.getElementById('artistAvatar');
  if (item.avatar) {
    avatarImg.src = item.avatar;
  }
}

function renderRelated(relatedList) {
  const grid = document.getElementById('relatedGrid');
  grid.innerHTML = relatedList.map((item, idx) => `
    <div class="related-card" onclick="switchVideo(${idx})">
      <video src="${item.url}#t=0.5" preload="metadata" muted></video>
      <div class="card-title">${item.title}</div>
    </div>
  `).join('');
  
  window.currentRelated = relatedList;
}

function switchVideo(index) {
  if (window.currentRelated && window.currentRelated[index]) {
    playVideo(window.currentRelated[index]);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

initLibrary();
</script>

</body>
</html>
