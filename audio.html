<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trending Songs - Ning Wei Media</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:#172033;
    min-height:100vh;
    background:
    radial-gradient(circle at 10% 10%,rgba(0,145,255,.18),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(140,70,255,.15),transparent 30%),
    #f5f8fc;
}

header{
    background:linear-gradient(135deg,#087ee8,#1756d5);
    color:white;
    text-align:center;
    padding:24px 15px;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0;
    font-size:13px;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.search{
    width:100%;
    padding:14px 18px;
    border:0;
    outline:0;
    border-radius:30px;
    font-size:16px;
    margin-bottom:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.item{
    display:flex;
    align-items:center;
    min-height:62px;
    padding:10px;
    text-decoration:none;
    color:#172033;
    border-bottom:1px solid rgba(0,0,0,.08);
}

.item:hover{
    background:rgba(255,255,255,.8);
}

.icon{
    width:45px;
    text-align:center;
    font-size:25px;
}

.info{
    flex:1;
}

.name{
    font-weight:bold;
    font-size:17px;
}

.desc{
    font-size:12px;
    color:#718096;
    margin-top:3px;
}

.arrow{
    font-size:23px;
    color:#168de2;
}

.back{
    display:block;
    text-align:center;
    margin:20px;
    color:#168de2;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<header>

<h1>🎵 Trending Songs</h1>

<p>Music and DJ mixes</p>

</header>

<div class="container">

<input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 Search music..."
>

<div id="items">

<a class="item" href="media.html?path=media/songs/Ugandan">

<div class="icon">🇺🇬</div>

<div class="info">
<div class="name">Ugandan Music</div>
<div class="desc">Ugandan songs</div>
</div>

<div class="arrow">›</div>

</a>


<a class="item" href="media.html?path=media/songs/African">

<div class="icon">🌍</div>

<div class="info">
<div class="name">African Music</div>
<div class="desc">African songs</div>
</div>

<div class="arrow">›</div>

</a>


<a class="item" href="media.html?path=media/songs/International">

<div class="icon">🌎</div>

<div class="info">
<div class="name">International Music</div>
<div class="desc">International songs</div>
</div>

<div class="arrow">›</div>

</a>


<a class="item" href="media.html?path=media/songs/DJ-Mixes">

<div class="icon">🎧</div>

<div class="info">
<div class="name">DJ Mixes</div>
<div class="desc">Mixtapes, mappings, effects & skins</div>
</div>

<div class="arrow">›</div>

</a>

</div>

<a class="back" href="index.html">
← Back to Home
</a>

</div>

<script>

const search=
document.getElementById("search");

const items=
document.querySelectorAll(".item");

search.addEventListener("input",()=>{

    const q=
    search.value.toLowerCase();

    items.forEach(item=>{

        item.style.display=
        item.innerText.toLowerCase().includes(q)
        ? "flex"
        : "none";

    });

});

</script>

</body>
</html>
