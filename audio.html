<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trending Songs - Ning Wei Media</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef9ff,#f5f1ff,#effffc);
  color:#182033;
}

/* HEADER */
header{
  position:relative;
  overflow:hidden;
  min-height:155px;
  padding:25px 15px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;

  background:
    linear-gradient(rgba(80,180,240,.18),rgba(80,180,240,.18)),
    url("ning-wei.png");

  background-size:cover;
  background-position:center 25%;

  box-shadow:0 4px 18px rgba(0,0,0,.15);
}

header h1{
  margin:0;
  font-size:38px;
  font-weight:800;
  text-shadow:0 2px 5px rgba(0,0,0,.7);
}

header p{
  margin:8px 0 0;
  font-size:20px;
  text-shadow:0 2px 4px rgba(0,0,0,.7);
}

/* CONTENT */
.container{
  max-width:800px;
  margin:auto;
  padding:25px 20px 40px;
}

/* SEARCH */
.search{
  width:100%;
  padding:20px 25px;
  border:0;
  outline:none;
  border-radius:40px;
  background:white;
  font-size:21px;
  color:#333;
  box-shadow:0 5px 18px rgba(0,0,0,.10);
  margin-bottom:25px;
}

.search::placeholder{
  color:#777;
}

/* TITLE */
.page-title{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:30px;
  font-weight:800;
  margin:15px 0 18px;
}

/* FOLDER LIST */
.folder-list{
  background:rgba(255,255,255,.75);
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

/* EACH FOLDER */
.folder{
  display:flex;
  align-items:center;
  min-height:105px;
  padding:16px 18px;
  text-decoration:none;
  color:#182033;
  border-bottom:1px solid #ddd;
  transition:.2s;
}

.folder:last-child{
  border-bottom:0;
}

.folder:active{
  transform:scale(.98);
}

/* BLACK NUMBER */
.number{
  width:58px;
  height:58px;
  min-width:58px;
  border-radius:50%;

  background:#000;

  color:white;
  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;
  font-weight:bold;

  border:3px solid white;
  box-shadow:
    0 2px 8px rgba(0,0,0,.30),
    inset 0 0 0 2px #222;

  margin-right:18px;
}

/* ICON */
.icon{
  font-size:38px;
  width:55px;
  min-width:55px;
  margin-right:10px;
}

/* TEXT */
.folder-info{
  flex:1;
}

.folder-info strong{
  display:block;
  font-size:22px;
  margin-bottom:5px;
}

.folder-info small{
  display:block;
  font-size:16px;
  color:#777;
}

/* ARROW */
.arrow{
  font-size:34px;
  color:#168dcc;
  margin-left:10px;
}

/* BACK */
.back{
  display:block;
  text-align:center;
  margin:30px 0 10px;
  color:#168dcc;
  text-decoration:none;
  font-size:20px;
  font-weight:bold;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  color:#777;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>Ning Wei Media</h1>
  <p>Music • Videos • Photos • Apps • Software</p>
</header>

<div class="container">

  <input
    type="search"
    id="search"
    class="search"
    placeholder="🔎 Search music..."
  >

  <div class="page-title">
    🎵 Trending Songs
  </div>

  <div class="folder-list" id="folders">

    <!-- NUMBERING STARTS FROM 1 IN THIS FOLDER -->

    <a class="folder"
       href="media/songs/Ugandan/index.html">
      <span class="number">1</span>

      <span class="icon">🇺🇬</span>

      <span class="folder-info">
        <strong>Ugandan Music</strong>
        <small>Ugandan songs</small>
      </span>

      <span class="arrow">›</span>
    </a>


    <a class="folder"
       href="media/songs/African/index.html">
      <span class="number">2</span>

      <span class="icon">🌍</span>

      <span class="folder-info">
        <strong>African Music</strong>
        <small>African songs</small>
      </span>

      <span class="arrow">›</span>
    </a>


    <a class="folder"
       href="media/songs/International/index.html">
      <span class="number">3</span>

      <span class="icon">🌎</span>

      <span class="folder-info">
        <strong>International Music</strong>
        <small>International songs</small>
      </span>

      <span class="arrow">›</span>
    </a>

  </div>

  <a class="back" href="index.html">
    ← Back to Home
  </a>

</div>

<footer>
  © 2026 Ning Wei Media
</footer>

<script>

/* SEARCH */
const search = document.getElementById("search");
const folders = document.querySelectorAll(".folder");

search.addEventListener("input", function(){

  const text = this.value.toLowerCase().trim();

  folders.forEach(function(folder){

    const name = folder.innerText.toLowerCase();

    if(name.includes(text)){
      folder.style.display = "flex";
    }else{
      folder.style.display = "none";
    }

  });

});

</script>

</body>
</html>
