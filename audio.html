<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music - Ning Wei Media</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3faff;color:#111}
.header{position:relative;height:300px;overflow:hidden;color:#fff}
.header img{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;object-position:50% 18%;transform:scale(1.08)}
.overlay{position:absolute;inset:0;background:rgba(55,145,205,.38)}
.headerText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;text-shadow:0 2px 7px #000}
.headerText h1{margin:0;font-size:34px}
.headerText p{margin:7px 0;font-size:14px;font-weight:bold}
.top{padding:12px 15px}
.search{display:flex;gap:8px}
.search input{flex:1;height:48px;border:1px solid #d5e3e9;border-radius:25px;padding:0 16px;font-size:16px}
.search button{width:48px;border:0;border-radius:50%;background:#168dcc;color:#fff;font-size:20px}
.path{padding:10px 15px;color:#777;font-size:13px}
.list{padding:0 15px 25px}
.row{display:flex;align-items:center;gap:9px;background:#fff;margin:6px 0;padding:9px 10px;border-radius:12px;text-decoration:none;color:#111;box-shadow:0 2px 8px #00000010}
.num{width:30px;height:30px;min-width:30px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold}
.icon{width:36px;height:36px;min-width:36px;border-radius:9px;background:#edf8fd;display:flex;align-items:center;justify-content:center}
.info{flex:1;min-width:0}
.name{font-weight:bold;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:#777;margin-top:3px}
.arrow{font-size:25px;color:#168dcc}
.back{display:block;margin:0 15px 25px;padding:12px;background:#fff;border-radius:12px;text-align:center;text-decoration:none;color:#168dcc;font-weight:bold}
.empty{text-align:center;background:#fff;padding:20px;border-radius:12px;color:#777}
</style>
</head>

<body>

<header class="header">
<img src="ning-wei.png" alt="">
<div class="overlay"></div>
<div class="headerText">
<h1>Ning Wei Media</h1>
<p>Music • Videos • Photos • Apps • Software</p>
</div>
</header>

<div class="top">
<div class="search">
<input id="search" placeholder="🔍 Search everything...">
<button onclick="goSearch()">🔍</button>
</div>
</div>

<div id="path" class="path"></div>
<div id="list" class="list"></div>

<a class="back" href="index.html">← Home</a>

<script>

const USER="Ningwei2567";
const REPO="Ning-wei-1";
const BRANCH="main";

const params=new URLSearchParams(location.search);
const currentPath=params.get("path")||"media/songs";

function goSearch(){
location.href="search.html";
}

document.getElementById("search").addEventListener("keydown",e=>{
if(e.key==="Enter")goSearch();
});

function encodePath(path){
return path.split("/").map(encodeURIComponent).join("/");
}

async function load(){

const api=
`https://api.github.com/repos/${USER}/${REPO}/contents/${encodePath(currentPath)}?ref=${BRANCH}`;

const response=await fetch(api,{cache:"no-store"});

if(!response.ok){
document.getElementById("list").innerHTML=
`<div class="empty">Unable to load this folder.</div>`;
return;
}

let items=await response.json();

if(!Array.isArray(items))items=[items];

items=items.filter(item=>{
if(item.type==="dir")return true;
return /\.(mp3|m4a|wav|aac|ogg|oga|opus|flac)$/i.test(item.name);
});

items.sort((a,b)=>{
if(a.type!==b.type)return a.type==="dir"?-1:1;
return a.name.localeCompare(b.name);
});

document.getElementById("path").textContent=
currentPath.replace(/^media\/songs\/?/,"Music / ");

let html="";

items.forEach((item,i)=>{

let href;

if(item.type==="dir"){
href="audio.html?path="+encodeURIComponent(item.path);
}else{
href="media.html?path="+encodeURIComponent(item.path);
}

html+=`
<a class="row" href="${href}">
<span class="num">${i+1}</span>
<span class="icon">${item.type==="dir"?"📁":"🎵"}</span>
<span class="info">
<span class="name">${escapeHTML(item.name)}</span>
<span class="sub">${item.type==="dir"?"Folder":"Audio"}</span>
</span>
<span class="arrow">›</span>
</a>`;
});

document.getElementById("list").innerHTML=
html||`<div class="empty">This folder is empty.</div>`;

}

function escapeHTML(x){
return String(x).replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#039;"
}[m]));
}

load();

</script>
</body>
</html>
