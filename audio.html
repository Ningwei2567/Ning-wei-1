<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media - Trending Songs</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5fb;
  color:#222;
}

header{
  background:#168de2;
  color:white;
  text-align:center;
  padding:35px 15px;
}

header h1{
  margin:0;
  font-size:32px;
}

.playlist{
  background:white;
  margin:20px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 15px #ccc;
}

.playlist h2{
  margin-top:0;
}

.song{
  background:#f1f5fb;
  margin-top:15px;
  padding:15px;
  border-radius:12px;
}

.song-name{
  font-weight:bold;
  font-size:18px;
  margin-bottom:10px;
  word-break:break-word;
}

audio{
  width:100%;
}

.download{
  display:block;
  background:#168de2;
  color:white;
  text-align:center;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

.back{
  display:block;
  margin:25px;
  color:#168de2;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>🎵 Trending Songs</h1>
<p>Listen and download music</p>
</header>

<div class="playlist">
<h2>🔥 Latest Songs</h2>
<div id="latest">Loading...</div>
</div>

<div class="playlist">
<h2>🇺🇬 Ugandan Music</h2>
<div id="ugandan">Loading...</div>
</div>

<div class="playlist">
<h2>🌍 African Music</h2>
<div id="african">Loading...</div>
</div>

<div class="playlist">
<h2>🎧 DJ Mixes</h2>
<div id="mixes">Loading...</div>
</div>

<a class="back" href="index.html">← Back to Home</a>

<script>

const username = "Ningwei2567";
const repo = "Ning-wei-1";

function loadSongs(folder, elementId){

  const url =
  `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;

  fetch(url)
  .then(response => response.json())
  .then(files => {

    const box = document.getElementById(elementId);

    if(!Array.isArray(files)){
      box.innerHTML = "<p>No songs uploaded yet.</p>";
      return;
    }

    const songs = files.filter(file =>
      file.type === "file" &&
      /\.(mp3|wav|m4a|ogg)$/i.test(file.name)
    );

    box.innerHTML = "";

    if(songs.length === 0){
      box.innerHTML = "<p>No songs uploaded yet.</p>";
      return;
    }

    songs.forEach(file => {

      const item = document.createElement("div");
      item.className = "song";

      item.innerHTML = `
        <div class="song-name">🎵 ${file.name}</div>

        <audio controls>
          <source src="${file.download_url}">
        </audio>

        <a class="download"
           href="${file.download_url}"
           download>
           ⬇ Download Song
        </a>
      `;

      box.appendChild(item);

    });

  })
  .catch(() => {
    document.getElementById(elementId).innerHTML =
    "<p>Unable to load songs.</p>";
  });
}


/* PLAYLISTS */

loadSongs("media/songs", "latest");

loadSongs("media/songs/Ugandan", "ugandan");

loadSongs("media/songs/African", "african");

loadSongs("media/songs/DJ-Mixes", "mixes");

</script>

</body>
</html>
