<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media - Music</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8fa;
  color:#111;
}

.header{
  height:190px;
  display:flex;
  align-items:flex-end;
  padding:15px;
  background:
    linear-gradient(rgba(80,190,235,.20),rgba(80,190,235,.20)),
    url("ning-wei.png") center/cover no-repeat;
}

.header h1{
  margin:0;
  color:#fff;
  font-size:26px;
  text-shadow:0 2px 6px #000;
}

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.search{
  width:100%;
  padding:13px 17px;
  border:1px solid #ccc;
  border-radius:25px;
  font-size:16px;
  outline:none;
  margin-bottom:12px;
}

.back{
  display:inline-block;
  margin-bottom:12px;
  color:#087ea4;
  text-decoration:none;
  font-weight:bold;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
  padding:9px;
  margin-bottom:7px;
  border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}

.number{
  width:32px;
  height:32px;
  min-width:32px;
  border-radius:50%;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.icon{
  font-size:21px;
}

.item a{
  flex:1;
  color:#111;
  text-decoration:none;
  font-weight:bold;
  word-break:break-word;
}

.arrow{
  color:#0795c5;
  font-size:22px;
}

.message{
  text-align:center;
  padding:30px;
  color:#777;
}
</style>
</head>

<body>

<header class="header">
  <h1>🎵 Ning Wei Music</h1>
</header>

<div class="container">

  <a class="back" id="back" href="index.html">
    ← Back
  </a>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search music..."
  >

  <div id="list">
    <div class="message">Loading...</div>
  </div>

</div>

<script>

const OWNER = "Ningwei2567";
const REPO = "Ning-wei-1";
const BRANCH = "main";

const ROOT = "media/songs";

const params =
  new URLSearchParams(location.search);

let currentPath =
  params.get("path") || ROOT;

let allItems = [];

const API =
  `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;


/* NAME */

function cleanName(name){

  return name
    .replace(/\.[^/.]+$/,"")
    .replace(/[-_]/g," ");
}


/* ICON */

function getIcon(item){

  if(item.type === "dir"){

    const n =
      item.name.toLowerCase();

    if(n.includes("dj") ||
       n.includes("mix"))
      return "🎧";

    if(n.includes("ugandan") ||
       n.includes("african") ||
       n.includes("international"))
      return "🎵";

    if(n.includes("mapping"))
      return "🗺️";

    if(n.includes("effect"))
      return "🔊";

    if(n.includes("skin"))
      return "🎨";

    return "📁";
  }

  if(/\.(mp3|wav|m4a|aac|ogg|oga|opus|flac)$/i
    .test(item.name))
    return "🎵";

  return "📄";
}


/* OPEN LINK */

function getLink(item){

  if(item.type === "dir"){

    return "audio.html?path=" +
      encodeURIComponent(item.path);

  }

  return "media.html?path=" +
    encodeURIComponent(item.path);
}


/* DISPLAY */

function display(items){

  const list =
    document.getElementById("list");

  list.innerHTML = "";

  if(items.length === 0){

    list.innerHTML =
      `<div class="message">
        Nothing found.
      </div>`;

    return;
  }

  items.forEach((item,index)=>{

    const row =
      document.createElement("div");

    row.className = "item";


    const number =
      document.createElement("div");

    number.className = "number";

    /*
      Numbering ALWAYS starts at 1
      inside the current folder.
    */

    number.textContent =
      index + 1;


    const icon =
      document.createElement("span");

    icon.className = "icon";

    icon.textContent =
      getIcon(item);


    const link =
      document.createElement("a");

    link.href =
      getLink(item);

    link.textContent =
      cleanName(item.name);


    const arrow =
      document.createElement("span");

    arrow.className = "arrow";

    arrow.textContent =
      item.type === "dir"
        ? "›"
        : "▶";


    row.appendChild(number);
    row.appendChild(icon);
    row.appendChild(link);
    row.appendChild(arrow);

    list.appendChild(row);

  });
}


/* BACK */

function setupBack(){

  const back =
    document.getElementById("back");

  if(currentPath === ROOT){

    back.href = "index.html";

    back.textContent =
      "← Home";

    return;
  }

  const parent =
    currentPath
      .substring(
        0,
        currentPath.lastIndexOf("/")
      );

  if(parent === "media"){

    back.href =
      "audio.html";

  }else{

    back.href =
      "audio.html?path=" +
      encodeURIComponent(parent);

  }

  back.textContent =
    "← Back";
}


/* LOAD */

async function loadFolder(){

  const list =
    document.getElementById("list");

  try{

    const response =
      await fetch(
        API +
        currentPath +
        "?ref=" +
        BRANCH
      );

    if(!response.ok)
      throw new Error();

    let items =
      await response.json();


    /*
      Folders first.
    */

    items.sort((a,b)=>{

      if(a.type !== b.type){

        return a.type === "dir"
          ? -1
          : 1;
      }

      return a.name.localeCompare(b.name);

    });


    /*
      Keep folders and media files.
      Ignore GitHub helper files.
    */

    allItems =
      items.filter(item=>{

        if(item.type === "dir")
          return true;

        return /\.(mp3|wav|m4a|aac|ogg|oga|opus|flac)$/i
          .test(item.name);

      });


    display(allItems);
    setupBack();

  }catch(error){

    list.innerHTML =
      `<div class="message">
        Unable to load this music folder.
      </div>`;

  }
}


/* SEARCH */

document
.getElementById("search")
.addEventListener("input",function(){

  const text =
    this.value
      .toLowerCase()
      .trim();

  if(!text){

    display(allItems);
    return;
  }

  const filtered =
    allItems.filter(item=>
      item.name
        .toLowerCase()
        .includes(text)
    );

  display(filtered);

});


loadFolder();

</script>

</body>
</html>
