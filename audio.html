<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trending Songs - Ning Wei Media</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f7;
  color:#222;
}

/* =========================
   HEADER
   YOUR PHOTO + LIGHT SKY BLUE
   ========================= */

header{
  position:relative;
  overflow:hidden;

  min-height:155px;
  padding:25px 15px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
  color:white;

  background:
    linear-gradient(
      rgba(135,206,235,.16),
      rgba(135,206,235,.16)
    ),
    url("ning-wei.png");

  background-size:cover;
  background-position:center 25%;

  box-shadow:0 3px 14px rgba(0,0,0,.15);
}

header h1{
  margin:0;

  font-size:32px;
  font-weight:800;

  text-shadow:
    0 2px 5px rgba(0,0,0,.9),
    0 1px 2px rgba(0,0,0,.9);
}

header p{
  margin:7px 0 0;

  font-size:15px;
  font-weight:600;

  text-shadow:
    0 1px 4px rgba(0,0,0,.9);
}

/* =========================
   CONTENT
   ========================= */

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:14px;
}

/* =========================
   SEARCH
   ========================= */

.search-box{
  width:100%;
  height:52px;

  margin-bottom:15px;
  padding:0 18px;

  border:0;
  border-radius:28px;

  background:white;

  font-size:16px;

  outline:none;

  box-shadow:0 3px 12px rgba(0,0,0,.10);
}

/* =========================
   TITLE
   ========================= */

.page-title{
  margin:8px 0 14px;

  font-size:25px;
  font-weight:800;
}

/* =========================
   NUMBERED ROWS
   ========================= */

.category{
  display:flex;
  align-items:center;

  width:100%;
  min-height:70px;

  margin:8px 0;

  padding:10px 13px;

  background:white;

  border-radius:12px;

  text-decoration:none;
  color:#222;

  box-shadow:0 2px 8px rgba(0,0,0,.09);
}

/* BLACK NUMBER */

.number{
  width:42px;
  height:42px;

  min-width:42px;

  margin-right:13px;

  border-radius:50%;

  background:#000;

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:18px;
  font-weight:bold;

  border:2px solid white;

  box-shadow:0 2px 6px rgba(0,0,0,.3);
}

/* ICON */

.icon{
  width:42px;
  min-width:42px;

  margin-right:10px;

  font-size:25px;

  text-align:center;
}

/* TEXT */

.category-text{
  flex:1;
}

.category-text strong{
  display:block;

  font-size:18px;
}

.category-text small{
  display:block;

  margin-top:4px;

  color:#777;

  font-size:14px;
}

/* ARROW */

.arrow{
  font-size:28px;
  font-weight:bold;

  color:#222;
}

/* BACK */

.back{
  display:block;

  width:max-content;

  margin:22px auto 30px;

  padding:10px 18px;

  background:#000;

  color:white;

  border-radius:8px;

  text-decoration:none;

  font-weight:bold;
}

/* FOOTER */

footer{
  padding:25px;

  text-align:center;

  color:#777;

  font-size:13px;
}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

<h1>Ning Wei Media</h1>

<p>
Music • Videos • Photos • Apps • Software
</p>

</header>


<div class="container">


<!-- SEARCH -->

<input
id="search"
class="search-box"
type="search"
placeholder="Search music..."
>


<!-- TITLE -->

<h2 class="page-title">
🎵 Trending Songs
</h2>


<!-- =========================
     MUSIC CATEGORIES
     ========================= -->

<div id="musicList">


<a
class="category"
href="media/songs/Ugandan/index.html"
>

<span class="number">1</span>

<span class="icon">🇺🇬</span>

<span class="category-text">

<strong>Ugandan Music</strong>

<small>Ugandan songs</small>

</span>

<span class="arrow">›</span>

</a>


<a
class="category"
href="media/songs/African/index.html"
>

<span class="number">2</span>

<span class="icon">🌍</span>

<span class="category-text">

<strong>African Music</strong>

<small>African songs</small>

</span>

<span class="arrow">›</span>

</a>


<a
class="category"
href="media/songs/International/index.html"
>

<span class="number">3</span>

<span class="icon">🌍</span>

<span class="category-text">

<strong>International Music</strong>

<small>International songs</small>

</span>

<span class="arrow">›</span>

</a>


</div>


<a
class="back"
href="index.html"
>
← Back to Home
</a>


</div>


<footer>

© 2026 Ning Wei Media

</footer>


<script>

/* =========================
   SEARCH
   ========================= */

const search =
document.getElementById("search");

const categories =
document.querySelectorAll(".category");


search.addEventListener(
"input",
function(){

const text =
this.value.toLowerCase().trim();


categories.forEach(
item => {

const name =
item.innerText.toLowerCase();


item.style.display =
name.includes(text)
? "flex"
: "none";

});

});

</script>


</body>

</html>
