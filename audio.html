<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trending Songs - Ning Wei Media</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7f9;
 color:#111;
}

header{
 height:180px;
 background:
 linear-gradient(rgba(135,206,235,.28),rgba(135,206,235,.28)),
 url("ning-wei.png") center/cover no-repeat;
 display:flex;
 align-items:flex-end;
 padding:20px;
}

h1{
 margin:0;
 color:white;
 text-shadow:0 2px 5px #000;
 font-size:28px;
}

main{
 max-width:700px;
 margin:auto;
 padding:15px;
}

.back{
 display:inline-block;
 margin-bottom:12px;
 text-decoration:none;
 color:#078;
 font-weight:bold;
}

.search{
 width:100%;
 padding:14px;
 border:1px solid #ccc;
 border-radius:30px;
 font-size:17px;
 margin-bottom:12px;
}

.item{
 display:flex;
 align-items:center;
 gap:12px;
 background:#fff;
 padding:11px;
 margin:7px 0;
 border-radius:12px;
 box-shadow:0 2px 6px #0002;
 text-decoration:none;
 color:#111;
}

.num{
 width:40px;
 height:40px;
 min-width:40px;
 border-radius:50%;
 background:#000;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
}

.icon{
 font-size:25px;
 width:35px;
 text-align:center;
}

.name{
 font-weight:bold;
 font-size:17px;
}

.arrow{
 margin-left:auto;
 color:#168baa;
 font-size:27px;
}
</style>
</head>

<body>

<header>
<h1>🎵 Trending Songs</h1>
</header>

<main>

<a class="back" href="index.html">← Back to Home</a>

<input
 id="search"
 class="search"
 placeholder="Search music..."
>

<div id="list">

<a class="item" href="media/songs/Ugandan/index.html">
<span class="num">1</span>
<span class="icon">🎵</span>
<span class="name">Ugandan Music</span>
<span class="arrow">›</span>
</a>

<a class="item" href="media/songs/African/index.html">
<span class="num">2</span>
<span class="icon">🌍</span>
<span class="name">African Music</span>
<span class="arrow">›</span>
</a>

<a class="item" href="media/songs/International/index.html">
<span class="num">3</span>
<span class="icon">🌎</span>
<span class="name">International Music</span>
<span class="arrow">›</span>
</a>

</div>

</main>

<script>
const search=document.getElementById("search");
const items=[...document.querySelectorAll(".item")];

search.addEventListener("input",()=>{
 const q=search.value.toLowerCase();

 items.forEach(item=>{
   item.style.display=
   item.innerText.toLowerCase().includes(q)
   ? "flex"
   : "none";
 });
});
</script>

</body>
</html>
