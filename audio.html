<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media - Trending Songs</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:
      radial-gradient(circle at 10% 10%,#dff6ff,transparent 35%),
      radial-gradient(circle at 90% 20%,#eee5ff,transparent 35%),
      linear-gradient(135deg,#f8fbff,#f5f1ff,#effcf8);
    color:#182033;
}

header{
    background:linear-gradient(135deg,#087fe8,#3159d9);
    color:white;
    text-align:center;
    padding:32px 15px;
}

header h1{
    margin:0;
    font-size:32px;
}

header p{
    margin:8px 0 0;
    font-size:17px;
}

.search-box{
    padding:22px 4%;
}

.search{
    width:100%;
    padding:17px 20px;
    border:0;
    border-radius:35px;
    font-size:18px;
    outline:none;
    box-shadow:0 4px 18px #cfd7e5;
}

.container{
    max-width:800px;
    margin:auto;
    padding:0 4% 30px;
}

.category{
    display:flex;
    align-items:center;
    gap:15px;
    padding:20px 12px;
    border-bottom:1px solid #d9dce4;
    text-decoration:none;
    color:#182033;
    background:rgba(255,255,255,.55);
}

.category:first-child{
    border-radius:20px 20px 0 0;
}

.category:last-child{
    border-radius:0 0 20px 20px;
}

.icon{
    font-size:35px;
    width:55px;
    text-align:center;
}

.info{
    flex:1;
}

.info h2{
    margin:0;
    font-size:21px;
}

.info p{
    margin:5px 0 0;
    color:#718096;
}

.arrow{
    font-size:30px;
    color:#168bd0;
}

.back{
    display:block;
    text-align:center;
    margin:10px 0 35px;
    color:#168bd0;
    text-decoration:none;
    font-weight:bold;
    font-size:18px;
}
</style>
</head>

<body>

<header>
    <h1>🎵 Trending Songs</h1>
    <p>Music and audio</p>
</header>

<div class="search-box">
    <input
        id="search"
        class="search"
        type="search"
        placeholder="🔎 Search music..."
    >
</div>

<div class="container">

    <div id="categories">

        <a class="category"
           href="media/songs/Ugandan/index.html">
            <div class="icon">🇺🇬</div>
            <div class="info">
                <h2>Ugandan Music</h2>
                <p>Ugandan songs</p>
            </div>
            <div class="arrow">›</div>
        </a>

        <a class="category"
           href="media/songs/African/index.html">
            <div class="icon">🌍</div>
            <div class="info">
                <h2>African Music</h2>
                <p>African songs</p>
            </div>
            <div class="arrow">›</div>
        </a>

        <a class="category"
           href="media/songs/International/index.html">
            <div class="icon">🌎</div>
            <div class="info">
                <h2>International Music</h2>
                <p>International songs</p>
            </div>
            <div class="arrow">›</div>
        </a>

    </div>

</div>

<a class="back" href="index.html">
    ← Back to Home
</a>

<script>

const search =
document.getElementById("search");

search.addEventListener("input",function(){

    const text =
        this.value.toLowerCase();

    document.querySelectorAll(".category")
    .forEach(item => {

        item.style.display =
            item.innerText.toLowerCase()
            .includes(text)
            ? "flex"
            : "none";

    });

});

</script>

</body>
</html>
