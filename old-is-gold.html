<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Old is Gold - Ning Wei Media</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef6fb;
  color:#111;
}

/* SMALL HEADER */
.hero{
  height:125px;
  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  background-image:
    linear-gradient(rgba(75,170,225,.30),rgba(75,170,225,.30)),
    url("ning-wei.png");

  background-size:cover;
  background-position:center 25%;
}

.hero-content{
  color:white;
  text-shadow:0 2px 6px rgba(0,0,0,.65);
}

.hero h1{
  margin:0;
  font-size:29px;
  font-weight:800;
}

.hero p{
  margin:4px 0 0;
  font-size:14px;
  font-weight:600;
}

/* CONTENT */
.container{
  max-width:800px;
  margin:auto;
  padding:14px 12px 30px;
}

.back{
  display:inline-block;
  margin:2px 0 12px;
  color:#16879a;
  text-decoration:none;
  font-size:18px;
  font-weight:800;
}

.search{
  width:100%;
  height:54px;
  border:1px solid #d5d5d5;
  border-radius:30px;
  padding:0 20px;
  font-size:17px;
  outline:none;
  margin-bottom:14px;
}

/* TITLE */
.title{
  color:#187fad;
  font-size:27px;
  font-weight:800;
  margin:8px 4px 12px;
}

/* LIST */
.list{
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.row{
  display:flex;
  align-items:center;

  min-height:76px;
  padding:9px 11px;

  color:#111;
  text-decoration:none;

  border-bottom:1px solid #e5e5e5;
}

.row:last-child{
  border-bottom:none;
}

/* BLACK CIRCLE */
.number{
  width:52px;
  height:52px;
  min-width:52px;

  border-radius:50%;

  background:#000;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:21px;
  font-weight:800;

  margin-right:13px;
}

/* ICON */
.icon{
  width:48px;
  min-width:48px;
  text-align:center;

  font-size:30px;

  margin-right:9px;
}

/* TEXT */
.info{
  flex:1;
}

.name{
  font-size:18px;
  font-weight:800;
}

.desc{
  margin-top:3px;
  color:#777;
  font-size:14px;
}

/* ARROW */
.arrow{
  color:#16879a;
  font-size:28px;
  padding-left:7px;
}

/* MOBILE */
@media(max-width:600px){

  .hero{
    height:120px;
  }

  .hero h1{
    font-size:26px;
  }

  .hero p{
    font-size:13px;
  }

  .row{
    min-height:70px;
  }

  .number{
    width:48px;
    height:48px;
    min-width:48px;
    font-size:20px;
    margin-right:10px;
  }

  .icon{
    width:40px;
    min-width:40px;
    font-size:26px;
  }

  .name{
    font-size:17px;
  }

  .desc{
    font-size:13px;
  }
}
</style>
</head>

<body>

<header class="hero">
  <div class="hero-content">
    <h1>🏆 Old is Gold</h1>
    <p>Classic Music Collection</p>
  </div>
</header>

<div class="container">

  <a class="back" href="index.html">← Back to Home</a>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search Old is Gold..."
  >

  <div class="title">🏆 Old is Gold</div>

  <div class="list">

    <a class="row"
       href="audio.html?path=media/songs/Old-is-Gold/Ugandan-Music">

      <div class="number">1</div>

      <div class="icon">🎵</div>

      <div class="info">
        <div class="name">Ugandan Music</div>
        <div class="desc">Classic Ugandan music</div>
      </div>

      <div class="arrow">›</div>
    </a>


    <a class="row"
       href="audio.html?path=media/songs/Old-is-Gold/Amapiano">

      <div class="number">2</div>

      <div class="icon">🎶</div>

      <div class="info">
        <div class="name">Amapiano</div>
        <div class="desc">Classic Amapiano music</div>
      </div>

      <div class="arrow">›</div>
    </a>


    <a class="row"
       href="audio.html?path=media/songs/Old-is-Gold/South-African-Music">

      <div class="number">3</div>

      <div class="icon">🎧</div>

      <div class="info">
        <div class="name">South African Music</div>
        <div class="desc">Classic South African music</div>
      </div>

      <div class="arrow">›</div>
    </a>

  </div>

</div>

<script>
const search = document.getElementById("search");
const rows = document.querySelectorAll(".row");

search.addEventListener("input", function(){

  const value = this.value.toLowerCase();

  rows.forEach(function(row){

    if(row.innerText.toLowerCase().includes(value)){
      row.style.display = "flex";
    }else{
      row.style.display = "none";
    }

  });

});
</script>

</body>
</html>
