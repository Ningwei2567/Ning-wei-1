<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old is Gold - Ning Wei Media</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f8fc;
  color:#14213d;
}

/* ================= HEADER ================= */

.hero{
  position:relative;
  width:100%;
  height:190px;
  overflow:hidden;
  background:#2878c9;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;

  background-image:url("ning-wei.png");
  background-repeat:no-repeat;
  background-size:cover;

  /* keeps the head around the middle */
  background-position:center 48%;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(25,120,205,.48);
}

.hero-content{
  position:absolute;
  z-index:2;

  right:5%;
  top:50%;
  transform:translateY(-50%);

  width:55%;
  text-align:center;
  color:white;

  text-shadow:0 2px 5px rgba(0,0,0,.55);
}

.hero-title{
  margin:0;
  font-size:40px;
  font-weight:800;
}

.hero-subtitle{
  margin-top:10px;
  font-size:20px;
}

/* ================= MOBILE HEADER ================= */

@media(max-width:700px){

  .hero{
    height:175px;
  }

  .hero::before{
    background-position:center 48%;
  }

  .hero-content{
    right:2%;
    width:57%;
  }

  .hero-title{
    font-size:27px;
  }

  .hero-subtitle{
    font-size:13px;
  }
}

@media(max-width:400px){

  .hero{
    height:160px;
  }

  .hero-content{
    width:58%;
  }

  .hero-title{
    font-size:23px;
  }

  .hero-subtitle{
    font-size:11px;
  }
}

/* ================= SEARCH ================= */

.search{
  width:92%;
  margin:20px auto 16px;
}

.search input{
  width:100%;
  height:55px;

  border:1px solid #d3d9df;
  border-radius:30px;

  padding:0 20px;
  font-size:18px;

  outline:none;
  background:white;

  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

/* ================= LIST ================= */

.container{
  width:94%;
  max-width:1000px;
  margin:auto;
}

.list{
  background:rgba(255,255,255,.8);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

/* SMALL THIN FOLDER ROW */

.folder{
  display:flex;
  align-items:center;

  min-height:70px;
  padding:9px 14px;

  text-decoration:none;
  color:#14213d;

  border-bottom:1px solid #e1e6eb;
}

.folder:last-child{
  border-bottom:none;
}

/* BLACK NUMBER CIRCLE */

.number{
  width:46px;
  height:46px;

  flex:none;

  border-radius:50%;

  background:#000;
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:21px;
  font-weight:800;

  margin-right:13px;
}

/* ICON */

.icon{
  width:45px;
  flex:none;

  text-align:center;
  font-size:27px;

  margin-right:10px;
}

/* TEXT */

.text{
  flex:1;
  min-width:0;
}

.name{
  font-size:18px;
  font-weight:750;
}

.description{
  margin-top:3px;
  font-size:13px;
  color:#78818b;
}

/* ARROW */

.arrow{
  color:#168ba0;
  font-size:29px;
  margin-left:8px;
}

/* ================= FOOTER ================= */

footer{
  text-align:center;
  color:#707b86;
  padding:25px 0;
  font-size:14px;
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="hero">

  <div class="hero-content">

    <h1 class="hero-title">
      🕰️ Old is Gold
    </h1>

    <div class="hero-subtitle">
      Classic Music • Old School • Timeless Hits
    </div>

  </div>

</header>


<!-- SEARCH -->

<div class="search">

  <input
    type="search"
    id="search"
    placeholder="🔎 Search Old is Gold..."
    oninput="searchFolders()"
  >

</div>


<!-- FOLDERS -->

<main class="container">

  <div class="list" id="folderList">


    <!-- 1 -->

    <a
      class="folder"
      href="audio.html?path=media/songs/Old-is-Gold/Ugandan"
    >

      <div class="number">1</div>

      <div class="icon">🇺🇬</div>

      <div class="text">

        <div class="name">
          Ugandan Music
        </div>

        <div class="description">
          Classic Ugandan music
        </div>

      </div>

      <div class="arrow">›</div>

    </a>


    <!-- 2 -->

    <a
      class="folder"
      href="audio.html?path=media/songs/Old-is-Gold/Amapiano"
    >

      <div class="number">2</div>

      <div class="icon">🎵</div>

      <div class="text">

        <div class="name">
          Amapiano
        </div>

        <div class="description">
          Classic and old Amapiano
        </div>

      </div>

      <div class="arrow">›</div>

    </a>


    <!-- 3 -->

    <a
      class="folder"
      href="audio.html?path=media/songs/Old-is-Gold/South-African-Music"
    >

      <div class="number">3</div>

      <div class="icon">🌍</div>

      <div class="text">

        <div class="name">
          South African Music
        </div>

        <div class="description">
          Classic South African music
        </div>

      </div>

      <div class="arrow">›</div>

    </a>


  </div>

</main>


<footer>
  © 2026 Ning Wei Media
</footer>


<script>

function searchFolders(){

  const value =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const folders =
    document.querySelectorAll(".folder");

  folders.forEach(folder => {

    const text =
      folder.innerText.toLowerCase();

    folder.style.display =
      text.includes(value)
      ? "flex"
      : "none";

  });

}

</script>

</body>
</html>
