<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ning Wei Media</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f8fb;color:#111}
.nw-header{height:205px;position:relative;overflow:hidden;background:#87ceeb}
.nw-header img{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;object-position:50% 18%;transform:scale(1.15)}
.overlay{position:absolute;inset:0;background:rgba(55,145,205,.38)}
.head{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.head h1{margin:0;color:white;font-size:30px;text-shadow:0 2px 5px #333}
.head p{margin:5px 0 12px;color:white;font-size:13px}
.search{width:92%;max-width:500px;height:42px;border:0;border-radius:25px;padding:0 17px;font-size:15px;outline:none}
.wrap{width:94%;max-width:700px;margin:14px auto 40px}
.path{font-size:13px;color:#666;margin:8px 2px 10px;word-break:break-all}
.upload{display:block;text-align:center;text-decoration:none;background:#0796b5;color:white;font-weight:bold;padding:11px;border-radius:9px;margin-bottom:10px}
.row{display:flex;align-items:center;background:white;border-radius:9px;min-height:47px;padding:5px 8px;margin:6px 0;box-shadow:0 1px 5px #ddd;text-decoration:none;color:#111}
.num{width:31px;height:31px;border-radius:50%;background:#000;color:white;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:none}
.icon{font-size:20px;width:35px;text-align:center}
.name{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow{font-size:24px;color:#078da9;padding:0 4px}
.empty{text-align:center;padding:25px;color:#777}
</style>
</head>

<body>

<header class="nw-header">
<img src="ning-wei.png" alt="">
<div class="overlay"></div>
<div class="head">
<h1>Ning Wei Media</h1>
<p>Music • Videos • Photos • Apps • Software</p>
<input id="search" class="search" placeholder="Search this folder...">
</div>
</header>

<main class="wrap">

<div id="path" class="path"></div>

<a id="upload" class="upload">📤 Upload Directly Here</a>

<div id="list">Loading...</div>

</main>

<script>
const OWNER="Ningwei2567";
const REPO="Ning-wei-1";
const BRANCH="main";
const API="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/";

const params=new URLSearchParams(location.search);
const currentPath=params.get("path") || "media";

let allItems=[];

function apiPath(path){
    return API+path.split("/").map(encodeURIComponent).join("/");
}

function rawUrl(path){
    return "https://raw.githubusercontent.com/"+OWNER+"/"+REPO+"/"+BRANCH+"/"+path.split("/").map(encodeURIComponent).join("/");
}

function icon(item){
    if(item.type==="dir") return "📁";

    const ext=item.name.split(".").pop().toLowerCase();

    if(["mp3","wav","m4a","aac","ogg","oga","opus","flac"].includes(ext)) return "🎵";
    if(["mp4","webm","mov","m4v"].includes(ext)) return "🎬";
    if(["jpg","jpeg","png","gif","webp","bmp"].includes(ext)) return "📸";
    if(["apk"].includes(ext)) return "📱";
    if(["exe","msi","zip","rar","7z"].includes(ext)) return "💻";

    return "📄";
}

function mediaLink(path){
    return "media.html?path="+encodeURIComponent(path);
}

function uploadLink(path){
    return "github-upload.html?path="+encodeURIComponent(path);
}

function render(items){

    const box=document.getElementById("list");

    if(!items.length){
        box.innerHTML='<div class="empty">No files found in this folder.</div>';
        return;
    }

    items.sort((a,b)=>{
        if(a.type==="dir" && b.type!=="dir") return -1;
        if(a.type!=="dir" && b.type==="dir") return 1;
        return a.name.localeCompare(b.name);
    });

    box.innerHTML=items.map((item,index)=>{

        const path=currentPath+"/"+item.name;

        if(item.type==="dir"){
            return `
            <a class="row"
               href="browser.html?path=${encodeURIComponent(path)}">
                <span class="num">${index+1}</span>
                <span class="icon">📁</span>
                <span class="name">${escapeHtml(item.name)}</span>
                <span class="arrow">›</span>
            </a>`;
        }

        return `
        <a class="row"
           href="${mediaLink(path)}">
            <span class="num">${index+1}</span>
            <span class="icon">${icon(item)}</span>
            <span class="name">${escapeHtml(item.name)}</span>
            <span class="arrow">›</span>
        </a>`;
    }).join("");
}

function escapeHtml(text){
    return text.replace(/[&<>"']/g,m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[m]));
}

async function load(){

    document.getElementById("path").textContent=
        "Folder: "+currentPath;

    document.getElementById("upload").href=
        uploadLink(currentPath);

    try{

        const response=await fetch(apiPath(currentPath),{
            headers:{
                "Accept":"application/vnd.github+json"
            }
        });

        if(!response.ok)
            throw new Error("GitHub folder could not be loaded.");

        allItems=await response.json();

        render(allItems);

    }catch(error){

        document.getElementById("list").innerHTML=
            '<div class="empty">❌ '+escapeHtml(error.message)+'</div>';
    }
}

document.getElementById("search").addEventListener("input",function(){

    const q=this.value.toLowerCase().trim();

    render(
        allItems.filter(x=>
            x.name.toLowerCase().includes(q)
        )
    );
});

load();
</script>

</body>
</html>
