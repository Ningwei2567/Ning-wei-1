<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ning Wei Media Player</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial}
.header{height:145px;position:relative;overflow:hidden}
.header img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;transform:scale(1.15)}
.overlay{position:absolute;inset:0;background:rgba(55,145,205,.38)}
.title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:bold;text-shadow:0 2px 5px #000}
.wrap{width:94%;max-width:800px;margin:20px auto}
.name{font-size:17px;font-weight:bold;margin-bottom:15px;word-break:break-word}
.player{width:100%;max-height:70vh;background:#000;border-radius:10px}
audio{width:100%}
img.media-image{width:100%;max-height:70vh;object-fit:contain;background:#000;border-radius:10px}
button,.download,.back{display:block;width:100%;padding:13px;margin-top:12px;border:0;border-radius:8px;text-align:center;text-decoration:none;font-weight:bold;font-size:15px}
.download{background:#0796b5;color:white}
.back{background:#333;color:white}
.error{background:#401414;color:#ffbaba;padding:14px;border-radius:8px}
.loading{text-align:center;padding:30px}
</style>
</head>

<body>

<header class="header">
<img src="ning-wei.png" alt="">
<div class="overlay"></div>
<div class="title">Ning Wei Media</div>
</header>

<main class="wrap">

<div id="name" class="name"></div>

<div id="player">
<div class="loading">Loading media...</div>
</div>

<a id="download" class="download" style="display:none">
⬇️ Download
</a>

<a id="back" class="back" href="javascript:history.back()">
← Back
</a>

</main>

<script>

const OWNER="Ningwei2567";
const REPO="Ning-wei-1";
const BRANCH="main";

const params=new URLSearchParams(location.search);

let path=params.get("path") || params.get("file");

if(path) path=decodeURIComponent(path);

const nameBox=document.getElementById("name");
const player=document.getElementById("player");
const download=document.getElementById("download");

function apiUrl(path){
    return "https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+
        path.split("/").map(encodeURIComponent).join("/");
}

function escapeHtml(text){
    return text.replace(/[&<>"']/g,m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[m]));
}

async function load(){

    if(!path){
        player.innerHTML='<div class="error">❌ No media file selected.</div>';
        return;
    }

    nameBox.textContent=path.split("/").pop();

    try{

        const response=await fetch(apiUrl(path),{
            headers:{
                "Accept":"application/vnd.github+json"
            }
        });

        if(!response.ok)
            throw new Error("GitHub could not find this file.");

        const file=await response.json();

        const url=file.download_url;

        if(!url)
            throw new Error("GitHub did not provide a download URL.");

        download.href=url;
        download.download=file.name;
        download.style.display="block";

        const ext=file.name.split(".").pop().toLowerCase();

        if(["mp3","wav","m4a","aac","ogg","oga","opus","flac"].includes(ext)){

            player.innerHTML=`
                <audio
                    class="player"
                    controls
                    preload="metadata"
                >
                    <source src="${url}">
                    Your browser cannot play this audio format.
                </audio>
            `;

        }

        else if(["mp4","webm","m4v","mov"].includes(ext)){

            player.innerHTML=`
                <video
                    class="player"
                    controls
                    playsinline
                    preload="metadata"
                >
                    <source src="${url}">
                    Your browser cannot play this video format.
                </video>
            `;

        }

        else if(["jpg","jpeg","png","gif","webp","bmp"].includes(ext)){

            player.innerHTML=`
                <img
                    class="media-image"
                    src="${url}"
                    alt="${escapeHtml(file.name)}"
                >
            `;

        }

        else{

            player.innerHTML=
                '<div class="error">This file type cannot be played in the browser. Use Download.</div>';
        }

    }catch(error){

        player.innerHTML=
            '<div class="error">❌ '+escapeHtml(error.message)+'</div>';
    }
}

load();

</script>

</body>
</html>
