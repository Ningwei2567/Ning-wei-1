<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3faff;
  color:#111;
}

.nw-header{
  position:relative;
  height:318px;
  overflow:hidden;
  background:#8ed8ff;
}

.nw-header-photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 18%;
  transform:scale(1.08);
}

.nw-header-overlay{
  position:absolute;
  inset:0;
  background:rgba(55,165,220,.38);
}

.nw-header-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  text-align:center;
  padding:20px 12px;
}

.nw-title{
  margin:0;
  color:#fff;
  font-size:29px;
  font-weight:900;
  text-shadow:0 2px 6px rgba(0,0,0,.45);
}

.nw-subtitle{
  color:#fff;
  font-size:13px;
  font-weight:bold;
  margin:5px 0 12px;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
}

.search{
  width:min(94%,520px);
  height:43px;
  border:0;
  outline:0;
  border-radius:25px;
  padding:0 18px;
  font-size:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.2);
}

.container{
  width:min(850px,95%);
  margin:15px auto 30px;
}

.back{
  display:block;
  color:#0789bd;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
  margin-bottom:10px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  border:1px solid #d8edf7;
}

.file-icon{
  font-size:48px;
  text-align:center;
}

.file-name{
  text-align:center;
  font-size:20px;
  font-weight:900;
  margin:8px 0 4px;
  word-break:break-word;
}

.artist{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-bottom:15px;
}

.media-box{
  width:100%;
  margin:10px 0;
}

audio{
  display:block;
  width:100%;
}

video{
  display:block;
  width:100%;
  max-height:65vh;
  background:#000;
  border-radius:8px;
}

.preview-image{
  display:block;
  max-width:100%;
  max-height:65vh;
  margin:auto;
  border-radius:8px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
  margin-top:15px;
}

.download,
.share{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  color:#fff;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  text-decoration:none;
}

.download{
  background:#000;
}

.share{
  background:#078fc5;
}

.message{
  text-align:center;
  padding:25px 10px;
  color:#d00000;
  font-weight:bold;
}

.ad{
  margin-top:14px;
  padding:15px;
  background:#eaf7fc;
  border:1px dashed #8ccde5;
  border-radius:8px;
  text-align:center;
  color:#777;
  font-size:12px;
}

@media(max-width:600px){
  .nw-header{height:318px}

  .nw-title{font-size:26px}

  .file-name{font-size:17px}
}
</style>
</head>

<body>

<header class="nw-header">

  <img
    class="nw-header-photo"
    src="ning-wei.png"
    alt=""
  >

  <div class="nw-header-overlay"></div>

  <div class="nw-header-content">

    <h1 class="nw-title">Ning Wei Media</h1>

    <div class="nw-subtitle">
      Music • Videos • Photos • Apps • Software
    </div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search songs, videos, photos, apps..."
    >

  </div>

</header>


<main class="container">

  <a href="javascript:history.back()" class="back">
    ← Back
  </a>

  <div class="card">

    <div id="content">
      Loading media...
    </div>

  </div>

  <div class="ad">
    Advertisement
  </div>

</main>


<script>

/* ==========================================
   READ FILE INFORMATION
========================================== */

const params =
  new URLSearchParams(window.location.search);

let src =
  params.get("url") ||
  params.get("src") ||
  "";

let path =
  params.get("path") ||
  "";

let name =
  params.get("name") ||
  "";

let mime =
  params.get("mime") ||
  params.get("type") ||
  "";


/* ==========================================
   GITHUB FILE
========================================== */

if(!src && path){

  const encoded =
    path
      .split("/")
      .filter(Boolean)
      .map(
        p => encodeURIComponent(p)
      )
      .join("/");

  src =
    "https://raw.githubusercontent.com/" +
    "Ningwei2567/Ning-wei-1/main/" +
    encoded;
}


/* ==========================================
   OLD folder + file FORMAT
========================================== */

if(!src){

  const folder =
    params.get("folder") || "";

  const file =
    params.get("file") || "";

  if(folder && file){

    const full =
      folder + "/" + file;

    const encoded =
      full
        .split("/")
        .filter(Boolean)
        .map(
          p => encodeURIComponent(p)
        )
        .join("/");

    src =
      "https://raw.githubusercontent.com/" +
      "Ningwei2567/Ning-wei-1/main/" +
      encoded;

    if(!name)
      name = file;
  }
}


/* ==========================================
   GET NAME FROM URL
========================================== */

function filenameFromURL(url){

  try{

    const clean =
      url.split("?")[0];

    const parts =
      clean.split("/");

    return decodeURIComponent(
      parts[parts.length - 1]
    ) || "Media file";

  }catch(e){

    return "Media file";

  }
}


if(!name)
  name = filenameFromURL(src);


/* ==========================================
   EXTENSION
========================================== */

function getExtension(filename){

  const clean =
    filename
      .split("?")[0]
      .toLowerCase();

  const parts =
    clean.split(".");

  return parts.length > 1
    ? parts.pop()
    : "";
}

const ext =
  getExtension(name);


/* ==========================================
   MEDIA TYPES
========================================== */

const audioExt = [
  "mp3",
  "wav",
  "m4a",
  "aac",
  "ogg",
  "oga",
  "opus",
  "flac"
];

const videoExt = [
  "mp4",
  "webm",
  "mov",
  "m4v",
  "avi",
  "mkv",
  "3gp"
];

const imageExt = [
  "jpg",
  "jpeg",
  "png",
  "gif",
  "webp",
  "bmp"
];

const isAudio =
  mime.startsWith("audio/") ||
  audioExt.includes(ext);

const isVideo =
  mime.startsWith("video/") ||
  videoExt.includes(ext);

const isImage =
  mime.startsWith("image/") ||
  imageExt.includes(ext);


/* ==========================================
   NO FILE
========================================== */

const content =
  document.getElementById("content");

if(!src){

  content.innerHTML = `
    <div class="message">
      ❌ No media file selected.
      <br><br>
      Go back and select the file again.
    </div>
  `;

}else{

  renderMedia();

}


/* ==========================================
   RENDER
========================================== */

function renderMedia(){

  let icon = "📁";

  if(isAudio)
    icon = "🎵";

  else if(isVideo)
    icon = "🎬";

  else if(isImage)
    icon = "📷";

  else if(ext === "apk")
    icon = "📱";

  else
    icon = "💻";


  let media = "";


  /* AUDIO */

  if(isAudio){

    media = `
      <div class="media-box">

        <audio
          controls
          preload="metadata"
          src="${escapeHTML(src)}">
        </audio>

      </div>
    `;

  }


  /* VIDEO */

  else if(isVideo){

    media = `
      <div class="media-box">

        <video
          controls
          playsinline
          preload="metadata"
          src="${escapeHTML(src)}">
        </video>

      </div>
    `;

  }


  /* IMAGE */

  else if(isImage){

    media = `
      <div class="media-box">

        <img
          class="preview-image"
          src="${escapeHTML(src)}"
          alt="${escapeHTML(name)}">

      </div>
    `;

  }


  /* FILE */

  else{

    media = `
      <div style="
        text-align:center;
        padding:25px 5px;
        color:#555;
      ">
        This file is ready for download.
      </div>
    `;

  }


  /*
  SONG DOWNLOAD NAME
  */

  let downloadText =
    "📥 Download Original";

  if(isAudio && ext === "mp3")
    downloadText = "📥 Download MP3";

  else if(isAudio)
    downloadText =
      "📥 Download " +
      ext.toUpperCase();

  else if(isVideo)
    downloadText =
      "📥 Download " +
      ext.toUpperCase();

  else if(ext === "apk")
    downloadText = "📥 Download APK";


  content.innerHTML = `

    <div class="file-icon">
      ${icon}
    </div>

    <div class="file-name">
      ${escapeHTML(name)}
    </div>

    <div class="artist">
      Ning Wei Media
    </div>

    ${media}

    <div class="buttons">

      <button
        class="download"
        id="downloadButton"
        onclick="downloadOriginal()">
        ${downloadText}
      </button>

      <button
        class="share"
        onclick="shareFile()">
        🔗 Share
      </button>

    </div>

  `;

}


/* ==========================================
   ESCAPE
========================================== */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================================
   DOWNLOAD ORIGINAL
========================================== */

async function downloadOriginal(){

  if(!src)
    return;


  const button =
    document.getElementById(
      "downloadButton"
    );

  const original =
    button.innerHTML;


  button.innerHTML =
    "⏳ Preparing...";


  /*
  Try to fetch the original file.
  No conversion is performed.
  */

  try{

    const response =
      await fetch(src);

    if(!response.ok)
      throw new Error(
        "Unable to download"
      );

    const blob =
      await response.blob();

    const blobURL =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href =
      blobURL;

    link.download =
      name || "download";

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(
      () => URL.revokeObjectURL(blobURL),
      5000
    );

    button.innerHTML =
      "✅ Downloaded";

    setTimeout(
      () => {
        button.innerHTML =
          original;
      },
      2000
    );

  }catch(error){

    console.log(
      "Download fallback:",
      error
    );


    /*
    FALLBACK:
    Open the exact original URL.
    */

    const link =
      document.createElement("a");

    link.href =
      src;

    link.download =
      name || "download";

    link.target =
      "_blank";

    link.rel =
      "noopener";

    document.body.appendChild(link);

    link.click();

    link.remove();

    button.innerHTML =
      original;

  }

}


/* ==========================================
   SHARE
========================================== */

async function shareFile(){

  const shareData = {

    title:
      name || "Ning Wei Media",

    text:
      `Check out ${name || "this file"} on Ning Wei Media`,

    url:
      window.location.href

  };


  try{

    if(navigator.share){

      await navigator.share(
        shareData
      );

      return;
    }

  }catch(error){

    console.log(
      "Share cancelled"
    );

  }


  try{

    await navigator.clipboard.writeText(
      window.location.href
    );

    alert(
      "✅ Link copied!"
    );

  }catch(error){

    alert(
      "Copy this page link to share."
    );

  }

}


/* ==========================================
   SEARCH
========================================== */

document
  .getElementById("search")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        const q =
          this.value.trim();

        if(q){

          window.location.href =
            "library.html?category=all" +
            "&search=" +
            encodeURIComponent(q);

        }

      }

    }
  );

</script>

</body>
</html>
