<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media Player</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f7;
}


.container{
max-width:600px;
margin:auto;
padding-bottom:30px;
}


.header{

height:125px;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;

}


.header img{

position:absolute;
width:100%;
height:125px;
object-fit:cover;

}


.header-content{

position:relative;
z-index:2;
text-shadow:0 2px 5px #000;

}


.card{

background:white;
margin:15px;
padding:15px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;

}


.cover{

width:100%;
height:280px;
object-fit:cover;
border-radius:12px;

}


.artist{

display:flex;
align-items:center;
gap:12px;
margin-top:15px;

}


.artist img{

width:60px;
height:60px;
border-radius:50%;
object-fit:cover;

}


audio,video{

width:100%;
margin-top:15px;

}


button,a{

display:inline-block;
padding:12px 15px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
margin-top:15px;

}


.download{

background:#000;
color:white;

}


.share{

background:#128c9e;
color:white;

}


</style>

</head>


<body>


<div class="container">


<header class="header">

<img src="ning-wei.png">

<div class="header-content">

<h1>Ning Wei Media</h1>

<p>Music • Videos • Photos</p>

</div>

</header>



<div class="card">


<img id="cover" class="cover">



<div class="artist">


<img id="artistPhoto">


<h2 id="artistName">
Loading...
</h2>


</div>



<h1 id="songTitle">
Loading...
</h1>



<audio id="audio" controls></audio>


<video id="video" controls style="display:none"></video>



<a id="download" class="download">

⬇ Download

</a>


<a id="share" class="share">

Share

</a>



</div>


</div>



<script>


const SUPABASE_URL =
"https://btksyizkcpzubtextuce.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



const params =
new URLSearchParams(location.search);


const id =
params.get("id");



async function loadMedia(){


if(!id){

return;

}



let {data,error}=await db

.from("songs")

.select(`

title,
song_url,
cover_url,

artists(
name,
photo
)

`)

.eq("id",id)

.single();



if(error){

console.log(error);
return;

}



document.getElementById("songTitle").innerHTML=data.title;


document.getElementById("artistName").innerHTML=
data.artists.name;


document.getElementById("cover").src=
data.cover_url;


document.getElementById("artistPhoto").src=
data.artists.photo;



let audio=
document.getElementById("audio");


let video=
document.getElementById("video");



if(data.song_url.match(/\.(mp4|webm|mov)$/i)){


video.src=data.song_url;

video.style.display="block";

audio.style.display="none";


}

else{


audio.src=data.song_url;

}



document.getElementById("download").href=
data.song_url;



document.getElementById("share").onclick=function(){

navigator.share({

title:data.title,

url:location.href

});

};


}


loadMedia();


</script>


</body>

</html>
