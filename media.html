<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3faff;
  color:#111;
}

.header{
  position:relative;
  height:318px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#000;
}

.header img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 18%;
}

.header::after{
  display:none !important;
  content:none !important;
}

.header-content{
  position:relative;
  z-index:2;
  color:white;
  text-shadow:0 2px 5px rgba(0,0,0,.55);
}

.header-content h1{
  margin:0;
  font-size:38px;
  font-weight:900;
}

.header-content p{
  margin:8px 0 0;
  font-size:17px;
}

.container{
  width:min(850px,95%);
  margin:15px auto 30px;
}

.back{
  display:block;
  color:#0789bd;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
  margin-bottom:10px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  border:1px solid #d8edf7;
}

.file-icon{
  font-size:48px;
  text-align:center;
}

.file-name{
  text-align:center;
  font-size:20px;
  font-weight:900;
  margin:8px 0 4px;
  word-break:break-word;
}

.artist{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-bottom:15px;
}

.media-box{
  width:100%;
  margin:15px 0;
}

audio{
  display:block;
  width:100%;
}

video{
  display:block;
  width:100%;
  max-height:65vh;
  background:#000;
  border-radius:8px;
}

.preview-image{
  display:block;
  max-width:100%;
  max-height:65vh;
  margin:auto;
  border-radius:8px;
  cursor:zoom-in;
}

.preview-image.zoomed{
  max-width:none;
  width:auto;
  transform:scale(1.6);
  transform-origin:center;
  cursor:zoom-out;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
  margin-top:15px;
}

.download,
.share{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  color:#fff;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  text-decoration:none;
}

.download{
  background:#000;
}

.share{
  background:#078fc5;
}

.message{
  text-align:center;
  padding:25px 10px;
  color:#d00000;
  font-weight:bold;
}

.ad{
  margin-top:14px;
  padding:15px;
  background:#eaf7fc;
  border:1px dashed #8ccde5;
  border-radius:8px;
  text-align:center;
  color:#777;
  font-size:12px;
}

@media(max-width:600px){

  .header{
    height:318px;
  }

  .header-content h1{
    font-size:29px;
  }

  .header-content p{
    font-size:14px;
  }

  .file-name{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header class="header">

  <img
    src="https://ningwei2567.github.io/Ning-wei-1/ning-wei.png"
    alt="Ning Wei"
  >

  <div class="header-content">
    <h1>Ning Wei Media</h1>
    <p>Music • Videos • Photos • Apps • Software</p>
  </div>

</header>

<main class="container">

  <a href="javascript:history.back()" class="back">
    ← Back
  </a>

  <div class="card">

    <div id="content">
      Loading media...
    </div>

  </div>

  <div class="ad">
    Advertisement
  </div>

</main>

<script>

const params=
  new URLSearchParams(
    window.location.search
  );

const SITE=
  "https://ningwei2567.github.io/Ning-wei-1/";

let src=
  params.get("url")||
  "";

let path=
  params.get("path")||
  "";

let name=
  params.get("name")||
  "";

let mime=
  params.get("mime")||
  "";

/* GITHUB PAGES FILE */

if(!src && path){

  src=
    SITE+
    path
      .split("/")
      .filter(Boolean)
      .map(encodeURIComponent)
      .join("/");

}

/* OLD FORMAT */

if(!src){

  const folder=
    params.get("folder")||"";

  const file=
    params.get("file")||"";

  if(folder && file){

    const full=
      folder+"/"+file;

    src=
      SITE+
      full
        .split("/")
        .filter(Boolean)
        .map(encodeURIComponent)
        .join("/");

    if(!name)
      name=file;

  }

}

/* FILE NAME */

function filenameFromURL(url){

  try{

    const clean=
      url.split("?")[0];

    const parts=
      clean.split("/");

    return decodeURIComponent(
      parts[parts.length-1]
    )||"Media file";

  }catch{

    return "Media file";

  }

}

if(!name)
  name=filenameFromURL(src);

/* EXTENSION */

function getExtension(filename){

  const clean=
    filename
      .split("?")[0]
      .toLowerCase();

  const parts=
    clean.split(".");

  return parts.length>1
    ? parts.pop()
    : "";

}

const ext=
  getExtension(name);

/* TYPES */

const audioExt=[
  "mp3",
  "wav",
  "m4a",
  "aac",
  "ogg",
  "oga",
  "flac",
  "opus",
  "wma"
];

const videoExt=[
  "mp4",
  "3gp",
  "webm",
  "mkv",
  "avi",
  "mov",
  "m4v"
];

const imageExt=[
  "jpg",
  "jpeg",
  "png",
  "gif",
  "webp",
  "bmp",
  "svg"
];

const isAudio=
  mime.startsWith("audio/")||
  audioExt.includes(ext);

const isVideo=
  mime.startsWith("video/")||
  videoExt.includes(ext);

const isImage=
  mime.startsWith("image/")||
  imageExt.includes(ext);

const content=
  document.getElementById("content");

if(!src){

  content.innerHTML=`
    <div class="message">
      ❌ No media file selected.
    </div>
  `;

}else{

  renderMedia();

}

/* ESCAPE */

function escapeHTML(value){

  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* RENDER */

function renderMedia(){

  let icon="💻";
  let media="";

  if(isAudio){

    icon="🎵";

    media=`

      <div class="media-box">

        <audio
          id="audioPlayer"
          controls
          preload="auto"
          src="${escapeHTML(src)}">
        </audio>

      </div>

    `;

  }

  else if(isVideo){

    icon="🎬";

    media=`

      <div class="media-box">

        <video
          controls
          playsinline
          preload="metadata"
          src="${escapeHTML(src)}">
        </video>

      </div>

    `;

  }

  else if(isImage){

    icon="📷";

    media=`

      <div class="media-box">

        <img
          id="photo"
          class="preview-image"
          src="${escapeHTML(src)}"
          alt="${escapeHTML(name)}">

      </div>

    `;

  }

  else if(ext==="apk"){

    icon="📱";

  }

  content.innerHTML=`

    <div class="file-icon">
      ${icon}
    </div>

    <div class="file-name">
      ${escapeHTML(name)}
    </div>

    <div class="artist">
      Ning Wei Media
    </div>

    ${media}

    <div class="buttons">

      <button
        class="download"
        onclick="downloadOriginal()">
        📥 Download ${ext.toUpperCase()}
      </button>

      <button
        class="share"
        onclick="shareFile()">
        🔗 Share
      </button>

    </div>

  `;

  /* PHOTO ZOOM */

  const photo=
    document.getElementById("photo");

  if(photo){

    photo.addEventListener(
      "click",
      ()=>{
        photo.classList.toggle("zoomed");
      }
    );

  }

}

/* DOWNLOAD ORIGINAL */

function downloadOriginal(){

  if(!src)
    return;

  const link=
    document.createElement("a");

  link.href=src;
  link.download=name||"download";
  link.target="_blank";
  link.rel="noopener";

  document.body.appendChild(link);
  link.click();
  link.remove();

}

/* SHARE */

async function shareFile(){

  const data={
    title:name||"Ning Wei Media",
    text:
      "Check out "+
      (name||"this file")+
      " on Ning Wei Media",
    url:window.location.href
  };

  if(navigator.share){

    try{

      await navigator.share(data);
      return;

    }catch{}

  }

  try{

    await navigator.clipboard.writeText(
      window.location.href
    );

    alert("✅ Link copied!");

  }catch{

    alert(
      "Copy this page link to share."
    );

  }

}

</script>

</body>
</html>
