<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef8ff;
    color:#111;
}

.nw-header{
    position:relative;
    height:318px;
    width:100%;
    overflow:hidden;
    background:#8fd3f4;
}

.nw-header-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 28%;
    transform:scale(1.08);
}

.nw-header-overlay{
    position:absolute;
    inset:0;
    background:rgba(55,145,205,.38);
}

.nw-header-content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:10px;
    text-align:center;
}

.nw-title{
    margin:0;
    color:white;
    font-size:42px;
    line-height:1.1;
    font-weight:900;
    text-shadow:0 3px 8px rgba(0,0,0,.65);
}

.nw-subtitle{
    margin:20px 10px 0;
    color:white;
    font-size:23px;
    font-weight:800;
    text-shadow:0 2px 6px rgba(0,0,0,.65);
}

.page{
    width:calc(100% - 28px);
    max-width:700px;
    margin:28px auto;
}

.card{
    background:white;
    border-radius:28px;
    padding:26px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.cover{
    width:275px;
    height:275px;
    object-fit:cover;
    display:block;
    margin:10px auto 28px;
    border-radius:28px;
}

h1{
    text-align:center;
    font-size:34px;
    margin:0 0 10px;
    line-height:1.15;
    overflow-wrap:anywhere;
}

.artist{
    text-align:center;
    color:#777;
    font-size:22px;
    margin-bottom:28px;
}

.player{
    width:100%;
    margin:10px 0 25px;
}

audio,
video{
    display:block;
    width:100%;
}

video{
    max-height:500px;
    border-radius:18px;
    background:#000;
}

.image-player{
    width:100%;
    max-height:650px;
    object-fit:contain;
    border-radius:18px;
    background:#111;
}

.download{
    display:block;
    width:100%;
    padding:20px;
    border:0;
    border-radius:18px;
    background:#000;
    color:white;
    text-decoration:none;
    text-align:center;
    font-size:25px;
    font-weight:900;
    margin-top:20px;
}

.share{
    display:block;
    width:100%;
    padding:20px;
    border:0;
    border-radius:18px;
    background:#e7f6ff;
    color:#1684bd;
    text-align:center;
    font-size:25px;
    font-weight:900;
    margin-top:20px;
    cursor:pointer;
}

.ad{
    margin-top:28px;
    min-height:100px;
    border-radius:18px;
    background:#f1f1f1;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
    font-size:16px;
}

.comments{
    margin-top:28px;
    padding:20px;
    border-radius:18px;
    background:#f5f5f5;
}

.comments h2{
    margin-top:0;
}

.comment-box{
    width:100%;
    min-height:90px;
    border:1px solid #ddd;
    border-radius:14px;
    padding:14px;
    font-size:16px;
    resize:vertical;
}

.comment-button{
    margin-top:10px;
    padding:13px 20px;
    border:0;
    border-radius:12px;
    background:#1684bd;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.comment{
    background:white;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    overflow-wrap:anywhere;
}

.error{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:14px;
    background:#ffe7e7;
    color:#b00000;
    font-weight:bold;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#1684bd;
    font-weight:bold;
    text-decoration:none;
}

@media(max-width:600px){

    .nw-header{
        height:318px;
    }

    .nw-title{
        font-size:40px;
    }

    .nw-subtitle{
        font-size:21px;
        margin-top:18px;
    }

    .page{
        width:calc(100% - 20px);
        margin:20px auto;
    }

    .card{
        padding:20px;
        border-radius:25px;
    }

    .cover{
        width:275px;
        height:275px;
    }

    h1{
        font-size:31px;
    }
}
</style>
</head>

<body>

<header class="nw-header">

    <img
        class="nw-header-photo"
        src="ning-wei.png"
        alt="Ning Wei"
    >

    <div class="nw-header-overlay"></div>

    <div class="nw-header-content">
        <h2 class="nw-title">Ning Wei Media</h2>
        <div class="nw-subtitle">
            Music • Videos • Photos • Apps • Software
        </div>
    </div>

</header>


<main class="page">

<section class="card">

    <img
        id="cover"
        class="cover"
        src="ning-wei.png"
        alt="Ning Wei Media"
    >

    <h1 id="title">Loading...</h1>

    <div id="artist" class="artist">
        Ning Wei Media
    </div>

    <div id="player" class="player"></div>

    <div id="error" class="error"></div>

    <a
        id="download"
        class="download"
        href="#"
        download
    >
        ⬇️ Download
    </a>

    <button
        id="share"
        class="share"
        type="button"
    >
        🔗 Share
    </button>

    <div class="ad">
        Advertisement
    </div>

    <div class="comments">

        <h2>💬 Comments</h2>

        <textarea
            id="commentText"
            class="comment-box"
            placeholder="Write a comment..."
        ></textarea>

        <button
            id="commentButton"
            class="comment-button"
            type="button"
        >
            Post Comment
        </button>

        <div id="commentsList"></div>

    </div>

    <a
        id="back"
        class="back"
        href="index.html"
    >
        ← Back
    </a>

</section>

</main>


<script>

const REPO_OWNER = "Ningwei2567";
const REPO_NAME  = "Ning-wei-1";
const BRANCH      = "main";

const PROJECT_ROOT =
    "https://ningwei2567.github.io/Ning-wei-1/";

const RAW_ROOT =
    "https://raw.githubusercontent.com/Ningwei2567/Ning-wei-1/main/";

const params = new URLSearchParams(location.search);

let filePath = params.get("path") || "";
let folder = params.get("folder") || "";
let file = params.get("file") || "";

if(!filePath && file){
    if(folder){
        filePath = "media/songs/" + folder + "/" + file;
    }else{
        filePath = file;
    }
}

function decodePath(value){
    try{
        return decodeURIComponent(value);
    }catch(e){
        return value;
    }
}

filePath = decodePath(filePath);

filePath = filePath
    .replace(/^\/+/,"")
    .replace(/^Ning-wei-1\//,"");

const titleElement = document.getElementById("title");
const artistElement = document.getElementById("artist");
const playerElement = document.getElementById("player");
const downloadElement = document.getElementById("download");
const errorElement = document.getElementById("error");
const backElement = document.getElementById("back");
const coverElement = document.getElementById("cover");

function encodePath(path){

    return path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");
}

function getFileName(path){

    const parts = path.split("/");

    return parts[parts.length - 1] || "Media";
}

function cleanTitle(name){

    return name
        .replace(/\.[^/.]+$/,"")
        .replace(/[_-]+/g," ")
        .replace(/\s+/g," ")
        .trim();
}

function extension(name){

    const match = name.match(/\.([^.]+)$/);

    return match
        ? match[1].toLowerCase()
        : "";
}

function showError(message){

    errorElement.style.display = "block";
    errorElement.textContent = "❌ " + message;
}

if(!filePath){

    titleElement.textContent = "No file selected";
    playerElement.innerHTML = "";
    downloadElement.style.display = "none";

}else{

    const fileName = getFileName(filePath);
    const ext = extension(fileName);

    const encoded = encodePath(filePath);

    const rawUrl = RAW_ROOT + encoded;

    titleElement.textContent = cleanTitle(fileName);

    artistElement.textContent = "Ning Wei Media";

    downloadElement.href = rawUrl;
    downloadElement.setAttribute("download",fileName);

    coverElement.src =
        PROJECT_ROOT + "ning-wei.png";

    const audioTypes = [
        "mp3",
        "m4a",
        "wav",
        "ogg",
        "oga",
        "opus",
        "aac",
        "flac"
    ];

    const videoTypes = [
        "mp4",
        "webm",
        "m4v",
        "mov"
    ];

    const imageTypes = [
        "jpg",
        "jpeg",
        "png",
        "gif",
        "webp",
        "bmp"
    ];


    if(audioTypes.includes(ext)){

        const audio = document.createElement("audio");

        audio.controls = true;
        audio.preload = "metadata";
        audio.src = rawUrl;

        audio.addEventListener("error",function(){

            showError(
                "This audio file could not be loaded. Check that the file exists in the GitHub repository."
            );

        });

        playerElement.appendChild(audio);

    }

    else if(videoTypes.includes(ext)){

        const video = document.createElement("video");

        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;
        video.src = rawUrl;

        video.addEventListener("error",function(){

            showError(
                "This video file could not be played in this browser. You can still try Download."
            );

        });

        playerElement.appendChild(video);

    }

    else if(imageTypes.includes(ext)){

        const image = document.createElement("img");

        image.className = "image-player";
        image.src = rawUrl;
        image.alt = fileName;

        image.addEventListener("error",function(){

            showError(
                "This image could not be loaded."
            );

        });

        playerElement.appendChild(image);

    }

    else{

        playerElement.innerHTML = `
            <div style="
                padding:30px;
                text-align:center;
                background:#f3f3f3;
                border-radius:18px;
                font-weight:bold;
            ">
                📁 This file type cannot be previewed here.
                <br><br>
                Use Download below.
            </div>
        `;

    }


    let parentPath =
        filePath.split("/").slice(0,-1).join("/");

    if(parentPath){

        backElement.href =
            "browser.html?path=" +
            encodeURIComponent(parentPath);

    }else{

        backElement.href = "index.html";

    }

}


/* SHARE */

document.getElementById("share").addEventListener(
    "click",
    async function(){

        try{

            if(navigator.share){

                await navigator.share({

                    title:titleElement.textContent,

                    url:location.href

                });

            }else{

                await navigator.clipboard.writeText(
                    location.href
                );

                alert("Link copied!");

            }

        }catch(e){

            console.log(e);

        }

    }
);


/* LOCAL COMMENTS */

const commentKey =
    "ningwei-comments-" +
    encodeURIComponent(filePath);

const commentText =
    document.getElementById("commentText");

const commentButton =
    document.getElementById("commentButton");

const commentsList =
    document.getElementById("commentsList");

function loadComments(){

    commentsList.innerHTML = "";

    let comments = [];

    try{

        comments =
            JSON.parse(
                localStorage.getItem(commentKey) || "[]"
            );

    }catch(e){

        comments = [];

    }

    comments.forEach(function(comment){

        const div =
            document.createElement("div");

        div.className = "comment";

        div.textContent = comment;

        commentsList.appendChild(div);

    });

}

commentButton.addEventListener(
    "click",
    function(){

        const text =
            commentText.value.trim();

        if(!text){

            return;

        }

        let comments = [];

        try{

            comments =
                JSON.parse(
                    localStorage.getItem(commentKey) || "[]"
                );

        }catch(e){

            comments = [];

        }

        comments.push(text);

        localStorage.setItem(
            commentKey,
            JSON.stringify(comments)
        );

        commentText.value = "";

        loadComments();

    }
);

loadComments();

</script>

</body>
</html>
