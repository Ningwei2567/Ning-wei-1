<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ning Wei Media Player</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3faff;
color:#111;
}

.header{
position:relative;
height:250px;
overflow:hidden;
color:#fff;
}

.header img{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
object-position:50% 18%;
transform:scale(1.08);
}

.overlay{
position:absolute;
inset:0;
background:rgba(55,145,205,.38);
}

.headerText{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
text-shadow:0 2px 7px #000;
}

.headerText h1{
margin:0;
font-size:32px;
}

.headerText p{
margin:7px 0;
font-size:14px;
font-weight:bold;
}

.container{
padding:18px 15px 30px;
}

.card{
background:#fff;
border-radius:16px;
padding:18px;
box-shadow:0 3px 15px #00000012;
text-align:center;
}

.cover{
width:150px;
height:150px;
border-radius:15px;
object-fit:cover;
}

h2{
font-size:21px;
margin:15px 0 5px;
word-break:break-word;
}

.artist{
color:#777;
margin-bottom:15px;
}

audio,video{
width:100%;
margin:10px 0 18px;
}

.download,
.share{
display:block;
padding:14px;
margin-top:10px;
border-radius:11px;
text-decoration:none;
font-weight:bold;
}

.download{
background:#000;
color:#fff;
}

.share{
background:#eaf7ff;
color:#168dcc;
}

.error{
color:#b00020;
font-weight:bold;
}

.ad{
margin-top:18px;
padding:25px 10px;
background:#f1f1f1;
border-radius:10px;
color:#888;
}

.back{
display:block;
margin-top:18px;
color:#168dcc;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<header class="header">

<img src="ning-wei.png">

<div class="overlay"></div>

<div class="headerText">
<h1>Ning Wei Media</h1>
<p>Music • Videos • Photos • Apps • Software</p>
</div>

</header>

<div class="container">

<div id="card" class="card">

<img
id="cover"
class="cover"
src="ning-wei.png"
alt=""
>

<h2 id="title">
Loading...
</h2>

<div id="artist" class="artist"></div>

<div id="player"></div>

<a
id="download"
class="download"
href="#"
download
>
⬇ Download
</a>

<a
id="share"
class="share"
href="#"
>
🔗 Share
</a>

<div class="ad">
Advertisement
</div>

<a
class="back"
href="javascript:history.back()"
>
← Back
</a>

</div>

</div>

<script>

const params=
new URLSearchParams(
location.search
);

const path=
params.get("path");

const directUrl=
params.get("url");

const song=
params.get("song") ||
"Media";

const artist=
params.get("artist") ||
"Ning Wei Media";

const cover=
params.get("cover");


const titleEl=
document.getElementById("title");

const artistEl=
document.getElementById("artist");

const coverEl=
document.getElementById("cover");

const player=
document.getElementById("player");

const download=
document.getElementById("download");

const share=
document.getElementById("share");


titleEl.textContent=
song;

artistEl.textContent=
artist;


if(cover){
coverEl.src=cover;
}


/* ==========================
   GET FILE URL
========================== */

function rawURL(p){

const encoded=
p.split("/")
.map(encodeURIComponent)
.join("/");

return(
"https://raw.githubusercontent.com/" +
"Ningwei2567/Ning-wei-1/main/" +
encoded
);

}


let mediaURL=
directUrl || (
path ? rawURL(path) : null
);


if(!mediaURL){

player.innerHTML=
'<div class="error">Media file is missing.</div>';

download.style.display="none";

}else{

const lower=
mediaURL.toLowerCase();


/* AUDIO */

if(
/\.(mp3|m4a|wav|aac|ogg|oga|opus|flac)(\?|$)/i.test(lower)
){

player.innerHTML=`
<audio
controls
preload="metadata"
src="${mediaURL}"
>
</audio>
`;

}


/* VIDEO */

else if(
/\.(mp4|webm|mov|m4v|avi|mkv)(\?|$)/i.test(lower)
){

player.innerHTML=`
<video
controls
preload="metadata"
src="${mediaURL}"
>
</video>
`;

}


/* IMAGE */

else if(
/\.(jpg|jpeg|png|gif|webp|bmp)(\?|$)/i.test(lower)
){

player.innerHTML=`
<img
src="${mediaURL}"
style="width:100%;border-radius:12px"
>
`;

}

else{

player.innerHTML=
'<div class="error">This file cannot be previewed here. Use Download.</div>';

}


download.href=
mediaURL;

download.download=
song;


/* SHARE */

share.addEventListener(
"click",
async function(e){

e.preventDefault();

const shareData={
title:song,
text:
`Listen to ${song} on Ning Wei Media`,
url:location.href
};


if(
navigator.share
){

try{
await navigator.share(shareData);
}catch(e){}

}else{

try{

await navigator.clipboard.writeText(
location.href
);

share.textContent=
"✓ Link copied";

}catch(e){

prompt(
"Copy this link:",
location.href
);

}

}

});

}

</script>

</body>
</html>
