<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ning Wei Media Player</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f7fa;
color:#111;
}

.header{
height:230px;
position:relative;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
}

.header:before{
content:"";
position:absolute;
inset:0;
background:url("ning-wei.png") center/cover no-repeat;
}

.header:after{
content:"";
position:absolute;
inset:0;
background:rgba(42,157,201,.38);
}

.header h1{
position:relative;
z-index:2;
color:white;
font-size:40px;
text-shadow:0 3px 7px #000;
}

.container{
max-width:900px;
margin:auto;
padding:25px;
}

.back{
display:block;
font-size:23px;
font-weight:bold;
color:#167f91;
text-decoration:none;
margin-bottom:20px;
}

.player{
background:#fff;
border-radius:22px;
padding:20px;
box-shadow:0 4px 15px rgba(0,0,0,.1);
}

audio,video,img{
width:100%;
max-height:500px;
border-radius:15px;
}

h2{
word-break:break-word;
}

.buttons{
display:flex;
gap:12px;
margin-top:20px;
}

button{
flex:1;
padding:15px;
border:0;
border-radius:30px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.download{
background:#168fd1;
color:white;
}

.share{
background:#eee;
}

.ad{
margin-top:25px;
padding:30px;
background:#eee;
border-radius:15px;
text-align:center;
color:#888;
}

</style>
</head>

<body>

<header class="header">
<h1>🎵 Ning Wei Media</h1>
</header>

<main class="container">

<a class="back" href="javascript:history.back()">← Back</a>

<div class="player">

<h2 id="title">Loading...</h2>

<div id="media"></div>

<div class="buttons">

<button class="download" id="download">
⬇ Download
</button>

<button class="share" id="share">
↗ Share
</button>

</div>

<div class="ad">
Advertisement
</div>

</div>

</main>

<script>

const params=new URLSearchParams(location.search);

const path=params.get("path");

if(!path){

document.getElementById("title").textContent=
"No media selected.";

}else{

const raw=
"https://raw.githubusercontent.com/Ningwei2567/Ning-wei-1/main/"
+
path.split("/")
.map(encodeURIComponent)
.join("/");

const name=
decodeURIComponent(path.split("/").pop());

document.getElementById("title").textContent=name;

const ext=name.split(".").pop().toLowerCase();

const media=document.getElementById("media");

if(["mp3","m4a","wav","aac","ogg","opus","flac"].includes(ext)){

media.innerHTML=
`<audio controls preload="metadata" src="${raw}"></audio>`;

}

else if(["mp4","webm","mov","m4v"].includes(ext)){

media.innerHTML=
`<video controls playsinline preload="metadata" src="${raw}"></video>`;

}

else if(["jpg","jpeg","png","gif","webp","bmp"].includes(ext)){

media.innerHTML=
`<img src="${raw}" alt="">`;

}

else{

media.innerHTML=
`<p>This file cannot be previewed here.</p>`;

}

document.getElementById("download").onclick=()=>{

const a=document.createElement("a");

a.href=raw;
a.download=name;
a.target="_blank";
a.click();

};

document.getElementById("share").onclick=async()=>{

try{

await navigator.share({
title:name,
url:location.href
});

}catch(e){

navigator.clipboard.writeText(location.href);

alert("Link copied.");

}

};

}

</script>

</body>
</html>
