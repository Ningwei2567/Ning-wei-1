<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef8ff;
}

.header{
    height:318px;
    position:relative;
    overflow:hidden;
}

.header img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 28%;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(55,145,205,.38);
}

.headerText{
    position:relative;
    z-index:2;
    text-align:center;
    color:white;
    padding-top:10px;
    text-shadow:0 3px 8px #000;
}

.headerText h1{
    margin:0;
    font-size:42px;
}

.headerText p{
    font-size:22px;
    font-weight:bold;
}

.card{
    background:white;
    width:calc(100% - 20px);
    max-width:700px;
    margin:25px auto;
    padding:22px;
    border-radius:28px;
    box-shadow:0 3px 15px #bbb;
}

.cover{
    width:275px;
    height:275px;
    object-fit:cover;
    display:block;
    margin:0 auto 25px;
    border-radius:28px;
}

.title{
    text-align:center;
    font-size:32px;
    font-weight:900;
    overflow-wrap:anywhere;
}

.artist{
    text-align:center;
    color:#777;
    font-size:21px;
    margin:12px 0 25px;
}

audio,video{
    width:100%;
}

video{
    max-height:500px;
    background:#000;
    border-radius:15px;
}

.download,
.share{
    display:block;
    width:100%;
    padding:20px;
    margin-top:20px;
    border-radius:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    text-decoration:none;
}

.download{
    background:#000;
    color:white;
}

.share{
    border:0;
    background:#e7f6ff;
    color:#1684bd;
}

.error{
    display:none;
    margin-top:15px;
    padding:15px;
    background:#ffe5e5;
    color:#b00000;
    border-radius:15px;
    font-weight:bold;
    text-align:center;
}
</style>
</head>

<body>

<header class="header">

<img src="ning-wei.png" alt="Ning Wei">

<div class="overlay"></div>

<div class="headerText">
<h1>Ning Wei Media</h1>
<p>Music • Videos • Photos • Apps • Software</p>
</div>

</header>

<div class="card">

<img
id="cover"
class="cover"
src="ning-wei.png"
alt="Ning Wei"
>

<div id="title" class="title">
Loading...
</div>

<div class="artist">
Ning Wei Media
</div>

<div id="player"></div>

<div id="error" class="error"></div>

<a
id="download"
class="download"
href="#"
download
>
⬇️ Download
</a>

<button
class="share"
onclick="shareFile()"
>
🔗 Share
</button>

</div>

<script>

const params =
new URLSearchParams(location.search);

/*
IMPORTANT:

The browser page should send:

media.html?url=EXACT_GITHUB_URL

This player does NOT guess the folder.
*/

let url = params.get("url");

if(url){

    try{
        url = decodeURIComponent(url);
    }catch(e){}

}

/* Backward compatibility */

if(!url){

    const path = params.get("path");

    if(path){

        url =
        "https://raw.githubusercontent.com/" +
        "Ningwei2567/Ning-wei-1/main/" +
        path
        .split("/")
        .map(encodeURIComponent)
        .join("/");

    }

}

const player =
document.getElementById("player");

const title =
document.getElementById("title");

const download =
document.getElementById("download");

const error =
document.getElementById("error");


function showError(){

    error.style.display="block";

    error.textContent =
    "❌ This media file could not be loaded. " +
    "The file URL or file path is incorrect.";

}


if(!url){

    title.textContent="No file selected";

    showError();

}else{

    let fileName =
    url.split("/").pop();

    try{
        fileName =
        decodeURIComponent(fileName);
    }catch(e){}

    title.textContent =
    fileName
    .replace(/\.[^.]+$/,"")
    .replace(/[_-]+/g," ");

    download.href=url;

    download.download=fileName;


    const ext =
    fileName
    .split(".")
    .pop()
    .toLowerCase();


    const audioTypes=[
        "mp3",
        "m4a",
        "wav",
        "ogg",
        "oga",
        "aac",
        "opus",
        "flac"
    ];


    const videoTypes=[
        "mp4",
        "webm",
        "m4v",
        "mov"
    ];


    const imageTypes=[
        "jpg",
        "jpeg",
        "png",
        "gif",
        "webp"
    ];


    if(audioTypes.includes(ext)){

        const audio =
        document.createElement("audio");

        audio.controls=true;

        audio.preload="metadata";

        audio.src=url;

        audio.addEventListener(
            "error",
            showError
        );

        player.appendChild(audio);

    }

    else if(videoTypes.includes(ext)){

        const video =
        document.createElement("video");

        video.controls=true;

        video.preload="metadata";

        video.src=url;

        video.addEventListener(
            "error",
            showError
        );

        player.appendChild(video);

    }

    else if(imageTypes.includes(ext)){

        const image =
        document.createElement("img");

        image.src=url;

        image.style.width="100%";

        image.style.borderRadius="18px";

        image.addEventListener(
            "error",
            showError
        );

        player.appendChild(image);

    }

    else{

        player.innerHTML=
        "<div style='padding:25px;text-align:center'>" +
        "📁 Preview unavailable.<br><br>" +
        "Use Download." +
        "</div>";

    }

}


async function shareFile(){

    try{

        if(navigator.share){

            await navigator.share({

                title:title.textContent,

                url:location.href

            });

        }else{

            await navigator.clipboard.writeText(
                location.href
            );

            alert("Link copied!");

        }

    }catch(e){}

}

</script>

</body>
</html>
