<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef8ff;
    color:#111;
}

/* ================= HEADER ================= */

.nw-header{
    position:relative;
    width:100%;
    height:318px;
    overflow:hidden;
    background:#8fd3f4;
}

.nw-header-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 28%;
    transform:scale(1.08);
}

.nw-header-overlay{
    position:absolute;
    inset:0;
    background:rgba(55,145,205,.38);
}

.nw-header-content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-top:10px;
}

.nw-title{
    margin:0;
    color:#fff;
    font-size:42px;
    line-height:1.1;
    font-weight:900;
    text-shadow:0 3px 8px rgba(0,0,0,.65);
}

.nw-subtitle{
    margin-top:20px;
    color:#fff;
    font-size:23px;
    font-weight:800;
    text-shadow:0 2px 6px rgba(0,0,0,.65);
}

/* ================= PAGE ================= */

.page{
    width:calc(100% - 20px);
    max-width:700px;
    margin:20px auto;
}

.card{
    background:#fff;
    border-radius:28px;
    padding:22px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

/* ================= COVER ================= */

.cover{
    width:275px;
    height:275px;
    object-fit:cover;
    display:block;
    margin:8px auto 25px;
    border-radius:28px;
}

/* ================= TITLE ================= */

h1{
    text-align:center;
    font-size:32px;
    line-height:1.15;
    margin:0 0 10px;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.artist{
    text-align:center;
    color:#777;
    font-size:21px;
    margin-bottom:25px;
}

/* ================= PLAYER ================= */

.player{
    width:100%;
    margin:10px 0 24px;
}

audio{
    width:100%;
    display:block;
}

video{
    width:100%;
    max-height:500px;
    display:block;
    background:#000;
    border-radius:18px;
}

.image-player{
    width:100%;
    max-height:650px;
    object-fit:contain;
    background:#111;
    border-radius:18px;
}

/* ================= DOWNLOAD ================= */

.download{
    display:block;
    width:100%;
    padding:19px;
    border-radius:18px;
    background:#000;
    color:#fff;
    text-align:center;
    text-decoration:none;
    font-size:24px;
    font-weight:900;
    margin-top:18px;
}

/* ================= SHARE ================= */

.share{
    display:block;
    width:100%;
    padding:19px;
    border:0;
    border-radius:18px;
    background:#e7f6ff;
    color:#1684bd;
    text-align:center;
    font-size:24px;
    font-weight:900;
    margin-top:18px;
    cursor:pointer;
}

/* ================= ERROR ================= */

.error{
    display:none;
    margin:15px 0;
    padding:15px;
    border-radius:14px;
    background:#ffe6e6;
    color:#b00000;
    font-weight:bold;
    text-align:center;
    overflow-wrap:anywhere;
}

/* ================= AD ================= */

.ad{
    margin-top:25px;
    min-height:100px;
    border-radius:18px;
    background:#f1f1f1;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
}

/* ================= COMMENTS ================= */

.comments{
    margin-top:25px;
    padding:20px;
    border-radius:18px;
    background:#f5f5f5;
}

.comments h2{
    margin-top:0;
}

.comment-box{
    width:100%;
    min-height:90px;
    padding:14px;
    border:1px solid #ddd;
    border-radius:14px;
    resize:vertical;
    font-size:16px;
}

.comment-button{
    margin-top:10px;
    padding:13px 20px;
    border:0;
    border-radius:12px;
    background:#1684bd;
    color:#fff;
    font-weight:bold;
}

.comment{
    margin-top:10px;
    padding:12px;
    border-radius:12px;
    background:#fff;
    overflow-wrap:anywhere;
}

.back{
    display:block;
    margin-top:22px;
    text-align:center;
    color:#1684bd;
    text-decoration:none;
    font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .nw-header{
        height:318px;
    }

    .nw-title{
        font-size:40px;
    }

    .nw-subtitle{
        font-size:21px;
        margin-top:18px;
    }

    .page{
        width:calc(100% - 16px);
    }

    .card{
        padding:20px;
    }

    .cover{
        width:275px;
        height:275px;
    }

    h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="nw-header">

    <img
        class="nw-header-photo"
        src="ning-wei.png"
        alt="Ning Wei"
    >

    <div class="nw-header-overlay"></div>

    <div class="nw-header-content">

        <h2 class="nw-title">
            Ning Wei Media
        </h2>

        <div class="nw-subtitle">
            Music • Videos • Photos • Apps • Software
        </div>

    </div>

</header>


<!-- ================= CONTENT ================= -->

<main class="page">

<section class="card">

    <img
        id="cover"
        class="cover"
        src="ning-wei.png"
        alt="Ning Wei Media"
    >

    <h1 id="title">
        Loading...
    </h1>

    <div
        id="artist"
        class="artist"
    >
        Ning Wei Media
    </div>

    <div
        id="player"
        class="player"
    ></div>

    <div
        id="error"
        class="error"
    ></div>

    <a
        id="download"
        class="download"
        href="#"
        download
    >
        ⬇️ Download
    </a>

    <button
        id="share"
        class="share"
        type="button"
    >
        🔗 Share
    </button>

    <div class="ad">
        Advertisement
    </div>

    <div class="comments">

        <h2>💬 Comments</h2>

        <textarea
            id="commentText"
            class="comment-box"
            placeholder="Write a comment..."
        ></textarea>

        <button
            id="commentButton"
            class="comment-button"
            type="button"
        >
            Post Comment
        </button>

        <div id="commentsList"></div>

    </div>

    <a
        id="back"
        class="back"
        href="index.html"
    >
        ← Back
    </a>

</section>

</main>


<script>

/*
====================================================
NING WEI MEDIA PLAYER
IMPORTANT:
Do NOT use URLSearchParams for the file path.
URLSearchParams converts "+" into a space.
This player preserves "+" exactly.
====================================================
*/


const REPO_OWNER = "Ningwei2567";
const REPO_NAME  = "Ning-wei-1";
const BRANCH     = "main";

const PROJECT_ROOT =
    "https://ningwei2567.github.io/Ning-wei-1/";

const RAW_ROOT =
    "https://raw.githubusercontent.com/Ningwei2567/Ning-wei-1/main/";


/* =================================================
   READ QUERY PARAMETER WITHOUT CHANGING +
================================================= */

function getRawParameter(name){

    const query =
        window.location.search.substring(1);

    const parts =
        query.split("&");

    for(let i = 0; i < parts.length; i++){

        const pair =
            parts[i].split("=");

        const key =
            pair.shift();

        if(key === name){

            const value =
                pair.join("=");

            try{

                return decodeURIComponent(value);

            }catch(e){

                return value;
            }
        }
    }

    return "";
}


/* =================================================
   GET PATH
================================================= */

let filePath =
    getRawParameter("path");

let folder =
    getRawParameter("folder");

let file =
    getRawParameter("file");


/* Old format support */

if(!filePath && file){

    if(folder){

        filePath =
            "media/songs/" +
            folder +
            "/" +
            file;

    }else{

        filePath =
            file;
    }
}


/* =================================================
   CLEAN PATH
================================================= */

filePath =
    filePath
        .replace(/^\/+/,"")
        .replace(/^Ning-wei-1\//,"");


/* =================================================
   ELEMENTS
================================================= */

const titleElement =
    document.getElementById("title");

const artistElement =
    document.getElementById("artist");

const playerElement =
    document.getElementById("player");

const downloadElement =
    document.getElementById("download");

const errorElement =
    document.getElementById("error");

const backElement =
    document.getElementById("back");

const coverElement =
    document.getElementById("cover");


/* =================================================
   ENCODE PATH
================================================= */

function encodePath(path){

    return path
        .split("/")
        .map(function(part){

            return encodeURIComponent(part);

        })
        .join("/");
}


/* =================================================
   FILE NAME
================================================= */

function getFileName(path){

    const parts =
        path.split("/");

    return parts[
        parts.length - 1
    ] || "Media";
}


/* =================================================
   EXTENSION
================================================= */

function getExtension(name){

    const match =
        name.match(/\.([^.]+)$/);

    if(!match){

        return "";
    }

    return match[1].toLowerCase();
}


/* =================================================
   DISPLAY TITLE
================================================= */

function cleanTitle(name){

    return name
        .replace(/\.[^/.]+$/,"")
        .replace(/[_-]+/g," ")
        .replace(/\s+/g," ")
        .trim();
}


/* =================================================
   ERROR
================================================= */

function showError(message){

    errorElement.style.display =
        "block";

    errorElement.textContent =
        "❌ " + message;
}


/* =================================================
   LOAD FILE
================================================= */

if(!filePath){

    titleElement.textContent =
        "No file selected";

    downloadElement.style.display =
        "none";

}else{

    const fileName =
        getFileName(filePath);

    const ext =
        getExtension(fileName);

    /*
    IMPORTANT:
    encodePath preserves + as %2B.
    */

    const encodedPath =
        encodePath(filePath);

    const rawUrl =
        RAW_ROOT +
        encodedPath;


    /* TITLE */

    titleElement.textContent =
        cleanTitle(fileName);


    /* ARTIST */

    artistElement.textContent =
        "Ning Wei Media";


    /* COVER */

    coverElement.src =
        PROJECT_ROOT +
        "ning-wei.png";


    /* DOWNLOAD */

    downloadElement.href =
        rawUrl;

    downloadElement.download =
        fileName;


    /* AUDIO */

    const audioTypes = [

        "mp3",
        "m4a",
        "wav",
        "ogg",
        "oga",
        "opus",
        "aac",
        "flac"

    ];


    /* VIDEO */

    const videoTypes = [

        "mp4",
        "webm",
        "m4v",
        "mov"

    ];


    /* IMAGE */

    const imageTypes = [

        "jpg",
        "jpeg",
        "png",
        "gif",
        "webp",
        "bmp"

    ];


    /* =============================================
       AUDIO
    ============================================= */

    if(audioTypes.includes(ext)){

        const audio =
            document.createElement("audio");

        audio.controls = true;

        audio.preload =
            "metadata";

        audio.src =
            rawUrl;

        audio.addEventListener(
            "loadedmetadata",
            function(){

                errorElement.style.display =
                    "none";

            }
        );

        audio.addEventListener(
            "error",
            function(){

                showError(
                    "The audio URL could not be loaded."
                );

                console.log(
                    "Requested media URL:",
                    rawUrl
                );

            }
        );

        playerElement.appendChild(
            audio
        );
    }


    /* =============================================
       VIDEO
    ============================================= */

    else if(videoTypes.includes(ext)){

        const video =
            document.createElement("video");

        video.controls = true;

        video.preload =
            "metadata";

        video.playsInline =
            true;

        video.src =
            rawUrl;

        video.addEventListener(
            "error",
            function(){

                showError(
                    "The video could not be played in this browser. Try Download."
                );

            }
        );

        playerElement.appendChild(
            video
        );
    }


    /* =============================================
       IMAGE
    ============================================= */

    else if(imageTypes.includes(ext)){

        const image =
            document.createElement("img");

        image.className =
            "image-player";

        image.src =
            rawUrl;

        image.alt =
            fileName;

        image.addEventListener(
            "error",
            function(){

                showError(
                    "The image could not be loaded."
                );

            }
        );

        playerElement.appendChild(
            image
        );
    }


    /* =============================================
       OTHER FILE
    ============================================= */

    else{

        playerElement.innerHTML = `

            <div style="
                padding:30px;
                text-align:center;
                background:#f3f3f3;
                border-radius:18px;
                font-weight:bold;
            ">

                📁 This file cannot be previewed here.

                <br><br>

                Use the Download button.

            </div>

        `;
    }


    /* =============================================
       BACK BUTTON
    ============================================= */

    const pieces =
        filePath.split("/");

    pieces.pop();

    const parentPath =
        pieces.join("/");


    if(parentPath){

        backElement.href =
            "browser.html?path=" +
            encodeURIComponent(
                parentPath
            );

    }else{

        backElement.href =
            "index.html";
    }

}


/* =================================================
   SHARE
================================================= */

document
.getElementById("share")
.addEventListener(
    "click",
    async function(){

        try{

            if(navigator.share){

                await navigator.share({

                    title:
                        titleElement.textContent,

                    url:
                        window.location.href

                });

            }else{

                await navigator.clipboard.writeText(
                    window.location.href
                );

                alert(
                    "Link copied!"
                );
            }

        }catch(error){

            console.log(error);

        }

    }
);


/* =================================================
   COMMENTS
================================================= */

const commentKey =
    "ningwei-comments-" +
    encodeURIComponent(filePath);


const commentText =
    document.getElementById(
        "commentText"
    );


const commentButton =
    document.getElementById(
        "commentButton"
    );


const commentsList =
    document.getElementById(
        "commentsList"
    );


function loadComments(){

    commentsList.innerHTML =
        "";

    let comments = [];

    try{

        comments =
            JSON.parse(
                localStorage.getItem(
                    commentKey
                ) || "[]"
            );

    }catch(error){

        comments = [];
    }


    comments.forEach(
        function(comment){

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "comment";

            div.textContent =
                comment;

            commentsList.appendChild(
                div
            );

        }
    );
}


commentButton.addEventListener(
    "click",
    function(){

        const text =
            commentText.value.trim();

        if(!text){

            return;
        }

        let comments = [];

        try{

            comments =
                JSON.parse(
                    localStorage.getItem(
                        commentKey
                    ) || "[]"
                );

        }catch(error){

            comments = [];
        }


        comments.push(text);


        localStorage.setItem(
            commentKey,
            JSON.stringify(
                comments
            )
        );


        commentText.value =
            "";


        loadComments();

    }
);


loadComments();

</script>

</body>
</html>
