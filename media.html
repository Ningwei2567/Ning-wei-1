<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ning Wei Media</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f5;
  color:#111;
}

.nw-header{
  height:205px;
  position:relative;
  overflow:hidden;
}

.nw-header-photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 18%;
  transform:scale(1.12);
}

.nw-header-overlay{
  position:absolute;
  inset:0;
  background:rgba(70,165,215,.38);
}

.nw-header-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:15px;
}

.nw-title{
  color:#fff;
  font-size:29px;
  font-weight:900;
  text-shadow:0 2px 5px rgba(0,0,0,.4);
}

.nw-subtitle{
  color:#fff;
  font-size:14px;
  margin-top:5px;
}

.container{
  max-width:700px;
  margin:14px auto;
  padding:0 12px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.cover{
  width:100%;
  max-height:330px;
  object-fit:contain;
  border-radius:12px;
  display:block;
  background:#eee;
}

.title{
  font-size:20px;
  font-weight:800;
  margin:14px 0 5px;
  word-break:break-word;
}

.artist{
  color:#777;
  margin-bottom:14px;
}

audio,
video{
  width:100%;
  margin:8px 0 15px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

button,
.back{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-size:14px;
  font-weight:800;
  text-decoration:none;
  cursor:pointer;
}

.download{
  background:#000;
  color:#fff;
}

.share{
  background:#8fd0f2;
  color:#111;
}

.back{
  background:#eee;
  color:#111;
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#f1f1f1;
  font-size:13px;
  word-break:break-word;
}

.hidden{
  display:none;
}

.ad{
  margin-top:15px;
  min-height:70px;
  border-radius:10px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  font-size:13px;
}
</style>
</head>

<body>

<header class="nw-header">

  <img
    class="nw-header-photo"
    src="ning-wei.png"
    alt="Ning Wei Media">

  <div class="nw-header-overlay"></div>

  <div class="nw-header-content">

    <div class="nw-title">
      Ning Wei Media
    </div>

    <div class="nw-subtitle">
      Music • Videos • Photos • Apps • Software
    </div>

  </div>

</header>

<div class="container">

  <div class="card">

    <img
      id="cover"
      class="cover"
      src="ning-wei.png"
      alt="Cover">

    <div id="title" class="title">
      Loading...
    </div>

    <div class="artist">
      Ning Wei Media
    </div>

    <div id="player"></div>

    <div class="buttons">

      <button
        id="download"
        class="download"
        type="button">
        ⬇ Download
      </button>

      <button
        id="share"
        class="share"
        type="button">
        ↗ Share
      </button>

      <a
        class="back"
        href="javascript:history.back()">
        ← Back
      </a>

    </div>

    <div
      id="status"
      class="status">
      Finding media file...
    </div>

    <div class="ad">
      Advertisement
    </div>

  </div>

</div>

<script>

const OWNER = "Ningwei2567";
const REPO = "Ning-wei-1";
const BRANCH = "main";

const API =
  "https://api.github.com/repos/" +
  OWNER +
  "/" +
  REPO +
  "/contents/";

const params =
  new URLSearchParams(window.location.search);

let filePath =
  params.get("path");

const title =
  document.getElementById("title");

const player =
  document.getElementById("player");

const status =
  document.getElementById("status");

const downloadButton =
  document.getElementById("download");

const shareButton =
  document.getElementById("share");

if(!filePath){

  title.textContent =
    "No media file selected.";

  status.textContent =
    "❌ No GitHub file path was supplied.";

  downloadButton.disabled = true;

}else{

  try{
    filePath =
      decodeURIComponent(filePath);
  }catch(e){}

  filePath =
    filePath.replace(/^\/+/,"");

  filePath =
    filePath.replace(/^Ning-wei-1\//,"");

  loadActualFile();

}


/*
==================================================
CREATE GITHUB API URL
==================================================
*/

function githubAPIPath(path){

  return API +
    path
      .split("/")
      .filter(Boolean)
      .map(function(part){
        return encodeURIComponent(part);
      })
      .join("/") +
    "?ref=" +
    encodeURIComponent(BRANCH);

}


/*
==================================================
FIND THE ACTUAL FILE ON GITHUB
==================================================
*/

async function loadActualFile(){

  status.classList.remove("hidden");

  status.textContent =
    "Finding the actual file on GitHub...";

  try{

    const response =
      await fetch(
        githubAPIPath(filePath),
        {
          headers:{
            "Accept":
              "application/vnd.github+json"
          }
        }
      );

    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        "GitHub returned HTTP " +
        response.status
      );

    }

    const file =
      await response.json();

    /*
      Make sure GitHub returned a FILE.
    */

    if(file.type !== "file"){

      throw new Error(
        "The supplied path is not a file."
      );

    }

    /*
      THIS IS THE IMPORTANT PART.

      GitHub gives us the actual download URL.
    */

    const actualURL =
      file.download_url;

    if(!actualURL){

      throw new Error(
        "GitHub did not provide a download URL."
      );

    }

    const filename =
      file.name ||
      filePath.split("/").pop();

    title.textContent =
      filename;

    document.title =
      filename + " - Ning Wei Media";

    status.textContent =
      "✓ File found: " + filePath;

    createPlayer(
      actualURL,
      filename
    );

    setupDownload(
      actualURL,
      filename
    );

    setupShare();

  }catch(error){

    console.error(error);

    player.innerHTML = "";

    title.textContent =
      filePath.split("/").pop();

    status.textContent =
      "❌ The audio URL could not be loaded.\n\n" +
      "GitHub could not find this exact file:\n" +
      filePath;

    downloadButton.disabled = true;

  }

}


/*
==================================================
CREATE PLAYER
==================================================
*/

function createPlayer(url,filename){

  player.innerHTML = "";

  const extension =
    filename
      .split(".")
      .pop()
      .toLowerCase();

  const audioExtensions = [
    "mp3",
    "m4a",
    "wav",
    "ogg",
    "oga",
    "aac",
    "opus",
    "flac"
  ];

  const videoExtensions = [
    "mp4",
    "webm",
    "m4v",
    "mov"
  ];

  const imageExtensions = [
    "jpg",
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp"
  ];


  /*
  AUDIO
  */

  if(audioExtensions.includes(extension)){

    const audio =
      document.createElement("audio");

    audio.controls = true;
    audio.preload = "metadata";

    /*
      Use GitHub's actual URL.
    */

    audio.src = url;

    audio.addEventListener(
      "loadedmetadata",
      function(){

        status.textContent =
          "✓ Audio ready.";

      }
    );

    audio.addEventListener(
      "error",
      function(){

        status.textContent =
          "❌ GitHub found the file, " +
          "but this browser could not play this audio format.";

      }
    );

    player.appendChild(audio);

    return;
  }


  /*
  VIDEO
  */

  if(videoExtensions.includes(extension)){

    const video =
      document.createElement("video");

    video.controls = true;
    video.preload = "metadata";
    video.playsInline = true;

    video.src = url;

    video.addEventListener(
      "loadedmetadata",
      function(){

        status.textContent =
          "✓ Video ready.";

      }
    );

    video.addEventListener(
      "error",
      function(){

        status.textContent =
          "❌ GitHub found the video, " +
          "but this browser could not play this format.";

      }
    );

    player.appendChild(video);

    return;
  }


  /*
  IMAGE
  */

  if(imageExtensions.includes(extension)){

    const image =
      document.createElement("img");

    image.src = url;

    image.style.width = "100%";
    image.style.maxHeight = "500px";
    image.style.objectFit = "contain";
    image.style.borderRadius = "12px";

    document.getElementById("cover").src =
      url;

    player.appendChild(image);

    status.textContent =
      "✓ Image loaded.";

    return;
  }


  /*
  UNKNOWN FILE
  */

  status.textContent =
    "✓ File found. Use Download to save it.";

}


/*
==================================================
DOWNLOAD
==================================================
*/

function setupDownload(url,filename){

  downloadButton.disabled = false;

  downloadButton.onclick =
    function(){

      /*
        Direct GitHub download.

        This avoids fetch/blob problems
        and lets the browser download
        the actual repository file.
      */

      const link =
        document.createElement("a");

      link.href = url;

      link.download = filename;

      link.target = "_blank";

      document.body.appendChild(link);

      link.click();

      link.remove();

    };

}


/*
==================================================
SHARE
==================================================
*/

function setupShare(){

  shareButton.onclick =
    async function(){

      try{

        if(navigator.share){

          await navigator.share({

            title:
              title.textContent +
              " - Ning Wei Media",

            text:
              "Listen or download this media.",

            url:
              window.location.href

          });

        }else{

          await navigator.clipboard.writeText(
            window.location.href
          );

          status.textContent =
            "✓ Media link copied.";

        }

      }catch(error){}

    };

}

</script>

</body>
</html>
