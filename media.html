<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    color:#172033;
    min-height:100vh;

    background:
    radial-gradient(circle at 5% 10%,rgba(0,145,255,.18),transparent 28%),
    radial-gradient(circle at 95% 20%,rgba(140,70,255,.15),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(0,190,160,.14),transparent 35%),
    linear-gradient(135deg,#f8fbff,#f4f1ff,#f2fffb);
}

header{
    background:linear-gradient(135deg,#087ee8,#1756d5);
    color:white;
    text-align:center;
    padding:23px 15px;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
    font-size:14px;
    opacity:.92;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.search{
    width:100%;
    padding:14px 18px;
    border:0;
    outline:0;
    border-radius:30px;
    font-size:16px;
    background:white;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:12px;
}

.list{
    background:rgba(255,255,255,.55);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.item{
    display:flex;
    align-items:center;
    min-height:64px;
    padding:10px 12px;
    color:#172033;
    text-decoration:none;
    border-bottom:1px solid rgba(0,0,0,.07);
    transition:.2s;
}

.item:last-child{
    border-bottom:0;
}

.item:hover{
    background:rgba(255,255,255,.85);
}

.icon{
    width:46px;
    text-align:center;
    font-size:27px;
}

.info{
    flex:1;
    min-width:0;
}

.name{
    font-size:16px;
    font-weight:bold;
    word-break:break-word;
}

.type{
    margin-top:3px;
    color:#718096;
    font-size:12px;
}

.arrow{
    color:#168de2;
    font-size:25px;
    padding-left:8px;
}

.message{
    text-align:center;
    padding:30px 10px;
    color:#777;
}

.back{
    display:block;
    text-align:center;
    margin:22px;
    color:#087ee8;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<header>

    <h1 id="title">📁 Ning Wei Media</h1>

    <p>
        Browse and search this folder
    </p>

</header>


<div class="container">

    <input
        id="search"
        class="search"
        type="search"
        placeholder="🔎 Search this folder..."
        autocomplete="off"
    >


    <div id="list" class="list">

        <div class="message">
            Loading...
        </div>

    </div>


    <a
        class="back"
        href="index.html"
    >
        ← Back to Home
    </a>

</div>


<script>

const USER = "Ningwei2567";

const REPO = "Ning-wei-1";

const BRANCH = "main";


const params =
new URLSearchParams(window.location.search);


const folder =
params.get("path") || "media";


const API =
`https://api.github.com/repos/${USER}/${REPO}/contents/${folder}?ref=${BRANCH}`;


const list =
document.getElementById("list");


const search =
document.getElementById("search");


const title =
document.getElementById("title");


let allItems = [];



/* MAKE FILE/FOLDER NAME BEAUTIFUL */

function niceName(name){

    return name
        .replace(/\.[^/.]+$/,"")
        .replace(/[-_]/g," ")
        .replace(/\b\w/g,c=>c.toUpperCase());

}



/* CHOOSE ICON */

function getIcon(item){

    if(item.type === "dir"){

        const n =
        item.name.toLowerCase();

        if(n.includes("dj"))
            return "🎧";

        if(n.includes("mapping"))
            return "🗺️";

        if(n.includes("effect"))
            return "🔊";

        if(n.includes("skin"))
            return "🎨";

        if(n.includes("uganda"))
            return "🇺🇬";

        if(n.includes("africa"))
            return "🌍";

        if(n.includes("international"))
            return "🌎";

        return "📁";
    }


    const n =
    item.name.toLowerCase();


    if(/\.(mp3|wav|m4a|ogg|flac|aac)$/i.test(n))
        return "🎵";


    if(/\.(mp4|mkv|mov|avi|webm)$/i.test(n))
        return "🎬";


    if(/\.(jpg|jpeg|png|gif|webp)$/i.test(n))
        return "📸";


    if(/\.apk$/i.test(n))
        return "📱";


    if(/\.(zip|rar|7z)$/i.test(n))
        return "📦";


    return "📄";
}



/* CHECK AUDIO */

function isAudio(name){

    return /\.(mp3|wav|m4a|ogg|flac|aac)$/i.test(name);

}



/* DISPLAY ITEMS */

function displayItems(data){

    list.innerHTML = "";


    if(data.length === 0){

        list.innerHTML =
        `<div class="message">
            Nothing found in this folder.
        </div>`;

        return;
    }


    data.forEach(item => {

        const link =
        document.createElement("a");


        link.className =
        "item";


        /*
         * FOLDER
         */

        if(item.type === "dir"){

            link.href =
            `media.html?path=${encodeURIComponent(item.path)}`;

        }


        /*
         * AUDIO FILE
         *
         * IMPORTANT:
         * Audio no longer downloads directly.
         * It opens song.html.
         */

        else if(isAudio(item.name)){

            link.href =
            `song.html?folder=${encodeURIComponent(folder)}&file=${encodeURIComponent(item.name)}&title=${encodeURIComponent(niceName(item.name))}`;

        }


        /*
         * OTHER FILES
         */

        else{

            link.href =
            item.download_url;

            link.target =
            "_blank";

        }


        link.innerHTML = `

            <div class="icon">
                ${getIcon(item)}
            </div>

            <div class="info">

                <div class="name">
                    ${niceName(item.name)}
                </div>

                <div class="type">
                    ${item.type === "dir"
                        ? "Folder"
                        : isAudio(item.name)
                            ? "Song • Open player"
                            : "File"}
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        `;


        list.appendChild(link);

    });

}



/* LOAD FOLDER */

async function loadFolder(){

    try{

        const response =
        await fetch(API);


        if(!response.ok){

            throw new Error(
                "Folder could not be loaded"
            );

        }


        allItems =
        await response.json();


        if(!Array.isArray(allItems)){

            throw new Error(
                "Invalid folder"
            );

        }


        const current =
        folder.split("/").pop();


        title.textContent =
        "📁 " + niceName(current);


        displayItems(allItems);


    }catch(error){

        list.innerHTML =
        `<div class="message">
            Unable to load this folder.
        </div>`;

    }

}



/* SEARCH */

search.addEventListener(
    "input",
    function(){

        const query =
        search.value
        .toLowerCase()
        .trim();


        const filtered =
        allItems.filter(item =>
            item.name
            .toLowerCase()
            .includes(query)
        );


        displayItems(filtered);

    }
);


loadFolder();

</script>

</body>
</html>
