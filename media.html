<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:#172033;
    min-height:100vh;
    background:
    radial-gradient(circle at 5% 10%,rgba(0,145,255,.18),transparent 28%),
    radial-gradient(circle at 95% 20%,rgba(130,70,255,.15),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(0,190,150,.13),transparent 32%),
    linear-gradient(135deg,#f8fbff,#f4f1ff,#f2fffb);
}

header{
    background:linear-gradient(135deg,#087ee8,#1756d5);
    color:white;
    text-align:center;
    padding:22px 15px;
}

header h1{
    margin:0;
    font-size:27px;
}

header p{
    margin:6px 0 0;
    font-size:13px;
    opacity:.9;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.search{
    width:100%;
    padding:14px 18px;
    border:0;
    outline:0;
    border-radius:30px;
    font-size:16px;
    background:white;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:10px;
}

.list{
    background:rgba(255,255,255,.5);
    border-radius:15px;
    overflow:hidden;
}

.item{
    display:flex;
    align-items:center;
    min-height:60px;
    padding:10px 12px;
    color:#172033;
    text-decoration:none;
    border-bottom:1px solid rgba(0,0,0,.07);
}

.item:last-child{
    border-bottom:0;
}

.item:hover{
    background:rgba(255,255,255,.8);
}

.icon{
    width:42px;
    text-align:center;
    font-size:24px;
}

.info{
    flex:1;
}

.name{
    font-size:16px;
    font-weight:bold;
}

.type{
    margin-top:3px;
    color:#718096;
    font-size:12px;
}

.arrow{
    color:#168de2;
    font-size:24px;
}

.message{
    text-align:center;
    padding:30px 10px;
    color:#777;
}

.back{
    display:block;
    text-align:center;
    margin:20px;
    color:#087ee8;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1 id="title">📁 Ning Wei Media</h1>
    <p>Browse and search this folder</p>
</header>

<div class="container">

<input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 Search this folder..."
>

<div id="list" class="list">
    <div class="message">Loading...</div>
</div>

<a class="back" href="index.html">
    ← Back to Home
</a>

</div>

<script>

const USER = "Ningwei2567";
const REPO = "Ning-wei-1";
const BRANCH = "main";

const params =
new URLSearchParams(location.search);

const path =
params.get("path") || "media";

const API =
`https://api.github.com/repos/${USER}/${REPO}/contents/${path}?ref=${BRANCH}`;

const list =
document.getElementById("list");

const search =
document.getElementById("search");

const title =
document.getElementById("title");

let items = [];


function niceName(name){

    return name
    .replace(/\.[^/.]+$/,"")
    .replace(/[-_]/g," ")
    .replace(/\b\w/g,c=>c.toUpperCase());

}


function icon(item){

    if(item.type === "dir"){

        const n=item.name.toLowerCase();

        if(n.includes("dj")) return "🎧";
        if(n.includes("mapping")) return "🗺️";
        if(n.includes("effect")) return "🔊";
        if(n.includes("skin")) return "🎨";
        if(n.includes("uganda")) return "🇺🇬";
        if(n.includes("afric")) return "🌍";
        if(n.includes("international")) return "🌎";
        if(n.includes("song")) return "🎵";

        return "📁";
    }

    const n=item.name.toLowerCase();

    if(/\.(mp3|wav|m4a|ogg|flac)$/i.test(n))
        return "🎵";

    if(/\.(mp4|mkv|mov|avi|webm)$/i.test(n))
        return "🎬";

    if(/\.(jpg|jpeg|png|gif|webp)$/i.test(n))
        return "📸";

    if(/\.apk$/i.test(n))
        return "📱";

    if(/\.(zip|rar|7z)$/i.test(n))
        return "📦";

    return "📄";
}


function show(data){

    list.innerHTML="";

    if(data.length===0){

        list.innerHTML=
        `<div class="message">
        Nothing found in this folder.
        </div>`;

        return;
    }


    data.forEach(item=>{

        const a=document.createElement("a");

        a.className="item";

        if(item.type==="dir"){

            a.href=
            `media.html?path=${encodeURIComponent(item.path)}`;

        }else{

            /*
             * Files are opened/downloaded directly.
             */
            a.href=item.download_url;
            a.target="_blank";
        }


        a.innerHTML=`

        <div class="icon">
            ${icon(item)}
        </div>

        <div class="info">

            <div class="name">
                ${niceName(item.name)}
            </div>

            <div class="type">
                ${item.type==="dir" ? "Folder" : "File"}
            </div>

        </div>

        <div class="arrow">›</div>

        `;

        list.appendChild(a);

    });

}


async function load(){

    try{

        const response=
        await fetch(API);

        if(!response.ok)
            throw new Error();

        items=
        await response.json();

        if(!Array.isArray(items))
            throw new Error();


        const current=
        path.split("/").pop();

        title.textContent=
        "📁 "+niceName(current);


        show(items);

    }catch(e){

        list.innerHTML=
        `<div class="message">
        Unable to load this folder.
        </div>`;

    }

}


search.addEventListener("input",()=>{

    const q=
    search.value.toLowerCase().trim();

    const filtered=
    items.filter(item=>
        item.name.toLowerCase().includes(q)
    );

    show(filtered);

});


load();

</script>

</body>
</html>
