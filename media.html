<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ning Wei Media Player</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4fbff;
 color:#111;
}

.header{
 height:318px;
 position:relative;
 overflow:hidden;
 background:#8ed8f5;
}

.header img{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center 20%;
}

.overlay{
 position:absolute;
 inset:0;
 background:rgba(55,145,205,.38);
}

.headerText{
 position:absolute;
 bottom:24px;
 width:100%;
 text-align:center;
 color:#fff;
 text-shadow:0 2px 6px #000;
}

.headerText h1{
 margin:0;
 font-size:30px;
}

.headerText p{
 margin:6px 0 0;
 font-size:14px;
}

.container{
 width:min(700px,94%);
 margin:15px auto 40px;
}

.player{
 background:#fff;
 border-radius:15px;
 padding:18px;
 box-shadow:0 2px 12px #0001;
 text-align:center;
}

.cover{
 width:170px;
 height:170px;
 border-radius:50%;
 object-fit:cover;
 margin:auto;
 display:block;
 box-shadow:0 3px 12px #0003;
}

.artist{
 margin-top:15px;
 font-size:14px;
 color:#087db5;
 font-weight:bold;
}

.song{
 margin-top:5px;
 font-size:21px;
 font-weight:800;
 word-break:break-word;
}

audio{
 width:100%;
 margin-top:18px;
}

.buttons{
 display:flex;
 gap:8px;
 margin-top:15px;
}

.buttons a,
.buttons button{
 flex:1;
 border:0;
 border-radius:9px;
 padding:12px 8px;
 font-weight:bold;
 font-size:14px;
 text-decoration:none;
 text-align:center;
 cursor:pointer;
}

.download{
 background:#087db5;
 color:#fff;
}

.share{
 background:#e9f7ff;
 color:#087db5;
}

.ad{
 margin-top:15px;
 min-height:90px;
 border-radius:10px;
 background:#f1f1f1;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#888;
 font-size:13px;
}

.message{
 margin-top:15px;
 padding:12px;
 border-radius:9px;
 background:#ffe9e9;
 color:#b00020;
 display:none;
}

@media(max-width:500px){
 .header{
   height:318px;
 }

 .cover{
   width:145px;
   height:145px;
 }
}
</style>
</head>

<body>

<header class="header">

<img src="ning-wei.png" alt="Ning Wei Media">

<div class="overlay"></div>

<div class="headerText">

<h1>Ning Wei Media</h1>

<p>Music • Videos • Photos • Apps • Software</p>

</div>

</header>


<div class="container">

<div class="player">

<img
 id="cover"
 class="cover"
 src="ning-wei.png"
 alt="Artist"
>

<div
 id="artist"
 class="artist">
Ning Wei Media
</div>

<div
 id="song"
 class="song">
Loading...
</div>


<audio
 id="audio"
 controls
 preload="metadata">
</audio>


<div class="buttons">

<a
 id="download"
 class="download"
 download>
📥 Download
</a>

<button
 id="share"
 class="share">
📤 Share
</button>

</div>


<div class="ad">
ADVERTISEMENT
</div>


<div
 id="message"
 class="message">
</div>

</div>

</div>


<script>

/* =====================================================
   NING WEI MEDIA SUPABASE PLAYER
===================================================== */

const SUPABASE_URL =
"https://btksyizkcpzubtextuce.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";

const audio =
document.getElementById("audio");

const song =
document.getElementById("song");

const artist =
document.getElementById("artist");

const cover =
document.getElementById("cover");

const download =
document.getElementById("download");

const share =
document.getElementById("share");

const message =
document.getElementById("message");


function showError(text){

 message.style.display="block";

 message.innerHTML=text;

}


function getParameter(name){

 return new URLSearchParams(
   window.location.search
 ).get(name);

}


/* =====================================================
   NEW SUPABASE SONG FORMAT
===================================================== */

const songUrl =
getParameter("url");

const songName =
getParameter("song");

const artistName =
getParameter("artist");

const coverUrl =
getParameter("cover");


if(songUrl){

 audio.src =
 decodeURIComponent(songUrl);

 song.textContent =
 songName
 ? decodeURIComponent(songName)
 : "Music";

 artist.textContent =
 artistName
 ? decodeURIComponent(artistName)
 : "Ning Wei Media";


 if(coverUrl){

   cover.src =
   decodeURIComponent(coverUrl);

 }


 download.href =
 decodeURIComponent(songUrl);

 download.download =
 songName
 ? decodeURIComponent(songName)
 : "Ning-Wei-Media-Music";


}else{

 showError(
   "❌ No music was selected."
 );

 song.textContent =
 "No song selected";

}


/* =====================================================
   SHARE
===================================================== */

share.addEventListener(
"click",
async function(){

 const url =
 window.location.href;


 if(navigator.share){

   try{

     await navigator.share({

       title:
       song.textContent,

       text:
       "Listen on Ning Wei Media",

       url:url

     });

   }catch(e){}

 }else{

   try{

     await navigator.clipboard.writeText(url);

     share.textContent =
     "✅ Link Copied";

     setTimeout(
       ()=>{
         share.textContent =
         "📤 Share";
       },
       2000
     );

   }catch(e){

     alert(url);

   }

 }

});


audio.addEventListener(
"error",
function(){

 showError(
   "❌ This audio file could not be played by the browser. You can try Download instead."
 );

});

</script>

</body>
</html>
