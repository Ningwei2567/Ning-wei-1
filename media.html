/* =====================================================
   ELEMENTS

const statusBox =

const errorBox =

const songMeta =

const cover =

const songTitle =
document.getElementById("songTitle");

const artist =

const mediaTitle =
document.getElementById("mediaTitle");

const audioBox =

===================================================== */

document.getElementById(

document.getElementById(

const downloadPopupFile =
document.getElementById(
"downloadPopupFile"
);

/* =====================================================
   DOWNLOAD POPUP
===================================================== */

function showDownloadPopup(
filename,
finished=false
){

clearTimeout(
downloadPopupTimer
);

downloadPopupFile.textContent =
filename ||
"Ning Wei Media";


if(finished){

downloadPopupTitle.textContent =
"Download finished!";

}
else{

downloadPopupTitle.textContent =
"Download started!";

}


downloadPopup.classList.add(
"show"
);


downloadPopupTimer =
setTimeout(
function(){

downloadPopup.classList.remove(
"show"
);

},
2200
);

}


/* =====================================================
   DOWNLOAD CLICK
===================================================== */

download.addEventListener(
"click",
function(){

const filename =
download.getAttribute(
"download"
) ||
download.textContent.trim() ||
"Ning Wei Media";


/*
   Show immediately when
   the download is requested.
*/

showDownloadPopup(
filename,
false
);


/*
   Give the browser time to
   start the download, then
   change the message.
*/

setTimeout(
function(){

showDownloadPopup(
filename,
true
);

},
1200
);

});


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id");

const path =
params.get("path");

const directUrl =
params.get("url");

const suppliedName =
params.get("name");

const suppliedMime =
params.get("mime");

const oldFolder =
params.get("folder");

const oldFile =
params.get("file");


/* =====================================================
   HELPERS
===================================================== */

function hideAllMedia(){

audioBox.style.display =
"none";

videoBox.style.display =
"none";

imageBox.style.display =
"none";

videoFormatNote.style.display =
"none";

audio.pause();

video.pause();

audio.removeAttribute(
"src"
);

video.removeAttribute(
"src"
);

videoSource.removeAttribute(
"src"
);

videoSource.removeAttribute(
"type"
);

video.load();

}


function showError(message){

statusBox.style.display =
"none";

errorBox.textContent =
message;

errorBox.style.display =
"block";

}


function cleanName(filename){

if(!filename){

return "Ning Wei Media";

}

let name =
filename
.split("/")
.pop();

name =
name.replace(
/\.[^/.]+$/,
""
);

name =
name
.replace(
/[_-]+/g,
" "
)
.trim();

return name ||
"Ning Wei Media";

}


function extensionOf(filename){

if(!filename){

return "";
}

const clean =
filename
.split("?")[0]
.split("#")[0];

const parts =
clean.split(".");

if(parts.length < 2){

return "";

}

return parts
.pop()
.toLowerCase();

}


/* =====================================================
   MEDIA TYPE
===================================================== */

function mediaType(
filename,
mime
){

const m =
(mime || "")
.toLowerCase()
.split(";")[0]
.trim();


if(
m.startsWith("image/")
){

return "image";

}

if(
m.startsWith("video/")
){

return "video";

}

if(
m.startsWith("audio/")
){

return "audio";

}


const ext =
extensionOf(filename);


const imageExtensions = [

"jpg",
"jpeg",
"png",
"gif",
"webp",
"avif",
"bmp",
"svg"

];


const videoExtensions = [

"mp4",
"webm",
"mov",
"m4v",
"3gp",
"3g2",
"mpg",
"mpeg",
"mpe",
"ogv",
"avi",
"mkv"

];


const audioExtensions = [

"mp3",
"wav",
"m4a",
"aac",
"ogg",
"oga",
"flac",
"wma",
"opus",
"aiff",
"aif"

];


if(
imageExtensions.includes(ext)
){

return "image";

}


if(
videoExtensions.includes(ext)
){

return "video";

}


if(
audioExtensions.includes(ext)
){

return "audio";

}


return "";

}


/* =====================================================
   VIDEO MIME TYPE
===================================================== */

function videoMimeType(
filename,
mime
){

const supplied =
(mime || "")
.toLowerCase()
.split(";")[0]
.trim();


if(
supplied.startsWith("video/")
){

return supplied;

}


const ext =
extensionOf(filename);


const videoMimes = {

mp4:
"video/mp4",

webm:
"video/webm",

mov:
"video/quicktime",

m4v:
"video/mp4",

"3gp":
"video/3gpp",

"3g2":
"video/3gpp2",

mpg:
"video/mpeg",

mpeg:
"video/mpeg",

mpe:
"video/mpeg",

ogv:
"video/ogg",

avi:
"video/x-msvideo",

mkv:
"video/x-matroska"

};


return videoMimes[ext] || "";

}


/* =====================================================
   AUDIO MIME TYPE
===================================================== */

function audioMimeType(
filename,
mime
){

const supplied =
(mime || "")
.toLowerCase()
.split(";")[0]
.trim();


if(
supplied.startsWith("audio/")
){

return supplied;

}


const ext =
extensionOf(filename);


const audioMimes = {

mp3:
"audio/mpeg",

wav:
"audio/wav",

m4a:
"audio/mp4",

aac:
"audio/aac",

ogg:
"audio/ogg",

oga:
"audio/ogg",

flac:
"audio/flac",

opus:
"audio/opus"

};


return audioMimes[ext] || "";

}


/* =====================================================
   IMAGE MIME TYPE
===================================================== */

function imageMimeType(
filename,
mime
){

const supplied =
(mime || "")
.toLowerCase()
.split(";")[0]
.trim();


if(
supplied.startsWith("image/")
){

return supplied;

}


const ext =
extensionOf(filename);


const imageMimes = {

jpg:
"image/jpeg",

jpeg:
"image/jpeg",

png:
"image/png",

gif:
"image/gif",

webp:
"image/webp",

avif:
"image/avif",

bmp:
"image/bmp",

svg:
"image/svg+xml"

};


return imageMimes[ext] || "";

}


/* =====================================================
   GITHUB URL
===================================================== */

function githubUrlFromPath(p){

if(!p){

return "";

}

p =
p.trim();


if(
/^https?:\/\//i.test(p)
){

return p;

}


p =
p.replace(
/^\/+/,
""
);


if(
p.startsWith("./")
){

p =
p.substring(2);

}


try{

return new URL(
p,
BASE_URL
).href;

}

catch(e){

return (
BASE_URL +
p
.split("/")
.map(
part =>
encodeURIComponent(part)
)
.join("/")
);

}

}


/* =====================================================
   FILENAME FROM PATH
===================================================== */

function filenameFromPath(p){

if(!p){

return "";

}

try{

const u =
new URL(
p,
BASE_URL
);

const pathname =
u.pathname;

return pathname
.split("/")
.pop();

}

catch(e){

return p
.split("/")
.pop();

}

}


/* =====================================================
   DOWNLOAD LABEL
===================================================== */

function downloadLabel(
filename,
type
){

const ext =
extensionOf(filename);

if(ext){

return "⬇ Download " +
ext.toUpperCase();

}

if(
type === "image"
){

return "⬇ Download Photo";

}

if(
type === "video"
){

return "⬇ Download Video";

}

if(
type === "audio"
){

return "⬇ Download Audio";

}

return "⬇ Download";

}


/* =====================================================
   SET VIDEO SOURCE
===================================================== */

function setVideoSource(
mediaUrl,
filename,
mime
){

const type =
videoMimeType(
filename,
mime
);

videoSource.src =
mediaUrl;


if(type){

videoSource.type =
type;

}

else{

videoSource.removeAttribute(
"type"
);

}


video.load();

}


/* =====================================================
   DIRECT MEDIA MODE
===================================================== */

function loadDirectMedia(){

let mediaUrl = "";

let filename = "";

let mime =
suppliedMime || "";


if(directUrl){

mediaUrl =
directUrl;

filename =
suppliedName ||
filenameFromPath(
mediaUrl
);

}

else if(path){

mediaUrl =
githubUrlFromPath(
path
);

filename =
suppliedName ||
filenameFromPath(
path
);

}

else if(oldFile){

let folder =
oldFolder || "";


if(
folder.startsWith(
"media/"
)
){

mediaUrl =
githubUrlFromPath(
folder +
"/" +
oldFile
);

}

else{

mediaUrl =
githubUrlFromPath(
"media/" +
folder +
"/" +
oldFile
);

}


filename =
suppliedName ||
oldFile;

}

else{

return false;

}


if(!mediaUrl){

showError(
"❌ No media file selected."
);

return true;

}


const type =
mediaType(
filename,
mime
);


if(!type){

showError(
"❌ Unsupported media format."
);

return true;

}


hideAllMedia();

errorBox.style.display =
"none";

songMeta.style.display =
"none";


mediaTitle.textContent =
cleanName(filename);

mediaTitle.style.display =
"block";


/* =====================
   IMAGE
===================== */

if(
type === "image"
){

imageBox.style.display =
"block";

mediaImage.src =
mediaUrl;

mediaImage.alt =
cleanName(filename);

mediaImage.onclick =
function(){

mediaImage.classList.toggle(
"zoomed"
);

};


mediaImage.onerror =
function(){

showError(
"❌ This photo could not be loaded."
);

};

}


/* =====================
   VIDEO
===================== */

if(
type === "video"
){

videoBox.style.display =
"block";


setVideoSource(
mediaUrl,
filename,
mime
);


videoFormatNote.style.display =
"block";


video.onerror =
function(){

showError(
"❌ This video format cannot be played by your browser. The original file is still available for download."
);

};

}


/* =====================
   AUDIO
===================== */

if(
type === "audio"
){

audioBox.style.display =
"block";


const audioMime =
audioMimeType(
filename,
mime
);


if(audioMime){

audio.setAttribute(
"type",
audioMime
);

}


audio.src =
mediaUrl;

audio.load();


audio.onerror =
function(){

showError(
"❌ This audio file could not be played by your browser. The original file can still be downloaded."
);

};

}


/* =====================
   DOWNLOAD
===================== */

download.href =
mediaUrl;

download.textContent =
downloadLabel(
filename,
type
);


download.setAttribute(
"download",
filename ||
"ning-wei-media"
);


/* =====================
   SHARE
===================== */

shareButton.onclick =
function(){

shareMedia(
mediaUrl,
cleanName(filename)
);

};


actions.style.display =
"flex";

statusBox.style.display =
"none";

document.title =
cleanName(filename) +
" - Ning Wei Media";


return true;

}


/* =====================================================
   SUPABASE SONG MODE
===================================================== */

async function loadSupabaseSong(){

if(!id){

return;

}


try{

const result =
await db
.from("songs")
.select(
"title,song_url,cover_url,artists(name,photo)"
)
.eq(
"id",
id
)
.single();


const data =
result.data;

const error =
result.error;


if(error){

console.error(error);

showError(
"❌ The song could not be loaded."
);

return;

}


if(!data){

showError(
"❌ Song not found."
);

return;

}


hideAllMedia();

mediaTitle.style.display =
"none";


songMeta.style.display =
"flex";


songTitle.textContent =
data.title ||
"Untitled Song";


const artistData =
data.artists;


if(
Array.isArray(
artistData
)
){

const firstArtist =
artistData[0];


if(firstArtist){

artist.textContent =
firstArtist.name ||
"Unknown Artist";


if(firstArtist.photo){

cover.src =
firstArtist.photo;

}

}

}

else if(artistData){

artist.textContent =
artistData.name ||
"Unknown Artist";


if(artistData.photo){

cover.src =
artistData.photo;

}

}

else{

artist.textContent =
"Ning Wei Media";

}


if(data.cover_url){

cover.src =
data.cover_url;

}


const songUrl =
data.song_url;


if(!songUrl){

showError(
"❌ No media URL was found for this song."
);

return;

}


const filename =
filenameFromPath(
songUrl
);


const type =
mediaType(
filename,
""
);


/* =====================
   VIDEO SONG
===================== */

if(
type === "video"
){

videoBox.style.display =
"block";


setVideoSource(
songUrl,
filename,
""
);


videoFormatNote.style.display =
"block";


video.onerror =
function(){

showError(
"❌ This video format cannot be played by your browser. The original file can still be downloaded."
);

};

}


/* =====================
   IMAGE SONG
===================== */

else if(
type === "image"
){

imageBox.style.display =
"block";


mediaImage.src =
songUrl;


mediaImage.onclick =
function(){

mediaImage.classList.toggle(
"zoomed"
);

};

}


/* =====================
   AUDIO SONG
===================== */

else{

audioBox.style.display =
"block";


const audioMime =
audioMimeType(
filename,
""
);


if(audioMime){

audio.setAttribute(
"type",
audioMime
);

}


audio.src =
songUrl;

audio.load();


audio.onerror =
function(){

showError(
"❌ This audio file could not be played by your browser."
);

};

}


/* =====================
   DOWNLOAD
===================== */

download.href =
songUrl;

download.textContent =
downloadLabel(
filename,
type || "audio"
);


download.setAttribute(
"download",
filename ||
"ning-wei-song"
);


/* =====================
   SHARE
===================== */

shareButton.onclick =
function(){

shareMedia(
window.location.href,
data.title ||
"Ning Wei Media"
);

};


actions.style.display =
"flex";

statusBox.style.display =
"none";


document.title =
(
data.title ||
"Ning Wei Media"
) +
" - Ning Wei Media";


}

catch(error){

console.error(error);

showError(
"❌ Something went wrong while loading the media."
);

}

}


/* =====================================================
   SHARE
===================================================== */

async function shareMedia(
url,
title
){

try{

if(
navigator.share
){

await navigator.share({

title:
title,

text:
"Ning Wei Media",

url:
url

});

return;

}


if(
navigator.clipboard
){

await navigator.clipboard.writeText(
url
);

alert(
"Link copied."
);

return;

}


prompt(
"Copy this link:",
url
);

}

catch(error){

console.log(error);

}

}


/* =====================================================
   START
===================================================== */

async function start(){

if(id){

await loadSupabaseSong();

return;

}


const loaded =
loadDirectMedia();


if(!loaded){

showError(
"❌ No media file selected."
);

}

}


start();

</script>
