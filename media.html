<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media Player</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f8fa;
  color: #111;
}

.header {
  height: 190px;
  display: flex;
  align-items: flex-end;
  padding: 15px;
  background:
    linear-gradient(rgba(80,190,235,.20), rgba(80,190,235,.20)),
    url("ning-wei.png") center/cover no-repeat;
}

.header h1 {
  margin: 0;
  color: white;
  font-size: 26px;
  text-shadow: 0 2px 6px #000;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.back {
  display: inline-block;
  margin-bottom: 15px;
  color: #087ea4;
  text-decoration: none;
  font-weight: bold;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 1px 5px rgba(0,0,0,.12);
}

.title {
  margin: 0 0 5px;
  font-size: 21px;
  word-break: break-word;
}

.type {
  margin: 0;
  color: #777;
}

.player {
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 12px;
}

audio {
  width: 100%;
  display: block;
  padding: 15px;
}

video {
  width: 100%;
  max-height: 550px;
  display: block;
}

.image {
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  display: block;
}

.buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button,
.download {
  border: 0;
  padding: 12px 18px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}

.download {
  background: #0795c5;
  color: white;
}

.share {
  background: black;
  color: white;
}

.message {
  text-align: center;
  padding: 35px 15px;
  color: #777;
  background: white;
  border-radius: 10px;
}

.ad {
  min-height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed #bbb;
  border-radius: 8px;
  color: #888;
  margin-top: 15px;
  background: white;
}
</style>
</head>

<body>

<header class="header">
  <h1>🎵 Ning Wei Media</h1>
</header>

<div class="container">

  <a class="back" id="back" href="index.html">
    ← Back
  </a>

  <div class="card">
    <h2 class="title" id="title">Loading...</h2>
    <p class="type" id="type"></p>
  </div>

  <div id="content">
    <div class="message">Loading media...</div>
  </div>

  <div class="buttons" id="buttons" style="display:none;">

    <a
      id="download"
      class="download"
      href="#"
      download
    >
      ⬇ Download
    </a>

    <button
      class="share"
      onclick="sharePage()"
    >
      ↗ Share
    </button>

  </div>

  <div class="ad">
    Advertisement
  </div>

</div>

<script>

const params =
  new URLSearchParams(window.location.search);

/*
  This player accepts:

  ?path=media/songs/Ugandan/song.mp3

  OR

  ?folder=Ugandan&file=song.mp3

  OR

  ?file=17880208913860.mp4
*/

let path = params.get("path");
let folder = params.get("folder");
let file = params.get("file");

if (!path && file) {

  if (folder) {
    path = "media/songs/" +
      folder.replace(/^\/+|\/+$/g, "") +
      "/" +
      file;
  } else {
    path = file;
  }
}

const title =
  document.getElementById("title");

const type =
  document.getElementById("type");

const content =
  document.getElementById("content");

const buttons =
  document.getElementById("buttons");

const download =
  document.getElementById("download");

if (!path) {

  title.textContent = "No media selected";

  type.textContent = "";

  content.innerHTML =
    `<div class="message">
      No file was selected.
    </div>`;

} else {

  const cleanPath =
    path.replace(/^\/+/, "");

  const fileName =
    cleanPath.split("/").pop();

  const extension =
    fileName
      .split(".")
      .pop()
      .toLowerCase();

  title.textContent =
    fileName.replace(/\.[^/.]+$/, "");

  const mediaURL =
    "https://raw.githubusercontent.com/" +
    "Ningwei2567/Ning-wei-1/main/" +
    cleanPath
      .split("/")
      .map(encodeURIComponent)
      .join("/");

  download.href = mediaURL;
  download.download = fileName;

  buttons.style.display = "flex";

  /*
    AUDIO
  */

  const audioTypes = [
    "mp3",
    "wav",
    "m4a",
    "aac",
    "ogg",
    "oga",
    "opus",
    "flac"
  ];

  /*
    VIDEO
  */

  const videoTypes = [
    "mp4",
    "webm",
    "mov",
    "m4v",
    "avi",
    "mkv"
  ];

  /*
    IMAGE
  */

  const imageTypes = [
    "jpg",
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp"
  ];

  if (audioTypes.includes(extension)) {

    type.textContent = "Audio";

    content.innerHTML = `
      <div class="player">
        <audio
          controls
          preload="metadata"
          src="${mediaURL}">
        </audio>
      </div>
    `;

  }

  else if (videoTypes.includes(extension)) {

    type.textContent = "Video";

    content.innerHTML = `
      <div class="player">
        <video
          controls
          playsinline
          preload="metadata"
          src="${mediaURL}">
        </video>
      </div>
    `;

  }

  else if (imageTypes.includes(extension)) {

    type.textContent = "Image";

    content.innerHTML = `
      <div class="player">
        <img
          class="image"
          src="${mediaURL}"
          alt="${fileName}">
      </div>
    `;

  }

  else {

    type.textContent = "File";

    content.innerHTML =
      `<div class="message">
        This file cannot be played directly in the browser.
        <br><br>
        Use the Download button below.
      </div>`;
  }
}


/*
  SHARE
*/

async function sharePage() {

  const shareData = {
    title:
      document.getElementById("title").textContent,

    text:
      "Ning Wei Media",

    url:
      window.location.href
  };

  try {

    if (navigator.share) {

      await navigator.share(shareData);

    } else {

      await navigator.clipboard.writeText(
        window.location.href
      );

      alert("Link copied!");

    }

  } catch (error) {
    console.log(error);
  }
}

</script>

</body>
</html>
