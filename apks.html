<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apps - Ning Wei Media</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3faff}
.header{height:300px;position:relative;overflow:hidden;color:#fff}
.header img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;transform:scale(1.08)}
.overlay{position:absolute;inset:0;background:rgba(55,145,205,.38)}
.text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;text-shadow:0 2px 7px #000}
.text h1{margin:0;font-size:34px}
.text p{font-size:14px;font-weight:bold}
.top{padding:12px 15px}
.search{display:flex;gap:8px}
input{flex:1;height:48px;border:1px solid #d5e3e9;border-radius:25px;padding:0 16px;font-size:16px}
button{width:48px;border:0;border-radius:50%;background:#168dcc;color:#fff;font-size:20px}
.list{padding:0 15px 25px}
.row{display:flex;align-items:center;gap:9px;background:#fff;margin:6px 0;padding:9px;border-radius:12px;text-decoration:none;color:#111}
.num{width:30px;height:30px;min-width:30px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
.info{flex:1;min-width:0}
.name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:#777}
.arrow{font-size:25px;color:#168dcc}
.empty{background:#fff;padding:20px;text-align:center;border-radius:12px;color:#777}
.back{display:block;margin:0 15px 25px;padding:12px;background:#fff;border-radius:12px;text-align:center;text-decoration:none;color:#168dcc;font-weight:bold}
</style>
</head>

<body>

<header class="header">
<img src="ning-wei.png">
<div class="overlay"></div>
<div class="text">
<h1>Ning Wei Media</h1>
<p>Music • Videos • Photos • Apps • Software</p>
</div>
</header>

<div class="top">
<div class="search">
<input id="search" placeholder="🔍 Search everything...">
<button onclick="goSearch()">🔍</button>
</div>
</div>

<div id="list" class="list"></div>

<a class="back" href="index.html">← Home</a>

<script>

const USER="Ningwei2567";
const REPO="Ning-wei-1";
const BRANCH="main";

const params=new URLSearchParams(location.search);
const path=params.get("path")||"media/apps";

function goSearch(){
location.href="search.html";
}

document.getElementById("search").addEventListener("keydown",e=>{
if(e.key==="Enter")goSearch();
});

function enc(p){
return p.split("/").map(encodeURIComponent).join("/");
}

async function load(){

const r=await fetch(
`https://api.github.com/repos/${USER}/${REPO}/contents/${enc(path)}?ref=${BRANCH}`,
{cache:"no-store"}
);

if(!r.ok){
list.innerHTML='<div class="empty">Unable to load apps.</div>';
return;
}

let items=await r.json();
if(!Array.isArray(items))items=[items];

items=items.filter(x=>
x.type==="dir" ||
/\.apk$/i.test(x.name)
);

items.sort((a,b)=>{
if(a.type!==b.type)return a.type==="dir"?-1:1;
return a.name.localeCompare(b.name);
});

let html="";

items.forEach((x,i)=>{

let href;

if(x.type==="dir"){
href="apks.html?path="+encodeURIComponent(x.path);
}else{
href=x.download_url;
}

html+=`
<a class="row" href="${href}">
<span class="num">${i+1}</span>
<span>📱</span>
<span class="info">
<div class="name">${safe(x.name)}</div>
<div class="sub">${x.type==="dir"?"Folder":"APK Application"}</div>
</span>
<span class="arrow">›</span>
</a>`;

});

list.innerHTML=html||'<div class="empty">No apps found.</div>';

}

function safe(x){
return String(x).replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#039;"
}[m]));
}

load();

</script>
</body>
</html>
