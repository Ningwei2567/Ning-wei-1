<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload • Ning Wei Media</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:Arial,Helvetica,sans-serif; background:#eef9ff; color:#123; }
  .header{ position:relative; height:210px; overflow:hidden; background:#1688c5; }
  .header img{ width:100%; height:100%; object-fit:cover; }
  .header-overlay{ position:absolute; inset:0; background:linear-gradient(to bottom,rgba(0,120,190,.25),rgba(0,55,100,.82)); }
  .header-content{ position:absolute; left:0; right:0; bottom:18px; text-align:center; color:white; padding:10px; }
  .container{ width:min(700px,94%); margin:18px auto; }
  .card{ background:white; border-radius:15px; padding:18px; margin-bottom:16px; box-shadow:0 3px 14px rgba(0,100,160,.10); }
  .card h3{ margin-top:0; color:#126b9d; }
  
  /* Creator Profile Header */
  .creator-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
  .creator-photo{ width:60px; height:60px; border-radius:50%; border:2px solid #1688c5; object-fit:cover; background:#dceff8; }
  
  label{ display:block; margin-top:13px; margin-bottom:6px; font-weight:bold; font-size:14px; }
  input, textarea, select{ width:100%; padding:12px; border:1px solid #cbdde7; border-radius:9px; font-size:15px; }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:#1688c5; }
  
  /* Inline Warning */
  .validation-warning{ display:none; margin-top:8px; padding:8px; border-radius:6px; background:#fff4d6; border-left:4px solid #e5a400; color:#795500; font-size:13px; font-weight:bold; }

  .type-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px; }
  .type-button{ border:0; border-radius:11px; padding:15px; background:#e7f6ff; color:#096b9f; font-weight:bold; cursor:pointer; }
  .type-button.active{ background:#1688c5; color:white; }
  .upload-section{ display:none; margin-top:15px; }
  .upload-section.active{ display:block; }
  .upload-button{ width:100%; border:0; border-radius:10px; padding:14px; margin-top:18px; background:#1688c5; color:white; font-weight:bold; cursor:pointer; }
  .upload-button:disabled{ background:#ccc; cursor:not-allowed; }
  #statusMsg{ margin-top:15px; padding:12px; border-radius:8px; display:none; font-weight:bold; text-align:center; }
  .status-success{ background:#e8f5e9; color:#2e7d32; border:1px solid #a5d6a7; }
  .status-error{ background:#ffebee; color:#c62828; border:1px solid #ef9a9a; }
</style>
</head>
<body>

<header class="header">
  <img src="ning-wei.png" alt="Ning Wei Media">
  <div class="header-overlay"></div>
  <div class="header-content"><h1>Ning Wei Media</h1></div>
</header>

<main class="container">
  <!-- CREATOR -->
  <section class="card">
    <div class="creator-header">
      <h3>👤 Your Creator Profile</h3>
      <img id="creatorPreview" class="creator-photo" src="ning-wei.png" alt="Profile">
    </div>
    
    <label for="creatorName">Name *</label>
    <input id="creatorName" type="text" placeholder="Enter your name">
    <div id="nameWarning" class="validation-warning">⚠️ Please enter your name.</div>

    <label for="creatorEmail">Email *</label>
    <input id="creatorEmail" type="email" placeholder="Enter your email">
    <div id="emailWarning" class="validation-warning">⚠️ Please enter your email.</div>
  </section>

  <!-- CHOOSE TYPE -->
  <section class="card">
    <h3>Choose What You Want to Upload</h3>
    <div class="type-grid">
      <button type="button" class="type-button" data-type="music">🎵 Music</button>
      <button type="button" class="type-button" data-type="photos">🖼️ Photos</button>
      <button type="button" class="type-button" data-type="videos">🎬 Videos</button>
      <button type="button" class="type-button" data-type="apps">📱 Apps</button>
      <button type="button" class="type-button" data-type="software">💻 Software</button>
      <button type="button" class="type-button" data-type="mixes">🎧 DJ Mixes</button>
    </div>
  </section>

  <!-- UPLOAD FORM SECTION -->
  <section class="card upload-section" id="uploadSection">
    <h3 id="selectedCategoryTitle">Upload Media</h3>
    
    <label for="mediaTitle">Title *</label>
    <input id="mediaTitle" type="text" placeholder="Enter media title">

    <label for="mediaFile">Select File *</label>
    <input id="mediaFile" type="file">

    <button type="button" id="submitBtn" class="upload-button">Upload & Submit</button>
    <div id="statusMsg"></div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://btksyizkcpzubtextuce.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let selectedCategory = "";

document.querySelectorAll('.type-button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedCategory = btn.getAttribute('data-type');
    
    const uploadSec = document.getElementById('uploadSection');
    uploadSec.classList.add('active');
    document.getElementById('selectedCategoryTitle').innerText = `Upload ${btn.innerText}`;
    
    const fileInput = document.getElementById('mediaFile');
    if (selectedCategory === 'music' || selectedCategory === 'mixes') {
      fileInput.accept = 'audio/*';
    } else if (selectedCategory === 'photos') {
      fileInput.accept = 'image/*';
    } else if (selectedCategory === 'videos') {
      fileInput.accept = 'video/*';
    } else {
      fileInput.accept = '*/*';
    }
  });
});

function checkCreator() {
  const nameInput = document.getElementById("creatorName");
  const emailInput = document.getElementById("creatorEmail");
  const nameWarning = document.getElementById("nameWarning");
  const emailWarning = document.getElementById("emailWarning");
  
  nameWarning.style.display = "none";
  emailWarning.style.display = "none";
  
  const name = nameInput.value.trim();
  const email = emailInput.value.trim().toLowerCase();

  if (!name) {
    nameWarning.style.display = "block";
    throw new Error("Missing Name");
  }
  if (!email) {
    emailWarning.style.display = "block";
    throw new Error("Missing Email");
  }

  return { name, email };
}

document.getElementById("submitBtn").addEventListener("click", async () => {
  const statusMsg = document.getElementById("statusMsg");
  statusMsg.style.display = "none";
  
  try {
    const { name, email } = checkCreator();
    const titleInput = document.getElementById("mediaTitle");
    const fileInput = document.getElementById("mediaFile");
    const title = titleInput.value.trim();
    const file = fileInput.files[0];

    if (!selectedCategory) {
      alert("Please select a category to upload.");
      return;
    }
    if (!title) {
      alert("Please enter a title.");
      return;
    }
    if (!file) {
      alert("Please select a file.");
      return;
    }

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.innerText = "Uploading to Supabase Storage...";

    const fileExt = file.name.split('.').pop();
    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
    const filePath = `uploads/${fileName}`;

    const { data: storageData, error: storageError } = await supabaseClient.storage
      .from('media_uploads')
      .upload(filePath, file);

    if (storageError) throw storageError;

    const { data: publicUrlData } = supabaseClient.storage
      .from('media_uploads')
      .getPublicUrl(filePath);

    const fileUrl = publicUrlData.publicUrl;

    const initialStatus = (email === "admin@ningweimedia.com") ? "approved" : "pending";

    const { error: dbError } = await supabaseClient
      .from('artist_submissions')
      .insert([
        {
          artist_name: name,
          email: email,
          song_title: title,
          category: selectedCategory,
          status: initialStatus,
          files: [{ name: file.name, url: fileUrl, type: file.type }]
        }
      ]);

    if (dbError) throw dbError;

    statusMsg.className = "status-success";
    statusMsg.innerText = "✅ Upload successful! Saved in Supabase.";
    statusMsg.style.display = "block";

    titleInput.value = "";
    fileInput.value = "";

  } catch (err) {
    if (err.message !== "Missing Name" && err.message !== "Missing Email") {
      console.error(err);
      statusMsg.className = "status-error";
      statusMsg.innerText = "❌ Upload failed: " + (err.message || "An error occurred.");
      statusMsg.style.display = "block";
    }
  } finally {
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = false;
    submitBtn.innerText = "Upload & Submit";
  }
});
</script>
</body>
</html>
