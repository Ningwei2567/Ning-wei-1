<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GitHub Upload — Ning Wei Media</title><style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4faff;
    color:#111;
}

.container{
    max-width:700px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:25px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
}

h1{
    margin-top:0;
    font-size:28px;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:bold;
}

input,
button{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

input[type="file"]{
    background:#fafafa;
}

button{
    margin-top:22px;
    border:0;
    background:#111;
    color:#fff;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.info{
    background:#eef7ff;
    padding:14px;
    border-radius:10px;
    margin:15px 0;
    line-height:1.5;
}

.status{
    margin-top:20px;
    padding:14px;
    border-radius:10px;
    display:none;
    white-space:pre-wrap;
    word-break:break-word;
}

.status.show{
    display:block;
}

.success{
    background:#e9f9ee;
    color:#126b2e;
}

.error{
    background:#ffecec;
    color:#a00000;
}

.progress{
    margin-top:15px;
    display:none;
}

.progress-bar{
    width:100%;
    height:12px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#111;
    transition:width .2s;
}

.small{
    font-size:13px;
    color:#666;
    margin-top:7px;
}
</style></head><body><div class="container"><div class="card"><h1>📤 GitHub Upload</h1><div class="info">
    <strong>Destination folder:</strong>
    <span id="destination">media</span>
</div><label for="token">GitHub Token</label>

<input
id="token"
type="password"
placeholder="Paste your GitHub token here"
autocomplete="off"

«»

<div class="small">
    Your token is used only during this upload and is not saved by this page.
</div><label for="file">Choose File</label>

<input
id="file"
type="file"

«»

<div id="fileInfo" class="small"></div><button id="uploadButton">
    Upload to GitHub
</button><div id="progress" class="progress"><div class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
</div>

</div><div id="status" class="status"></div></div></div><script>

/* =========================================================
   GITHUB SETTINGS
========================================================= */

const GITHUB_OWNER = "Ningwei2567";
const GITHUB_REPO = "Ning-wei-1";
const GITHUB_BRANCH = "main";


/* =========================================================
   GET FOLDER FROM browser.html
========================================================= */

const params = new URLSearchParams(window.location.search);

let currentPath = params.get("path") || "media";

currentPath = decodeURIComponent(currentPath);

currentPath = currentPath
    .replace(/^\/+/, "")
    .replace(/\/+$/, "");

if (!currentPath) {
    currentPath = "media";
}

document.getElementById("destination").textContent = currentPath;


/* =========================================================
   ELEMENTS
========================================================= */

const tokenInput = document.getElementById("token");
const fileInput = document.getElementById("file");
const uploadButton = document.getElementById("uploadButton");
const statusBox = document.getElementById("status");
const progressBox = document.getElementById("progress");
const progressFill = document.getElementById("progressFill");
const fileInfo = document.getElementById("fileInfo");


/* =========================================================
   FILE INFORMATION
========================================================= */

fileInput.addEventListener("change", function(){

    const file = fileInput.files[0];

    if (!file) {
        fileInfo.textContent = "";
        return;
    }

    const sizeMB = file.size / (1024 * 1024);

    fileInfo.textContent =
        file.name +
        " — " +
        sizeMB.toFixed(2) +
        " MB";

});


/* =========================================================
   STATUS MESSAGE
========================================================= */

function showStatus(message, type){

    statusBox.textContent = message;

    statusBox.className =
        "status show " + type;

}


/* =========================================================
   BASE64 CONVERSION
========================================================= */

function fileToBase64(file){

    return new Promise(function(resolve, reject){

        const reader = new FileReader();

        reader.onload = function(){

            try{

                const result = reader.result;

                const base64 =
                    result.split(",")[1];

                resolve(base64);

            }catch(error){

                reject(error);

            }

        };

        reader.onerror = function(){

            reject(
                new Error("Could not read the selected file.")
            );

        };

        reader.readAsDataURL(file);

    });

}


/* =========================================================
   BUILD GITHUB API URL
========================================================= */

function githubFileUrl(repositoryPath){

    const encodedPath = repositoryPath
        .split("/")
        .filter(Boolean)
        .map(function(part){
            return encodeURIComponent(part);
        })
        .join("/");

    return (
        "https://api.github.com/repos/" +
        encodeURIComponent(GITHUB_OWNER) +
        "/" +
        encodeURIComponent(GITHUB_REPO) +
        "/contents/" +
        encodedPath
    );

}


/* =========================================================
   GET EXISTING FILE
========================================================= */

async function getExistingFile(url, token){

    const response = await fetch(url, {

        method:"GET",

        headers:{
            "Accept":"application/vnd.github+json",
            "Authorization":"Bearer " + token,
            "X-GitHub-Api-Version":"2022-11-28"
        }

    });

    if(response.status === 404){

        return null;

    }

    if(!response.ok){

        let message =
            "Could not check the GitHub file.";

        try{

            const data =
                await response.json();

            if(data.message){
                message = data.message;
            }

        }catch(error){}

        throw new Error(message);

    }

    return await response.json();

}


/* =========================================================
   UPLOAD
========================================================= */

uploadButton.addEventListener("click", async function(){

    const token =
        tokenInput.value.trim();

    const file =
        fileInput.files[0];


    /* -----------------------------------------------------
       CHECK TOKEN
    ----------------------------------------------------- */

    if(!token){

        showStatus(
            "Please paste your GitHub token.",
            "error"
        );

        tokenInput.focus();

        return;

    }


    /* -----------------------------------------------------
       CHECK FILE
    ----------------------------------------------------- */

    if(!file){

        showStatus(
            "Please choose a file to upload.",
            "error"
        );

        fileInput.focus();

        return;

    }


    /* -----------------------------------------------------
       FILE SIZE LIMIT
    ----------------------------------------------------- */

    const maxSize =
        90 * 1024 * 1024;

    if(file.size > maxSize){

        showStatus(
            "This file is larger than 90 MB.\n\n" +
            "Please choose a smaller file.",
            "error"
        );

        return;

    }


    /* -----------------------------------------------------
       CREATE REPOSITORY PATH
    ----------------------------------------------------- */

    const repositoryPath =
        currentPath +
        "/" +
        file.name;


    const url =
        githubFileUrl(repositoryPath);


    /* -----------------------------------------------------
       START
    ----------------------------------------------------- */

    uploadButton.disabled = true;

    progressBox.style.display = "block";

    progressFill.style.width = "10%";

    showStatus(
        "Preparing upload...",
        "success"
    );


    try{

        /* -------------------------------------------------
           CONVERT FILE
        ------------------------------------------------- */

        progressFill.style.width = "25%";

        showStatus(
            "Reading the file...",
            "success"
        );

        const base64 =
            await fileToBase64(file);


        /* -------------------------------------------------
           CHECK IF FILE ALREADY EXISTS
        ------------------------------------------------- */

        progressFill.style.width = "40%";

        showStatus(
            "Checking GitHub...",
            "success"
        );

        const existing =
            await getExistingFile(
                url,
                token
            );


        /* -------------------------------------------------
           PREPARE REQUEST
        ------------------------------------------------- */

        progressFill.style.width = "60%";

        const body = {

            message:
                "Upload " + file.name,

            content:
                base64,

            branch:
                GITHUB_BRANCH

        };


        /* -------------------------------------------------
           IF FILE EXISTS, INCLUDE SHA
        ------------------------------------------------- */

        if(existing && existing.sha){

            body.sha =
                existing.sha;

        }


        /* -------------------------------------------------
           SEND TO GITHUB
        ------------------------------------------------- */

        showStatus(
            "Uploading to GitHub...",
            "success"
        );

        progressFill.style.width = "75%";


        const response =
            await fetch(url, {

                method:"PUT",

                headers:{

                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        "Bearer " + token,

                    "X-GitHub-Api-Version":
                        "2022-11-28",

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(body)

            });


        /* -------------------------------------------------
           READ RESPONSE
        ------------------------------------------------- */

        let data = null;

        try{

            data =
                await response.json();

        }catch(error){}


        if(!response.ok){

            let message =
                "GitHub upload failed.";

            if(data && data.message){

                message =
                    data.message;

            }

            throw new Error(message);

        }


        /* -------------------------------------------------
           SUCCESS
        ------------------------------------------------- */

        progressFill.style.width = "100%";

        showStatus(

            "✅ Upload successful!\n\n" +

            "File: " +
            file.name +
            "\n\n" +

            "Folder: " +
            currentPath +
            "\n\n" +

            "The file has been added to your GitHub repository.",

            "success"

        );


        /* -------------------------------------------------
           CLEAR TOKEN
        ------------------------------------------------- */

        tokenInput.value = "";


    }catch(error){

        progressFill.style.width = "0%";

        showStatus(

            "❌ Upload failed.\n\n" +

            error.message,

            "error"

        );

    }finally{

        uploadButton.disabled = false;

    }

});

</script></body>
</html>
