<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Upload - Ning Wei Media</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f8fb;color:#111}
.header{height:205px;position:relative;overflow:hidden}
.header img{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;object-position:50% 18%;transform:scale(1.15)}
.overlay{position:absolute;inset:0;background:rgba(55,145,205,.38)}
.head{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center}
.head h1{margin:0;font-size:29px;text-shadow:0 2px 5px #333}
.head p{font-size:13px}
.wrap{width:94%;max-width:650px;margin:15px auto}
.card{background:white;padding:17px;border-radius:12px;box-shadow:0 2px 10px #ddd}
.folder{font-size:13px;color:#666;word-break:break-all;margin-bottom:15px}
label{display:block;font-weight:bold;margin:13px 0 6px}
input{width:100%;padding:11px;border:1px solid #ccd6dd;border-radius:8px}
button,.back{width:100%;display:block;border:0;border-radius:8px;padding:13px;margin-top:15px;text-align:center;font-weight:bold;font-size:16px;text-decoration:none}
button{background:#0796b5;color:white}
button:disabled{background:#999}
.back{background:#333;color:white}
.status{margin-top:15px;padding:12px;border-radius:8px;display:none}
.ok{display:block;background:#e6f8eb;color:#146c2e}
.err{display:block;background:#ffe7e7;color:#a00000}
</style>
</head>

<body>

<header class="header">
<img src="ning-wei.png" alt="">
<div class="overlay"></div>

<div class="head">
<h1>📤 Upload Directly Here</h1>
<p>Ning Wei Media</p>
</div>
</header>

<main class="wrap">

<div class="card">

<div id="folder" class="folder">
Loading folder...
</div>

<form id="form">

<label>Select file</label>

<input
    id="file"
    type="file"
    required
>

<button id="button" type="submit">
📤 Upload Here
</button>

<div id="status" class="status"></div>

</form>

<a id="back" class="back">
← Back to Folder
</a>

</div>

</main>

<script>

const params=new URLSearchParams(location.search);

const folder=
    params.get("path") || "media";


const FUNCTION_URL=
"https://btksyizkcpzubtextuce.supabase.co/functions/v1/github-upload";


document.getElementById("folder").textContent=
"Uploading into: "+folder;


document.getElementById("back").href=
"browser.html?path="+encodeURIComponent(folder);


document
.getElementById("form")
.addEventListener("submit",async function(e){

    e.preventDefault();

    const file=
        document.getElementById("file").files[0];

    const button=
        document.getElementById("button");

    const status=
        document.getElementById("status");


    if(!file)return;


    button.disabled=true;
    button.textContent="Uploading...";

    status.className="status";
    status.textContent="";


    try{

        const password=
            prompt(
                "Enter the upload password:"
            );


        if(!password){

            throw new Error(
                "Upload cancelled."
            );

        }


        const formData=
            new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "folder",
            folder
        );


        formData.append(
            "password",
            password
        );


        const response=
            await fetch(
                FUNCTION_URL,
                {
                    method:"POST",
                    body:formData
                }
            );


        const result=
            await response.json();


        if(!response.ok){

            throw new Error(
                result.error ||
                "Upload failed."
            );

        }


        status.className=
            "status ok";


        status.innerHTML=
            "✅ <b>Upload successful!</b><br><br>"+
            "The file was added directly to:<br>"+
            "<b>"+folder+"</b>";


        document
            .getElementById("form")
            .reset();


    }catch(error){

        status.className=
            "status err";

        status.textContent=
            "❌ "+error.message;

    }


    button.disabled=false;

    button.textContent=
        "📤 Upload Here";

});

</script>

</body>
</html>
