<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>Ning Wei Media — Direct Upload</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#f5f5f7;
font-family:Arial,Helvetica,sans-serif;
color:#111;
}

.wrap{
max-width:600px;
margin:auto;
min-height:100vh;
padding-bottom:30px;
}

.header{
height:125px;
position:relative;
overflow:hidden;
background:#000;
color:#fff;
text-align:center;
display:flex;
align-items:center;
justify-content:center;
}

.header img{
position:absolute;
inset:0;
width:100%;
height:125px;
object-fit:cover;
opacity:.8;
}

.header-content{
position:relative;
z-index:2;
text-shadow:0 2px 6px #000;
}

.header h1{
margin:0;
font-size:27px;
}

.header p{
margin:7px 0;
font-size:13px;
}

.card{
background:#fff;
margin:12px 15px;
padding:18px;
border-radius:13px;
box-shadow:0 2px 8px #0000000d;
}

.folder{
font-size:18px;
font-weight:900;
margin-bottom:8px;
}

.help{
font-size:12px;
color:#666;
line-height:1.5;
margin-bottom:15px;
}

.upload-button{
display:block;
width:100%;
padding:15px;
border:0;
border-radius:10px;
background:#55bfe8;
color:#fff;
font-size:15px;
font-weight:800;
text-align:center;
cursor:pointer;
}

.upload-button:disabled{
opacity:.6;
cursor:not-allowed;
}

#fileInput{
display:none;
}

.selected{
margin-top:12px;
padding:12px;
background:#f3f3f3;
border-radius:9px;
font-size:12px;
color:#555;
word-break:break-word;
display:none;
}

.progress{
margin-top:14px;
height:12px;
background:#ddd;
border-radius:20px;
overflow:hidden;
display:none;
}

.fill{
height:100%;
width:0;
background:#55bfe8;
transition:width .2s ease;
}

.status{
margin-top:12px;
font-size:13px;
font-weight:700;
line-height:1.5;
}

.success{
color:#157a2b;
}

.error{
color:#a00000;
}

.back{
display:block;
background:#111;
color:#fff;
text-align:center;
text-decoration:none;
padding:12px;
border-radius:9px;
margin-top:12px;
font-weight:700;
}

</style>

</head>

<body>

<div class="wrap">

<header class="header">

<img
src="ning-wei.png"
alt="Ning Wei Media"
>

<div class="header-content">

<h1>Ning Wei Media</h1>

<p>
Direct Folder Upload
</p>

</div>

</header>


<div class="card">

<div
id="folderName"
class="folder"
>
Loading folder...
</div>

<div
id="help"
class="help"
>
Preparing direct upload...
</div>


<input
id="fileInput"
type="file"
>


<button
id="uploadButton"
class="upload-button"
type="button"
>

📤 Choose File From Phone

</button>


<div
id="selected"
class="selected"
></div>


<div
id="progress"
class="progress"
>

<div
id="fill"
class="fill"
></div>

</div>


<div
id="status"
class="status"
></div>


<a
id="back"
class="back"
href="library.html"
>

← Back to Ning Wei Media

</a>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://btksyizkcpzubtextuce.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJidGtz";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   READ CURRENT FOLDER
===================================================== */

const params =
new URLSearchParams(
window.location.search
);

const requestedPath =
params.get("path");


/* =====================================================
   ELEMENTS
===================================================== */

const fileInput =
document.getElementById(
"fileInput"
);

const uploadButton =
document.getElementById(
"uploadButton"
);

const folderName =
document.getElementById(
"folderName"
);

const help =
document.getElementById(
"help"
);

const selected =
document.getElementById(
"selected"
);

const status =
document.getElementById(
"status"
);

const progress =
document.getElementById(
"progress"
);

const fill =
document.getElementById(
"fill"
);

const back =
document.getElementById(
"back"
);


/* =====================================================
   CHECK FOLDER
===================================================== */

if(!requestedPath){

folderName.textContent =
"No folder selected.";

help.textContent =
"Open a folder first, then use Upload Directly Here.";

uploadButton.disabled =
true;

}

else{

const readable =
requestedPath
.split("/")
.pop()
.replace(/-/g," ");

folderName.textContent =
"📁 " + readable;


/* =====================================================
   DETERMINE FILE TYPE
===================================================== */

let uploadType =
"other";


if(
requestedPath.startsWith(
"media/songs/"
)
){

uploadType =
"audio";

}


else if(
requestedPath.startsWith(
"media/dj-mixes/"
)
){

uploadType =
"audio";

}


else if(
requestedPath.startsWith(
"media/videos/"
)
){

uploadType =
"video";

}


else if(
requestedPath.startsWith(
"media/photos/"
)
){

uploadType =
"photo";

}


else if(
requestedPath.startsWith(
"media/apps/"
)
){

uploadType =
"app";

}


else if(
requestedPath.startsWith(
"media/software/"
)
){

uploadType =
"software";

}


/* =====================================================
   FILE PICKER ACCEPT TYPE
===================================================== */

if(uploadType === "audio"){

fileInput.accept =
"audio/*";

help.textContent =
"🎵 This folder accepts audio/music files only.";

}


else if(uploadType === "video"){

fileInput.accept =
"video/*";

help.textContent =
"🎬 This folder accepts video files only.";

}


else if(uploadType === "photo"){

fileInput.accept =
"image/*";

help.textContent =
"📸 This folder accepts photo/image files only.";

}


else if(uploadType === "app"){

fileInput.accept =
".apk,.apks,.xapk,application/vnd.android.package-archive";

help.textContent =
"📱 This folder accepts Android app files only.";

}


else if(uploadType === "software"){

fileInput.accept =
".exe,.msi,.dmg,.pkg,.deb,.rpm,.appimage,.zip,.rar,.7z";

help.textContent =
"💻 This folder accepts software/installer files only.";

}


else{

fileInput.accept =
"*/*";

help.textContent =
"Choose the file you want to upload.";

}


/* =====================================================
   BACK BUTTON
===================================================== */

back.href =
"library.html?folder="+
encodeURIComponent(
requestedPath
);

}


/* =====================================================
   CLEAN FILE NAME
===================================================== */

function clean(value){

return String(value || "")
.replace(
/[^a-zA-Z0-9._-]/g,
"-"
)
.replace(
/-+/g,
"-"
)
.replace(
/^-|-$/g,
""
);

}


/* =====================================================
   UNIQUE FILE NAME
===================================================== */

function uniqueName(file){

return (
Date.now() +
"-" +
Math.random()
.toString(36)
.slice(2,9) +
"-" +
clean(file.name)
);

}


/* =====================================================
   MIME TYPE
===================================================== */

function mime(file){

return (
file.type ||
"application/octet-stream"
);

}


/* =====================================================
   CONVERT WEBSITE PATH
   TO STORAGE LOCATION
===================================================== */

function bucketAndFolder(
folder
){

/* MUSIC */

if(
folder.startsWith(
"media/songs/"
)
){

return [

"songs",

folder.replace(
"media/songs/",
""
)

];

}


/* APPS */

if(
folder.startsWith(
"media/apps/"
)
){

return [

"artist-uploads",

"apps/" +
folder.replace(
"media/apps/",
""
)

];

}


/* SOFTWARE */

if(
folder.startsWith(
"media/software/"
)
){

return [

"artist-uploads",

"software/" +
folder.replace(
"media/software/",
""
)

];

}


/* PHOTOS */

if(
folder.startsWith(
"media/photos/"
)
){

return [

"artist-uploads",

"photos/" +
folder.replace(
"media/photos/",
""
)

];

}


/* VIDEOS */

if(
folder.startsWith(
"media/videos/"
)
){

return [

"artist-uploads",

"videos/" +
folder.replace(
"media/videos/",
""
)

];

}


/* DJ MIXES */

if(
folder.startsWith(
"media/dj-mixes/"
)
){

return [

"artist-uploads",

"dj-mixes/" +
folder.replace(
"media/dj-mixes/",
""
)

];

}


/* FALLBACK */

return [

"artist-uploads",

folder.replace(
"media/",
""
)

];

}


/* =====================================================
   UPLOAD
===================================================== */

async function uploadFile(file){

if(!requestedPath){

status.className =
"status error";

status.textContent =
"❌ No destination folder selected.";

return;

}


const location =
bucketAndFolder(
requestedPath
);


const bucket =
location[0];

const folder =
location[1];


const path =
folder +
"/" +
uniqueName(file);


/* SHOW SELECTED FILE */

selected.style.display =
"block";

selected.textContent =
"Selected: " +
file.name;


/* DISABLE BUTTON */

uploadButton.disabled =
true;


/* SHOW PROGRESS */

progress.style.display =
"block";

fill.style.width =
"10%";


status.className =
"status";

status.textContent =
"Uploading " +
file.name +
"...";


try{

const result =
await db
.storage
.from(bucket)
.upload(
path,
file,
{
upsert:false,
contentType:mime(file),
cacheControl:"3600"
}
);


if(result.error){

throw result.error;

}


/* SUCCESS */

fill.style.width =
"100%";


status.className =
"status success";

status.textContent =
"✅ File uploaded successfully.";


/* BUTTON */

uploadButton.textContent =
"📤 Upload Another File";


uploadButton.disabled =
false;


/* CLEAR */

fileInput.value =
"";


console.log(
"Uploaded:",
bucket,
path
);


}
catch(error){

console.error(
"Upload error:",
error
);


status.className =
"status error";


status.textContent =
"❌ Upload failed: " +
(
error.message ||
"Unknown error"
);


fill.style.width =
"0%";


uploadButton.disabled =
false;

}

}


/* =====================================================
   OPEN PHONE FILE PICKER
===================================================== */

uploadButton.addEventListener(
"click",
function(){

fileInput.click();

}
);


/* =====================================================
   FILE SELECTED
===================================================== */

fileInput.addEventListener(
"change",
function(){

const files =
[...this.files];


/* ONLY ONE FILE */

if(files.length > 1){

status.className =
"status error";

status.textContent =
"❌ Please choose only one file.";

this.value =
"";

return;

}


if(!files.length){

return;

}


const file =
files[0];


/* =====================================================
   VERIFY FILE TYPE
===================================================== */

if(uploadType === "audio"){

if(
!file.type.startsWith(
"audio/"
)
){

status.className =
"status error";

status.textContent =
"❌ This folder accepts audio files only.";

this.value =
"";

return;

}

}


if(uploadType === "video"){

if(
!file.type.startsWith(
"video/"
)
){

status.className =
"status error";

status.textContent =
"❌ This folder accepts video files only.";

this.value =
"";

return;

}

}


if(uploadType === "photo"){

if(
!file.type.startsWith(
"image/"
)
){

status.className =
"status error";

status.textContent =
"❌ This folder accepts image files only.";

this.value =
"";

return;

}

}


if(uploadType === "app"){

const name =
file.name.toLowerCase();

if(
!(
name.endsWith(".apk") ||
name.endsWith(".apks") ||
name.endsWith(".xapk")
)
){

status.className =
"status error";

status.textContent =
"❌ This folder accepts APK/app files only.";

this.value =
"";

return;

}

}


/* =====================================================
   UPLOAD AUTOMATICALLY
===================================================== */

uploadFile(file);

}

);

</script>

</body>

</html>
