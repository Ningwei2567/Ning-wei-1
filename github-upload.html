</style></head><body><div class="wrap"><header class="header"><img src="ning-wei.png" alt="Ning Wei Media"><div>

</div></div><script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://btksyizkcpzubtextuce.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJidGtz";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   CATEGORY LIST
===================================================== */

const groups = {

  "🎵 Music":[

    ["Top Ugandan Music","songs","Top-Ugandan-Music"],

    ["Amapiano Music","songs","Amapiano-Music"],

    ["Afrobeat Music","songs","Afrobeat-Music"],

    ["Dancehall Music","songs","Dancehall-Music"],

    ["R&B Music","songs","R-B-Music"],

    ["Reggae","songs","Reggae"],

    ["Old School R&B","songs","Old-School-R-B"],

    ["Old South African Music","songs","Old-South-African-Music"],

    ["Western Music","songs","Western-Music"],

    ["Love Songs","songs","Love-Songs"],

    ["Oldies / Kikadde Music","songs","Oldies-Kikadde-Music"],

    ["Kadongo Kamu","songs","Kadongo-Kamu"],

    ["High School Music","songs","High-School-Music"],

    ["Lingala Music","songs","Lingala-Music"],

    ["Instrumental","songs","Instrumental"]

  ],


  "📱 Apps":[

    ["Premium Unlocked Apps","apps","Premium-Unlocked-Apps"],

    ["Free Unlimited Internet VPNs","apps","Free-Unlimited-Internet-VPNs"],

    ["Social Media","apps","Social-Media"],

    ["Messaging","apps","Messaging"],

    ["Music & Audio","apps","Music-Audio"],

    ["Business & Work","apps","Business-Work"],

    ["Finance & Banking","apps","Finance-Banking"],

    ["Shopping","apps","Shopping"],

    ["Travel & Transport","apps","Travel-Transport"],

    ["News","apps","News"],

    ["Sports","apps","Sports"],

    ["Health & Fitness","apps","Health-Fitness"],

    ["Tools & Utilities","apps","Tools-Utilities"],

    ["File Management","apps","File-Management"],

    ["Security","apps","Security"]

  ],


  "💻 Software":[

    ["Virtual DJ Software","software","Virtual-DJ-Software"],

    ["Windows Software","software","Windows-Software"],

    ["Video Editing","software","Video-Editing"],

    ["Audio Editing","software","Audio-Editing"],

    ["Photo Editing","software","Photo-Editing"],

    ["Graphics & Design","software","Graphics-Design"],

    ["Mac Software","software","Mac-Software"],

    ["Linux Software","software","Linux-Software"],

    ["Android Software","software","Android-Software"],

    ["Office & Productivity","software","Office-Productivity"],

    ["Internet & Browsers","software","Internet-Browsers"],

    ["Security & Antivirus","software","Security-Antivirus"],

    ["File Management","software","File-Management"],

    ["Media Players","software","Media-Players"],

    ["Download Managers","software","Download-Managers"],

    ["Programming & Development","software","Programming-Development"],

    ["Utilities & Tools","software","Utilities-Tools"]

  ],


  "📸 Photos":[

    ["Trending Photos & Jokes","photos","Trending-Photos-Jokes"]

  ],


  "🎬 Videos":[

    ["Trending Videos","videos","Trending-Videos"]

  ],


  "🎧 DJ Mixes":[

    ["DJ Mixes","dj","DJ-Mixes"]

  ]

};


/* =====================================================
   BUILD CATEGORY MENU
===================================================== */

const categorySelect =
  document.getElementById("category");

for(
  const [group,items]
  of Object.entries(groups)
){

  const optgroup =
    document.createElement("optgroup");

  optgroup.label = group;

  for(
    const item
    of items
  ){

    const option =
      document.createElement("option");

    option.value =
      item[1] + "|" + item[2];

    option.textContent =
      item[0];

    optgroup.appendChild(option);

  }

  categorySelect.appendChild(
    optgroup
  );
}


/* =====================================================
   READ CATEGORY FROM URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const requestedCategory =
  params.get("category");

const requestedPath =
  params.get("path");


if(requestedCategory){

  const options =
    [...categorySelect.options];

  const found =
    options.find(
      option =>
        option.textContent
          .toLowerCase()
          .includes(
            requestedCategory
              .toLowerCase()
          )
    );

  if(found){

    categorySelect.value =
      found.value;

  }

}


/* =====================================================
   HELPERS
===================================================== */

function clean(value){

  return String(value || "")
    .replace(
      /[^a-zA-Z0-9._-]/g,
      "-"
    )
    .replace(
      /-+/g,
      "-"
    )
    .replace(
      /^-|-$/g,
      ""
    );

}


function mime(file){

  return (
    file.type ||
    "application/octet-stream"
  );

}


function uniqueName(file){

  return (
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,9) +
    "-" +
    clean(file.name)
  );

}


/* =====================================================
   STORAGE LOCATION
===================================================== */

function bucketAndFolder(
  type,
  folder
){

  if(type === "songs"){

    return [
      "songs",
      folder
    ];

  }


  if(
    type === "apps" ||
    type === "software"
  ){

    return [
      "artist-uploads",
      type + "/" + folder
    ];

  }


  if(type === "photos"){

    return [
      "artist-uploads",
      "photos/" + folder
    ];

  }


  if(type === "videos"){

    return [
      "artist-uploads",
      "videos/" + folder
    ];

  }


  return [
    "artist-uploads",
    "dj-mixes/" + folder
  ];

}


/* =====================================================
   UPLOAD ONE FILE
===================================================== */

async function uploadOne(
  file,
  bucket,
  folder
){

  const path =
    folder +
    "/" +
    uniqueName(file);


  const result =
    await db
      .storage
      .from(bucket)
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:mime(file),
          cacheControl:"3600"
        }
      );


  if(result.error){

    throw result.error;

  }


  return path;

}


/* =====================================================
   UPDATE SELECTED FILES
===================================================== */

document
  .getElementById("files")
  .addEventListener(
    "change",
    function(){

      const files =
        [...this.files];

      const box =
        document.getElementById(
          "selected"
        );


      if(!files.length){

        box.textContent =
          "No files selected.";

        return;

      }


      box.textContent =
        files.length +
        " file(s) selected: " +
        files
          .map(file => file.name)
          .join(", ");

    }
  );


/* =====================================================
   UPLOAD ALL
===================================================== */

async function uploadAll(){

  const button =
    document.getElementById(
      "upload"
    );

  const files =
    [
      ...document
        .getElementById("files")
        .files
    ];

  const status =
    document.getElementById(
      "status"
    );

  const fill =
    document.getElementById(
      "fill"
    );


  const artistName =
    document
      .getElementById(
        "artistName"
      )
      .value
      .trim();


  const email =
    document
      .getElementById(
        "email"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "description"
      )
      .value
      .trim();


  if(!artistName){

    status.className =
      "status error";

    status.textContent =
      "Please enter the artist / creator name.";

    return;

  }


  if(!email){

    status.className =
      "status error";

    status.textContent =
      "Please enter the email.";

    return;

  }


  if(!files.length){

    status.className =
      "status error";

    status.textContent =
      "Choose at least one media file.";

    return;

  }


  button.disabled = true;

  fill.style.width = "0%";

  status.className =
    "status";

  status.textContent =
    "Preparing upload...";


  try{

    const selected =
      categorySelect.value
        .split("|");


    const type =
      selected[0];

    const folder =
      selected[1];


    const location =
      bucketAndFolder(
        type,
        folder
      );


    const bucket =
      location[0];

    const baseFolder =
      location[1];


    let successful = 0;


    for(
      let i = 0;
      i < files.length;
      i++
    ){

      const file =
        files[i];


      status.textContent =
        "Uploading " +
        (i + 1) +
        " of " +
        files.length +
        ": " +
        file.name;


      const uploadedPath =
        await uploadOne(
          file,
          bucket,
          baseFolder
        );


      successful++;


      console.log(
        "Uploaded:",
        uploadedPath
      );


      fill.style.width =
        Math.round(
          ((i + 1) /
          files.length) *
          100
        ) + "%";

    }


    status.className =
      "status success";


    status.textContent =
      "✅ " +
      successful +
      " file(s) uploaded successfully.";


  }catch(error){

    console.error(
      "Upload error:",
      error
    );


    status.className =
      "status error";


    status.textContent =
      "❌ Upload failed: " +
      (
        error.message ||
        "Unknown error"
      );

  }finally{

    button.disabled =
      false;

  }

}


/* =====================================================
   BUTTON
===================================================== */

document
  .getElementById("upload")
  .addEventListener(
    "click",
    uploadAll
  );

</script></body>
</html>
