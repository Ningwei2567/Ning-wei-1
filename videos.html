<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media - Trending Videos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f7fa;
        color: #111;
    }

    header {
        background: #111;
        color: white;
        text-align: center;
        padding: 25px 15px;
    }

    header h1 {
        margin: 0 0 8px;
        font-size: 28px;
    }

    header p {
        margin: 0;
        font-size: 16px;
        color: #ddd;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        padding: 20px;
    }

    .title-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
    }

    .title {
        margin: 0;
        font-size: 26px;
    }

    .btn-direct-upload {
        background: linear-gradient(135deg, #e5a400, #b88300);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        padding: 12px 24px;
        border-radius: 10px;
        text-decoration: none;
        box-shadow: 0 3px 10px rgba(229,164,0,.3);
        transition: transform 0.1s ease;
    }

    .btn-direct-upload:active {
        transform: scale(0.97);
    }

    .video-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .video-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        display: flex;
        flex-direction: column;
    }

    .video-card video {
        width: 100%;
        height: 200px;
        background: #000;
        object-fit: cover;
    }

    .video-details {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
    }

    .video-title {
        font-size: 15px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .video-uploader {
        font-size: 12px;
        color: #666;
    }

    .download-btn {
        margin-top: auto;
        background: #25d366;
        color: white;
        text-align: center;
        padding: 8px 12px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        font-size: 13px;
        display: inline-block;
    }

    .error {
        padding: 30px;
        text-align: center;
        color: #777;
        background: white;
        border-radius: 12px;
        grid-column: 1 / -1;
    }

    @media (max-width: 800px) {
        .video-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
    }

    @media (max-width: 500px) {
        .video-grid {
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .video-card video {
            height: 210px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Ning Wei Media</h1>
    <p>Music • Videos • Photos • Apps • Software</p>
</header>

<div class="container">

    <div class="title-bar">
        <h2 class="title">🎬 Trending Videos</h2>
        <a href="upload.html?type=videos" class="btn-direct-upload">📤 Upload Direct Here</a>
    </div>

    <div class="video-grid" id="videoGrid">
        <div class="error">Loading videos...</div>
    </div>

</div>

<script>
/*
=================================================
SUPABASE CONFIG & INITIALIZATION
=================================================
*/
const SUPABASE_URL = "https://btksyizkcpzubtextuce.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/*
=================================================
GITHUB REPO CONFIG
=================================================
*/
const GITHUB_OWNER = "Ningwei2567";
const GITHUB_REPO  = "Ning-wei-1";
const GITHUB_BRANCH = "main";
const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/`;

const videoGrid = document.getElementById("videoGrid");

function isVideo(filename) {
    return /\.(mp4|webm|mov|m4v|3gp|mkv)$/i.test(filename);
}

function cleanName(name) {
    return String(name || "Untitled")
        .split("/").pop()
        .replace(/\.[^/.]+$/, "")
        .replace(/[_-]+/g, " ")
        .trim();
}

/*
=================================================
LOAD LIVE VIDEOS FROM SUPABASE
=================================================
*/
async function loadSupabaseVideos() {
    try {
        const { data, error } = await db
            .from("artist_submissions")
            .select("*")
            .eq("status", "approved")
            .order("posted_at", { ascending: false });

        if (error || !data) return [];

        const liveItems = [];

        data.forEach(row => {
            const files = Array.isArray(row.files) ? row.files : [];
            files.forEach(f => {
                const fname = String(f.name || f.original_name || "");
                if (f.type === "video" || isVideo(fname)) {
                    liveItems.push({
                        title: cleanName(fname),
                        url: f.url,
                        uploader: row.artist_name ? `Uploaded by ${row.artist_name}` : "Direct Upload"
                    });
                }
            });
        });

        return liveItems;
    } catch (err) {
        console.error("Error loading Supabase videos:", err);
        return [];
    }
}

/*
=================================================
LOAD VIDEOS FROM GITHUB
=================================================
*/
async function loadGithubVideos() {
    try {
        const api = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;
        const res = await fetch(api);
        if (!res.ok) return [];

        const data = await res.json();
        const tree = data.tree || [];
        const items = [];

        for (const file of tree) {
            if (file.type !== "blob") continue;
            if (isVideo(file.path)) {
                items.push({
                    title: cleanName(file.path),
                    url: RAW_BASE + file.path.split("/").map(encodeURIComponent).join("/"),
                    uploader: "Library Video"
                });
            }
        }
        return items;
    } catch (err) {
        console.error("Error loading GitHub videos:", err);
        return [];
    }
}

/*
=================================================
RENDER ALL VIDEOS
=================================================
*/
async function renderAllVideos() {
    const [supabaseVideos, githubVideos] = await Promise.all([
        loadSupabaseVideos(),
        loadGithubVideos()
    ]);

    const allVideos = [...supabaseVideos, ...githubVideos];
    videoGrid.innerHTML = "";

    if (!allVideos.length) {
        videoGrid.innerHTML = '<div class="error">No videos found.<br>Use the "Upload Direct Here" button above to add videos!</div>';
        return;
    }

    allVideos.forEach(item => {
        addVideoCard(item.url, item.title, item.uploader);
    });
}

function addVideoCard(src, title, subtitle) {
    const card = document.createElement("div");
    card.className = "video-card";

    const video = document.createElement("video");
    video.src = src;
    video.controls = true;
    video.preload = "metadata";

    const details = document.createElement("div");
    details.className = "video-details";

    const name = document.createElement("div");
    name.className = "video-title";
    name.textContent = title;

    const uploader = document.createElement("div");
    uploader.className = "video-uploader";
    uploader.textContent = subtitle;

    const download = document.createElement("a");
    download.className = "download-btn";
    download.href = src;
    download.download = title;
    download.target = "_blank";
    download.textContent = "📥 Download Video";

    details.appendChild(name);
    details.appendChild(uploader);
    details.appendChild(download);

    card.appendChild(video);
    card.appendChild(details);

    videoGrid.appendChild(card);
}

// Start
renderAllVideos();
</script>

</body>
</html>
