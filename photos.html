<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media - Photos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f7fa;
        color: #111;
    }

    header {
        background: #111;
        color: white;
        text-align: center;
        padding: 25px 15px;
    }

    header h1 {
        margin: 0 0 8px;
        font-size: 28px;
    }

    header p {
        margin: 0;
        font-size: 16px;
        color: #ddd;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        padding: 20px;
    }

    .title-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
    }

    .title {
        margin: 0;
        font-size: 26px;
    }

    .btn-direct-upload {
        background: linear-gradient(135deg, #e5a400, #b88300);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        padding: 12px 24px;
        border-radius: 10px;
        text-decoration: none;
        box-shadow: 0 3px 10px rgba(229,164,0,.3);
        transition: transform 0.1s ease;
    }

    .btn-direct-upload:active {
        transform: scale(0.97);
    }

    .photo-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }

    .photo-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        display: flex;
        flex-direction: column;
    }

    .photo-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .photo-card img:hover {
        transform: scale(1.03);
    }

    .photo-details {
        padding: 10px;
    }

    .photo-name {
        font-size: 13px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .photo-uploader {
        font-size: 11px;
        color: #777;
        margin-top: 2px;
    }

    .error {
        padding: 30px;
        text-align: center;
        color: #c00;
        background: white;
        border-radius: 12px;
    }

    /* Full-screen photo viewer */
    .viewer {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.95);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
    }

    .viewer img {
        max-width: 95%;
        max-height: 80%;
        object-fit: contain;
    }

    .viewer-controls {
        margin-top: 15px;
        display: flex;
        gap: 10px;
    }

    .download-btn {
        background: #25d366;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
    }

    .close {
        position: absolute;
        top: 15px;
        right: 25px;
        color: white;
        font-size: 40px;
        cursor: pointer;
    }

    @media (max-width: 800px) {
        .photo-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .photo-card img {
            height: 180px;
        }
    }

    @media (max-width: 450px) {
        .photo-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .photo-card img {
            height: 150px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Ning Wei Media</h1>
    <p>Music • Videos • Photos • Apps • Software</p>
</header>

<div class="container">

    <div class="title-bar">
        <h2 class="title">📷 Photos</h2>
        <a href="upload.html?type=photos" class="btn-direct-upload">📤 Upload Direct Here</a>
    </div>

    <div class="photo-grid" id="photoGrid"></div>

</div>

<!-- Full-screen viewer -->
<div class="viewer" id="viewer">
    <span class="close" onclick="closeViewer()">×</span>
    <img id="viewerImage" src="" alt="Photo">
    <div class="viewer-controls">
        <a id="downloadBtn" href="" download target="_blank" class="download-btn">📥 Download Photo</a>
    </div>
</div>

<script>
/*
=================================================
SUPABASE CONFIG & INITIALIZATION
=================================================
*/
const SUPABASE_URL = "https://btksyizkcpzubtextuce.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/*
=================================================
LOCAL HARDCODED PHOTOS
=================================================
*/
const localPhotos = [
    "IMG-20260830-WA0002.jpg",
    "IMG-20260903-WA0003.jpg",
    "IMG-20260903-WA0006.jpg",
    "IMG-20260903-WA0007.jpg",
    "IMG-20260903-WA0008.jpg",
    "IMG-20260903-WA0009.jpg",
    "IMG-20260903-WA0010.jpg",
    "IMG-20260903-WA0012.jpg",
    "IMG-20260903-WA0013.jpg",
    "IMG-20260903-WA0014.jpg",
    "IMG-20260903-WA0015.jpg",
    "IMG-20260903-WA0016.jpg",
    "IMG-20260903-WA0018.jpg"
];

const photoGrid = document.getElementById("photoGrid");

function isImage(filename) {
    return /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(filename);
}

function cleanName(name) {
    return String(name || "Untitled")
        .split("/").pop()
        .replace(/\.[^/.]+$/, "")
        .replace(/[_-]+/g, " ")
        .trim();
}

/*
=================================================
LOAD LIVE PHOTOS FROM SUPABASE
=================================================
*/
async function loadSupabasePhotos() {
    try {
        const { data, error } = await db
            .from("artist_submissions")
            .select("*")
            .eq("status", "approved")
            .order("posted_at", { ascending: false });

        if (error || !data) return [];

        const liveItems = [];

        data.forEach(row => {
            const files = Array.isArray(row.files) ? row.files : [];
            files.forEach(f => {
                const fname = String(f.name || f.original_name || "");
                if (f.type === "photo" || isImage(fname)) {
                    liveItems.push({
                        title: cleanName(fname),
                        url: f.url,
                        uploader: row.artist_name ? `By ${row.artist_name}` : "Direct Upload"
                    });
                }
            });
        });

        return liveItems;
    } catch (err) {
        console.error("Error loading Supabase photos:", err);
        return [];
    }
}

/*
=================================================
RENDER ALL PHOTOS
=================================================
*/
async function renderAllPhotos() {
    photoGrid.innerHTML = "";

    // Load Live Uploads first
    const livePhotos = await loadSupabasePhotos();

    livePhotos.forEach(item => {
        addPhotoCard(item.url, item.title, item.uploader);
    });

    // Add Local Files
    localPhotos.forEach(file => {
        addPhotoCard("media/photos/" + file, cleanName(file), "Local Library");
    });
}

function addPhotoCard(src, title, subtitle) {
    const card = document.createElement("div");
    card.className = "photo-card";

    const img = document.createElement("img");
    img.src = src;
    img.alt = title;

    img.onclick = function() {
        openViewer(src);
    };

    img.onerror = function() {
        card.innerHTML =
            '<div class="error">❌ Photo not found<br><small>' +
            title +
            '</small></div>';
    };

    card.appendChild(img);

    const details = document.createElement("div");
    details.className = "photo-details";

    const name = document.createElement("div");
    name.className = "photo-name";
    name.textContent = title;

    const uploader = document.createElement("div");
    uploader.className = "photo-uploader";
    uploader.textContent = subtitle;

    details.appendChild(name);
    details.appendChild(uploader);
    card.appendChild(details);

    photoGrid.appendChild(card);
}

function openViewer(src) {
    document.getElementById("viewerImage").src = src;
    document.getElementById("downloadBtn").href = src;
    document.getElementById("viewer").style.display = "flex";
}

function closeViewer() {
    document.getElementById("viewer").style.display = "none";
    document.getElementById("viewerImage").src = "";
    document.getElementById("downloadBtn").href = "";
}

document.getElementById("viewer").onclick = function(event) {
    if (event.target === this) {
        closeViewer();
    }
};

// Start
renderAllPhotos();
</script>

</body>
</html>
