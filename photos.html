<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media - Photos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    /* ============================================================
     * photos.html — Phase 1 modified
     * Original kept intact; viewer converted to inline stage +
     * prev/next + swipe + metadata. Local + live photos sorted
     * newest-first (live by posted_at, local by filename recency).
     * ============================================================ */
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f7fa;
        color: #111;
    }

    header {
        background: #111;
        color: white;
        text-align: center;
        padding: 25px 15px;
    }
    header h1 { margin: 0 0 8px; font-size: 28px; }
    header p { margin: 0; font-size: 16px; color: #ddd; }

    .container { max-width: 1200px; margin: auto; padding: 20px; }

    .title-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
    }
    .title { margin: 0; font-size: 26px; }
    .btn-direct-upload {
        background: linear-gradient(135deg, #e5a400, #b88300);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        padding: 12px 24px;
        border-radius: 10px;
        text-decoration: none;
        box-shadow: 0 3px 10px rgba(229,164,0,.3);
        transition: transform 0.1s ease;
    }
    .btn-direct-upload:active { transform: scale(0.97); }

    .photo-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }
    .photo-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        display: flex;
        flex-direction: column;
    }
    .photo-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
        cursor: pointer;
        transition: transform 0.2s;
    }
    .photo-card img:hover { transform: scale(1.03); }
    .photo-details { padding: 10px; }
    .photo-name {
        font-size: 13px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .photo-uploader { font-size: 11px; color: #777; margin-top: 2px; }
    .error { padding: 30px; text-align: center; color: #c00; background: white; border-radius: 12px; }

    /* ============================================================
     * PHASE 1: inline viewer stage (was fullscreen-only overlay)
     * ============================================================ */
    .viewer {
        display: none;
        background: #000;
        border-radius: 12px;
        margin-bottom: 20px;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(0,0,0,.25);
        position: relative;
    }
    .viewer.open { display: block; }
    .viewer-stage {
        position: relative;
        width: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 250px;
    }
    .viewer-stage img {
        max-width: 100%;
        max-height: 70vh;
        object-fit: contain;
        display: block;
    }

    /* Prev / next arrows */
    .nav-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0,0,0,.6);
        color: #fff;
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        z-index: 5;
    }
    .nav-arrow:hover { background: #e50914; }
    .nav-arrow.prev { left: 8px; }
    .nav-arrow.next { right: 8px; }
    .nav-arrow:disabled { opacity: .3; cursor: not-allowed; }

    /* Viewer header (title + download + close) */
    .viewer-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: #111;
        color: #fff;
    }
    .viewer-header .v-title {
        flex: 1;
        font-size: 15px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .viewer-header .v-close {
        background: transparent;
        border: 1px solid #444;
        color: #fff;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
    }
    .viewer-header .v-close:hover { background: #e50914; border-color: #e50914; }
    .viewer-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px 14px;
        background: #111;
        color: #aaa;
        font-size: 12px;
        border-top: 1px solid #222;
    }
    .viewer-meta .v-avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        object-fit: cover;
        background: #333;
        border: 1px solid #444;
    }
    .viewer-meta .v-uploader { color: #e50914; font-weight: bold; }

    .download-btn {
        background: #e50914;
        color: white;
        padding: 8px 14px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        font-size: 13px;
        white-space: nowrap;
    }
    .download-btn:hover { background: #b00710; }

    /* Section heading above the grid */
    .grid-heading {
        margin: 4px 0 12px;
        font-size: 16px;
        font-weight: 800;
        color: #111;
    }

    @media (max-width: 800px) {
        .photo-grid { grid-template-columns: repeat(2, 1fr); }
        .photo-card img { height: 180px; }
    }
    @media (max-width: 450px) {
        .photo-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .photo-card img { height: 150px; }
    }
</style>
</head>

<body>

<header>
    <h1>Ning Wei Media</h1>
    <p>Music • Videos • Photos • Apps • Software</p>
</header>

<div class="container">

    <div class="title-bar">
        <h2 class="title">📷 Photos</h2>
        <a href="upload.html?type=photos" class="btn-direct-upload">📤 Upload Direct Here</a>
    </div>

    <!-- Phase 1: inline viewer stage (was a dead fullscreen overlay) -->
    <div class="viewer" id="viewer">
        <div class="viewer-stage" id="viewerStage">
            <button class="nav-arrow prev" id="prevBtn" aria-label="Previous photo">‹</button>
            <button class="nav-arrow next" id="nextBtn" aria-label="Next photo">›</button>
        </div>
        <div class="viewer-header">
            <div class="v-title" id="viewerTitle">Photo</div>
            <a id="downloadBtn" class="download-btn" href="" download target="_blank">📥 Download</a>
            <button class="v-close" id="closeBtn" aria-label="Close viewer">×</button>
        </div>
        <div class="viewer-meta">
            <img class="v-avatar" id="viewerAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="">
            <span class="v-uploader" id="viewerUploader">Ning Wei Media</span>
            <span>·</span>
            <span id="viewerDate">—</span>
        </div>
    </div>

    <div class="grid-heading">All Photos</div>
    <div class="photo-grid" id="photoGrid"></div>

</div>

<script>
/*
=================================================
SUPABASE CONFIG & INITIALIZATION
=================================================
*/
const SUPABASE_URL = "https://btksyizkcpzubtextuce.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/*
=================================================
LOCAL HARDCODED PHOTOS
=================================================
*/
const localPhotos = [
    "IMG-20260830-WA0002.jpg",
    "IMG-20260903-WA0003.jpg",
    "IMG-20260903-WA0006.jpg",
    "IMG-20260903-WA0007.jpg",
    "IMG-20260903-WA0008.jpg",
    "IMG-20260903-WA0009.jpg",
    "IMG-20260903-WA0010.jpg",
    "IMG-20260903-WA0012.jpg",
    "IMG-20260903-WA0013.jpg",
    "IMG-20260903-WA0014.jpg",
    "IMG-20260903-WA0015.jpg",
    "IMG-20260903-WA0016.jpg",
    "IMG-20260903-WA0018.jpg"
];

const photoGrid = document.getElementById("photoGrid");

function isImage(filename) {
    return /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(filename);
}

function cleanName(name) {
    return String(name || "Untitled")
        .split("/").pop()
        .replace(/\.[^/.]+$/, "")
        .replace(/[_-]+/g, " ")
        .trim();
}

function escAttr(s) {
    return String(s ?? '').replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDate(iso) {
    if (!iso) return '—';
    try {
        return new Date(iso).toLocaleDateString('en-US',
            { month:'long', day:'numeric', year:'numeric' });
    } catch { return String(iso).slice(0,10); }
}

/*
=================================================
Phase 1: state
=================================================
*/
let allPhotos = [];          // flattened list (live + local)
let currentIndex = -1;       // currently shown photo index in allPhotos

/*
=================================================
LOAD LIVE PHOTOS FROM SUPABASE
=================================================
*/
async function loadSupabasePhotos() {
    try {
        const { data, error } = await db
            .from("artist_submissions")
            .select("*")
            .eq("status", "approved")
            .order("posted_at", { ascending: false });

        if (error || !data) return [];

        const liveItems = [];

        data.forEach(row => {
            const files = Array.isArray(row.files) ? row.files : [];
            const avatar = row.cover_url || row.artist_cover || row.profile_pic || '';
            const isoDate = row.posted_at || row.created_at || row.uploaded_at || '';

            files.forEach(f => {
                const fname = String(f.name || f.original_name || "");
                if (f.type === "photo" || isImage(fname)) {
                    liveItems.push({
                        title: cleanName(fname),
                        url: f.url,
                        uploader: row.artist_name || "Direct Upload",
                        avatar: avatar,
                        date: isoDate ? formatDate(isoDate) : "",
                        isoDate: isoDate,
                        source: 'live'
                    });
                }
            });
        });

        return liveItems;
    } catch (err) {
        console.error("Error loading Supabase photos:", err);
        return [];
    }
}

/*
=================================================
BUILD LOCAL PHOTO ITEMS
- Phase 1 C14: local photos also get a sortable date.
  We derive it from the WhatsApp IMG-YYYYMMDD-WA#### pattern
  (your filenames all follow this); falls back to filename order.
=================================================
*/
function buildLocalPhotos() {
    return localPhotos.map((file, idx) => {
        // IMG-20260830-WA0002.jpg → 2026-08-30
        const m = file.match(/IMG-(\d{4})(\d{2})(\d{2})-WA(\d+)/i);
        const isoDate = m
            ? `${m[1]}-${m[2]}-${m[3]}`
            : '';
        return {
            title: cleanName(file),
            url: "media/photos/" + file,
            uploader: "Local Library",
            avatar: '',
            date: isoDate ? formatDate(isoDate) : '',
            isoDate: isoDate,
            // Preserve original order as fallback key for sort
            _localOrder: idx,
            source: 'local'
        };
    });
}

/*
=================================================
RENDER ALL PHOTOS
=================================================
*/
async function renderAllPhotos() {
    photoGrid.innerHTML = "";

    // Live first, then local
    const livePhotos = await loadSupabasePhotos();
    const localItems = buildLocalPhotos();

    // Phase 1 C14: combined sort, newest-first
    allPhotos = [...livePhotos, ...localItems].sort((a, b) => {
        if (a.isoDate && b.isoDate) {
            return new Date(b.isoDate).getTime() - new Date(a.isoDate).getTime();
        }
        if (a.isoDate && !b.isoDate) return -1;
        if (!a.isoDate && b.isoDate) return 1;
        return (a._localOrder || 0) - (b._localOrder || 0);
    });

    allPhotos.forEach((item, i) => {
        addPhotoCard(item, i);
    });

    attachViewerNav();
}

function addPhotoCard(item, index) {
    const card = document.createElement("div");
    card.className = "photo-card";

    const img = document.createElement("img");
    img.src = item.url;
    img.alt = item.title;
    img.loading = "lazy";

    img.onclick = function() {
        openViewer(index);
    };

    img.onerror = function() {
        card.innerHTML =
            '<div class="error">❌ Photo not found<br><small>' +
            escAttr(item.title) +
            '</small></div>';
    };

    card.appendChild(img);

    const details = document.createElement("div");
    details.className = "photo-details";

    const name = document.createElement("div");
    name.className = "photo-name";
    name.textContent = item.title;

    const uploader = document.createElement("div");
    uploader.className = "photo-uploader";
    const subBits = [item.uploader];
    if (item.date) subBits.push(item.date);
    uploader.textContent = subBits.join(' • ');

    details.appendChild(name);
    details.appendChild(uploader);
    card.appendChild(details);

    photoGrid.appendChild(card);
}

/*
=================================================
Phase 1: viewer with prev/next + swipe + metadata
=================================================
*/
function openViewer(index) {
    currentIndex = index;
    renderCurrent();
    const viewer = document.getElementById('viewer');
    viewer.classList.add('open');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeViewer() {
    const viewer = document.getElementById('viewer');
    viewer.classList.remove('open');
    const stage = document.getElementById('viewerStage');
    [...stage.querySelectorAll('img')].forEach(n => n.remove());
}

function renderCurrent() {
    const item = allPhotos[currentIndex];
    if (!item) return;

    const stage = document.getElementById('viewerStage');
    [...stage.querySelectorAll('img')].forEach(n => n.remove());
    stage.insertAdjacentHTML('beforeend',
        `<img src="${escAttr(item.url)}" alt="${escAttr(item.title)}">`);

    document.getElementById('viewerTitle').textContent = item.title;
    document.getElementById('viewerUploader').textContent = item.uploader;
    document.getElementById('viewerDate').textContent = item.date || '—';

    const dl = document.getElementById('downloadBtn');
    dl.href = item.url;
    dl.setAttribute('download', item.title || '');

    const av = document.getElementById('viewerAvatar');
    if (item.avatar) {
        av.src = item.avatar;
    }
    av.onerror = function () {
        av.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
    };

    document.getElementById('prevBtn').disabled = allPhotos.length <= 1;
    document.getElementById('nextBtn').disabled = allPhotos.length <= 1;
}

function navigate(delta) {
    if (!allPhotos.length) return;
    currentIndex = (currentIndex + delta + allPhotos.length) % allPhotos.length;
    renderCurrent();
}

function attachViewerNav() {
    const prev = document.getElementById('prevBtn');
    const next = document.getElementById('nextBtn');
    const close = document.getElementById('closeBtn');

    // Replace to drop any old listeners
  [prev, next, close].forEach(el => {
    const fresh = el.cloneNode(true);
    el.parentNode.replaceChild(fresh, el);
  });

    document.getElementById('prevBtn').addEventListener('click', () => navigate(-1));
    document.getElementById('nextBtn').addEventListener('click', () => navigate(1));
    document.getElementById('closeBtn').addEventListener('click', closeViewer);

    // Swipe on the stage
    const stage = document.getElementById('viewerStage');
    const freshStage = stage.cloneNode(true);
    stage.parentNode.replaceChild(freshStage, stage);

    const w = document.getElementById('viewerStage');
    let tx = 0;
    w.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
    w.addEventListener('touchend',   e => {
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
    }, { passive: true });

    // Keyboard arrows
    document.removeEventListener('keydown', onViewerKey);
    document.addEventListener('keydown', onViewerKey);
}
function onViewerKey(e) {
    const viewer = document.getElementById('viewer');
    if (!viewer.classList.contains('open')) return;
    if (e.key === 'ArrowLeft')  navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
    if (e.key === 'Escape')     closeViewer();
}

// Start
renderAllPhotos();
</script>

</body>
</html>
