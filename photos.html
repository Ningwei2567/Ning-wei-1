<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photos</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
<div class="header-content">
<h1>📸 Trending Photos</h1>
<p>View photos</p>
</div>
</header>

<main class="container">

<a class="back" href="index.html">← Back to Home</a>

<input class="search" placeholder="Search photos..."
oninput="filter(this.value)">

<div id="list" class="list"></div>

</main>

<script>

const repo="Ningwei2567/Ning-wei-1";
const base="media/photos";

fetch(`https://api.github.com/repos/${repo}/contents/${base}`)
.then(r=>r.json())
.then(data=>{

const list=document.getElementById("list");

data
.filter(x=>x.name!=="index.html")
.forEach((x,i)=>{

const a=document.createElement("a");

a.className="item";

a.href=x.type==="dir"
?`browser.html?base=${encodeURIComponent(x.path)}`
:`media.html?path=${encodeURIComponent(x.path)}`;

a.innerHTML=`
<div class="num">${i+1}</div>
<div class="icon">${x.type==="dir"?"📁":"🖼️"}</div>
<div class="text">
<div class="title">${x.name}</div>
<div class="sub">${x.type==="dir"?"Folder":"Photo"}</div>
</div>
<div class="arrow">›</div>
`;

list.appendChild(a);

});

});

function filter(q){

q=q.toLowerCase();

document.querySelectorAll(".item").forEach(x=>{
x.style.display=
x.innerText.toLowerCase().includes(q)?"":"none";
});

}

</script>

</body>
</html>
