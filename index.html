<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ning Wei Media - Music</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f7fa;
 color:#111;
}
.header{
 height:205px;
 position:relative;
 overflow:hidden;
}
.header img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.header:after{
 content:"";
 position:absolute;
 inset:0;
 background:rgba(100,190,230,.45);
}
.title{
 position:absolute;
 z-index:2;
 bottom:28px;
 left:6%;
 color:white;
 font-size:42px;
 font-weight:bold;
 text-shadow:0 3px 5px #333;
}
.search{
 width:92%;
 margin:25px auto;
}
.search input{
 width:100%;
 height:62px;
 border-radius:35px;
 border:1px solid #ccc;
 padding:0 25px;
 font-size:22px;
}
.main{
 width:92%;
 max-width:1000px;
 margin:auto;
}
.back{
 display:inline-block;
 margin-bottom:15px;
 text-decoration:none;
 color:#1689ad;
 font-size:20px;
 font-weight:bold;
}
.list{
 display:flex;
 flex-direction:column;
 gap:12px;
}
.row{
 background:white;
 border-radius:18px;
 min-height:82px;
 display:flex;
 align-items:center;
 padding:10px 14px;
 box-shadow:0 3px 12px #ddd;
 text-decoration:none;
 color:#111;
}
.num{
 width:58px;
 height:58px;
 min-width:58px;
 border-radius:50%;
 background:#000;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:25px;
 font-weight:bold;
 margin-right:18px;
}
.icon{
 font-size:35px;
 width:55px;
}
.name{
 flex:1;
 font-size:21px;
 font-weight:bold;
}
.type{
 display:block;
 color:#777;
 font-size:15px;
 margin-top:5px;
}
.arrow{
 font-size:32px;
 color:#1689ad;
}
.error{
 background:white;
 padding:25px;
 border-radius:15px;
 color:#c00;
}
</style>
</head>

<body>

<div class="header">
<img src="ning-wei.png">
<div class="title">🎵 Ning Wei Media</div>
</div>

<div class="search">
<input id="search" placeholder="Search music..." oninput="filterList()">
</div>

<div class="main">
<a class="back" id="back" href="index.html">← Back</a>

<div id="list" class="list">
Loading...
</div>
</div>

<script>
const API="https://api.github.com/repos/Ningwei2567/Ning-wei-1/contents/";
const BASE="media/songs";

const params=new URLSearchParams(location.search);
let current=params.get("path") || BASE;

async function load(){
 try{
  const res=await fetch(API+current);
  if(!res.ok)throw new Error("Folder could not be loaded");

  let items=await res.json();

  items=items.filter(x=>
   x.name!=="index.html" &&
   x.name!=="folder.html" &&
   x.name!=="README.txt"
  );

  items.sort((a,b)=>{
   if(a.type!==b.type)return a.type==="dir"?-1:1;
   return a.name.localeCompare(b.name);
  });

  const list=document.getElementById("list");
  list.innerHTML="";

  if(current!==BASE){
   document.getElementById("back").href=
    "audio.html?path="+encodeURIComponent(
      current.substring(0,current.lastIndexOf("/"))
    );
  }

  items.forEach((item,i)=>{
   const row=document.createElement("a");
   row.className="row";
   row.dataset.name=item.name.toLowerCase();

   const number=i+1;

   if(item.type==="dir"){
    row.href="audio.html?path="+encodeURIComponent(item.path);
    row.innerHTML=`
      <div class="num">${number}</div>
      <div class="icon">📁</div>
      <div class="name">${item.name}</div>
      <div class="arrow">›</div>
    `;
   }else{
    const ext=item.name.split(".").pop().toLowerCase();
    const audio=["mp3","wav","m4a","aac","ogg","oga","opus","flac"];

    if(!audio.includes(ext))return;

    row.href="media.html?path="+encodeURIComponent(item.path);
    row.innerHTML=`
      <div class="num">${number}</div>
      <div class="icon">▶️</div>
      <div class="name">
        ${item.name}
        <span class="type">Audio</span>
      </div>
      <div class="arrow">›</div>
    `;
   }

   list.appendChild(row);
  });

 }catch(e){
  document.getElementById("list").innerHTML=
   `<div class="error">${e.message}</div>`;
 }
}

function filterList(){
 const q=document.getElementById("search").value.toLowerCase();
 document.querySelectorAll(".row").forEach(x=>{
  x.style.display=x.dataset.name.includes(q)?"flex":"none";
 });
}

load();
</script>

</body>
</html>
