<style>

*{
 box-sizing:border-box

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5fbff;
 color:#111
}


/* HEADER */

.header{
 position:relative;
 height:318px;
 overflow:hidden;
 background:#8ed8f5
}

.header img{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center 20%
}

.overlay{
 position:absolute;
 inset:0;
 background:rgba(55,145,205,.38)
}

.headerText{
 position:absolute;
 bottom:25px;
 width:100%;
 text-align:center;
 color:white;
 text-shadow:0 2px 6px #000
}

.headerText h1{
 margin:0;
 font-size:31px
}

.headerText p{
 margin:6px 0 0;
 font-size:14px
}


/* SEARCH */

.search{
 width:94%;
 margin:12px auto;
 position:relative
}

.search input{
 width:100%;
 padding:13px 17px;
 border:1px solid #cbdde7;
 border-radius:30px;
 font-size:15px;
 outline:none
}


/* MAIN */

.container{
 width:94%;
 max-width:700px;
 margin:auto
}


/* MENU */

.menu{
 background:white;
 border-radius:14px;
 overflow:hidden;
 box-shadow:0 2px 10px #0001
}

.item{
 display:flex;
 align-items:center;
 min-height:48px;
 padding:6px 10px;
 border-bottom:1px solid #edf2f5;
 text-decoration:none;
 color:#111
}

.item:last-child{
 border-bottom:0
}

.number{
 width:30px;
 height:30px;
 min-width:30px;
 border-radius:50%;
 background:#000;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 font-size:13px;
 margin-right:10px
}

.text{
 flex:1;
 font-size:14px;
 font-weight:600
}

.arrow{
 color:#087db5;
 font-size:24px
}


/* SEARCH RESULTS */

#results{
 margin-top:12px;
 display:none
}

.resultsTitle{
 font-size:17px;
 font-weight:bold;
 color:#087db5;
 margin:10px 3px
}

.result{
 display:flex;
 align-items:center;
 background:white;
 border-radius:10px;
 padding:9px;
 margin-bottom:7px;
 box-shadow:0 1px 6px #0001;
 text-decoration:none;
 color:#111
}

.resultIcon{
 width:38px;
 height:38px;
 min-width:38px;
 border-radius:50%;
 background:#087db5;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 margin-right:10px
}

.resultText{
 overflow:hidden
}

.resultName{
 font-weight:bold;
 font-size:14px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.resultArtist{
 color:#777;
 font-size:12px;
 margin-top:3px
}


/* SECTIONS */

.section{
 margin-top:15px;
 background:white;
 border-radius:14px;
 padding:12px;
 box-shadow:0 2px 10px #0001
}

.sectionTitle{
 color:#087db5;
 font-weight:bold;
 font-size:17px;
 margin-bottom:10px
}


/* APP ICONS */

.apps{
 display:flex;
 gap:9px;
 overflow-x:auto
}

.app{
 min-width:60px;
 text-align:center;
 font-size:10px;
 font-weight:bold
}

.appIcon{
 width:48px;
 height:48px;
 border-radius:50%;
 margin:auto auto 5px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:23px
}


/* SOCIAL */

.social{

 gap:10px;
 flex-wrap:wrap
}

.social a{
 width:42px;
 height:42px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:white;

 font-weight:bold;
 font-size:17px
}

.instagram{background:#e1306c}

<script>


/* =====================================================
   SUPABASE SEARCH
===================================================== */

const SUPABASE_URL=
"https://btksyizkcpzubtextuce.supabase.co";


const SUPABASE_KEY=
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";


const searchInput=
document.getElementById("search");

const results=
document.getElementById("results");

const resultList=
document.getElementById("resultList");


let timer=null;


searchInput.addEventListener(
"input",
function(){

 clearTimeout(timer);

 timer=setTimeout(
 runSearch,
 300
 );

});


async function runSearch(){

 const q=
 searchInput.value.trim();


 if(q.length<2){

   results.style.display="none";

   resultList.innerHTML="";

   return;

 }


 results.style.display="block";

 resultList.innerHTML=
 "<div class='result'>"+
 "🔎 Searching..."+
 "</div>";


 try{

   const url=
   SUPABASE_URL+
   "/rest/v1/artist_submissions"+
   "?select=id,artist_name,files,created_at"+
   "&status=eq.approved"+
   "&or=("+
   "artist_name.ilike.*"+
   encodeURIComponent(q)+
   "*" +
   ",files.cs."+encodeURIComponent(
   JSON.stringify([
     {name:q}
   ])
   )+
   ")"+
   "&order=created_at.desc";


   const response=
   await fetch(
     url,
     {
       headers:{
         "apikey":SUPABASE_KEY,
         "Authorization":
         "Bearer "+SUPABASE_KEY
       }
     }
   );


   if(!response.ok){

     throw new Error(
       "Search error "+response.status
     );

   }


   const data=
   await response.json();


   const matches=[];


   data.forEach(item=>{

     if(
       item.artist_name
       .toLowerCase()
       .includes(q.toLowerCase())
     ){

       matches.push({

         artist:item.artist_name,

         name:item.artist_name+
         " — Artist Profile",

         url:"#"

       });

     }


     if(
       Array.isArray(item.files)
     ){

       item.files.forEach(file=>{

         if(
           file.type==="song" &&
           file.name &&
           file.name
           .toLowerCase()
           .includes(q.toLowerCase())
         ){

           matches.push({

             artist:item.artist_name,

             name:file.name,

             url:file.url

           });

         }

       });

     }

   });


   if(!matches.length){

     resultList.innerHTML=
     "<div class='result'>"+
     "No music found for "+
     "<strong>"+escapeHtml(q)+
     "</strong>"+
     "</div>";

     return;

   }


   resultList.innerHTML="";


   matches.forEach(item=>{

     const a=
     document.createElement("a");

     a.className="result";

     a.href=
     item.url;


     a.innerHTML=

     "<div class='resultIcon'>🎵</div>"+

     "<div class='resultText'>"+

     "<div class='resultName'>"+
     escapeHtml(item.name)+
     "</div>"+

     "<div class='resultArtist'>"+
     "Artist: "+
     escapeHtml(item.artist)+
     "</div>"+

     "</div>";


     resultList.appendChild(a);

   });


 }catch(error){

   console.error(error);

   resultList.innerHTML=
   "<div class='result'>"+
   "❌ Search unavailable right now."+
   "</div>";

 }

}


function escapeHtml(text){

 return String(text)

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

</script>
