<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ning Wei Media - Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #f5f5f7;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 40px;
        }

        /* Banner Header with Centered Face Image */
        .banner {
            position: relative;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.5)), url('ning-wei.png');
            background-size: cover;
            background-position: center 30% !important;
            background-repeat: no-repeat;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .banner h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .banner p {
            margin: 4px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.95;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        /* Search Bar Component */
        .search-container {
            padding: 15px 15px 10px 15px;
            display: flex;
            justify-content: center;
        }

        .search-box {
            width: 100%;
            background: #ffffff;
            border-radius: 25px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e5e5ea;
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 1rem;
            color: #333;
        }

        /* Native File Selector Upload Area */
        .upload-section {
            padding: 0 15px 15px 15px;
        }

        .btn-upload-direct {
            width: 100%;
            background-color: #128c9e;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(18, 140, 158, 0.2);
        }

        /* Section Headings Styling */
        .section-header {
            padding: 15px 15px 10px 15px;
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 7 CORE COMPACT CATEGORY LIST ROWS */
        .list-container {
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-item {
            background: #ffffff;
            border-radius: 14px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(0,0,0,0.02);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .item-left-block {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .number-badge {
            width: 32px;
            height: 32px;
            background: #000000;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .row-icon {
            width: 26px;
            height: 26px;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .text-meta-box {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 6px;
            min-width: 0;
            flex: 1;
            flex-wrap: wrap;
        }

        .text-title { font-size: 1rem; font-weight: 700; color: #1d1d1f; margin: 0; }
        .text-subtitle { font-size: 0.78rem; color: #86868b; margin: 0; }
        .arrow-indicator { color: #0071e3; font-size: 1.1rem; font-weight: bold; padding-left: 8px; flex-shrink: 0; }

        /* TRENDING APPS GRID SYSTEM - COMPACT CIRCULAR DESIGN */
        .apps-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 15px;
        }

        .grid-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #000000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .grid-number {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffffff;
            background: #000000;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            flex-shrink: 0;
        }

        /* Circular Colored App Icons styling */
        .app-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            margin-right: 12px;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .app-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* FOLLOW ME CARD BLOCK DESIGN */
        .follow-card {
            background: #ffffff;
            border-radius: 24px;
            margin: 25px 15px 0 15px;
            padding: 20px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            text-align: center;
            border: 1px solid #eef2f5;
        }

        .follow-card h2 {
            margin: 0 0 15px 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #0076df;
        }

        .social-buttons-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Top Visual Profile Banner -->
        <div class="banner">
            <h1>Ning Wei Media</h1>

        <!-- Search Filtering Bar -->
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" onkeyup="filterEverything()" placeholder="Search everything...">

        <!-- Functional Device Upload System Module -->
        <div class="upload-section">

            <button onclick="document.getElementById('homeSelector').click()" class="btn-upload-direct">
                🎤 Upload Your Music Here
            </button>
        </div>

        <h2 class="section-header">Ning Wei Media</h2>
