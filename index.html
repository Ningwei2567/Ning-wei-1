<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media</title>

<style>

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f7;
color:#111;
}

a{
-webkit-tap-highlight-color:transparent;
font-family:inherit;
}

.container{
width:100%;
max-width:600px;
margin:auto;
min-height:100vh;
padding-bottom:25px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{

height:150px;

position:relative;
overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

text-align:center;

color:white;
background:#000;

}

.header img{

position:absolute;

left:0;
top:0;

width:100%;
height:150px;

object-fit:cover;
object-position:center 35%;

}

.header-content{

position:relative;
z-index:2;

padding:8px 15px;

text-shadow:
0 2px 5px rgba(0,0,0,.9),
0 1px 2px rgba(0,0,0,.9);

}

.header h1{

margin:0;

font-size:30px;
font-weight:800;

}

.header p{

margin:8px 0 0;

font-size:15px;

}


/* =========================================================
   SECTION HEADINGS
   ========================================================= */

.section{

padding:14px 18px 4px;

}

.section h2{

margin:0 0 10px;

font-size:24px;
font-weight:800;

}


/* =========================================================
   EXPLORE
   ========================================================= */

.explore-list{

display:flex;

flex-direction:column;

gap:8px;

padding:0 18px;

}

.explore-row{

display:flex;

align-items:center;

min-height:60px;

padding:8px 12px;

background:#fff;

border:1px solid #ddd;

border-radius:12px;

text-decoration:none;

color:#111;

box-shadow:
0 2px 7px rgba(0,0,0,.06);

}

.number{

width:42px;
height:42px;

min-width:42px;

border-radius:50%;

display:flex;

align-items:center;
justify-content:center;

background:#000;
color:#fff;

font-size:17px;
font-weight:800;

margin-right:12px;

}

.category-name{

font-size:17px;
font-weight:700;

}


/* =========================================================
   TRENDING APPS
   ========================================================= */

.trending{

padding:20px 18px 5px;

}

.trending h2{

margin:0 0 10px;

font-size:24px;
font-weight:800;

}


/*
   Small compact grid so ten apps fit naturally
   without making the homepage unnecessarily long.
*/

.apps{

display:grid;

grid-template-columns:
repeat(5,minmax(0,1fr));

gap:8px;

}

.app{

display:flex;

flex-direction:column;

align-items:center;
justify-content:center;

min-height:86px;

padding:8px 3px;

background:#fff;

border-radius:11px;

text-decoration:none;

color:#111;

box-shadow:
0 2px 7px rgba(0,0,0,.07);

}

.app-logo{

width:43px;
height:43px;

object-fit:contain;

display:block;

margin-bottom:6px;

}

.app-name{

font-size:9px;

font-weight:700;

text-align:center;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

width:100%;

}


/* =========================================================
   FOLLOW US
   ========================================================= */

.social{

padding:20px 18px 10px;

}

.social h2{

margin:0 0 12px;

font-size:24px;

}

.social-list{

display:flex;

justify-content:center;

align-items:center;

gap:12px;

}

.social a{

width:42px;
height:42px;

border-radius:50%;

display:flex;

align-items:center;
justify-content:center;

background:#000;

overflow:hidden;

}

.social img{

width:25px;
height:25px;

object-fit:contain;

}


/* =========================================================
   FOOTER
   ========================================================= */

.footer{

padding:20px 15px;

text-align:center;

font-size:12px;

color:#777;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:420px){

.header{

height:150px;

}

.header img{

height:150px;

}

.header h1{

font-size:27px;

}

.header p{

font-size:13px;

}

.section h2,
.trending h2,
.social h2{

font-size:22px;

}

.explore-list{

padding:0 18px;

}

.explore-row{

min-height:56px;

}

.number{

width:38px;
height:38px;

min-width:38px;

font-size:15px;

}

.category-name{

font-size:16px;

}


/* Five small apps across the screen */

.apps{

grid-template-columns:
repeat(5,minmax(0,1fr));

gap:6px;

}

.app{

min-height:80px;

padding:7px 2px;

}

.app-logo{

width:36px;
height:36px;

}

.app-name{

font-size:8px;

}

.social-list{

gap:10px;

}

.social a{

width:38px;
height:38px;

}

.social img{

width:22px;
height:22px;

}

}

</style>

</head>
