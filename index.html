<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ning Wei Media - Home</title>
    <style>
        /* Modern clean mobile shell alignment */
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #f5f5f7;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 30px;
        }

        /* Banner Header Section Layout */
        .banner {
            position: relative;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.5)), url('ning-wei.png');
            background-size: cover;
            background-position: center;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .banner h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .banner p {
            margin: 4px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.95;
            letter-spacing: 0.5px;
        }

        /* Search Section Wrapper Container */
        .search-container {
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .search-box {
            width: 100%;
            background: #ffffff;
            border-radius: 25px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e5e5ea;
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 1rem;
            color: #333;
        }

        /* Home Page Core Title Header Label */
        .section-header {
            padding: 0 15px 10px 15px;
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #000000;
        }

        /* MASTER REBUILT COMPACT LIST ROWS CONFIGURATION */
        .list-container {
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-item {
            background: #ffffff;
            border-radius: 14px;
            padding: 8px 12px; /* Slim compact outer spacing matching your folders */
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(0,0,0,0.02);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .item-left-block {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        /* Tiny Crisp Black Circles */
        .number-badge {
            width: 32px;
            height: 32px;
            background: #000000;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            margin-right: 12px;
            flex-shrink: 0;
        }

        /* Universal Inline Icon Spacing Setup */
        .row-icon {
            width: 26px;
            height: 26px;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .row-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Clean Compact Text Content Sizing Layout */
        .text-meta-box {
            display: flex;
            flex-direction: row; /* Puts title and text description inline */
            align-items: baseline;
            gap: 6px;
            min-width: 0;
            flex: 1;
            flex-wrap: wrap; /* Prevents text overflow breaks on small devices */
        }

        .text-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1d1d1f;
            margin: 0;
        }

        .text-subtitle {
            font-size: 0.78rem;
            color: #86868b;
            margin: 0;
        }

        .arrow-indicator {
            color: #0071e3;
            font-size: 1.1rem;
            font-weight: bold;
            padding-left: 8px;
            flex-shrink: 0;
        }
    </style>
</head>
