<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f7;
}

.container{
max-width:420px;
margin:auto;
min-height:100vh;
padding-bottom:30px;
}


.header{

height:150px;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
background:#000;

}


.header img{

position:absolute;
width:100%;
height:150px;
object-fit:cover;
object-position:center 35%;

}


.header-content{

position:relative;
z-index:2;
text-shadow:0 2px 5px black;

}


.header h1{

margin:0;
font-size:30px;

}


.card{

background:white;
margin:15px;
padding:18px;
border-radius:16px;
box-shadow:0 3px 10px #ddd;

}


.card a{

display:block;
padding:14px;
margin-top:10px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
text-align:center;

}


.music{

background:#128c9e;
color:white;

}


.upload{

background:#000;
color:white;

}


.media{

background:#e91e63;
color:white;

}


</style>

</head>


<body>


<div class="container">


<header class="header">

<img src="ning-wei.png">

<div class="header-content">

<h1>Ning Wei Media</h1>

<p>Music • Videos • Photos • Apps</p>

</div>

</header>



<div class="card">

<h2>Welcome</h2>

<p>
Your home for music, videos and digital content.
</p>


<a class="music" href="library.html">

🎵 Music Library

</a>


<a class="upload" href="upload.html">

📤 Upload Content

</a>


<a class="media" href="media.html">

▶ Media Player

</a>


</div>



</div>


</body>

</html>
