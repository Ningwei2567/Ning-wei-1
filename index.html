<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ning Wei Media - Home</title>
    <style>
        /* Base page layout alignment */
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #f5f5f7;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 30px;
        }

        /* Banner Header with Centered Image Fix */
        .banner {
            position: relative;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.5)), url('ning-wei.png');
            background-size: cover;
            background-position: center 30% !important;
            background-repeat: no-repeat;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .banner h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .banner p {
            margin: 4px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.95;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        /* Search Bar Component */
        .search-container {
            padding: 15px 15px 10px 15px;
            display: flex;
            justify-content: center;
        }

        .search-box {
            width: 100%;
            background: #ffffff;
            border-radius: 25px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e5e5ea;
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 1rem;
            color: #333;
        }

        /* RESTORED: Artist Upload Section Button styling */
        .upload-section {
            padding: 0 15px 15px 15px;
        }

        .btn-upload-direct {
            width: 100%;
            background-color: #128c9e;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(18, 140, 158, 0.2);
            transition: background-color 0.2s;
        }

        .btn-upload-direct:active {
            background-color: #0e6f7d;
        }

        /* Section Header styling */
        .section-header {
            padding: 0 15px 10px 15px;
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #000000;
        }

        /* COMPACT LIST ROW DESIGN */
        .list-container {
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-item {
            background: #ffffff;
            border-radius: 14px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(0,0,0,0.02);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .item-left-block {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        /* Compact circular item badges */
        .number-badge {
            width: 32px;
            height: 32px;
            background: #000000;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            margin-right: 12px;
            flex-shrink: 0;
        }

        /* Row Category Icons spacing */
        .row-icon {
            width: 26px;
            height: 26px;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        /* Inline Text alignment structure */
        .text-meta-box {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 6px;
            min-width: 0;
            flex: 1;
            flex-wrap: wrap;
        }

        .text-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1d1d1f;
            margin: 0;
        }

        .text-subtitle {
            font-size: 0.78rem;
            color: #86868b;
            margin: 0;
        }

        .arrow-indicator {
            color: #0071e3;
            font-size: 1.1rem;
            font-weight: bold;
            padding-left: 8px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

            <!-- Item 4: Videos -->
            <a href="videos.html" class="list-item">

            <!-- Item 5: Photos -->
            <a href="photos.html" class="list-item">
                <div class="item-left-block">
                    <div class="number-badge">5</div>
                    <div class="row-icon" style="color: #ff4d4d;">📸</div>

            <!-- Item 6: Apps -->

                    <div class="text-meta-box">
                        <h3 class="text-title">Apps</h3>
                        <p class="text-subtitle">Applications</p>
                    </div>
                </div>
                <div class="arrow-indicator">❯</div>
            </a>
