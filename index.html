<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5faff;
    color:#111;
}

body{
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.nw-header{
    position:relative;
    width:100%;
    height:318px;
    overflow:hidden;
    background:#9bdcff;
}

.nw-header-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 18%;
    transform:scale(1.05);
}

.nw-header-overlay{
    position:absolute;
    inset:0;
    background:rgba(55,145,205,0.38);
}

.nw-header-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    text-align:center;
    padding:20px 15px 25px;
}

.nw-title{
    margin:0;
    color:white;
    font-size:32px;
    font-weight:800;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
}

.nw-subtitle{
    margin:7px 0 15px;
    color:white;
    font-size:14px;
    font-weight:600;
    text-shadow:0 2px 5px rgba(0,0,0,.5);
}

/* SEARCH */

.nw-search{
    width:min(92%,520px);
    height:43px;
    border:0;
    outline:0;
    border-radius:25px;
    padding:0 18px;
    font-size:15px;
    background:white;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

/* =========================
   MAIN
========================= */

.nw-container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:12px 10px 25px;
}

.nw-list{
    display:flex;
    flex-direction:column;
    gap:5px;
}

/* MENU ROW */

.nw-item{
    width:100%;
    min-height:48px;
    display:flex;
    align-items:center;
    text-decoration:none;
    color:#111;
    background:white;
    border-radius:10px;
    padding:5px 10px;
    box-shadow:0 1px 5px rgba(0,0,0,.10);
    transition:.15s;
}

.nw-item:active{
    transform:scale(.98);
}

.nw-number{
    width:30px;
    height:30px;
    min-width:30px;
    border-radius:50%;
    background:#000;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:bold;
}

.nw-item-text{
    flex:1;
    padding-left:12px;
    font-size:15px;
    font-weight:600;
}

.nw-arrow{
    font-size:25px;
    line-height:1;
    color:#168ab5;
    padding-left:5px;
}

/* =========================
   SECTION
========================= */

.nw-section{
    margin-top:18px;
}

.nw-section-title{
    font-size:18px;
    font-weight:800;
    margin:0 0 8px;
    padding-left:3px;
}

/* =========================
   TRENDING APPS
========================= */

.app-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.app-card{
    background:white;
    border-radius:12px;
    padding:8px 4px;
    text-decoration:none;
    color:#111;
    text-align:center;
    box-shadow:0 1px 5px rgba(0,0,0,.10);
}

.app-icon{
    width:42px;
    height:42px;
    margin:auto;
    border-radius:50%;
    object-fit:cover;
    display:block;
}

.app-name{
    display:block;
    margin-top:5px;
    font-size:11px;
    font-weight:700;
}

/* =========================
   SOCIAL
========================= */

.social-grid{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    padding:5px 0 12px;
}

.social{
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:white;
    font-size:18px;
    font-weight:bold;
}

/* Real brand-style colors */

.instagram{
    background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
}

.facebook{
    background:#1877f2;
}

.whatsapp{
    background:#25d366;
}

.youtube{
    background:#ff0000;
}

.tiktok{
    background:#000;
}

/* =========================
   FOOTER
========================= */

.nw-footer{
    text-align:center;
    padding:15px 10px 25px;
    font-size:12px;
    color:#777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .nw-header{
        height:318px;
    }

    .nw-title{
        font-size:29px;
    }

    .nw-subtitle{
        font-size:12px;
    }

    .nw-item{
        min-height:46px;
    }

    .nw-item-text{
        font-size:14px;
    }

    .app-grid{
        grid-template-columns:repeat(4,1fr);
        gap:6px;
    }

    .app-icon{
        width:38px;
        height:38px;
    }
}
</style>
</head>

<body>

<script>

/* =========================
   HOMEPAGE SEARCH
========================= */

function searchSite(){

    const search =
        document
        .getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();

    const items =
        document
        .querySelectorAll(".nw-item");

    items.forEach(function(item){

        const text =
            item
            .innerText
            .toLowerCase();

        if(
            search === "" ||
            text.includes(search)
        ){

            item.style.display="flex";

        }else{

            item.style.display="none";

        }

    });

}

</script>
