<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ning Wei Media</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4faff; color: #111; }
    .site-header { position: relative; height: 125px; background: #dff4ff; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
    .site-header img { position: absolute; inset: 0; width: 100%; height: 125px; object-fit: cover; }
    .header-content { position: relative; z-index: 2; color: white; text-shadow: 0 2px 5px rgba(0,0,0,.8); }
    .header-content h1 { margin: 0; font-size: 26px; font-weight: 800; }
    .header-content p { margin: 4px 0 0; font-size: 12px; font-weight: 600; }
    .container { width: 100%; max-width: 850px; margin: auto; padding: 15px; }
    
    /* Search Bar */
    .search-container { display: flex; gap: 8px; margin-bottom: 20px; }
    .search-input { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    .search-btn { padding: 12px 20px; background: #000; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* Upload Button */
    .artist-upload-btn { display: block; width: 100%; padding: 14px; background: #4fc3f7; color: white; text-align: center; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .artist-upload-btn small { display: block; font-size: 11px; font-weight: normal; margin-top: 2px; }
  </style>
</head>
<body>

<header class="site-header">
  <img src="ning-wei.png" alt="Ning Wei" onerror="this.style.display='none'">
  <div class="header-content">
    <h1>Ning Wei Media</h1>
    <p>Music • Videos • Photos • Apps • Software</p>
  </div>
</header>

<main class="container">
  <!-- Search Bar -->
  <form class="search-container" action="search.html" method="GET">
    <input type="text" name="q" class="search-input" placeholder="Search Ning Wei Media...">
    <button type="submit" class="search-btn">Search</button>
  </form>

  <!-- Updated Upload Button -->
  <a href="upload.html" class="artist-upload-btn">
    ⬆ Artists, upload your music here
    <small>Submit your Music, Videos, Apps & Files</small>
  </a>
</main>

</body>
</html>
