<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5fb;
    color:#222;
}

/* SMALL HEADER */
header{
    background:#168de2;
    color:white;
    text-align:center;
    padding:12px 8px;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:3px 0 0;
    font-size:13px;
}

/* FOLDER AREA */
.container{
    padding:10px;
}

/* 2 COLUMNS */
.folder-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

/* VERY SMALL CARDS */
.folder{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:white;
    color:#222;
    text-decoration:none;

    height:105px;
    padding:8px;

    border-radius:12px;
    box-shadow:0 2px 7px #d2d2d2;
}

.folder:active{
    transform:scale(.97);
}

.icon{
    font-size:28px;
    margin-bottom:5px;
}

.folder h2{
    margin:0;
    font-size:16px;
    line-height:1.15;
}

.folder p{
    margin:4px 0 0;
    color:#777;
    font-size:11px;
}

/* FOOTER */
footer{
    text-align:center;
    padding:8px;
    font-size:11px;
    color:#888;
}
</style>
</head>

<body>

<header>
    <h1>📱 Ning Wei Media</h1>
    <p>Music • Videos • Photos • Apps • Software</p>
</header>

<div class="container">

    <div class="folder-grid">

        <a class="folder" href="apks.html">
            <div class="icon">📱</div>
            <h2>Premium & Paid Apps</h2>
            <p>Apps</p>
        </a>

        <a class="folder" href="software.html">
            <div class="icon">💻</div>
            <h2>All Softwares</h2>
            <p>Software</p>
        </a>

        <a class="folder" href="audio.html">
            <div class="icon">🎵</div>
            <h2>Trending Songs</h2>
            <p>Music</p>
        </a>

        <a class="folder" href="videos.html">
            <div class="icon">🎬</div>
            <h2>Trending Videos</h2>
            <p>Videos</p>
        </a>

        <a class="folder" href="photos.html">
            <div class="icon">🔥</div>
            <h2>Trending Hot Photos</h2>
            <p>Photos</p>
        </a>

        <a class="folder" href="media/songs/DJ-Mixes/index.html">
            <div class="icon">🎧</div>
            <h2>DJ Mixes</h2>
            <p>DJ Mixes</p>
        </a>

    </div>

</div>

<footer>
    © 2026 Ning Wei Media
</footer>

</body>
</html>
