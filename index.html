<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#eef6fb;
  font-family:Arial,Helvetica,sans-serif;
  color:#111;
}

/* =========================
   UNIVERSAL HEADER
========================= */

.hero{
  width:100%;
  height:270px;
  position:relative;
  overflow:hidden;
  background-image:url("ning-wei.png");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(70,155,215,.45);
}

.hero-content{
  position:relative;
  z-index:2;
  color:white;
  padding:10px;
  text-shadow:0 3px 8px rgba(0,0,0,.7);
}

.hero h1{
  margin:0;
  font-size:48px;
  font-weight:800;
}

.hero p{
  margin:12px 0 0;
  font-size:22px;
  font-weight:600;
}

/* =========================
   SEARCH
========================= */

.search-area{
  padding:25px 22px 12px;
}

.search{
  display:block;
  width:100%;
  max-width:720px;
  margin:auto;
  border:1px solid #ccc;
  border-radius:35px;
  padding:16px 22px;
  font-size:19px;
  background:white;
  outline:none;
}

/* =========================
   PAGE TITLE
========================= */

.page-title{
  max-width:900px;
  margin:10px auto 16px;
  padding:0 22px;
  color:#16849a;
  font-size:30px;
  font-weight:800;
}

/* =========================
   LIST
========================= */

.list{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:0 20px 40px;
}

/* =========================
   VERY SMALL FOLDER ROW
========================= */

.item{
  width:100%;
  min-height:72px;
  margin-bottom:9px;
  padding:8px 12px;

  background:white;
  border-radius:18px;

  display:flex;
  align-items:center;

  text-decoration:none;
  color:#111;

  box-shadow:0 4px 13px rgba(0,0,0,.06);

  transition:transform .15s;
}

.item:active{
  transform:scale(.98);
}

/* BLACK CIRCLE */

.number{
  width:50px;
  height:50px;
  min-width:50px;

  border-radius:50%;

  background:#000;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;
  font-weight:800;

  margin-right:13px;
}

/* ICON */

.icon{
  width:45px;
  min-width:45px;
  font-size:28px;
  text-align:center;
  margin-right:8px;
}

/* TEXT */

.info{
  flex:1;
  min-width:0;
}

.name{
  font-size:20px;
  font-weight:800;
  line-height:1.1;
}

.desc{
  margin-top:3px;
  font-size:14px;
  color:#777;
}

/* ARROW */

.arrow{
  font-size:29px;
  color:#16899a;
  margin-left:8px;
}

/* =========================
   LOADING / ERROR
========================= */

.message{
  text-align:center;
  padding:45px 20px;
  color:#777;
  font-size:20px;
}

.error{
  color:#c33;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .hero{
    height:270px;
  }

  .hero h1{
    font-size:38px;
  }

  .hero p{
    font-size:18px;
  }

  .search-area{
    padding:20px 20px 10px;
  }

  .search{
    font-size:18px;
    padding:15px 20px;
  }

  .page-title{
    font-size:27px;
  }

  .list{
    padding:0 20px 30px;
  }

  .item{
    min-height:68px;
    padding:7px 9px;
    border-radius:17px;
  }

  .number{
    width:47px;
    height:47px;
    min-width:47px;
    font-size:20px;
    margin-right:11px;
  }

  .icon{
    width:42px;
    min-width:42px;
    font-size:26px;
  }

  .name{
    font-size:18px;
  }

  .desc{
    font-size:13px;
  }

  .arrow{
    font-size:27px;
  }
}
</style>
</head>

<body>

<!-- =========================
     UNIVERSAL HEADER
========================= -->

<header class="hero">
  <div class="hero-content">
    <h1 id="title">Ning Wei Media</h1>
    <p>Music • Videos • Photos • Apps • Software</p>
  </div>
</header>


<!-- =========================
     SEARCH
========================= -->

<div class="search-area">
  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search Ning Wei Media..."
  >
</div>


<!-- =========================
     PAGE TITLE
========================= -->

<div class="page-title" id="pageTitle">
  Ning Wei Media
</div>


<!-- =========================
     CONTENT
========================= -->

<div class="list" id="list">
  <div class="message">Loading...</div>
</div>


<script>

/* =====================================================
   GITHUB SETTINGS
===================================================== */

const OWNER = "Ningwei2567";
const REPO = "Ning-wei-1";
const BRANCH = "main";


/* =====================================================
   CURRENT FOLDER
===================================================== */

const params = new URLSearchParams(location.search);

let currentPath = params.get("path") || "";


/* =====================================================
   SPECIAL HOME PAGE
===================================================== */

const homeItems = [

  {
    name:"Trending Songs",
    icon:"🎵",
    desc:"Music and audio",
    path:"TRENDING"
  },

  {
    name:"Old is Gold",
    icon:"🏆",
    desc:"Classic and old music",
    path:"media/songs/Old-is-Gold"
  },

  {
    name:"DJ Mixes / Nonstop",
    icon:"🎧",
    desc:"DJ mixes and mixtapes",
    path:"media/songs/DJ-Mixes"
  },

  {
    name:"Trending Videos",
    icon:"🎬",
    desc:"Watch videos",
    path:"media/videos"
  },

  {
    name:"Trending Photos",
    icon:"📸",
    desc:"View photos",
    path:"media/photos"
  },

  {
    name:"All Apps",
    icon:"📱",
    desc:"Apps and APK files",
    path:"media/apps"
  },

  {
    name:"All Softwares",
    icon:"💻",
    desc:"Software and programs",
    path:"media/software"
  }

];


/* =====================================================
   FILE TYPES
===================================================== */

const audioTypes = [
  "mp3","wav","m4a","aac","ogg","oga","opus","flac"
];

const videoTypes = [
  "mp4","webm","mov","m4v","avi","mkv"
];

const imageTypes = [
  "jpg","jpeg","png","gif","webp","bmp"
];

const downloadTypes = [
  "apk","zip","rar","7z","exe","msi"
];


/* =====================================================
   GITHUB API
===================================================== */

async function githubFolder(path){

  let url =
    "https://api.github.com/repos/" +
    OWNER + "/" +
    REPO +
    "/contents/" +
    path +
    "?ref=" +
    BRANCH;

  const response = await fetch(url);

  if(!response.ok){
    throw new Error("GitHub folder could not be loaded.");
  }

  return await response.json();
}


/* =====================================================
   CREATE ITEM
===================================================== */

function createItem(item, number){

  const row = document.createElement("a");

  row.className = "item";

  const numberBox = document.createElement("div");
  numberBox.className = "number";
  numberBox.textContent = number;

  const icon = document.createElement("div");
  icon.className = "icon";

  const info = document.createElement("div");
  info.className = "info";

  const name = document.createElement("div");
  name.className = "name";

  const desc = document.createElement("div");
  desc.className = "desc";

  const arrow = document.createElement("div");
  arrow.className = "arrow";
  arrow.textContent = "›";

  name.textContent = item.name;

  if(item.type === "dir"){
    icon.textContent = getFolderIcon(item.name);
    desc.textContent = "Folder";

    row.href =
      "index.html?path=" +
      encodeURIComponent(item.path);

  }else{

    icon.textContent = getFileIcon(item.name);

    desc.textContent = "Media file";

    row.href =
      "media.html?path=" +
      encodeURIComponent(item.path);
  }

  info.appendChild(name);
  info.appendChild(desc);

  row.appendChild(numberBox);
  row.appendChild(icon);
  row.appendChild(info);
  row.appendChild(arrow);

  return row;
}


/* =====================================================
   FOLDER ICONS
===================================================== */

function getFolderIcon(name){

  const n = name.toLowerCase();

  if(n.includes("uganda")) return "🇺🇬";
  if(n.includes("african")) return "🌍";
  if(n.includes("international")) return "🌎";
  if(n.includes("amapiano")) return "🎵";
  if(n.includes("south african")) return "🇿🇦";
  if(n.includes("dj")) return "🎧";
  if(n.includes("mixtape")) return "🎶";
  if(n.includes("mapping")) return "🗺️";
  if(n.includes("sound")) return "🔊";
  if(n.includes("skin")) return "🎨";
  if(n.includes("video")) return "🎬";
  if(n.includes("photo")) return "📸";
  if(n.includes("app")) return "📱";
  if(n.includes("software")) return "💻";

  return "📁";
}


/* =====================================================
   FILE ICONS
===================================================== */

function getFileIcon(name){

  const ext =
    name.split(".").pop().toLowerCase();

  if(audioTypes.includes(ext)) return "🎵";

  if(videoTypes.includes(ext)) return "🎬";

  if(imageTypes.includes(ext)) return "📸";

  if(ext === "apk") return "📱";

  if(downloadTypes.includes(ext)) return "📦";

  return "📄";
}


/* =====================================================
   TITLE
===================================================== */

function setTitle(){

  if(!currentPath){

    document.getElementById("title").textContent =
      "Ning Wei Media";

    document.getElementById("pageTitle").textContent =
      "Ning Wei Media";

    return;
  }

  if(currentPath === "TRENDING"){

    document.getElementById("title").textContent =
      "🎵 Trending Songs";

    document.getElementById("pageTitle").textContent =
      "🎵 Trending Songs";

    return;
  }

  const parts =
    currentPath.split("/");

  const folderName =
    parts[parts.length - 1]
      .replace(/-/g," ");

  document.getElementById("title").textContent =
    folderName;

  document.getElementById("pageTitle").textContent =
    folderName;
}


/* =====================================================
   TRENDING SONGS
===================================================== */

function showTrendingSongs(){

  const list =
    document.getElementById("list");

  list.innerHTML = "";

  const categories = [

    {
      name:"Ugandan Music",
      icon:"🇺🇬",
      desc:"Music and audio",
      path:"media/songs/Ugandan"
    },

    {
      name:"African Music",
      icon:"🌍",
      desc:"Music and audio",
      path:"media/songs/African"
    },

    {
      name:"International Music",
      icon:"🌎",
      desc:"Music and audio",
      path:"media/songs/International"
    }

  ];

  categories.forEach((item,index)=>{

    const row =
      document.createElement("a");

    row.className = "item";

    row.href =
      "index.html?path=" +
      encodeURIComponent(item.path);

    row.innerHTML = `
      <div class="number">${index + 1}</div>
      <div class="icon">${item.icon}</div>

      <div class="info">
        <div class="name">${item.name}</div>
        <div class="desc">${item.desc}</div>
      </div>

      <div class="arrow">›</div>
    `;

    list.appendChild(row);

  });
}


/* =====================================================
   HOME
===================================================== */

function showHome(){

  const list =
    document.getElementById("list");

  list.innerHTML = "";

  homeItems.forEach((item,index)=>{

    const row =
      document.createElement("a");

    row.className = "item";

    if(item.path === "TRENDING"){

      row.href =
        "index.html?path=TRENDING";

    }else{

      row.href =
        "index.html?path=" +
        encodeURIComponent(item.path);

    }

    row.innerHTML = `
      <div class="number">${index + 1}</div>

      <div class="icon">${item.icon}</div>

      <div class="info">
        <div class="name">${item.name}</div>
        <div class="desc">${item.desc}</div>
      </div>

      <div class="arrow">›</div>
    `;

    list.appendChild(row);

  });
}


/* =====================================================
   LOAD REAL GITHUB FOLDER
===================================================== */

async function loadFolder(){

  const list =
    document.getElementById("list");

  list.innerHTML =
    '<div class="message">Loading...</div>';

  try{

    const data =
      await githubFolder(currentPath);

    if(!Array.isArray(data)){
      throw new Error("Not a folder.");
    }

    list.innerHTML = "";

    /* FOLDERS FIRST */

    const folders =
      data
      .filter(x => x.type === "dir")
      .sort((a,b)=>
        a.name.localeCompare(b.name)
      );

    /* FILES SECOND */

    const files =
      data
      .filter(x => x.type === "file")
      .sort((a,b)=>
        a.name.localeCompare(b.name)
      );

    const all =
      [...folders,...files];

    let number = 1;

    all.forEach(item=>{

      /* Hide technical files */

      const hidden = [
        "index.html",
        "audio.html",
        "photos.html",
        "videos.html",
        "software.html",
        "apks.html",
        "media.html",
        "song.html",
        "style.css"
      ];

      if(hidden.includes(item.name.toLowerCase())){
        return;
      }

      const row =
        createItem(item,number);

      list.appendChild(row);

      number++;

    });

    if(number === 1){

      list.innerHTML =
        '<div class="message">This folder is empty.</div>';

    }

  }catch(error){

    list.innerHTML = `
      <div class="message error">
        Unable to load this folder.
        <br><br>
        Please check that the folder exists in GitHub.
      </div>
    `;

  }
}


/* =====================================================
   SEARCH
===================================================== */

document
.getElementById("search")
.addEventListener("input",function(){

  const value =
    this.value.toLowerCase().trim();

  const items =
    document.querySelectorAll(".item");

  items.forEach(item=>{

    const text =
      item.innerText.toLowerCase();

    item.style.display =
      text.includes(value)
      ? "flex"
      : "none";

  });

});


/* =====================================================
   START
===================================================== */

setTitle();

if(!currentPath){

  showHome();

}else if(currentPath === "TRENDING"){

  showTrendingSongs();

}else{

  loadFolder();

}

</script>

</body>
</html>
