<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8fa;
  color:#111;
}

.header{
  height:190px;
  position:relative;
  display:flex;
  align-items:flex-end;
  padding:15px;
  background:
    linear-gradient(rgba(80,190,235,.20),rgba(80,190,235,.20)),
    url("ning-wei.png") center/cover no-repeat;
}

.header h1{
  margin:0;
  color:white;
  font-size:27px;
  text-shadow:0 2px 6px #000;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:12px;
}

.search{
  width:100%;
  padding:13px 17px;
  border:1px solid #ccc;
  border-radius:25px;
  font-size:16px;
  outline:none;
  margin-bottom:12px;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  background:white;
  padding:9px;
  margin-bottom:7px;
  border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}

.number{
  width:32px;
  height:32px;
  min-width:32px;
  border-radius:50%;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.icon{
  font-size:21px;
}

.item a{
  flex:1;
  color:#111;
  text-decoration:none;
  font-weight:bold;
}

.arrow{
  color:#0795c5;
  font-size:20px;
}

.loading,
.error{
  text-align:center;
  padding:30px;
  color:#777;
}

.back{
  display:block;
  margin-bottom:12px;
  color:#087ea4;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<header class="header">
  <h1>🎵 Ning Wei Media</h1>
</header>

<div class="container">

<input
  id="search"
  class="search"
  type="search"
  placeholder="Search..."
>

<div id="back"></div>

<div id="list">
  <div class="loading">Loading...</div>
</div>

</div>

<script>

const OWNER = "Ningwei2567";
const REPO = "Ning-wei-1";
const BRANCH = "main";

const API =
`https://api.github.com/repos/${OWNER}/${REPO}/contents/`;

let currentPath = "";
let allItems = [];

function iconFor(name,type){

  if(type === "dir"){

    const n = name.toLowerCase();

    if(n.includes("song") || n.includes("music"))
      return "🎵";

    if(n.includes("video"))
      return "🎬";

    if(n.includes("photo"))
      return "📷";

    if(n.includes("app"))
      return "📱";

    if(n.includes("software"))
      return "💻";

    if(n.includes("mix"))
      return "🎧";

    if(n.includes("mapping"))
      return "🗺️";

    if(n.includes("effect"))
      return "🔊";

    if(n.includes("skin"))
      return "🎨";

    return "📁";
  }

  if(/\.(mp3|wav|m4a|aac|ogg)$/i.test(name))
    return "🎵";

  if(/\.(mp4|webm|mov|mkv|avi)$/i.test(name))
    return "🎬";

  if(/\.(jpg|jpeg|png|gif|webp)$/i.test(name))
    return "🖼️";

  if(/\.(apk)$/i.test(name))
    return "📱";

  return "📄";
}

function cleanName(name){

  return name
    .replace(/\.[^/.]+$/,"")
    .replace(/[-_]/g," ");
}

function makeURL(item){

  if(item.type === "dir"){

    return "?path=" +
      encodeURIComponent(item.path);
  }

  const ext =
    item.name.split(".").pop().toLowerCase();

  const folder =
    item.path.substring(
      0,
      item.path.lastIndexOf("/")
    );

  if(["mp3","wav","m4a","aac","ogg"].includes(ext)){

    return "media/songs/song.html?folder=" +
      encodeURIComponent(
        folder.replace("media/songs/","")
      ) +
      "&file=" +
      encodeURIComponent(item.name);
  }

  if(["mp4","webm","mov","mkv","avi"].includes(ext)){

    return item.download_url;
  }

  return item.download_url;
}

async function loadFolder(path){

  currentPath = path;

  const list =
    document.getElementById("list");

  list.innerHTML =
    `<div class="loading">Loading...</div>`;

  try{

    const response =
      await fetch(
        API +
        path +
        "?ref=" +
        BRANCH
      );

    if(!response.ok)
      throw new Error();

    let items =
      await response.json();

    items =
      items.sort((a,b)=>{

        if(a.type !== b.type)
          return a.type === "dir" ? -1 : 1;

        return a.name.localeCompare(b.name);
      });

    allItems = items;

    showItems(items);

    showBack(path);

  }catch(e){

    list.innerHTML =
      `<div class="error">
        Unable to load this folder.
      </div>`;
  }
}

function showItems(items){

  const list =
    document.getElementById("list");

  list.innerHTML = "";

  if(items.length === 0){

    list.innerHTML =
      `<div class="loading">
        This folder is empty.
      </div>`;

    return;
  }

  items.forEach((item,index)=>{

    const row =
      document.createElement("div");

    row.className = "item";

    const number =
      document.createElement("div");

    number.className = "number";

    /*
      IMPORTANT:
      Numbering starts from 1
      inside EVERY folder.
    */

    number.textContent = index + 1;

    const icon =
      document.createElement("span");

    icon.className = "icon";

    icon.textContent =
      iconFor(item.name,item.type);

    const link =
      document.createElement("a");

    link.textContent =
      cleanName(item.name);

    link.href =
      makeURL(item);

    if(item.type === "file"){

      if(/\.(mp4|webm|mov|mkv|avi)$/i
        .test(item.name)){

        link.target = "_blank";
      }

      if(!/\.(mp3|wav|m4a|aac|ogg|mp4|webm|mov|mkv|avi)$/i
        .test(item.name)){

        link.download = "";
      }
    }

    const arrow =
      document.createElement("span");

    arrow.className = "arrow";

    arrow.textContent =
      item.type === "dir" ? "›" : "↓";

    row.appendChild(number);
    row.appendChild(icon);
    row.appendChild(link);
    row.appendChild(arrow);

    list.appendChild(row);
  });
}

function showBack(path){

  const back =
    document.getElementById("back");

  if(!path){

    back.innerHTML = "";
    return;
  }

  const parent =
    path.substring(
      0,
      path.lastIndexOf("/")
    );

  back.innerHTML =
    `<a class="back"
       href="?path=${encodeURIComponent(parent)}">
       ← Back
     </a>`;
}

document
.getElementById("search")
.addEventListener("input",function(){

  const text =
    this.value.toLowerCase().trim();

  if(!text){

    showItems(allItems);
    return;
  }

  const filtered =
    allItems.filter(item =>
      item.name
      .toLowerCase()
      .includes(text)
    );

  showItems(filtered);
});


const params =
  new URLSearchParams(location.search);

const path =
  params.get("path") || "";

loadFolder(path);

</script>

</body>
</html>
