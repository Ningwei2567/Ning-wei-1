<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f3f8fb;
    color: #111;
}

body {
    overflow-x: hidden;
}

/* ================= HEADER ================= */

.nw-header {
    position: relative;
    width: 100%;
    height: 205px;
    overflow: hidden;
    background: #87ceeb;
}

.nw-header-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 18%;
    transform: scale(1.15);
}

.nw-header-overlay {
    position: absolute;
    inset: 0;
    background: rgba(55,145,205,.38);
}

.nw-header-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
}

.nw-title {
    margin: 0;
    color: white;
    font-size: 30px;
    font-weight: 800;
    text-shadow: 0 2px 5px rgba(0,0,0,.5);
}

.nw-subtitle {
    margin: 5px 0 13px;
    color: white;
    font-size: 13px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
}

.nw-search {
    width: min(92%, 500px);
    height: 42px;
    border: none;
    outline: none;
    border-radius: 30px;
    padding: 0 18px;
    font-size: 15px;
}

/* ================= MAIN ================= */

.nw-container {
    width: min(94%, 700px);
    margin: 14px auto 35px;
}

.nw-menu {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.nw-item {
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 5px 9px;
    background: white;
    border-radius: 10px;
    text-decoration: none;
    color: #111;
    box-shadow: 0 1px 5px rgba(0,0,0,.08);
}

.nw-number {
    flex: 0 0 32px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
}

.nw-item-text {
    flex: 1;
    padding-left: 11px;
    font-size: 15px;
    font-weight: 600;
}

.nw-arrow {
    font-size: 25px;
    color: #078da9;
    padding-right: 5px;
}

/* ================= SECTIONS ================= */

.nw-section {
    margin-top: 22px;
}

.nw-section-title {
    margin: 0 0 10px;
    font-size: 19px;
    font-weight: 800;
}

/* ================= TRENDING APPS ================= */

.nw-apps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

.nw-app {
    background: white;
    border-radius: 10px;
    padding: 10px 5px;
    text-decoration: none;
    color: #111;
    text-align: center;
    box-shadow: 0 1px 5px rgba(0,0,0,.08);
}

.nw-app img {
    width: 43px;
    height: 43px;
    object-fit: contain;
    border-radius: 10px;
}

.nw-app-name {
    display: block;
    margin-top: 5px;
    font-size: 11px;
    font-weight: bold;
}

/* ================= SOCIAL ================= */

.nw-social {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

.nw-social a {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

.instagram {
    background: linear-gradient(45deg,#feda75,#d62976,#4f5bd5);
}

.facebook {
    background: #1877f2;
}

.whatsapp {
    background: #25d366;
}

.youtube {
    background: #ff0000;
}

.tiktok {
    background: #000;
}

.telegram {
    background: #229ed9;
}

.nw-footer {
    text-align: center;
    color: #666;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="nw-header">

    <img
        class="nw-header-photo"
        src="ning-wei.png"
        alt="Ning Wei Media"
    >

    <div class="nw-header-overlay"></div>

    <div class="nw-header-content">

        <h1 class="nw-title">
            Ning Wei Media
        </h1>

        <p class="nw-subtitle">
            Music • Videos • Photos • Apps • Software
        </p>

        <input
            class="nw-search"
            id="searchBox"
            type="search"
            placeholder="Search Ning Wei Media..."
        >

    </div>

</header>


<!-- ================= CONTENT ================= -->

<main class="nw-container">

    <div class="nw-menu">

        <!-- 1 -->
        <a class="nw-item" href="audio.html">
            <span class="nw-number">1</span>
            <span class="nw-item-text">🎵 Trending Songs</span>
            <span class="nw-arrow">›</span>
        </a>

        <!-- 2 -->
        <a
            class="nw-item"
            href="audio.html?path=media/songs/Old-is-Gold"
        >
            <span class="nw-number">2</span>
            <span class="nw-item-text">🎶 Old is Gold</span>
            <span class="nw-arrow">›</span>
        </a>

        <!-- 3 -->
        <a
            class="nw-item"
            href="audio.html?path=media/songs/DJ-Mixes"
        >
            <span class="nw-number">3</span>
            <span class="nw-item-text">🎧 DJ Mixes</span>
            <span class="nw-arrow">›</span>
        </a>

        <!-- 4 -->
        <a class="nw-item" href="videos.html">
            <span class="nw-number">4</span>
            <span class="nw-item-text">🎬 Videos</span>
            <span class="nw-arrow">›</span>
        </a>

        <!-- 5 -->
        <a class="nw-item" href="photos.html">
            <span class="nw-number">5</span>
            <span class="nw-item-text">📸 Photos</span>
            <span class="nw-arrow">›</span>
        </a>

        <!-- 6 -->
        <a class="nw-item" href="apks.html">
            <span class="nw-number">6</span>
            <span class="nw-item-text">📱 Apps</span>
            <span class="nw-arrow">›</span>
        </a>

        <!-- 7 -->
        <a class="nw-item" href="software.html">
            <span class="nw-number">7</span>
            <span class="nw-item-text">💻 Software</span>
            <span class="nw-arrow">›</span>
        </a>

        <!-- 8 — DIRECT FORM -->
        <a class="nw-item" href="upload.html">
            <span class="nw-number">8</span>
            <span class="nw-item-text">
                🎵 Upload Your Music Here
            </span>
            <span class="nw-arrow">›</span>
        </a>

    </div>


    <!-- ================= TRENDING APPS ================= -->

    <section class="nw-section">

        <h2 class="nw-section-title">
            🔥 Trending Apps
        </h2>

        <div class="nw-apps">

            <a class="nw-app" href="apks.html">
                <img src="ning-wei.png" alt="Apps">
                <span class="nw-app-name">Apps</span>
            </a>

            <a class="nw-app" href="apks.html">
                <img src="ning-wei.png" alt="Android">
                <span class="nw-app-name">Android</span>
            </a>

            <a class="nw-app" href="software.html">
                <img src="ning-wei.png" alt="Software">
                <span class="nw-app-name">Software</span>
            </a>

            <a class="nw-app" href="videos.html">
                <img src="ning-wei.png" alt="Media">
                <span class="nw-app-name">Media</span>
            </a>

        </div>

    </section>


    <!-- ================= FOLLOW US ================= -->

    <section class="nw-section">

        <h2 class="nw-section-title">
            Follow Us
        </h2>

        <div class="nw-social">

            <a
                class="instagram"
                href="https://www.instagram.com/"
                target="_blank"
                aria-label="Instagram"
            >◎</a>

            <a
                class="facebook"
                href="https://www.facebook.com/"
                target="_blank"
                aria-label="Facebook"
            >f</a>

            <a
                class="whatsapp"
                href="https://wa.me/"
                target="_blank"
                aria-label="WhatsApp"
            >☎</a>

            <a
                class="youtube"
                href="https://www.youtube.com/"
                target="_blank"
                aria-label="YouTube"
            >▶</a>

            <a
                class="tiktok"
                href="https://www.tiktok.com/"
                target="_blank"
                aria-label="TikTok"
            >♪</a>

            <a
                class="telegram"
                href="https://telegram.org/"
                target="_blank"
                aria-label="Telegram"
            >➤</a>

        </div>

    </section>


    <div class="nw-footer">
        © Ning Wei Media
    </div>

</main>


<script>
const searchBox = document.getElementById("searchBox");

searchBox.addEventListener("keydown", function(event) {

    if (event.key !== "Enter") return;

    const query =
        searchBox.value.trim();

    if (!query) return;

    window.location.href =
        "audio.html?search=" +
        encodeURIComponent(query);

});
</script>

</body>
</html>
