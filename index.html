<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaVault – Songs / Videos / Apps</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #24242e;
      --border: #333344;
      --text: #f0f0f5;
      --text-muted: #9999aa;
      --accent: #7c5cfc;
      --accent-hover: #6a4ae0;
      --danger: #e74c3c;
      --success: #2ecc71;
      --ads-bg: #1e1e28;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ========== HEADER ========== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button, .btn {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }

    .btn-danger {
      background: var(--danger);
      color: white;
    }
    .btn-danger:hover { opacity: 0.9; }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .admin-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .admin-toggle.active {
      background: rgba(124, 92, 252, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }
    .admin-toggle .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-muted);
    }
    .admin-toggle.active .dot { background: var(--accent); }

    /* ========== LAYOUT ========== */
    .layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .ads-column { display: none; } /* hide ads on small screens for demo */
    }

    /* ========== ADMIN BAR (appears when admin + selection) ========== */
    .admin-bar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: rgba(124, 92, 252, 0.15);
      border-bottom: 1px solid var(--accent);
      position: sticky;
      top: 57px;
      z-index: 90;
    }
    .admin-bar.visible { display: flex; }

    .admin-bar .selected-count {
      font-weight: 600;
      color: var(--accent);
    }

    /* ========== CONTENT GRID ========== */
    .content-area h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.15s, border-color 0.15s;
      position: relative;
    }
    .card:hover { transform: translateY(-2px); border-color: #444; }
