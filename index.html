<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ning Wei Media - Music, Videos, Photos, Apps & Software</title>
<meta name="description" content="Ning Wei Media - Free unlimited uploads. Discover and share music, videos, photos, apps, software, and DJ mixes from artists, DJs, and producers worldwide.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0a0a0a;color:#fff;line-height:1.5}
a{color:inherit;text-decoration:none}

/* HEADER */
.hero-header{
  position:relative;
  height:200px;
  overflow:hidden;
  background:#000;
}
.hero-header::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(10,10,10,1));
}
.hero-header img{
  position:absolute;
  left:0;top:0;
  width:100%;
  height:200px;
  object-fit:cover;
  object-position:center 22%;
}
.hero-content{
  position:absolute;
  bottom:20px;
  left:0;right:0;
  text-align:center;
  z-index:2;
  padding:0 16px;
}
.hero-content h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.5px;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.hero-content p{margin:6px 0 0;font-size:14px;color:#ccc;text-shadow:0 1px 3px rgba(0,0,0,.9)}

/* FREE BANNER */
.free-banner{
  background:linear-gradient(135deg,#e5a400,#b07a00);
  color:#fff;
  padding:10px 16px;
  text-align:center;
  font-weight:bold;
  font-size:13px;
  letter-spacing:.3px;
}
.free-banner span{font-size:18px;margin-right:6px;}

/* NAV / SEARCH */
.search-bar{
  padding:14px 16px;
  background:#111;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  z-index:50;
}
.search-input-wrap{
  position:relative;
  display:flex;
  align-items:center;
}
.search-input-wrap input{
  width:100%;
  padding:10px 14px 10px 38px;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:24px;
  color:#fff;
  font-size:14px;
}
.search-input-wrap input:focus{outline:none;border-color:#55bfe8}
.search-input-wrap::before{
  content:"🔍";
  position:absolute;
  left:12px;
  font-size:14px;
  pointer-events:none;
}

/* CATEGORY PILLS */
.cat-pills{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 16px;
  background:#0d0d0d;
  border-bottom:1px solid #222;
  scrollbar-width:none;
}
.cat-pills::-webkit-scrollbar{display:none}
.cat-pill{
  flex:0 0 auto;
  padding:7px 16px;
  background:#1a1a1a;
  color:#fff;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  border:1px solid #333;
  white-space:nowrap;
}
.cat-pill.active{background:#e50914;color:#fff;border-color:#e50914}

/* SECTION HEADERS */
.section{margin-top:18px}
.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px 10px;
}
.section-header h2{
  margin:0;
  font-size:18px;
  font-weight:800;
  color:#fff;
  text-transform:capitalize;
}
.section-header h2::before{
  content:"";
  display:inline-block;
  width:4px;
  height:18px;
  background:#e50914;
  margin-right:8px;
  vertical-align:middle;
  border-radius:2px;
}
.toggle-more{
  background:#222;
  color:#fff;
  border:none;
  padding:6px 14px;
  border-radius:14px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}
.toggle-more:hover{background:#333}

/* HORIZONTAL CAROUSEL */
.carousel-wrap{
  position:relative;
}
.media-row{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:0 16px 8px;
  scrollbar-width:none;
}
.media-row::-webkit-scrollbar{display:none}
.media-row .skeleton-card{
  flex:0 0 200px;
  height:230px;
  background:linear-gradient(90deg,#161616 25%,#1f1f1f 50%,#161616 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
  border-radius:10px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.media-card{
  flex:0 0 200px;
  background:#161616;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  height:230px;
  position:relative;
  border:1px solid #222;
}
.media-card:hover{border-color:#e50914}
.media-card video,
.media-card img{
  width:100%;
  height:130px;
  object-fit:cover;
  background:#000;
  display:block;
}
.media-card .card-info{
  padding:8px 10px;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
.media-card .card-info .title{
  font-size:13px;
  font-weight:bold;
  color:#fff;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.media-card .card-info .sub{
  font-size:11px;
  color:#888;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* APP GRID (TRENDING APPS - 4 cards) */
.apps-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:0 16px;
}
.apps-grid .app-card{
  background:#161616;
  border-radius:10px;
  padding:14px;
  text-align:center;
  border:1px solid #222;
  cursor:pointer;
}
.apps-grid .app-card:hover{border-color:#e50914}
.apps-grid .app-icon{
  width:60px;height:60px;
  border-radius:14px;
  margin:0 auto 8px;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}
.apps-grid .app-card .name{
  font-size:13px;
  font-weight:bold;
  color:#fff;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.apps-grid .app-card .sub{
  font-size:11px;
  color:#888;
  margin-top:2px;
}

/* EMPTY STATE */
.empty-state{
  text-align:center;
  padding:40px 20px;
  color:#777;
  font-size:14px;
}

/* ERROR STATE */
.error-state{
  text-align:center;
  padding:30px 20px;
  background:#220000;
  border:1px solid #a11;
  color:#ff8888;
  border-radius:10px;
  margin:16px;
  font-size:14px;
}

footer{
  text-align:center;
  padding:30px 16px;
  color:#777;
  font-size:12px;
  border-top:1px solid #222;
  margin-top:40px;
}

@media(max-width:500px){
  .hero-header{height:170px}
  .hero-header img{height:170px}
  .hero-content h1{font-size:24px}
}
</style>
</head>
<body>

<header class="hero-header">
  <img src="ning-wei.png" alt="Ning Wei Media" onerror="this.style.display='none'">
  <div class="hero-content">
    <h1>Ning Wei Media</h1>
    <p>Music • Videos • Photos • Apps • Software</p>
  </div>
</header>

<div class="free-banner">
  <span>♾️</span>100% FREE • UNLIMITED UPLOADS • NO RESTRICTIONS
</div>

<div class="search-bar">
  <div class="search-input-wrap">
    <input id="searchInput" type="text" placeholder="Search music, videos, apps...">
  </div>
</div>

<div class="cat-pills" id="catPills">
  <div class="cat-pill active" data-cat="all">All</div>
  <div class="cat-pill" data-cat="music">🎵 Music</div>
  <div class="cat-pill" data-cat="videos">🎬 Videos</div>
  <div class="cat-pill" data-cat="photos">🖼️ Photos</div>
  <div class="cat-pill" data-cat="apps">📱 Apps</div>
  <div class="cat-pill" data-cat="software">💻 Software</div>
  <div class="cat-pill" data-cat="mixes">🎧 DJ Mixes</div>
</div>

<main id="mainContent">

  <!-- Loading skeletons -->
  <section class="section" id="loadingSkeleton">
    <div class="section-header"><h2>Loading...</h2></div>
    <div class="carousel-wrap">
      <div class="media-row">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </section>

  <!-- Content sections rendered dynamically -->
  <div id="contentSections"></div>

</main>

<footer>
  <p>♾️ Ning Wei Media — Free Unlimited Uploads for Everyone</p>
  <p style="margin-top:8px"><a href="upload.html" style="color:#55bfe8">Upload your content →</a></p>
</footer>

<script>
/* ============================================================
 * index.html — Ning Wei Media homepage
 * Auto-approved content · Unlimited uploads · Free for everyone
 * ============================================================ */

const SUPABASE_URL  = "https://cuvkxlfgykumcwbnxige.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1dmt4bGZneWt1bWN3Ym54aWdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjExNjE5OTAsImV4cCI6MjA3NjczNzk5MH0.p_UsovIPsrNdNuLA73tFu6zfwkwkdIK7PZ-q37JCn6M";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const CATS = [
  { key:"music",    label:"Music",     icon:"🎵" },
  { key:"videos",   label:"Videos",    icon:"🎬" },
  { key:"photos",   label:"Photos",    icon:"🖼️" },
  { key:"apps",     label:"Apps",      icon:"📱" },
  { key:"software", label:"Software",  icon:"💻" },
  { key:"mixes",    label:"DJ Mixes",  icon:"🎧" }
];

const ICON_BY_CAT = { music:"🎵", videos:"🎬", photos:"🖼️", apps:"📱", software:"💻", mixes:"🎧" };

let allItems        = [];
let activeCategory  = "all";
let searchTerm      = "";
let sectionsLimit   = {};

/* ----------------- Helpers ----------------- */
function pickExt(url) {
  if (!url) return "";
  const noQuery = url.split("?")[0].split("#")[0];
  const dot = noQuery.lastIndexOf(".");
  return dot >= 0 ? noQuery.slice(dot + 1).toLowerCase() : "";
}
function isVideo(item) {
  const t = (item.type || item.file_type || "").toLowerCase();
  if (t.includes("video")) return true;
  const ext = pickExt(item.url);
  return ["mp4","webm","mov","m4v","avi","mkv","mpg","mpeg","flv","3gp"].includes(ext);
}
function isAudio(item) {
  const t = (item.type || item.file_type || "").toLowerCase();
  if (t.includes("audio")) return true;
  const ext = pickExt(item.url);
  return ["mp3","wav","m4a","aac","ogg","oga","opus","flac"].includes(ext);
}
function isImage(item) {
  const t = (item.type || item.file_type || "").toLowerCase();
  if (t.includes("image")) return true;
  const ext = pickExt(item.url);
  return ["jpg","jpeg","png","gif","webp","bmp"].includes(ext);
}
function detectCategory(item) {
  if ((item.category || "").toLowerCase().includes("app"))     return "apps";
  if ((item.category || "").toLowerCase().includes("soft"))    return "software";
  if ((item.category || "").toLowerCase().includes("mix"))     return "mixes";
  if (isVideo(item)) return "videos";
  if (isAudio(item)) return "music";
  if (isImage(item)) return "photos";
  return "music";
}
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function formatTitle(item) {
  return item.title || item.song_title || item.video_title ||
         item.name || item.app_name || "Untitled";
}
function formatUploader(item) {
  return item.uploader || item.creator_name || item.artist || "Ning Wei Media";
}
function formatDate(item) {
  const d = item.created_at || item.uploaded_at;
  if (!d) return "";
  try { return new Date(d).toLocaleDateString(); } catch { return ""; }
}

/* ----------------- URL Building ----------------- */
function publicUrl(bucket, path) {
  if (!path) return "";
  if (path.startsWith("http")) return path;
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;
}
function fileUrlForItem(item) {
  // Try multiple possible schema columns
  if (item.file_url)    return publicUrl(item.file_bucket || "artist-uploads", item.file_url);
  if (item.storage_path) return publicUrl(item.storage_bucket || "artist-uploads", item.storage_path);
  if (item.url)         return item.url;          // already a public URL?
  if (item.path)        return publicUrl("artist-uploads", item.path);
  return "";
}
function thumbnailUrlForItem(item) {
  if (item.thumbnail_url) return item.thumbnail_url;
  if (item.cover_url)     return item.cover_url;
  if (item.thumbnail_path) return publicUrl("artist-uploads", item.thumbnail_path);
  return "";
}

/* ----------------- Card Builders ----------------- */
function renderMediaCard(item) {
  const url = fileUrlForItem(item);
  const cat = detectCategory(item);
  const title = escapeHtml(formatTitle(item));
  const sub   = escapeHtml(formatUploader(item));

  let mediaHtml = "";
  if (cat === "videos") {
    mediaHtml = `<video src="${escapeHtml(url)}" muted preload="metadata" onerror="this.classList.add('broken')"></video>`;
  } else if (cat === "music") {
    mediaHtml = `<div style="height:130px;background:#0d0d0d;display:flex;align-items:center;justify-content:center;font-size:42px">🎵</div>`;
  } else if (cat === "photos") {
    mediaHtml = `<img src="${escapeHtml(url)}" loading="lazy" onerror="this.classList.add('broken')" alt="${title}">`;
  } else {
    // apps/software
    const icon = escapeHtml(thumbnailUrlForItem(item));
    mediaHtml = icon
      ? `<div style="height:130px;background:#0d0d0d;display:flex;align-items:center;justify-content:center"><img src="${icon}" loading="lazy" onerror="this.style.display='none'" style="width:64px;height:64px;border-radius:14px" alt="${title}"></div>`
      : `<div style="height:130px;background:#0d0d0d;display:flex;align-items:center;justify-content:center;font-size:42px">${ICON_BY_CAT[cat]||"📦"}</div>`;
  }

  return `
    <div class="media-card" onclick="goToLibrary('${cat}','${escapeHtml(item.title || '')}')">
      ${mediaHtml}
      <div class="card-info">
        <div class="title">${title}</div>
        <div class="sub">${sub}</div>
      </div>
    </div>
  `;
}

function renderAppCard(item, cat) {
  const title = escapeHtml(formatTitle(item));
  const sub   = escapeHtml(formatUploader(item));
  const icon  = escapeHtml(thumbnailUrlForItem(item));
  const iconHtml = icon
    ? `<img src="${icon}" loading="lazy" onerror="this.style.display='none'" style="width:60px;height:60px;border-radius:14px" alt="${title}">`
    : ICON_BY_CAT[cat] || "📦";

  return `
    <div class="app-card" onclick="goToLibrary('${cat}','${title}')">
      <div class="app-icon">${iconHtml}</div>
      <div class="name">${title}</div>
      <div class="sub">${sub}</div>
    </div>
  `;
}

/* ----------------- Navigation ----------------- */
function goToLibrary(cat, itemTitle) {
  // Deep-link to library.html with category + optional item context
  const params = new URLSearchParams();
  params.set("cat", cat);
  if (itemTitle) params.set("ref", itemTitle);
  window.location.href = "library.html?" + params.toString();
}

/* ----------------- Section Rendering ----------------- */
function getFilteredByCategory(cat) {
  let pool = cat === "all" ? allItems : allItems.filter(i => detectCategory(i) === cat);
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    pool = pool.filter(i => {
      const hay = [formatTitle(i), formatUploader(i), (i.category||""), (i.description||"")]
        .join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  return pool;
}

function renderSection(cat, label, icon) {
  const items = getFilteredByCategory(cat);
  if (!items.length) return "";

  const limit = sectionsLimit[cat] || 8;
  const visible = items.slice(0, limit);
  const hasMore = items.length > limit;

  let cardsHtml = "";
  if (cat === "apps" || cat === "software") {
    cardsHtml = `<div class="apps-grid">${visible.map(i => renderAppCard(i, cat)).join("")}</div>`;
  } else {
    cardsHtml = `<div class="carousel-wrap"><div class="media-row">${visible.map(renderMediaCard).join("")}</div></div>`;
  }

  return `
    <section class="section" data-cat="${cat}">
      <div class="section-header">
        <h2>${escapeHtml(icon + " " + label)}</h2>
        ${hasMore ? `<button class="toggle-more" onclick="toggleMore('${cat}')">More</button>` : ""}
      </div>
      ${cardsHtml}
    </section>
  `;
}

function toggleMore(cat) {
  sectionsLimit[cat] = (sectionsLimit[cat] || 8) === 8 ? 50 : 8;
  refreshSections();
}

function renderEmptyState() {
  return `<div class="empty-state">No content found. <a href="upload.html" style="color:#55bfe8">Be the first to upload!</a></div>`;
}

function renderErrorState(msg) {
  return `<div class="error-state">⚠️ ${escapeHtml(msg)}<br><small style="opacity:.7">Please refresh or try again later.</small></div>`;
}

function refreshSections() {
  const wrap = document.getElementById("contentSections");
  let html = "";
  if (activeCategory === "all") {
    for (const c of CATS) {
      html += renderSection(c.key, c.label, c.icon);
    }
  } else {
    const c = CATS.find(x => x.key === activeCategory);
    if (c) html += renderSection(c.key, c.label, c.icon);
  }
  wrap.innerHTML = html || renderEmptyState();
}

/* ----------------- Pill Switching ----------------- */
function switchCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll(".cat-pill").forEach(p => {
    p.classList.toggle("active", p.dataset.cat === cat);
  });
  refreshSections();
}

/* ----------------- Search ----------------- */
let searchTimer = null;
document.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("searchInput");
  input.addEventListener("input", e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchTerm = e.target.value.trim();
      refreshSections();
    }, 220);
  });

  document.querySelectorAll(".cat-pill").forEach(p => {
    p.addEventListener("click", () => switchCategory(p.dataset.cat));
  });

  loadContent();
});

/* ----------------- Data Loading ----------------- */
async function loadContent() {
  document.getElementById("loadingSkeleton").style.display = "";
  try {
    const { data, error } = await db
      .from("artist_submissions")
      .select("*")
      .eq("status", "approved")
      .order("created_at", { ascending: false })
      .limit(500);          // generous cap, no per-user restrictions

    if (error) throw error;

    allItems = data || [];
    document.getElementById("loadingSkeleton").style.display = "none";
    refreshSections();
  } catch (err) {
    document.getElementById("loadingSkeleton").style.display = "none";
    document.getElementById("contentSections").innerHTML =
      renderErrorState(err.message || "Failed to load content");
  }
}
</script>
</body>
</html>
