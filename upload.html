<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload • Ning Wei Media</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ... Keep your existing CSS styles, but add/replace these: ... */
.creator-header-flex { display: flex; align-items: center; justify-content: space-between; }
.creator-photo-small { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #1688c5; object-fit: cover; }
.validation-warning { display:none; margin-top:8px; padding:10px; border-radius:9px; background:#fff4d6; border-left:4px solid #e5a400; color:#795500; font-size:14px; font-weight:bold; }
.validation-warning.show { display:block; }
</style>
</head>
<body>

<header class="header">
  <img src="ning-wei.png" alt="Ning Wei Media">
  <div class="header-overlay"></div>
  <div class="header-content">
    <h1>Ning Wei Media</h1>
    <p>Upload Music • Videos • Photos • Apps • Software • Mixes</p>
  </div>
</header>

<main class="container">
  <!-- Removed Notice Box Here -->

  <!-- CREATOR -->
  <section class="card">
    <div class="creator-header-flex">
      <h3>👤 Your Creator Profile</h3>
      <img id="creatorPreview" class="creator-photo-small" src="ning-wei.png" alt="Profile">
    </div>

    <label for="creatorName">Name *</label>
    <input id="creatorName" type="text" placeholder="Enter your name">
    <div id="nameWarning" class="validation-warning">⚠️ Please enter your name first.</div>

    <label for="creatorEmail">Email *</label>
    <input id="creatorEmail" type="email" placeholder="Enter your email">
    <div id="emailWarning" class="validation-warning">⚠️ Please enter your email first.</div>
    
    <!-- ... Rest of your existing form fields ... -->
  </section>

  <!-- ... Rest of your existing HTML ... -->
</main>

<script>
// REPLACE YOUR EXISTING checkCreator() FUNCTION WITH THIS:
function checkCreator() {
  const name = document.getElementById("creatorName").value.trim();
  const email = document.getElementById("creatorEmail").value.trim().toLowerCase();
  
  const nameWarning = document.getElementById("nameWarning");
  const emailWarning = document.getElementById("emailWarning");

  // Reset warnings
  nameWarning.classList.remove("show");
  emailWarning.classList.remove("show");

  // Admin Bypass Check
  if (email === "admin@ningweimedia.com") {
    window.location.href = "github-upload.html"; // Redirects to your repo upload page
    throw new Error("Redirecting to Admin mode...");
  }

  if (!name) {
    nameWarning.classList.add("show");
    throw new Error("Please enter your name.");
  }
  if (!email) {
    emailWarning.classList.add("show");
    throw new Error("Please enter your email.");
  }

  return { name: name, email: email, folder: safeName(name) };
}

// ... Keep all your existing upload functions below this ...
</script>
</body>
</html>
