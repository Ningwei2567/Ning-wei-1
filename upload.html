<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ning Wei Media Upload</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f7;
}

.container{
max-width:420px;
margin:auto;
padding:15px;
}

.header{
height:125px;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
}

.header img{
position:absolute;
width:100%;
height:125px;
object-fit:cover;
}

.header div{
position:relative;
z-index:2;
text-shadow:0 2px 5px black;
}

.card{
background:white;
padding:18px;
margin-top:15px;
border-radius:15px;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
}

input{
border:1px solid #ccc;
}

button{
border:0;
background:#128c9e;
color:white;
font-weight:bold;
font-size:16px;
}

#status{
margin-top:15px;
}

</style>

</head>


<body>


<div class="container">


<header class="header">

<img src="ning-wei.png">

<div>

<h1>Ning Wei Media</h1>

<p>Artist Upload</p>

</div>

</header>



<div class="card">


<h2>Upload Music</h2>


<input id="name" placeholder="Artist name">

<input id="email" placeholder="Artist email">


<label>Artist Photo</label>

<input id="artistPhoto" type="file" accept="image/*">


<input id="title" placeholder="Song title">


<label>Song File</label>

<input id="song" type="file" accept="audio/*">


<label>Song Cover</label>

<input id="cover" type="file" accept="image/*">


<button onclick="upload()">
Upload
</button>


<div id="status"></div>


</div>


</div>



<script>


const URL="https://btksyizkcpzubtextuce.supabase.co";


const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";


const db=supabase.createClient(URL,KEY);



async function uploadFile(bucket,file){

if(!file)return null;


let filename=Date.now()+"-"+file.name;


let {error}=await db.storage
.from(bucket)
.upload(filename,file);


if(error){

console.log(error);
return null;

}


return URL+
"/storage/v1/object/public/"+
bucket+
"/"+
filename;

}



async function upload(){


let status=document.getElementById("status");

status.innerHTML="Uploading...";


let name=document.getElementById("name").value;

let email=document.getElementById("email").value;

let title=document.getElementById("title").value;


let artistPhoto=
document.getElementById("artistPhoto").files[0];


let song=
document.getElementById("song").files[0];


let cover=
document.getElementById("cover").files[0];



let photoURL=
await uploadFile("artist-photos",artistPhoto);


let songURL=
await uploadFile("songs",song);


let coverURL=
await uploadFile("covers",cover);




let {data:artist}=await db
.from("artists")
.insert({

name:name,
email:email,
photo:photoURL

})
.select()
.single();



if(!artist){

status.innerHTML="Artist upload failed";

return;

}



let {error}=await db
.from("songs")
.insert({

artist_id:artist.id,

title:title,

song_url:songURL,

cover_url:coverURL

});



if(error){

status.innerHTML="Song upload failed";

return;

}



status.innerHTML="✅ Upload complete";


}


</script>


</body>

</html>
