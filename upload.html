<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload • Ning Wei Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef9ff;
  color: #123;
}

header {
  background: linear-gradient(135deg, #38bdf8, #0284c7);
  color: white;
  text-align: center;
  padding: 22px 15px;
}

header img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 50%;
  background: white;
  margin-bottom: 10px;
}

header h1 {
  margin: 5px 0;
  font-size: 28px;
}

header p {
  margin: 5px 0;
}

.container {
  max-width: 850px;
  margin: 20px auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

.card h2 {
  margin-top: 0;
  color: #0284c7;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 14px;
  margin-bottom: 6px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #b9dbea;
  border-radius: 10px;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

input[type="file"] {
  background: #f5fbff;
}

.type-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.type-btn {
  border: none;
  padding: 13px 8px;
  border-radius: 10px;
  background: #dff4ff;
  color: #0369a1;
  font-weight: bold;
  cursor: pointer;
}

.type-btn.active {
  background: #0284c7;
  color: white;
}

.upload-section {
  display: none;
}

.upload-section.active {
  display: block;
}

button.upload {
  width: 100%;
  border: none;
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: #0284c7;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button.upload:disabled {
  background: #94a3b8;
  cursor: not-allowed;
}

.preview {
  text-align: center;
  margin-top: 12px;
}

.preview img {
  max-width: 150px;
  max-height: 150px;
  border-radius: 12px;
  object-fit: cover;
}

.progress-card {
  display: none;
}

.progress-bar {
  width: 100%;
  height: 18px;
  background: #dbeafe;
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: #0284c7;
  transition: width .2s;
}

.status {
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  display: none;
  white-space: pre-wrap;
}

.status.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.status.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.back {
  display: block;
  text-align: center;
  margin: 25px 0;
  color: #0284c7;
  text-decoration: none;
  font-weight: bold;
}

.small {
  color: #64748b;
  font-size: 13px;
}

@media(max-width:600px) {
  .type-buttons {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <img src="ning-wei.png" alt="Ning Wei Media">
  <h1>Ning Wei Media</h1>
  <p>Upload your music, videos, photos, apps and software</p>
</header>

<div class="container">

  <!-- CREATOR PROFILE -->
  <div class="card">
    <h2>Creator Profile</h2>

    <label for="creatorName">Creator Name *</label>
    <input
      type="text"
      id="creatorName"
      placeholder="Enter creator name"
      required
    >

    <label for="creatorEmail">Creator Email *</label>
    <input
      type="email"
      id="creatorEmail"
      placeholder="Enter creator email"
      required
    >

    <label for="creatorPhone">Phone</label>
    <input
      type="tel"
      id="creatorPhone"
      placeholder="Phone number"
    >

    <label for="creatorBiography">Biography</label>
    <textarea
      id="creatorBiography"
      placeholder="Tell us about the creator"
    ></textarea>

    <label for="creatorPhoto">Profile Photo</label>
    <input
      type="file"
      id="creatorPhoto"
      accept="image/*"
    >

    <div class="preview">
      <img id="creatorPreview" style="display:none;">
      <div id="creatorPreviewName"></div>
    </div>
  </div>

  <!-- TYPE -->
  <div class="card">
    <h2>Choose Upload Type</h2>

    <div class="type-buttons">
      <button class="type-btn active" data-type="music">🎵 Music</button>
      <button class="type-btn" data-type="photos">📷 Photos</button>
      <button class="type-btn" data-type="videos">🎬 Videos</button>
      <button class="type-btn" data-type="apps">📱 Apps</button>
      <button class="type-btn" data-type="software">💻 Software</button>
      <button class="type-btn" data-type="mixes">🎧 DJ Mixes</button>
    </div>
  </div>

  <!-- MUSIC -->
  <div class="card upload-section active" id="section-music">

    <h2>Upload Music</h2>

    <label for="songTitle">Song Title *</label>
    <input
      type="text"
      id="songTitle"
      placeholder="Song title"
    >

    <label for="songArtist">Artist</label>
    <input
      type="text"
      id="songArtist"
      placeholder="Artist name"
    >

    <label for="musicCategory">Music Category *</label>
    <select id="musicCategory">
      <option value="">Select category</option>
      <option value="Afrobeat">Afrobeat</option>
      <option value="Amapiano">Amapiano</option>
      <option value="Gospel">Gospel</option>
      <option value="Worship">Worship</option>
      <option value="Oldies">Oldies</option>
      <option value="R&B">R&B</option>
      <option value="Hip Hop">Hip Hop</option>
      <option value="Dancehall">Dancehall</option>
      <option value="Reggae">Reggae</option>
      <option value="Other">Other</option>
    </select>

    <label for="songFiles">Music Files *</label>
    <input
      type="file"
      id="songFiles"
      accept=".mp3,.wav,.m4a,.aac,.ogg,.oga,.opus,.flac,audio/*"
      multiple
    >

    <label for="songCover">Cover Image</label>
    <input
      type="file"
      id="songCover"
      accept="image/*"
    >

    <label for="musicDescription">Description</label>
    <textarea
      id="musicDescription"
      placeholder="Music description"
    ></textarea>

    <button class="upload" onclick="uploadMusic()">
      Upload Music
    </button>
  </div>

  <!-- PHOTOS -->
  <div class="card upload-section" id="section-photos">

    <h2>Upload Photos</h2>

    <label for="photoFiles">Photos *</label>
    <input
      type="file"
      id="photoFiles"
      accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,image/*"
      multiple
    >

    <label for="photoDescription">Description</label>
    <textarea
      id="photoDescription"
      placeholder="Photo description"
    ></textarea>

    <button class="upload" onclick="uploadPhotos()">
      Upload Photos
    </button>
  </div>

  <!-- VIDEOS -->
  <div class="card upload-section" id="section-videos">

    <h2>Upload Videos</h2>

    <label for="videoTitle">Video Title *</label>
    <input
      type="text"
      id="videoTitle"
      placeholder="Video title"
    >

    <label for="videoFiles">Video Files *</label>
    <input
      type="file"
      id="videoFiles"
      accept=".mp4,.webm,.mov,.m4v,.avi,.mkv,video/*"
      multiple
    >

    <label for="videoThumbnail">Video Thumbnail</label>
    <input
      type="file"
      id="videoThumbnail"
      accept="image/*"
    >

    <label for="videoDescription">Description</label>
    <textarea
      id="videoDescription"
      placeholder="Video description"
    ></textarea>

    <button class="upload" onclick="uploadVideos()">
      Upload Videos
    </button>
  </div>

  <!-- APPS -->
  <div class="card upload-section" id="section-apps">

    <h2>Upload App</h2>

    <label for="appName">App Name *</label>
    <input
      type="text"
      id="appName"
      placeholder="App name"
    >

    <label for="appCategory">App Category *</label>
    <select id="appCategory">
      <option value="">Select category</option>
      <option value="Android Apps">Android Apps</option>
      <option value="Games">Games</option>
      <option value="Tools">Tools</option>
      <option value="Education">Education</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Social">Social</option>
      <option value="Other">Other</option>
    </select>

    <label for="appFiles">App Files *</label>
    <input
      type="file"
      id="appFiles"
      accept=".apk,.xapk,.apks,.ipa"
      multiple
    >

    <label for="appIcon">App Icon</label>
    <input
      type="file"
      id="appIcon"
      accept="image/*"
    >

    <label for="appDescription">Description</label>
    <textarea
      id="appDescription"
      placeholder="App description"
    ></textarea>

    <button class="upload" onclick="uploadApps()">
      Upload Apps
    </button>
  </div>

  <!-- SOFTWARE -->
  <div class="card upload-section" id="section-software">

    <h2>Upload Software</h2>

    <label for="softwareName">Software Name *</label>
    <input
      type="text"
      id="softwareName"
      placeholder="Software name"
    >

    <label for="softwareCategory">Software Category *</label>
    <select id="softwareCategory">
      <option value="">Select category</option>
      <option value="Windows">Windows</option>
      <option value="Mac">Mac</option>
      <option value="Linux">Linux</option>
      <option value="Android">Android</option>
      <option value="Utilities">Utilities</option>
      <option value="Other">Other</option>
    </select>

    <label for="softwareFiles">Software Files *</label>
    <input
      type="file"
      id="softwareFiles"
      accept=".zip,.rar,.7z,.exe,.msi,.dmg,.iso,.apk"
      multiple
    >

    <label for="softwareImage">Software Image</label>
    <input
      type="file"
      id="softwareImage"
      accept="image/*"
    >

    <label for="softwareDescription">Description</label>
    <textarea
      id="softwareDescription"
      placeholder="Software description"
    ></textarea>

    <button class="upload" onclick="uploadSoftware()">
      Upload Software
    </button>
  </div>

  <!-- DJ MIXES -->
  <div class="card upload-section" id="section-mixes">

    <h2>Upload DJ Mix</h2>

    <label for="mixTitle">Mix Title *</label>
    <input
      type="text"
      id="mixTitle"
      placeholder="DJ Mix title"
    >

    <label for="mixFiles">Mix Files *</label>
    <input
      type="file"
      id="mixFiles"
      accept=".mp3,.wav,.m4a,.aac,.ogg,.oga,.opus,.flac,audio/*"
      multiple
    >

    <label for="mixCover">Mix Cover</label>
    <input
      type="file"
      id="mixCover"
      accept="image/*"
    >

    <label for="mixDescription">Description</label>
    <textarea
      id="mixDescription"
      placeholder="DJ Mix description"
    ></textarea>

    <button class="upload" onclick="uploadMixes()">
      Upload DJ Mix
    </button>
  </div>

  <!-- PROGRESS -->
  <div class="card progress-card" id="progressCard">

    <h2>Upload Progress</h2>

    <div class="progress-bar">
      <div
        class="progress-fill"
        id="progressFill"
      ></div>
    </div>

    <p id="progressText">Preparing upload...</p>
  </div>

  <div id="statusBox" class="status"></div>

  <a href="index.html" class="back">
    ← Back to Ning Wei Media
  </a>

</div>

<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
  "https://btksyizkcpzubtextuce.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXp...LY8";

const STORAGE_BUCKET =
  "artist-uploads";

const SUBMISSIONS_TABLE =
  "artist_submissions";

const { createClient } =
  supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   TYPE SWITCHING
   ========================================================= */

document
  .querySelectorAll(".type-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".type-btn")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        document
          .querySelectorAll(".upload-section")
          .forEach(section =>
            section.classList.remove("active")
          );

        button.classList.add("active");

        const type =
          button.dataset.type;

        document
          .getElementById(
            "section-" + type
          )
          .classList.add("active");
      }
    );
  });


/* =========================================================
   CREATOR PHOTO PREVIEW
   ========================================================= */

document
  .getElementById("creatorPhoto")
  .addEventListener(
    "change",
    function() {

      const file =
        this.files[0];

      if (!file) return;

      const preview =
        document.getElementById(
          "creatorPreview"
        );

      const name =
        document.getElementById(
          "creatorPreviewName"
        );

      preview.src =
        URL.createObjectURL(file);

      preview.style.display =
        "inline-block";

      name.textContent =
        file.name;
    }
  );


/* =========================================================
   HELPERS
   ========================================================= */

function getCreatorName() {

  return document
    .getElementById("creatorName")
    .value
    .trim();
}


function getCreatorEmail() {

  return document
    .getElementById("creatorEmail")
    .value
    .trim();
}


function getCreatorPhone() {

  return document
    .getElementById("creatorPhone")
    .value
    .trim();
}


function getBiography() {

  const value =
    document
      .getElementById("creatorBiography")
      .value
      .trim();

  /*
   IMPORTANT:
   biography is NOT NULL in Supabase.
   Therefore we NEVER send null or an empty
   database value.
  */

  return value ||
    "Ning Wei Media Creator";
}


function validateCreator() {

  const name =
    getCreatorName();

  const email =
    getCreatorEmail();

  if (!name) {
    throw new Error(
      "Please enter the creator name."
    );
  }

  if (!email) {
    throw new Error(
      "Please enter the creator email."
    );
  }

  return {
    name,
    email
  };
}


function safeFolderName(value) {

  return String(value)
    .trim()
    .replace(/[^a-zA-Z0-9_-]+/g, "-")
    .replace(/^-+|-+$/g, "") ||
    "Creator";
}


function safeFileName(value) {

  return String(value)
    .replace(/[^\w.\- ]+/g, "")
    .replace(/\s+/g, "-");
}


function showStatus(
  message,
  type
) {

  const box =
    document.getElementById(
      "statusBox"
    );

  box.textContent =
    message;

  box.className =
    "status " + type;

  box.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}


function startProgress() {

  document
    .getElementById("progressCard")
    .style.display = "block";

  setProgress(5);
}


function setProgress(percent) {

  document
    .getElementById("progressFill")
    .style.width =
      percent + "%";

  document
    .getElementById("progressText")
    .textContent =
      "Uploading... " +
      percent +
      "%";
}


function finishProgress() {

  setProgress(100);

  document
    .getElementById("progressText")
    .textContent =
      "Upload complete.";
}


function setButtonsDisabled(disabled) {

  document
    .querySelectorAll("button.upload")
    .forEach(button => {
      button.disabled =
        disabled;
    });
}


/* =========================================================
   FILE UPLOAD
   ========================================================= */

async function uploadFile(
  file,
  folder,
  category,
  role
) {

  if (!file) {
    throw new Error(
      "No file selected."
    );
  }

  const cleanName =
    safeFileName(file.name);

  const uniqueName =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 9) +
    "-" +
    cleanName;

  const path =
    folder +
    "/" +
    uniqueName;

  const { error } =
    await db.storage
      .from(STORAGE_BUCKET)
      .upload(
        path,
        file,
        {
          cacheControl: "3600",
          upsert: false,
          contentType:
            file.type ||
            "application/octet-stream"
        }
      );

  if (error) {
    throw new Error(
      "Storage: " +
      error.message
    );
  }

  const { data } =
    db.storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(path);

  return {
    name: cleanName,
    original_name: file.name,
    url: data.publicUrl,
    path: path,
    size: file.size,
    type: file.type || role,
    mime: file.type || "",
    category: category || "",
    role: role
  };
}


/* =========================================================
   PROFILE PHOTO
   ========================================================= */

async function uploadCreatorPhoto(
  creatorEmail
) {

  const file =
    document
      .getElementById("creatorPhoto")
      .files[0];

  if (!file) {
    return null;
  }

  const folder =
    "creator-profile-photos/" +
    safeFolderName(creatorEmail);

  return await uploadFile(
    file,
    folder,
    "creator-profile",
    "profile_photo"
  );
}


/* =========================================================
   SAVE DATABASE SUBMISSION
   ========================================================= */

async function saveSubmission(data) {

  const biography =
    String(
      data.biography || ""
    ).trim();

  const row = {

    artist_name:
      String(
        data.artist_name || ""
      ).trim(),

    artist_email:
      String(
        data.artist_email || ""
      ).trim(),

    phone:
      String(
        data.phone || ""
      ).trim(),

    /*
     NEVER NULL.
     Your Supabase table requires biography.
    */
    biography:
      biography ||
      "Ning Wei Media Creator",

    lyrics:
      data.lyrics || "",

    youtube_links:
      data.youtube_links || "",

    files:
      Array.isArray(data.files)
        ? data.files
        : [],

    status:
      "pending",

    posted_at:
      null
  };

  const { error } =
    await db
      .from(SUBMISSIONS_TABLE)
      .insert([row]);

  if (error) {

    throw new Error(
      "Database: " +
      error.message
    );
  }
}


/* =========================================================
   MUSIC
   ========================================================= */

async function uploadMusic() {

  try {

    setButtonsDisabled(true);

    showStatus(
      "",
      ""
    );

    startProgress();

    const creator =
      validateCreator();

    const title =
      document
        .getElementById("songTitle")
        .value
        .trim();

    const artist =
      document
        .getElementById("songArtist")
        .value
        .trim();

    const category =
      document
        .getElementById("musicCategory")
        .value;

    const files =
      Array.from(
        document
          .getElementById("songFiles")
          .files
      );

    const cover =
      document
        .getElementById("songCover")
        .files[0];

    const description =
      document
        .getElementById("musicDescription")
        .value
        .trim();

    if (!title)
      throw new Error(
        "Please enter the song title."
      );

    if (!category)
      throw new Error(
        "Please select a music category."
      );

    if (!files.length)
      throw new Error(
        "Please select at least one music file."
      );

    const creatorFolder =
      safeFolderName(
        creator.name
      );

    const uploaded = [];

    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      const result =
        await uploadFile(
          files[i],
          "music/" +
          creatorFolder,
          category,
          "music"
        );

      uploaded.push(result);

      setProgress(
        15 +
        Math.round(
          ((i + 1) /
            files.length) *
          45
        )
      );
    }

    if (cover) {

      const coverResult =
        await uploadFile(
          cover,
          "music-covers/" +
          creatorFolder,
          category,
          "cover"
        );

      uploaded.push(
        coverResult
      );
    }

    setProgress(75);

    await saveSubmission({

      artist_name:
        creator.name,

      artist_email:
        creator.email,

      phone:
        getCreatorPhone(),

      biography:
        getBiography(),

      lyrics:
        [
          "TYPE: Music",
          "TITLE: " + title,
          "ARTIST: " +
            (artist || ""),
          "CATEGORY: " +
            category,
          "DESCRIPTION: " +
            (description || "")
        ].join("\n"),

      youtube_links:
        "",

      files:
        uploaded
    });

    finishProgress();

    showStatus(
      "✅ Music uploaded successfully.\n\n" +
      "Title: " + title +
      "\nCategory: " + category +
      "\nStatus: Pending approval",
      "success"
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "❌ Upload failed.\n\n" +
      error.message,
      "error"
    );

  } finally {

    setButtonsDisabled(false);
  }
}


/* =========================================================
   PHOTOS
   ========================================================= */

async function uploadPhotos() {

  try {

    setButtonsDisabled(true);

    startProgress();

    const creator =
      validateCreator();

    const files =
      Array.from(
        document
          .getElementById("photoFiles")
          .files
      );

    const description =
      document
        .getElementById("photoDescription")
        .value
        .trim();

    if (!files.length)
      throw new Error(
        "Please select at least one photo."
      );

    const folder =
      "photos/" +
      safeFolderName(
        creator.name
      );

    const uploaded = [];

    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      const result =
        await uploadFile(
          files[i],
          folder,
          "photos",
          "photo"
        );

      uploaded.push(result);

      setProgress(
        15 +
        Math.round(
          ((i + 1) /
            files.length) *
          60
        )
      );
    }

    await saveSubmission({

      artist_name:
        creator.name,

      artist_email:
        creator.email,

      phone:
        getCreatorPhone(),

      biography:
        getBiography(),

      lyrics:
        "TYPE: Photos\n" +
        "DESCRIPTION: " +
        description,

      youtube_links:
        "",

      files:
        uploaded
    });

    finishProgress();

    showStatus(
      "✅ Photos uploaded successfully.\n\n" +
      "Status: Pending approval",
      "success"
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "❌ Upload failed.\n\n" +
      error.message,
      "error"
    );

  } finally {

    setButtonsDisabled(false);
  }
}


/* =========================================================
   VIDEOS
   ========================================================= */

async function uploadVideos() {

  try {

    const uploaded = [];

    for (

      i < files.length;
      i++
    ) {

      const result =
        await uploadFile(
          files[i],
          folder,
          "videos",

      uploaded.push(result);

      setProgress(

    });

    finishProgress();

    showStatus(

  } finally {
