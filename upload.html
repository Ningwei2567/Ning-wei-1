<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Upload - Ning Wei Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f7;
color:#111;
}

.page{
max-width:420px;
margin:auto;
padding-bottom:30px;
}

/* HEADER */

.header{
height:125px;
overflow:hidden;
position:relative;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:#000;
color:white;
}

.header img{
position:absolute;
width:100%;
height:125px;
object-fit:cover;
object-position:center 35%;
}

.header div{
position:relative;
z-index:2;
text-shadow:0 2px 5px #000;
}

.header h1{
margin:0;
font-size:28px;
}

/* FORM */

.card{
background:white;
margin:15px;
padding:18px;
border-radius:15px;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

label{
font-weight:bold;
display:block;
margin-top:12px;
}

button{
width:100%;
padding:14px;
border:0;
border-radius:12px;
background:#128c9e;
color:white;
font-size:17px;
font-weight:bold;
margin-top:15px;
}

#status{
margin:15px;
padding:12px;
border-radius:10px;
background:#e8f8ec;
display:none;
}
</style>

</head>

<body>

<div class="page">


<header class="header">

<img src="https://ningwei2567.github.io/Ning-wei-1/ning-wei.png">

<div>
<h1>Ning Wei Media</h1>
<p>Artists Upload Music • Videos • Photos</p>
</div>

</header>



<div class="card">

<h2>Artist Upload</h2>


<label>Artist Name</label>
<input id="artistName" placeholder="Enter artist name">


<label>Artist Photo</label>
<input id="artistPhoto" type="file" accept="image/*">


<label>Song Title</label>
<input id="songTitle" placeholder="Song title">


<label>Song File</label>
<input id="songFile" type="file" accept="audio/*">


<label>Song Cover</label>
<input id="songCover" type="file" accept="image/*">


<label>Video (optional)</label>
<input id="videoFile" type="file" accept="video/*">


<label>Lyrics (optional)</label>
<textarea id="lyrics" placeholder="Paste lyrics"></textarea>


<button onclick="uploadMedia()">
📤 Upload Everything
</button>


</div>


<div id="status"></div>


</div>


<script>


const SUPABASE_URL =
"https://btksyizkcpzubtextuce.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function uploadFile(file,bucket){

if(!file) return "";


let filename =
Date.now()+"-"+file.name;


let {error}=await supabaseClient
.storage
.from(bucket)
.upload(filename,file);


if(error){
throw error;
}


let url =
SUPABASE_URL+
"/storage/v1/object/public/"+
bucket+
"/"+
filename;


return url;

}



async function uploadMedia(){


try{


let artistName =
document.getElementById("artistName").value;


let songTitle =
document.getElementById("songTitle").value;


let artistPhoto =
await uploadFile(
document.getElementById("artistPhoto").files[0],
"artist-photos"
);



let songFile =
await uploadFile(
document.getElementById("songFile").files[0],
"songs"
);



let cover =
await uploadFile(
document.getElementById("songCover").files[0],
"covers"
);



let video =
await uploadFile(
document.getElementById("videoFile").files[0],
"videos"
);



let {data:artist}=await supabaseClient
.from("artists")
.insert({

name:artistName,
photo:artistPhoto

})
.select()
.single();



await supabaseClient
.from("songs")
.insert({

artist_id:artist.id,

title:songTitle,

song_url:songFile,

cover_url:cover,

video_url:video,

lyrics:
document.getElementById("lyrics").value

});



let status=document.getElementById("status");

status.style.display="block";

status.innerHTML=
"✅ Upload successful! Your music is now live.";


}catch(error){

alert(error.message);

}


}


</script>


</body>
</html>
