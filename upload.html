<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload • Ning Wei Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f7;
  color:#111;
}

/* =========================================================
   HEADER - BIGGER SIZE
   ========================================================= */

.header{
  position:relative;
  height:160px;
  overflow:hidden;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
}

.header img{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:160px;
  object-fit:cover;
  object-position:center 22%;
}

.header-content{
  position:relative;
  z-index:2;
  padding:8px 15px;
  text-shadow:
    0 2px 5px rgba(0,0,0,.9),
    0 1px 2px rgba(0,0,0,.9);
}

.header-content h1{
  margin:0;
  font-size:28px;
  font-weight:800;
}

.header-content p{
  margin:6px 0 0;
  font-size:14px;
}

/* =========================================================
   REST OF THE PAGE (same as before)
   ========================================================= */

.container{
  width:min(700px,94%);
  margin:18px auto;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.card h2,
.card h3{
  margin-top:0;
}

.intro{
  text-align:center;
}

.creator-preview{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:14px;
  padding:10px;
  background:#f7f7f7;
  border-radius:12px;
}

.creator-photo{
  width:46px;
  height:46px;
  min-width:46px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #111;
  background:#eee;
}

.creator-name{
  font-size:17px;
  font-weight:bold;
  color:#111;
}

label{
  display:block;
  margin-top:13px;
  margin-bottom:6px;
  font-weight:bold;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
  background:white;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  outline:none;
  border-color:#111;
}

.category-required{
  border:2px solid #e5a400 !important;
  background:#fffaf0 !important;
}

.type-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:12px;
}

.type-button{
  border:0;
  border-radius:11px;
  padding:15px 10px;
  background:#f0f0f0;
  color:#111;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.type-button.active{
  background:#111;
  color:white;
}

.upload-section{
  display:none;
}

.upload-section.active,
.upload-section.open{
  display:block !important;
}

.upload-button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  margin-top:18px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.upload-button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.file-name{
  margin-top:6px;
  font-size:13px;
  color:#666;
}

.validation-warning{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:9px;
  background:#fff4d6;
  border-left:4px solid #e5a400;
  color:#795500;
  font-size:14px;
  font-weight:bold;
}

.validation-warning.show{
  display:block;
}

.progress-box{
  display:none;
  margin-top:16px;
}

.progress{
  width:100%;
  height:10px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0;
  background:#111;
  transition:width .2s;
}

.status{
  margin-top:10px;
  padding:12px;
  border-radius:9px;
  background:#f5f5f5;
  font-size:14px;
}

.success{
  background:#e9f8ed;
  color:#176b2d;
}

.error{
  background:#fff0f0;
  color:#a11;
}

.back-button{
  display:block;
  text-align:center;
  text-decoration:none;
  margin-top:15px;
  padding:12px;
  background:#f0f0f0;
  color:#111;
  border-radius:9px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:22px;
  color:#777;
  font-size:12px;
}

@media(max-width:500px){
  .header{
    height:160px;
  }
  .header-content h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<header class="header">
  <img src="ning-wei.png" alt="Ning Wei Media">
  <div class="header-content">
    <h1>Ning Wei Media</h1>
    <p>Music • Videos • Photos • Apps • Software</p>
  </div>
</header>

<main class="container">

  <section class="card intro">
    <h2>📤 Upload to Ning Wei Media</h2>
    <p>Create your creator profile and choose what you want to upload.</p>
  </section>

  <!-- Keep all the rest of your form content exactly the same -->
  <!-- (Creator profile, type buttons, music section, photos, videos, apps, software, mixes, progress, back button) -->

  <!-- For now just replace the header part first and test the size -->

</main>

<footer>© Ning Wei Media</footer>

</body>
</html>
