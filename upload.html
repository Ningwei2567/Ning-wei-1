<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ning Wei Media Upload</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f7;
}

.container{
max-width:420px;
margin:auto;
padding:15px;
}


.header{

height:125px;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;

}


.header img{

position:absolute;
width:100%;
height:125px;
object-fit:cover;

}


.header div{

position:relative;
z-index:2;
text-shadow:0 2px 5px black;

}


.card{

background:white;
padding:18px;
border-radius:15px;
margin-top:15px;

}


input,button{

width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;

}


input{

border:1px solid #ccc;

}


button{

background:#128c9e;
border:0;
color:white;
font-size:16px;
font-weight:bold;

}


#status{

margin-top:15px;
font-weight:bold;

}


</style>


</head>


<body>


<div class="container">


<header class="header">

<img src="ning-wei.png">

<div>

<h1>Ning Wei Media</h1>

<p>Artist Upload</p>

</div>

</header>



<div class="card">


<h2>Upload Your Song</h2>


<input id="artistName"
placeholder="Artist name">



<input id="artistEmail"
placeholder="Artist email">



<label>
Artist Photo
</label>


<input id="artistPhoto"
type="file"
accept="image/*">



<input id="songTitle"
placeholder="Song title">



<label>
Song File
</label>


<input id="songFile"
type="file"
accept="audio/*,video/*">



<label>
Song Cover
</label>


<input id="songCover"
type="file"
accept="image/*">



<button onclick="uploadSong()">

Upload

</button>



<div id="status"></div>


</div>


</div>




<script>


const SUPABASE_URL =
"https://btksyizkcpzubtextuce.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function uploadFile(bucket,file){


if(!file){

return null;

}


let filename =
Date.now()+"-"+file.name;



let {error}=await db.storage

.from(bucket)

.upload(filename,file);



if(error){

console.log(error);

return null;

}



return SUPABASE_URL+
"/storage/v1/object/public/"+
bucket+
"/"+
filename;


}





async function uploadSong(){


let status=
document.getElementById("status");


status.innerHTML="Uploading...";



let name=
document.getElementById("artistName").value;


let email=
document.getElementById("artistEmail").value;


let photo=
document.getElementById("artistPhoto").files[0];


let title=
document.getElementById("songTitle").value;


let song=
document.getElementById("songFile").files[0];


let cover=
document.getElementById("songCover").files[0];




let photoURL =
await uploadFile(
"artist-photos",
photo
);



let songURL =
await uploadFile(
"songs",
song
);



let coverURL =
await uploadFile(
"covers",
cover
);




// create artist

let {data:artist,error:artistError}=

await db

.from("artists")

.insert({

name:name,

email:email,

photo:photoURL

})

.select()

.single();




if(artistError){

console.log(artistError);

status.innerHTML="Artist failed";

return;

}




// create song

let {error:songError}=

await db

.from("songs")

.insert({

title:title,

song_url:songURL,

cover_url:coverURL,

artist_id:artist.id

});





if(songError){

console.log(songError);

status.innerHTML="Song failed";

return;

}




status.innerHTML=
"✅ Upload successful";


}


</script>


</body>

</html>
