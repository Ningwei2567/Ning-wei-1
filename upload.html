<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ning Wei Media - Artist Upload</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f7;
color:#222;
}

.container{
max-width:430px;
margin:auto;
padding:15px;
}

.header{

height:125px;
overflow:hidden;
position:relative;
border-radius:0 0 20px 20px;

}

.header img{

width:100%;
height:125px;
object-fit:cover;

}

.header h1{

position:absolute;
top:35px;
width:100%;
text-align:center;
color:white;
font-size:25px;
text-shadow:0 2px 5px black;

}

.card{

background:white;
border-radius:18px;
padding:20px;
margin-top:15px;
box-shadow:0 3px 15px #ddd;

}

h2{

text-align:center;
color:#128c9e;

}


label{

display:block;
font-weight:bold;
margin-top:15px;

}


input,textarea{

width:100%;
padding:12px;
margin-top:7px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;

}


button{

width:100%;
padding:15px;
margin-top:20px;
border:0;
border-radius:12px;
background:#128c9e;
color:white;
font-size:18px;
font-weight:bold;

}


#status{

margin-top:15px;
padding:12px;
border-radius:10px;
background:#e8ffe8;
display:none;

}


</style>

</head>

<body>


<div class="container">


<div class="header">

<img src="ning-wei.png">

<h1>
Ning Wei Media
</h1>

</div>


<div class="card">


<h2>
Upload Music
</h2>


<label>
Artist Name
</label>

<input id="artistName"
placeholder="Enter artist name">


<label>
Artist Email
</label>

<input id="artistEmail"
placeholder="Email">


<label>
Artist Photo
</label>

<input id="artistPhoto"
type="file"
accept="image/*">


<label>
Song Title
</label>

<input id="songTitle"
placeholder="Song title">


<label>
Song File
</label>

<input id="songFile"
type="file"
accept="audio/*">


<label>
Song Cover
</label>

<input id="songCover"
type="file"
accept="image/*">
<!-- PART 2/3 -->

<button onclick="uploadEverything()">
📤 Upload Everything
</button>


<div id="status"></div>


</div>

</div>


<script>


const SUPABASE_URL = 
"https://btksyizkcpzubtextuce.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3N5aXprY3B6dWJ0ZXh0dWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzE2MjYsImV4cCI6MjEwNDUwNzYyNn0.F5tJqEc8xmwoJakmka1o5XVaALmHgSlptz4f4p2vLY8";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function uploadFile(bucket,file){

if(!file) return null;


const fileName =
Date.now()+"-"+file.name;


const {data,error}=await supabaseClient
.storage
.from(bucket)
.upload(fileName,file);


if(error){

console.log(error);
return null;

}


const url =
SUPABASE_URL+
"/storage/v1/object/public/"+
bucket+
"/"+
fileName;


return url;

}



async function uploadEverything(){


const status =
document.getElementById("status");


status.style.display="block";
status.innerHTML="Uploading...";



const artistName =
document.getElementById("artistName").value;


const artistEmail =
document.getElementById("artistEmail").value;


const artistPhoto =
document.getElementById("artistPhoto")
.files[0];


const songTitle =
document.getElementById("songTitle").value;


const songFile =
document.getElementById("songFile")
.files[0];


const songCover =
document.getElementById("songCover")
.files[0];



if(!artistName || !songTitle){

status.innerHTML=
"Please enter artist name and song title";

return;

}



const artistPhotoURL =
await uploadFile(
"artist-photos",
artistPhoto
);



const songURL =
await uploadFile(
"songs",
songFile
);



const coverURL =
await uploadFile(
"covers",
songCover
);
  <!-- PART 3/3 -->


// Create or find artist

let {data:existingArtist} =
await supabaseClient
.from("artists")
.select("*")
.eq("email",artistEmail)
.single();



let artistId;



if(existingArtist){


artistId = existingArtist.id;



await supabaseClient
.from("artists")
.update({

name:artistName,

photo:artistPhotoURL

})

.eq("id",artistId);



}else{


const {data:newArtist,error:artistError}=

await supabaseClient

.from("artists")

.insert({

name:artistName,

email:artistEmail,

photo:artistPhotoURL

})

.select()

.single();



if(artistError){

status.innerHTML=
"Artist save failed";

console.log(artistError);

return;

}


artistId=newArtist.id;


}



// Save song metadata


const {error:songError}=

await supabaseClient

.from("songs")

.insert({

artist_id:artistId,

title:songTitle,

song_url:songURL,

cover_url:coverURL

});



if(songError){


status.innerHTML=
"Song upload failed";

console.log(songError);

return;


}



status.innerHTML=

"✅ Upload successful! Your song, cover and artist profile are live on Ning Wei Media.";



}


</script>


</body>

</html>
